# Manifest delle schermate del mini-sito di aiuto.
#
# Ogni voce diventa un file `static/img/help/<id>.png` (piu' `<id>-desktop.png`
# se fra i `viewports` c'e' `desktop`), catturato dall'app vera con
# `python scripts/help_docs/capture_screenshots.py` sul database dimostrativo
# creato da `scripts/help_docs/seed_demo.py`.
#
# Campi:
#   id         nome-in-minuscolo-con-trattini; e' anche il nome del file
#   route      percorso dell'app da aprire
#   as         nome utente con cui accedere, o `anonimo`
#   caption    testo alternativo dell'immagine (obbligatorio: e' cio' che
#              legge chi non vede la figura)
#   viewports  [mobile] di norma; aggiungere `desktop` solo dove il disegno
#              della pagina cambia davvero
#   click      selettori da premere prima dello scatto (linguette, pannelli)
#   wait_for   selettore da attendere
#   clip       ritaglia sullo elemento invece dell'intera finestra
#   full_page  scatta l'intera pagina invece della sola finestra
#   annotate   [{selector, label}] cerchia un elemento e ci mette un numero
#
# NOTA: i dati visibili (nomi, date, punteggi) vengono dal seed dimostrativo e
# sono deterministici. Non ritoccare mai le immagini a mano: al primo
# cambiamento dell'interfaccia diventerebbero una descrizione falsa dell'app.

shots:
  # --- Pagine pubbliche ---------------------------------------------------
  - id: home-pubblica
    route: /
    as: anonimo
    caption: "La pagina iniziale di Tornei Biliardo vista da chi non ha ancora un account: le gare in diretta e quelle con le iscrizioni aperte."
    viewports: [mobile, desktop]

  - id: registrazione
    route: /auth/register
    as: anonimo
    caption: "Il modulo di registrazione: nome utente, email e password."

  - id: gare-aperte
    route: /garas
    as: anonimo
    caption: "L'elenco pubblico delle gare, con lo stato di ciascuna."

  - id: campionati-pubblici
    route: /campionatos
    as: anonimo
    caption: "L'elenco dei campionati in corso."

  # --- Giocatore ----------------------------------------------------------
  - id: dashboard-giocatore
    route: /dashboard
    as: Marco Rossi
    caption: "La home del giocatore: le gare a cui sei iscritto, i campionati e le gare vicine a te."
    viewports: [mobile, desktop]

  - id: gara-iscrizione
    route: /admin/gara/3
    as: Elena Ricci
    caption: "La pagina di una gara con le iscrizioni aperte: il pulsante «Iscriviti» è in fondo alla scheda."

  - id: gara-iscritto
    route: /admin/gara/3
    as: Marco Rossi
    caption: "La stessa gara dopo l'iscrizione: in alto compare «La tua iscrizione» e l'elenco degli iscritti."

  - id: gara-turni
    route: /admin/gara/2
    as: Marco Rossi
    caption: "Una gara in corso vista da un giocatore: le partite del turno, con i risultati già registrati."

  - id: gara-classifica
    route: /admin/gara/1
    as: Marco Rossi
    click: ['[data-c7-tab-btn="classifica"]']
    caption: "La classifica di una gara conclusa, ordinata per vittorie e differenza rack."

  - id: partita-segnapunti
    route: /admin/match/20
    as: Marco Rossi
    caption: "La pagina della partita: punteggio in alto, segnapunti al centro, elenco dei rack giocati sotto."
    viewports: [mobile, desktop]

  - id: partita-rack
    route: /admin/match/20
    as: Marco Rossi
    clip: ".c7-rackpad"
    caption: "I due tasti del segnapunti: si preme quello del giocatore che ha vinto il rack."

  - id: profilo
    route: /player/profile
    as: Marco Rossi
    caption: "Il profilo personale con le statistiche e il rating."

  - id: storico
    route: /player/history
    as: Marco Rossi
    caption: "Lo storico delle gare a cui hai partecipato."

  - id: notifiche
    route: /player/notifications
    as: Marco Rossi
    caption: "L'elenco delle notifiche ricevute."

  - id: progressi
    route: /gamification/dashboard
    as: Marco Rossi
    caption: "La pagina dei progressi: livello, punti esperienza, traguardi e serie."

  - id: match-individuali
    route: /match/
    as: Marco Rossi
    caption: "La sezione delle partite amichevoli, fuori dalle gare ufficiali."

  - id: proposta-nuova
    route: /match/proposals/create
    as: Marco Rossi
    caption: "Il modulo per proporre una partita amichevole: avversario, luogo, data e formato."

  - id: sale-biliardo
    route: /admin/venues
    as: Marco Rossi
    caption: "L'elenco delle sale biliardo registrate."

  - id: privacy-impostazioni
    route: /player/privacy-settings
    as: Marco Rossi
    caption: "Le impostazioni di privacy: cosa mostrare agli altri giocatori."

  # --- Direttore di gara --------------------------------------------------
  - id: dashboard-direttore
    route: /dashboard
    as: Luca Bianchi
    caption: "La home del direttore di gara: le gare che gestisce e i pulsanti per crearne di nuove."
    viewports: [mobile, desktop]

  - id: campionato-wizard
    route: /admin/campionato/wizard
    as: Luca Bianchi
    caption: "Primo passo della creazione di un campionato: nome, numero di gare, classifica e abbinamenti."

  - id: gara-nuova
    route: /admin/gara/create_standalone
    as: Luca Bianchi
    caption: "Il modulo per creare una gara singola, fuori da un campionato."

  - id: gara-gestione
    route: /admin/gara/2
    as: Luca Bianchi
    caption: "La gara vista dal direttore: il pannello «Gestione» con il pulsante per avviare il turno successivo."
    viewports: [mobile, desktop]

  - id: gara-iscritti
    route: /admin/gara/3
    as: Luca Bianchi
    click: ['[data-c7-tab-btn="iscritti"]']
    caption: "L'elenco degli iscritti visto dal direttore, con la possibilità di iscrivere o togliere un giocatore."

  - id: campionato-gestione
    route: /admin/campionato/1
    as: Luca Bianchi
    caption: "La pagina di un campionato: le sue gare, la classifica generale e le impostazioni."
    viewports: [mobile, desktop]

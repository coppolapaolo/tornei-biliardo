# Manifest delle schermate del mini-sito di aiuto.
#
# Ogni voce diventa un file `static/img/help/<lingua>/<id>.png` (piu'
# `<id>-desktop.png` se fra i `viewports` c'e' `desktop`), dall'app vera con
# `python scripts/help_docs/capture_screenshots.py` sul database dimostrativo
# creato da `scripts/help_docs/seed_demo.py`.
#
# Campi:
#   id         nome-in-minuscolo-con-trattini; e' anche il nome del file
#   route      percorso dell'app da aprire
#   as         nome utente con cui accedere, o `anonimo`
#   caption    testo alternativo dell'immagine (obbligatorio: e' cio' che
#              legge chi non vede la figura)
#   viewports  [mobile] di norma; aggiungere `desktop` solo dove il disegno
#              della pagina cambia davvero
#   click      selettori da premere prima dello scatto (linguette, pannelli)
#   wait_for   selettore da attendere
#   clip       ritaglia sullo elemento invece dell'intera finestra
#   full_page  scatta l'intera pagina invece della sola finestra
#   annotate   [{selector, label}] cerchia un elemento e ci mette un numero
#
# NOTA: i dati visibili (nomi, date, punteggi) vengono dal seed dimostrativo e
# sono deterministici — il seed fissa il generatore casuale apposta. Non
# ritoccare mai le immagini a mano: al primo cambiamento dell'interfaccia
# diventerebbero una descrizione falsa dell'app.
#
# Gli id nei percorsi (gara 1/2/3, match 18) sono quelli prodotti dal seed. Se
# cambi `seed_demo.py` **ricontrollali**: la cattura si ferma con un errore
# esplicito se un percorso non esiste piu', ma una gara diversa da quella
# attesa passerebbe inosservata.

# Lingue da catturare. Ogni schermata viene prodotta una volta per lingua, con
# l'app impostata su quella lingua: la guida inglese non puo' mostrare pulsanti
# italiani, sarebbe l'esatto contrario del suo scopo.
locales: [it, en]

# Le didascalie qui sotto sono in italiano e valgono da testo alternativo di
# riserva; ogni lingua puo' sovrascriverle in `<lingua>/captions.yaml`.

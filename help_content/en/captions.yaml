# English alt text for the screenshots.
#
# The technical part of the manifest (route, user, viewport) is shared and
# lives in `help_content/screenshots.yaml`; only the wording is per language,
# because a caption is what someone who cannot see the picture reads instead.
#
# Pages may override these with their own `caption:` on a block. What is here
# is the fallback used when they do not.

home-come-si-partecipa: "The «How to take part» panel at the bottom of the home page: the three steps and the Sign in and Register buttons."
home-pubblica: "The Tornei Biliardo home page as seen by someone without an account: it opens with «Live now», then the competitions open for registration, the ones finished in the last month and the championships. The cards are the same ones a signed-in user sees."

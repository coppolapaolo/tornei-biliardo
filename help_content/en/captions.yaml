# English alt text for the screenshots.
#
# The technical part of the manifest (route, user, viewport) is shared and
# lives in `help_content/screenshots.yaml`; only the wording is per language,
# because a caption is what someone who cannot see the picture reads instead.
#
# Pages may override these with their own `caption:` on a block. What is here
# is the fallback used when they do not.


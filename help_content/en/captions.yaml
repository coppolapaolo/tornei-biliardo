campionati-pubblici: "The list of championships in progress."
dashboard-giocatore: "A player's home right after coming in: the «How you are doing» panel at the top, then «Your competitions», «Head-to-head matches», «Live now», «Open, you can register», the competitions finished in the last month, the championships, and competitions near you."
gara-iscrizione: "A competition open for registration: the «Register» button is at the bottom of the card."

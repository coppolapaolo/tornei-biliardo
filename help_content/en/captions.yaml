referto-tpa: "The TPA scoresheet during the match: the two players with their TPA, the inning box and the keypad."
referto-tpa-foglio: "The scoresheet itself: each row is one visit to the table, with the balls pocketed and why the inning ended."

# --- Trial competition (ADR-058) -------------------------------------------
prova-spunta: "The «Trial competition» switch in the new competition form, with the explanation underneath."
prova-presentazione: "The introduction shown the first time you open the page of a trial competition: a title, one step at a time, and the «Skip» and «Next» buttons."

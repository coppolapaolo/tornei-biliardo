sale-biliardo: "The list of registered billiard venues."
privacy-impostazioni: "Privacy settings: what to show to other players."
dashboard-direttore: "A competition director's home right after coming in: the greeting with the role underneath, the buttons to create competitions and championships, the «How your competitions are going» panel, and «Your competitions», where each competition they direct says what it is waiting for."

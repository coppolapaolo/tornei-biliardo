# Micro-help and introductions: content ready for the adaptive interface.
#
# THE APP SHOWS THESE TEXTS: `static/js/help-hints.js` (the "help mode",
# ADR-058) fetches them from /aiuto/api/schermata/<endpoint>. This file
# mirrors `it/hints.yaml` one to one: same ids, same `anchor` values, same
# screens. Only the wording is translated.
#
# The `anchor` values are NOT translated on purpose: they are the contract with
# the app's templates (`data-help="..."`), and translating them would mean two
# different anchors for the same control.

hints:
- id: home.andamento
  label: How you are doing
  short: 'Two numbers, a chart and your latest activities: it tells you how you are getting on, and leads
    nowhere. It greets you on the way in, once per sign-in.'
  anchor: home-andamento
  screens:
  - dashboard.dashboard
  page: primo_accesso
  section: come_stai_andando
- id: home.tutti_i_numeri
  label: All your numbers
  short: 'Opens three or four extra rows: current streak, position in a championship, drills completed,
    level. It always starts closed, one tap opens it.'
  anchor: home-tutti-i-numeri
  screens:
  - dashboard.dashboard
  page: primo_accesso
  section: come_stai_andando
- id: gara.turni
  label: Rounds
  short: The matches of the current round, with the finished rounds below.
  anchor: gara-turni
  screens:
  - admin.competition.gara_detail
  page: seguire_la_gara
  section: turni
- id: gara.classifica
  label: Standings
  short: Where you stand right now. Updated at the end of each round, not after every match.
  anchor: gara-classifica
  screens:
  - admin.competition.gara_detail
  page: seguire_la_gara
  section: classifica
- id: gara.distanza
  label: Distance
  short: «Race to 4» means the first to win 4 racks takes the match, not that 4 racks are played.
  anchor: gara-distanza
  screens:
  - admin.competition.gara_detail
  - admin.competition.create_gara_standalone
  - admin.match.match_detail
  page: formati_di_gioco
  section: distanza
- id: gara.disciplina
  label: Discipline
  short: 'The game: 8-ball, 9-ball, 10-ball and the rest. The rules at the table stay the ones you know.'
  anchor: gara-disciplina
  screens:
  - admin.competition.create_gara_standalone
  page: formati_di_gioco
  section: discipline
- id: gara.strategia
  label: Pairing algorithm
  short: How pairs are formed each round. Amalfi is the choice for club competitions played over rounds.
  anchor: gara-strategia
  screens:
  - admin.competition.create_gara_standalone
  - admin.campionato.wizard_start
  page: abbinamenti
  section: amalfi
- id: gara.primo_turno
  label: First round
  short: 'In the first round there are no standings yet: pairs come from a draw, from ratings, or from
    the championship standings.'
  anchor: gara-primo-turno
  screens:
  - admin.competition.create_gara_standalone
  page: abbinamenti
  section: primo_turno
- id: gara.dispari
  label: If players are odd
  short: 'X by walkover, X by walkover with drill, three-player match or waitlist. Not asked on brackets: whoever is left
    over goes straight through.'
  anchor: gara-dispari
  screens:
  - admin.competition.create_gara_standalone
  - admin.campionato.wizard_step2
  page: numero_dispari
  section: quale
- id: gara.classifica_sistema
  label: Standings system
  short: 'Wins counts matches won, Racks counts total racks. Not shown on brackets: there the standings
    go by position, full stop.'
  anchor: gara-classifica-sistema
  screens:
  - admin.competition.create_gara_standalone
  page: classifiche
  section: vittorie
- id: gara.anti_rematch
  label: Avoid rematches
  short: 'Stops two players meeting twice in the same competition. Not asked on brackets: losers go out.'
  anchor: gara-anti-rematch
  screens:
  - admin.competition.create_gara_standalone
  - admin.campionato.wizard_step2
  page: abbinamenti
  section: amalfi
- id: gara.separazione_squadre
  label: Keep team-mates apart
  short: The bracket draw separates team-mates as far as it can. With large teams the derby is postponed,
    not avoided.
  anchor: gara-separazione-squadre
  screens:
  - admin.competition.create_gara_standalone
  page: squadre
  section: come_funziona
- id: gara.finalina
  label: 3rd/4th place final
  short: The two beaten semi-finalists play for third place, in the round of the final. Without it they
    are third, level.
  anchor: gara-finalina
  screens:
  - admin.competition.create_gara_standalone
  page: tabellone
  section: terzo_posto
- id: gara.fase_gironi
  label: Group stage
  short: 'Double elimination inside parallel groups: each qualifies four players — two unbeaten and two
    through the losers bracket — for the final bracket.'
  anchor: gara-fase-gironi
  screens:
  - admin.competition.create_gara_standalone
  page: tabellone
  section: doppio_ko
- id: gara.handicap
  label: Play with handicap
  short: 'You agree the head start at the table. What changes here is the rating: it only moves between
    players of the same category.'
  anchor: gara-handicap
  screens:
  - admin.competition.create_gara_standalone
  - admin.campionato.wizard_step2
  page: formati_di_gioco
  section: handicap
- id: gara.cerca_da_iscrivere
  label: Search for the player to enter
  short: 'Type a username, first name or last name: the list narrows as you type. Players who added their name to their profile show up with it.'
  anchor: gara-cerca-da-iscrivere
  screens:
  - admin.competition.gara_detail
  page: gestire_le_iscrizioni
  section: durante
- id: gara.categoria_iscritto
  label: Category
  short: The player's level in this competition. Type a new name and the category is created.
  anchor: gara-categoria-iscritto
  screens:
  - admin.competition.gara_detail
  page: categorie
  section: assegnare
- id: gara.squadre
  label: Teams
  short: The list of teams for this competition, or for the championship. Tap it to add, rename or merge; after the draw it is read-only.
  anchor: gara-squadre
  screens:
  - admin.competition.gara_detail
  - admin.competition.gara_impostazioni
  page: squadre
  section: attivare
- id: gara.forfait
  label: Forfeit handling
  short: 'Whoever abandons stays in the pairings losing by walkover, or drops out. Not asked on brackets:
    it is always a walkover.'
  anchor: gara-forfait
  screens:
  - admin.competition.create_gara_standalone
  page: opzioni_della_gara
  section: struttura
- id: gara.numero_esatto
  label: Exact number of racks
  short: 'All the planned racks are played even once the result is settled. Needed for racks standings.
    Not on brackets: play is always a race.'
  anchor: gara-numero-esatto
  screens:
  - admin.competition.create_gara_standalone
  page: formati_di_gioco
  section: numero_esatto
- id: gara.multiset
  label: Set play
  short: 'The match is split into sets: a set is won by reaching the distance, the match by taking enough
    sets.'
  anchor: gara-multiset
  screens:
  - admin.competition.create_gara_standalone
  page: formati_di_gioco
  section: set
- id: gara.regola_inizio
  label: Start rule
  short: Who takes the first shot. With a lag, whoever wins it chooses who breaks, and may send the opponent
    to the table.
  anchor: gara-regola-inizio
  screens:
  - admin.competition.create_gara_standalone
  - admin.competition.edit_gara
  - admin.campionato.wizard_step2
  page: opzioni_della_gara
  section: formato
- id: gara.chi_spacca
  label: Who breaks
  short: How the break shot passes from one rack to the next. «Alternating» is the standard rule.
  anchor: gara-chi-spacca
  screens:
  - admin.competition.create_gara_standalone
  - admin.competition.edit_gara
  - admin.campionato.wizard_step2
  page: opzioni_della_gara
  section: formato
- id: gara.spareggio
  label: Tie-break
  short: Up to which position level finishes are settled with an extra contest. Normally the podium. Not
    asked on brackets.
  anchor: gara-spareggio
  screens:
  - admin.competition.create_gara_standalone
  page: classifiche
  section: pari_merito
- id: gara.peso
  label: Weight in the standings
  short: How many times this competition's score counts in the championship standings. 1 = like every
    other. Not shown outside a championship.
  anchor: gara-peso
  screens:
  - admin.campionato.campionato_detail
  - admin.competition.edit_gara
  - admin.competition.gara_detail
  - admin.competition.gara_impostazioni
  page: opzioni_della_gara
  section: struttura
- id: gara.numero_turni
  label: Number of rounds
  short: 'How many sets of matches. Not set on brackets: the draw fixes it, on the entrants who turn up.
    Under double elimination it can grow by one if the Decider is played.'
  anchor: gara-numero-turni
  screens:
  - admin.competition.create_gara_standalone
  page: opzioni_della_gara
  section: struttura
- id: gara.tavoli
  label: Available tables
  short: Which of the venue's tables you will use tonight. The app assigns them to matches and frees them
    when matches end.
  anchor: gara-tavoli
  screens:
  - admin.competition.create_gara_standalone
  - admin.competition.gara_detail
  - admin.competition.gara_impostazioni
  - admin.competition.gara_preparazione
  page: opzioni_della_gara
  section: informazioni
- id: gara.reset_partita
  label: Reset the match
  short: Puts the score back to zero keeping the same pair, who replay. Use this when a result is wrong.
  anchor: gara-reset-partita
  screens:
  - admin.competition.gara_detail
  - admin.match.match_detail
  page: condurre_la_gara
  section: correggere
- id: gara.avvia_turno
  label: Start next round
  short: Lights up when every match in the round is finished. Starting it locks the previous round's results.
  anchor: gara-avvia-turno
  screens:
  - admin.competition.gara_detail
  page: condurre_la_gara
  section: turni_successivi
- id: gara.x_ultimo_iscritto
  label: Who gets the X in the first round?
  short: 'With an odd number of players: the app draws the X by walkover, or you hand it to the last player
    to register. The other pairings stay random.'
  anchor: gara-x-ultimo-iscritto
  screens:
  - admin.competition.gara_detail
  page: condurre_la_gara
  section: primo_turno
- id: gara.sorteggia_tabellone
  label: Draw the bracket
  short: 'In bracket competitions it replaces «Start the competition»: it closes registrations, freezes teams
    and fixes everybody''s path to the final.'
  anchor: gara-sorteggia-tabellone
  screens:
  - admin.competition.gara_detail
  page: tabellone
  section: sorteggio
- id: gara.squadra_iscrizione
  label: Which team are you playing for?
  short: Asked the moment you register, if the competition keeps team-mates apart in the draw. «No team»
    is an answer, changeable until the draw.
  anchor: gara-squadra-iscrizione
  screens:
  - admin.competition.gara_detail
  page: squadre
  section: iscriversi
- id: partita.punteggio
  label: Score
  short: The racks each player has won so far. It changes as soon as anyone records one, including from
    your opponent's phone.
  anchor: partita-punteggio
  screens:
  - admin.match.match_detail
  - individual_match.match_detail
  page: giocare_una_partita
  section: leggere
- id: partita.segnapunti
  label: Scoreboard
  short: After each rack press the button of whoever won it. The solid button is yours.
  anchor: partita-segnapunti
  screens:
  - admin.match.match_detail
  - individual_match.match_detail
  page: giocare_una_partita
  section: segnare
- id: partita.rack
  label: Racks played
  short: 'The scoresheet: who won each rack and the running score. For checking back when something does
    not add up.'
  anchor: partita-rack
  screens:
  - admin.match.match_detail
  - individual_match.match_detail
  page: giocare_una_partita
  section: leggere
- id: partita.forfait
  label: Declare forfeit
  short: 'Only for when the match really is abandoned: it awards the opponent all the remaining racks.'
  anchor: partita-forfait
  screens:
  - admin.match.match_detail
  - individual_match.match_detail
  page: giocare_una_partita
  section: forfait
- id: partita.tabellone
  label: Scoreboard
  short: 'Turn your phone sideways: the score gets big and reads from a distance, and you score a rack
    by tapping the player''s half.'
  anchor: partita-tabellone
  screens:
  - admin.match.match_detail
  - individual_match.match_detail
  page: giocare_una_partita
  section: tabellone
- id: iscrizione.pulsante
  label: Register
  short: Puts you on the list of entrants. You can withdraw as long as registrations stay open.
  anchor: iscrizione-pulsante
  screens:
  - admin.competition.gara_detail
  - player.gara_detail
  page: iscriversi_a_una_gara
  section: iscriversi
- id: iscrizione.lista_attesa
  label: Waitlist
  short: 'You are not shut out, you are queuing: you get in automatically if a place frees up or another
    player registers.'
  anchor: iscrizione-lista-attesa
  screens:
  - admin.competition.gara_detail
  - player.gara_detail
  page: iscriversi_a_una_gara
  section: lista_attesa
- id: profilo.runout
  label: Runout
  short: Racks closed in a single visit. «Break and run» are the ones where you also had the break shot.
  anchor: profilo-runout
  screens:
  - player.profile
  - player.view_profile
  page: profilo_e_statistiche
  section: cosa_contiene
- id: profilo.rating
  label: Rating
  short: 'An estimate of your strength worked out from results: it rises when you win, and more when you
    beat someone stronger.'
  anchor: profilo-rating
  screens:
  - player.profile
  - player.view_profile
  page: profilo_e_statistiche
  section: rating
- id: profilo.livello
  label: Level
  short: It measures how much you use the app, not how well you play. For ability there is the rating.
  anchor: profilo-livello
  screens:
  - gamification.dashboard
  page: progressi
  section: xp
- id: campionato.classifica
  label: Standings system
  short: 'It applies to every competition in the championship: you cannot add up competitions that count
    different things.'
  anchor: campionato-classifica
  screens:
  - admin.campionato.wizard_start
  - admin.campionato.campionato_detail
  page: creare_un_campionato
  section: passo1
- id: campionato.punti_posizione
  label: Position points
  short: 'How many points each placing is worth in bracket competitions. You set six bands: everybody
    sharing one takes the same score.'
  anchor: campionato-punti-posizione
  screens:
  - admin.campionato.edit_campionato
  - admin.campionato.wizard_step2
  page: creare_un_campionato
  section: punti_posizione
- id: esame.prova_da_solo
  label: Try it on your own
  short: 'You practise: you record the scores and can stop and resume. It stays in your history but carries
    no certification.'
  anchor: esame-prova-da-solo
  screens:
  - exam.exam_detail
  page: esami
  section: due_modi
- id: esame.appuntamento
  label: Ask for an appointment
  short: 'The exam that counts is taken in person: propose a date, a time and a venue to one or more examiners.
    The first to accept closes it for the others.'
  anchor: esame-appuntamento
  screens:
  - exam.exam_detail
  - exam.request_form
  page: esami
  section: appuntamento
- id: esame.componi
  label: Compose
  short: 'Name, drills, order and what each one is worth: all on one page, saved in one go.'
  anchor: esame-componi
  screens:
  - exam.exam_detail
  page: diventare_esaminatore
  section: comporre
- id: esame.quante_prove
  label: Attempts
  short: How many times the candidate repeats that drill. If it is more than one, the best attempt counts,
    not the sum.
  anchor: esame-quante-prove
  screens:
  - exam.compose_exam
  page: diventare_esaminatore
  section: comporre
- id: esame.punteggio_massimo
  label: Worth
  short: 'What the drill weighs inside this exam. It is per exam, not a property of the drill: the same
    drill can weigh differently elsewhere. The catalogue value is only the starting suggestion.'
  anchor: esame-punteggio-massimo
  screens:
  - exam.compose_exam
  page: diventare_esaminatore
  section: comporre
- id: esame.ordine_drill
  label: The order of the drills
  short: Candidates face them in this sequence. To change it, drag an entry by the handle on the left,
    or select it and use the up and down arrows.
  anchor: esame-ordine-drill
  screens:
  - exam.compose_exam
  page: diventare_esaminatore
  section: comporre
- id: referto.tastierino
  label: The keypad
  short: First how many balls went in, then why the inning ended. Keys that make no sense right now are
    switched off.
  anchor: referto-tastierino
  screens:
  - individual_match.tpa_referto
  page: referto_tpa
  section: come-si-compila
- id: referto.passa_tavolo
  label: Handing over the table
  short: 'Tap the other player''s panel: it closes your inning and starts theirs. Before the break, the same
    tap chooses who breaks.'
  anchor: referto-passa-tavolo
  screens:
  - individual_match.tpa_referto
  page: referto_tpa
  section: come-si-compila
- id: referto.annotazioni_piccole
  label: n, x, p
  short: 'The three marks that keep an error off the player who did not commit it: easy shot, planned
    safety, push out.'
  anchor: referto-annotazioni-piccole
  screens:
  - individual_match.tpa_referto
  page: referto_tpa
  section: annotazioni-piccole
- id: referto.rileggi
  label: Back and Next
  short: They step through the match one inning at a time, changing nothing. From a past inning you can
    restart — a sheet first tells you which innings leave the scoresheet.
  anchor: referto-rileggi
  screens:
  - individual_match.tpa_referto
  page: referto_tpa
  section: rileggere-e-ripartire
- id: challenge.ricerca
  label: Search the title or the instructions…
  short: It filters all three tabs at once, and the numbers next to the tab names update. It looks inside
    the instructions too, not just the title.
  anchor: challenge-ricerca
  screens:
  - challenge.challenge_catalog
  page: challenge
  section: catalogo
- id: challenge.titolo
  label: Title
  short: 'The name the drill goes by everywhere. It is optional: without one, it takes its number — «Drill
    12».'
  anchor: challenge-titolo
  screens:
  - challenge.create_challenge
  - challenge.edit_challenge
  - challenge.duplicate_challenge
  - challenge.diagram_builder
  - challenge.edit_diagram
  page: challenge
  section: crearle
- id: esercizi.riprendi
  label: Pick up from here
  short: 'The last drill you practised, with how it was going. «Start» opens the attempts screen straight away.'
  anchor: esercizi-riprendi
  screens:
  - challenge.today
  page: challenge
  section: catalogo
- id: esercizi.apri_catalogo
  label: Open the catalogue
  short: 'All the drills, to filter by skill, stroke, level and rating.'
  anchor: esercizi-apri-catalogo
  screens:
  - challenge.today
  page: challenge
  section: catalogo
- id: esercizi.filtri
  label: Filters
  short: 'Pick an axis — skill, stroke, level, rating — and tap an entry: filters add up. Tap the selected entry again to turn it off. A drill shows up only if its author filled in that information.'
  anchor: esercizi-filtri
  screens:
  - challenge.challenge_catalog
  page: challenge
  section: catalogo
- id: esercizio.voto
  label: Your rating
  short: 'One to five balls, to help others choose: tap the ball of your rating. You rate a drill after trying it; you can change the rating whenever you like, and tapping your ball again removes it.'
  anchor: esercizio-voto
  screens:
  - challenge.challenge_detail
  page: challenge
  section: catalogo
- id: esercizio.varianti
  label: Variants
  short: 'The same drill from the right and from the left, or from positions A and B: your results stay separate, because the gap between the two sides is what you want to know.'
  anchor: esercizio-varianti
  screens:
  - challenge.challenge_detail
  page: challenge
  section: catalogo
- id: allenamento.variante
  label: Which side
  short: 'Pick the variant before shooting: it stays selected for every attempt you record. If you do not say, the attempt counts for the drill in general.'
  anchor: allenamento-variante
  screens:
  - challenge.training_session
  page: challenge
  section: catalogo
- id: challenge.abilita
  label: What it trains
  short: 'The skills the drill tests, three at most: this is how the catalogue lets people find it when they look for «something on position». If you are not sure, leave it empty.'
  anchor: challenge-abilita
  screens:
  - challenge.create_challenge
  - challenge.edit_challenge
  - challenge.duplicate_challenge
  page: challenge
  section: crearle
- id: challenge.gesto
  label: With which stroke
  short: 'The strokes it is played with: stop, draw, follow… As many as needed, even none. A second way of searching, separate from «what it trains».'
  anchor: challenge-gesto
  screens:
  - challenge.create_challenge
  - challenge.edit_challenge
  - challenge.duplicate_challenge
  page: challenge
  section: crearle
- id: challenge.livello
  label: Level
  short: 'How hard you think it is, from 1 (for beginners) to 5. Tap the selected number again to leave it undeclared.'
  anchor: challenge-livello
  screens:
  - challenge.create_challenge
  - challenge.edit_challenge
  - challenge.duplicate_challenge
  page: challenge
  section: crearle
- id: challenge.duplica
  label: Duplicate
  short: 'Opens the form filled in with this drill and creates a new one, yours, with no attempts and no ratings. The original is left alone.'
  anchor: challenge-duplica
  screens:
  - challenge.challenge_detail
  page: challenge
  section: crearle
- id: challenge.punteggio_massimo
  label: Maximum score
  short: 'How far you can get. Optional: leave it empty for drills you repeat until you miss, where a
    maximum does not exist.'
  anchor: challenge-punteggio-massimo
  screens:
  - challenge.create_challenge
  - challenge.edit_challenge
  - challenge.duplicate_challenge
  - challenge.diagram_builder
  - challenge.edit_diagram
  page: challenge
  section: due_tipi
- id: challenge.colpi
  label: Shots in an attempt
  short: 'How many shots an attempt has when it is recorded shot by shot. The maximum score is not
    typed in: it is this number times the value of the centre of the target.'
  anchor: challenge-colpi
  screens:
  - challenge.edit_challenge
  - challenge.duplicate_challenge
  page: challenge
  section: due_tipi
- id: allenamento.esito
  label: Passed / Not passed
  short: 'The button you tap records the attempt straight away: there is nothing to confirm. Tapped the
    wrong one? «Undo the last one» takes it back.'
  anchor: allenamento-esito
  screens:
  - challenge.training_session
  page: challenge
  section: allenarsi
- id: allenamento.punteggio
  label: The score of the attempt
  short: 'Plus and minus build the score, which never goes above the maximum of the exercise. «Record
    the attempt» saves it and sets the figure back to zero, ready for the next one.'
  anchor: allenamento-punteggio
  screens:
  - challenge.training_session
  page: challenge
  section: allenarsi
- id: allenamento.andamento
  label: Today's attempts
  short: 'One bar for each attempt of today, the latest one lit. The dashed line is your average up to
    yesterday: you are compared with yourself, not with the others.'
  anchor: allenamento-andamento
  screens:
  - challenge.training_session
  page: challenge
  section: allenarsi
- id: allenamento.colpo
  label: Shot by shot
  short: 'If the ball went in, tap the cloth where the cue ball stopped: the ring it lands in gives the
    points. If it did not, the shot is worth zero and has no position.'
  anchor: allenamento-colpo
  screens:
  - challenge.training_session
  page: challenge
  section: allenarsi
- id: allenamento.annulla
  label: Undo the last one
  short: 'Removes the attempt you just recorded. The XP goes back too: it is there to fix a wrong tap,
    not to replay a score.'
  anchor: allenamento-annulla
  screens:
  - challenge.training_session
  page: challenge
  section: allenarsi
- id: drill.disegna
  label: Draw the drill
  short: 'No photo of the table? Draw the drill instead: place the balls, draw the shot, and the drawing
    becomes the picture.'
  anchor: drill-disegna
  screens:
  - challenge.create_challenge
  page: challenge
  section: disegnare
- id: drill.modifica_disegno
  label: Edit the drawing
  short: 'Puts the balls back on the table as you left them. Only on drawn drills: a photo has no drawing
    to reopen.'
  anchor: drill-modifica-disegno
  screens:
  - challenge.challenge_detail
  page: disegnare_un_drill
  section: correggere
- id: drill.strumento
  label: The tools
  short: 'One at a time, and the active one is yellow: «Move» tidies up, «Shot» draws a shot, «Free line»
    traces a path, «Text» writes.'
  anchor: drill-strumento
  screens:
  - challenge.diagram_builder
  - challenge.edit_diagram
  page: disegnare_un_drill
  section: strumenti
- id: drill.bersaglio
  label: The target
  short: 'Where the cue ball should stop: a centre and up to five rings, each with its own points.
    One per drawing, and with a target the exercise can be recorded shot by shot.'
  anchor: drill-bersaglio
  screens:
  - challenge.diagram_builder
  - challenge.edit_diagram
  page: disegnare_un_drill
  section: strumenti
- id: drill.calamite
  label: Snap to cushions and balls
  short: The ball snaps by itself to grid, cushion and other balls. Clear the tick box — or hold Alt —
    if it moves you where you do not want.
  anchor: drill-calamite
  screens:
  - challenge.diagram_builder
  - challenge.edit_diagram
  page: disegnare_un_drill
  section: bilie
- id: drill.punto_impatto
  label: Contact point on the cue ball
  short: 'The circle is the cue ball seen face on: tap where the cue strikes it. Middle is centre-ball,
    high or low is follow and draw, the sides are side spin.'
  anchor: drill-punto-impatto
  screens:
  - challenge.diagram_builder
  - challenge.edit_diagram
  page: disegnare_un_drill
  section: tiro
- id: drill.forza
  label: Power
  short: How hard the ball is struck. At power 30 it travels two table lengths, and the dashed circle
    marks where it stops.
  anchor: drill-forza
  screens:
  - challenge.diagram_builder
  - challenge.edit_diagram
  page: disegnare_un_drill
  section: tiro
- id: drill.posizioni_standard
  label: Standard positions
  short: 'Eight ready-made layouts, from the racks to the wagon wheel. They replace what is on the table:
    if you get it wrong, «Undo» puts everything back.'
  anchor: drill-posizioni-standard
  screens:
  - challenge.diagram_builder
  - challenge.edit_diagram
  page: disegnare_un_drill
  section: posizioni
- id: drill.istruzioni
  label: Instructions for whoever plays it
  short: 'The drawing shows the layout, not the rule: how the score is counted goes here, in words. Without
    it the drill will not save.'
  anchor: drill-istruzioni
  screens:
  - challenge.diagram_builder
  - challenge.edit_diagram
  page: disegnare_un_drill
  section: salvare
- id: sfida.avvio_rapido
  label: Quick start
  short: 'For the match you are playing right now: pick who is across the table and you are at the scoreboard.
    No date to agree on, no waiting.'
  anchor: sfida-avvio-rapido
  screens:
  - individual_match.dashboard
  - individual_match.match_list
  page: partite_amichevoli
  section: avvio-rapido
- id: sfida.chi_hai_davanti
  label: Who is across the table
  short: 'The opponents you play most often are already listed. For anyone else, search by name: they
    need an account.'
  anchor: sfida-chi-hai-davanti
  screens:
  - individual_match.quick_match
  page: partite_amichevoli
  section: avvio-rapido
- id: sfida.riepilogo_rapido
  label: How it is played
  short: Venue, discipline and distance are the ones from your last match. If they are fine you touch
    nothing; «Change» opens them up.
  anchor: sfida-riepilogo-rapido
  screens:
  - individual_match.quick_match
  page: partite_amichevoli
  section: avvio-rapido
- id: sfida.referto_all_avvio
  label: I'll keep the TPA scoresheet
  short: 'Decide now: the scoresheet is started before the first rack, and as soon as the match starts
    you are on the scoreboard.'
  anchor: sfida-referto-all-avvio
  screens:
  - individual_match.quick_match
  - individual_match.match_detail
  page: referto_tpa
  section: aprire
- id: campionato.playoff_classifica_finale
  label: Final championship standings
  short: The play-off is added to the championship (with a weight you choose), or it decides the top places
    on its own. Leave it alone and it is the sum, with weight 1.
  anchor: campionato-playoff-classifica-finale
  screens:
  - admin.campionato.campionato_detail
  page: playoff
  section: classifica_finale
- id: segnalazione.tipo
  label: What it is about
  short: 'Three choices: something is not working, you have an idea, you did not understand how to do
    something. It tells us at a glance what kind of report this is.'
  anchor: segnalazione-tipo
  screens:
  - feedback.nuova_segnalazione
  page: segnalare_un_problema
  section: come_si_scrive
- id: segnalazione.racconto
  label: Tell us what happened
  short: 'What you were doing, what you expected, what happened instead. You do not need to be technical:
    write it the way you would say it out loud.'
  anchor: segnalazione-racconto
  screens:
  - feedback.nuova_segnalazione
  page: segnalare_un_problema
  section: come_si_scrive
- id: segnalazione.stato
  label: The status of your report
  short: 'It says where we are: received, being considered, done, or not planned for now. It changes on
    its own, and you get a notification.'
  anchor: segnalazione-stato
  screens:
  - feedback.le_mie_segnalazioni
  page: segnalare_un_problema
  section: che_fine_fa
- id: vetrina.locandina
  label: Poster
  short: The image shown in the link preview on WhatsApp or Facebook. Upload it to the
    championship and all of its competitions will use it.
  anchor: vetrina-locandina
  screens:
  - admin.competition.gara_vetrina
  - admin.campionato.campionato_vetrina
  page: far_conoscere_la_gara
  section: locandina
- id: vetrina.indirizzo
  label: Custom address
  short: 'A readable name instead of the code, easy to read out on the phone. The link
    with the code keeps working.'
  anchor: vetrina-indirizzo
  screens:
  - admin.competition.gara_vetrina
  page: far_conoscere_la_gara
  section: indirizzo
- id: vetrina.link_esterno
  label: External link
  short: 'Rules, venue page or payment form: it becomes a button at the bottom of the
    showcase.'
  anchor: vetrina-link-esterno
  screens:
  - admin.competition.gara_vetrina
  - admin.campionato.campionato_vetrina
  page: far_conoscere_la_gara
  section: regolamento
- id: campionato.gare_pianificate
  label: Planned competitions
  short: 'How many competitions you expect to play in the championship. It is a guide for those who
    follow it: you add competitions one at a time, and you can have more or fewer.'
  anchor: campionato-gare-pianificate
  screens:
  - admin.campionato.wizard_start
  page: creare_un_campionato
  section: passo1
- id: campionato.modalita_esercizi
  label: Drill mode
  short: 'In the championship competitions players also face individual skill drills, with their own
    standings. If you do not know what it is, leave it off.'
  anchor: campionato-modalita-esercizi
  screens:
  - admin.campionato.wizard_start
  page: creare_un_campionato
  section: passo1
- id: campionato.playoff_elite
  label: Elite Playoff
  short: At the end of the championship the top players in the overall standings play a final competition
    among themselves. Here you decide whether to hold it and for how many players.
  anchor: campionato-playoff-elite
  screens:
  - admin.campionato.wizard_start
  page: playoff
  section: qualificarsi
- id: campionato.playoff_academy
  label: Academy Playoff
  short: 'A second final for those who come right after the top players: so even those not at the top
    have a competition to play for at the end of the season.'
  anchor: campionato-playoff-academy
  screens:
  - admin.campionato.wizard_start
  page: playoff
  section: qualificarsi
- id: campionato.nuova_gara
  label: New competition
  short: 'Adds a competition to the championship. It is born with the default settings chosen in the
    wizard: change only what you need.'
  anchor: campionato-nuova-gara
  screens:
  - admin.campionato.campionato_detail
  page: creare_un_campionato
  section: aggiungere_gare
- id: campionato.termina
  label: Terminate
  short: 'Closes the championship: the overall standings become final and, if you planned playoffs,
    you start them from here. There is no going back.'
  anchor: campionato-termina
  screens:
  - admin.campionato.campionato_detail
  page: creare_un_campionato
  section: classifica_generale
- id: campionato.avvia_playoff
  label: Start the playoffs
  short: Asks when the playoff is played and until when players can reply, then sends the invitation
    to the qualified players. Whoever declines leaves the place to the first of the excluded.
  anchor: campionato-avvia-playoff
  screens:
  - admin.campionato.campionato_detail
  page: playoff
  section: avviare
- id: playoff.risposta_invito
  label: Accept / Decline
  short: The answer to the invitation. Normally the player gives it from their phone; if they tell you
    in person, or if the player is fictitious, you record it here.
  anchor: playoff-risposta-invito
  screens:
  - admin.campionato.campionato_detail
  page: playoff
  section: invito
- id: playoff.invito_scaduto
  label: Accept (expired invitation)
  short: The invitation has expired, but until the competition starts you can accept it for the
    player, for instance if they show up at the venue. They join even beyond the places.
  anchor: playoff-invito-scaduto
  screens:
  - admin.campionato.campionato_detail
  page: playoff
  section: invito
- id: playoff.accetta_tutti
  label: Accept all remaining
  short: 'In a trial the fictitious players do not answer by themselves: this button accepts every
    invitation still pending, and the final fills up in one tap.'
  anchor: playoff-accetta-tutti
  screens:
  - admin.campionato.campionato_detail
  page: fare_una_prova
  section: campionato
- id: prova.spunta
  label: Trial competition
  short: A competition only you can see, to fill with fictitious players and run like a real one. It
    does not touch statistics or standings. At most three at a time.
  anchor: prova-spunta
  screens:
  - admin.competition.create_gara_standalone
  - admin.campionato.wizard_start
  page: fare_una_prova
  section: creare
- id: prova.fittizi
  label: Fictitious players
  short: 'Three buttons to fill the trial: the minimum to get it started, up to the maximum to fill it,
    one more to see what happens with an odd number.'
  anchor: prova-fittizi
  screens:
  - admin.competition.gara_detail
  page: fare_una_prova
  section: iscrivere
- id: prova.simulazione
  label: Simulation
  short: 'Makes the fictitious players play for you: one match, the whole round or the whole competition.
    Half the matches close by themselves, the others wait for you to validate them.'
  anchor: prova-simulazione
  screens:
  - admin.competition.gara_detail
  page: fare_una_prova
  section: simulare
- id: prova.aiuto
  label: Tips
  short: 'Turns the «?» next to the controls and the screen introductions on or off. It applies to this
    browser: switched off here, it stays off in every trial.'
  anchor: prova-aiuto
  screens:
  - admin.competition.gara_detail
  - admin.competition.gara_preparazione
  - admin.competition.gara_impostazioni
  - admin.campionato.campionato_detail
  - admin.campionato.edit_campionato
  page: fare_una_prova
  section: aiuto
- id: prova.elimina
  label: Delete the trial
  short: 'Deletes everything, right away: competitions, matches, registrations and fictitious players.
    If you do not, the trial disappears by itself on the expiry date written above.'
  anchor: prova-elimina
  screens:
  - admin.competition.gara_detail
  - admin.competition.gara_preparazione
  - admin.competition.gara_impostazioni
  - admin.campionato.campionato_detail
  - admin.campionato.edit_campionato
  page: fare_una_prova
  section: eliminare

tours:
- screen: dashboard.dashboard
  title: Your home
  intro: 'Everything starts here: how you are doing, the competitions you are registered for, the ones
    in progress, the championships and competitions near you.'
  audience:
  - giocatore
  steps:
  - title: The summary that greets you
    text: 'As soon as you come in, at the top there is a panel with how you are doing: two numbers, a
      chart and your latest activities. You just read it; then it makes way for the things to do, and
      comes back next time you sign in.'
  - title: Your competitions
    text: 'Under «Your competitions» there is only what concerns you: the competitions you are registered
      for and the ones you direct. Your current match sits inside the card of its own competition.'
  - title: Individual matches
    text: 'Matches outside a competition, scheduled or already started, have a section of their own just
      below your competitions.'
  - title: Live now
    text: The competitions being played right now, including those you are not in, with the scores
      at the tables. The dark card is the live one.
  - title: Open, you can register
    text: 'The competitions you can still register for are in a separate section further down: one tap on
      the green button and you are in.'
  - title: Finished
    text: 'The latest finished competition and those of the last month, everyone''s: the ones you played
      or directed are marked «You played» and «You directed». The others are in the history.'
  - title: At the bottom of the screen
    text: The bar with Dashboard, Venues, Matches, Challenges and Notifications takes you everywhere.
      On a computer it is the left-hand column.
- screen: admin.competition.gara_detail
  title: The competition page
  intro: 'Everything about a competition is here: who plays whom, how the standings are going and who
    is taking part.'
  audience:
  - giocatore
  - direttore
  steps:
  - title: Where we are
    text: Whoever directs sees the phase strip at the top — preparation, registrations (the playoff has none), in play, closing — and a dark band with the one thing to do now; the rest of the management lives in «Competition settings». Players get the Rounds, Standings and Registered tabs.
  - hint: gara.turni
  - hint: gara.classifica
  - title: Entrants
    text: Who is taking part and who if anyone is on the waitlist.
  - hint: gara.distanza
- screen: admin.match.match_detail
  title: The scoreboard
  intro: 'You use this screen while you play: one button per player, pressed after each rack.'
  audience:
  - giocatore
  steps:
  - hint: partita.segnapunti
  - hint: partita.punteggio
  - title: If you make a mistake
    text: «Undo last rack» removes the last point awarded. You can repeat it.
  - hint: partita.rack
  - hint: partita.tabellone
- screen: admin.competition.create_gara_standalone
  title: Creating a competition
  intro: 'Four steps. If it is your first time, change only the name, date, venue and discipline: the
    rest is already fine.'
  audience:
  - direttore
  steps:
  - hint: gara.distanza
  - hint: gara.strategia
  - hint: gara.dispari
  - hint: gara.classifica_sistema
  - title: If you choose a bracket
    text: With knockout and double elimination half the questions disappear — they would have no effect
      on a bracket — and the «Bracket options» panel appears.
- screen: individual_match.tpa_referto
  title: The TPA scoresheet
  intro: 'Here you record the whole match, not just who wins the racks. One inning at a time: how many
    balls, and why it ended.'
  audience:
  - giocatore
  steps:
  - hint: referto.tastierino
  - hint: referto.passa_tavolo
  - hint: referto.annotazioni_piccole
  - hint: referto.rileggi
- screen: feedback.nuova_segnalazione
  title: Reporting a problem
  intro: Three fields, that is all. The page you came from, the version and the browser are attached by
    the app itself.
  audience:
  - giocatore
  - direttore
  steps:
  - hint: segnalazione.tipo
  - hint: segnalazione.racconto
  - title: What not to write
    text: 'The text ends up on GitHub, where we keep our list of work: do not put personal details in
      it, yours or another player''s.'
- screen: admin.campionato.wizard_start
  title: Creating a championship
  intro: 'Two steps: first what the championship is, then the settings every competition will inherit.
    If it is your first time, tick «Trial competition»: it is deleted with one tap.'
  audience:
  - direttore
  steps:
  - hint: campionato.gare_pianificate
  - hint: campionato.classifica
  - hint: gara.strategia
  - hint: campionato.playoff_elite
  - hint: prova.spunta
- screen: admin.campionato.campionato_detail
  title: The championship page
  intro: From here you add competitions, follow the overall standings and, at the end of the season,
    close the championship and start the playoffs.
  audience:
  - direttore
  steps:
  - hint: campionato.nuova_gara
  - title: Overall standings
    text: It adds up the results of every competition played, with the weight you gave each one. It
      updates by itself every time a match is closed.
  - hint: campionato.termina
  - hint: campionato.avvia_playoff

title: "Playing a match and keeping score"
section: giocare
kind: tutorial
audience: [giocatore]
minutes: 5
summary: "The scoreboard: one button per player, pressed after each rack. How to fix a mistake and what happens when the match ends."
screens: [admin.match.match_detail]
related: [seguire_la_gara, formati_di_gioco]

blocks:
  - type: text
    text: >-
      This is the screen you will use most: the match page. It is built to be
      used standing up, with one hand, while the other holds your cue.

  - type: heading
    id: aprire
    title: "Opening the match"

  - type: text
    text: >-
      When the round starts, your match appears at the top of your home and on
      the competition page, with the **Enter the result** button. You also get
      a notification. Tap it and you are in.

  - type: shot
    shot: partita-segnapunti
    caption: "The match page: score at the top, scoreboard in the middle, list of racks played at the bottom."

  - type: heading
    id: leggere
    title: "Reading the screen"

  - type: options
    title: "What is there, top to bottom"
    items:
      - name: "The «In progress» dot"
        text: "Red and blinking: it means the match is live and the score updates in real time for anyone following from a distance."
      - name: "The score"
        text: "The two big numbers. Under each is the player's name and rating."
        hint: partita.punteggio
      - name: "The distance line"
        text: "For example «Race to 5 · 7 racks played»: it reminds you what it takes to win and how many racks have been played in total."
        hint: gara.distanza
      - name: "The scoreboard"
        text: "The two large «+1» buttons, one per player. Yours is the solid dark one: you can tell it apart without reading the name."
        hint: partita.segnapunti
      - name: "Undo last rack"
        text: >-
          Removes the last point awarded. For when the wrong button gets
          pressed, and it stays within reach once the distance has been reached
          and even just after the match closes, until the director validates:
          the rack that closes the match is exactly the one where a mistake
          costs the most.
      - name: "Declare forfeit"
        text: "Only for when the match really is abandoned: it awards the opponent all the remaining racks."
        hint: partita.forfait
      - name: "Racks played"
        text: "The list of who won each rack, with the running score. It is the match's scoresheet."

  - type: heading
    id: segnare
    title: "Recording a rack"

  - type: steps
    items:
      - title: "Finish the rack at the table"
        text: "You play normally: the app does not get involved in the rules of pool."
      - title: "Press the button of whoever won"
        text: >-
          A single tap on the **+1** button with the rack winner's name. Not
          «+1 to me» and «-1 to them»: you only record the winner.
        shot: partita-rack
      - title: "Check the score at the top"
        text: >-
          The big number changes immediately, and the rack appears at the
          bottom of the list. If the number has not changed, the tap did not
          register: press again.
      - title: "Carry on to the distance"
        text: >-
          You keep going like that rack by rack. When the agreed number is
          reached the **+1** buttons switch off and you move on to confirming
          the result.

  - type: note
    tone: tip
    title: "Only one of you needs to record"
    text: >-
      Both players do not need to keep score: there is one score and it updates
      on both phones. Agree on who keeps the count, usually whoever has the
      handier phone.

  - type: heading
    id: tabellone
    title: "The scoreboard: turn your phone"

  - type: text
    text: >-
      Rest your phone against the cushion and turn it sideways: the page
      changes by itself into a full-screen scoreboard, with the two scores
      large in the middle. You can read it from a distance, even while playing
      from the other end of the table.

  - type: shot
    shot: partita-tabellone
    variant: landscape
    caption: "The scoreboard with the phone turned sideways: the table number in the top left, the two large scores, the BREAKING pill over whoever opens, and the rack dashes under each score."

  - type: list
    title: "What changes from the normal page"
    items:
      - "You score by tapping the **player's half**: left half of the screen, a rack to whoever is on the left; right half, to the other one. There is no button to look for — the target is half the screen, and you can hit it one-handed, even without looking."
      - "Your half is the one with **you** next to the name."
      - "Under each name is the player's **Elo rating**: it tells you who you are up against before the first break. In a competition match it is the competition Elo, in an individual match it is the one that also counts individual matches. Anyone who would rather not show it switches it off in their [privacy](/aiuto/account/privacy_e_dati) settings — and then nothing appears under their name."
      - "While you play, at the bottom the button to **undo the last rack** stays: with a target this big a stray tap gets easier, not harder. At the distance it gives way to «Accept» and «Reject», which does the same thing."
      - "The point lands in the same place as on the normal page: for the score there is no difference between the two views."
      - "Under each score, the dashes show how many racks are left to win, so you do not have to count them."
      - "In the top left, when a table is assigned, its **number stands out**: it is how you recognise your own scoreboard walking across a room with eight tables. Next to it, the time the match started."
      - "The red dot in the top right blinks while the match is live; it stops once the match is over."

  - type: text
    text: >-
      The scoreboard stays on when the match ends: the two halves switch off,
      **Accept** and **Reject** appear at the bottom, and above them you can
      read who won and by what score. You do not need to turn the phone upright
      to confirm the result.

  - type: heading
    id: chi-spacca
    title: "Who breaks, and racks closed in one visit"

  - type: text
    text: >-
      Above the name of whoever takes the break shot the word **breaking**
      appears. It moves on its own after each rack, following the rule chosen
      for the competition: there is nothing to press and nothing to remember.

  - type: text
    text: >-
      The dashes under the score do more than count: the one that has just lit
      up can be **pressed**. One tap marks that rack as closed in a single
      visit, that is without ever leaving the table to the opponent; a second
      tap unmarks it, if you got it wrong.

  - type: list
    title: "What appears on the dash"
    items:
      - "**B** if that rack was his to open: he broke and ran it."
      - "**R** if he closed it in reply, that is after the opponent had broken."
      - "Nothing, if you did not mark it. That is the normal case: marking is optional and does not change the score."

  - type: note
    tone: info
    title: "The difference between B and R is not a choice"
    text: >-
      You are not asked: the app already knows who had the break shot in that
      rack, and works it out by itself. All you do is press the dash.

  - type: text
    text: >-
      Both numbers end up in your [profile](/aiuto/account/profilo_e_statistiche),
      under **Runout**.

  - type: heading
    id: acchito
    title: "When the competition starts with a lag"

  - type: text
    text: >-
      If the start rule is **Lag**, before the first rack the scoreboard asks
      two questions instead of showing the score. In a competition the director
      picks it; in a [friendly match](/aiuto/giocare/partite_amichevoli) you
      pick it yourself, along with the rest of how you play.

  - type: steps
    items:
      - title: "Who won the lag?"
        text: "Tap the name of whoever won it."
      - title: "Who takes the break shot?"
        text: >-
          The lag winner chooses, and it **need not be them**: they may send
          the opponent to the table. If they break themselves you touch
          nothing; if they send the other player, tap the other name.
      - title: "Start"
        text: "The scoreboard appears, and you score as usual."

  - type: note
    tone: info
    title: "If the competition does not use a lag you see none of this"
    text: >-
      With the **First player** rule — which is the default — the first of the
      two breaks and the questions never appear.

  - type: note
    tone: tip
    title: "Your phone stays awake"
    text: >-
      While the scoreboard is open the screen stays on by itself: you do not
      have to touch it to keep it alive, so you cannot score a rack that never
      happened. If the phone locks anyway, the first tap after unlocking does
      not count: it only picks the match back up.

  - type: note
    tone: info
    title: "Friendly matches too"
    text: >-
      It is the same scoreboard: turn your phone when you are playing a match
      outside competitions as well.

  - type: note
    tone: tip
    title: "Going back to the normal page"
    text: >-
      Turn the phone upright and the scoreboard disappears on its own. If you
      would rather stay sideways but see the rest of the match — the list of
      racks, the forfeit — tap the **X** in the top left.

  - type: heading
    id: sbagli
    title: "If you make a mistake"

  - type: text
    text: >-
      **You pressed the wrong button**: tap **Undo last rack**. You can repeat
      it, going back rack by rack.

  - type: text
    text: >-
      **The match has just closed**: **Undo last rack** is still there, in the
      green box. It removes the wrong rack and puts the match back in progress,
      so you can replay it. This holds until the director validates the result.

  - type: text
    text: >-
      **The director has already validated**: from then on you cannot correct it
      yourself. Call them: they can reset the match and have you enter it again.
      That is deliberate: a validated result has gone into the standings, and it
      should not be able to change without the organiser knowing.

  - type: heading
    id: forfait
    title: "Forfeits and abandoned matches"

  - type: text
    text: >-
      If a player cannot continue — has to leave, gets injured, did not turn up
      — you use **Declare forfeit**. The opponent receives all the racks that
      were missing to the distance: if you were at 3-2 in a race to 5, the
      result becomes 5-2.

  - type: note
    tone: warning
    text: >-
      A forfeit cannot be undone by a player. If you declare one by mistake you
      need the competition director. When in doubt, ask them before pressing.

  - type: heading
    id: fine
    title: "When the match ends"

  - type: text
    text: >-
      Once the distance is reached **Distance reached** appears: the score can
      no longer go up and all that is left is to confirm it. Whoever won counts
      as agreeing without doing anything — they have no reason to dispute the
      result that hands them the win — so the missing signature is the loser's,
      with the two buttons **Accept** and **Reject**.

  - type: note
    tone: tip
    title: "If you record the rack that makes you lose, nothing more is asked of you"
    text: >-
      The one keeping score is often the one losing. Having already recorded
      the point that closes the match in the other player's favour, they are
      not asked to accept it a second time: the match closes straight away. The
      same goes when the competition director is the one recording, because
      their score is already the official one.

  - type: text
    text: >-
      **Reject** closes nothing: it removes the last rack and puts the score
      back one tap from the end, so you can sort it out at the table and record
      it again.

  - type: text
    text: >-
      Once the result is confirmed the match becomes **Finished**. From then
      on: the result goes into the round standings, the table frees up for the
      next match, and once **every** match in the round is done the director can
      start the next one. In place of the **+1** buttons a green box remains
      with **Undo last rack** on its own: if the last rack was wrong you remove
      it and the match goes back in progress, until the director validates.

  - type: shot
    shot: gara-turni
    caption: "The round's matches: finished ones show the result with a crown next to the winner."

  - type: faq
    items:
      - q: "Can I record the score of a match that is not mine?"
        a: "No, only the competition director can. You can see every match, but you can only act on your own."
      - q: "The score is not updating on my opponent's phone."
        a: "Updates travel over the network: if the venue has poor signal it can take a few seconds. Reloading the page brings it back in line."
      - q: "We played more racks than we should have."
        a: "The app does not allow it: once the distance is reached the +1 buttons switch off. Any extra racks simply do not count."
      - q: "Do both of us have to confirm the result?"
        a: "Both signatures are needed, but the winner's is automatic: the only one left for you to give is the loser's. And if the loser recorded the last rack they already gave it by pressing, so no button appears at all. When «Accept» and «Reject» show up, it is your turn."
      - q: "What is the table number at the top?"
        a: "The table the director assigned you for this match. If there is none, the venue has no tables configured and you sort it out on the spot."

title: "Profile and statistics"
section: account
kind: approfondimento
audience: [giocatore]
minutes: 4
summary: "What your profile holds, how to read the rating, and where to find the history of competitions you have played."
screens: [player.profile, player.history, player.edit_profile, player.dashboard,
  player.view_profile]
related: [privacy_e_dati, progressi]

blocks:
  - type: text
    text: >-
      Your profile is your card: what others see of you and what the app has
      recorded of your matches. You reach it by tapping the initial of your
      name at the top right.

  - type: shot
    shot: profilo
    caption: "The personal profile: details, rating and statistics of matches played."

  - type: heading
    id: cosa_contiene
    title: "What it holds"

  - type: options
    items:
      - name: "Username"
        text: "The name you appear under in the standings. It stays as chosen at sign-up."
      - name: "Email"
        text: "Used for password recovery and notifications. Editable, with a fresh verification."
      - name: "Town"
        text: "Optional: it only serves to show you nearby competitions first. Never your precise location."
      - name: "Team"
        text: >-
          Free text, written by you. Organisers use it when a competition runs
          a bracket and wants to keep team-mates from meeting straight away.
      - name: "Rating"
        text: "A numeric estimate of your strength, worked out from results."
        hint: profilo.rating
      - name: "Statistics"
        text: "Matches played, won, lost, racks and percentages."

  - type: heading
    id: rating
    title: "How to read the rating"

  - type: text
    text: >-
      The rating starts from a middling value and moves with every match: it
      rises when you win, falls when you lose, and moves **more** when the
      result is unexpected. Beating a much stronger opponent gains a lot;
      losing to a much weaker one costs as much.

  - type: text
    text: >-
      In the app the rating is called **Elo**, and it is the number you also
      see in the «How you are doing» panel, the one that greets you at the top
      of your home when you come in, together with how much it has changed over
      your recent matches. Anyone who has not played yet starts at 1200.

  - type: note
    tone: info
    title: "Two ratings, not one"
    text: >-
      There is a **competitive** rating, which counts official competitions
      only, and an **overall** one, which also includes friendly matches.
      Wherever the rating appears you can switch between them with one tap:
      your choice is remembered across all pages.

  - type: text
    text: >-
      In competitions **with a handicap** the rating only moves in matches
      between players of the same [category](/aiuto/organizzare/categorie): there nobody
      gives anything away and the result really does say who is stronger.
      Between different categories the score is altered by design, and using it
      to measure players' strength would distort it.

  - type: heading
    id: storico
    title: "The history"

  - type: shot
    shot: storico
    caption: "The history: every competition you have taken part in, with your finishing position and results."

  - type: text
    text: >-
      The history holds **everything you have played**, split into five tabs:
      matches, competitions, championships, drills and exams. It is the place to
      find an evening from months ago.

  - type: list
    title: "The five tabs"
    items:
      - "**Matches** — all of them, individual matches included. Every row says where it comes from: championship, competition or individual. «Where from» keeps just one kind, and the pie above counts the matches you are looking at, not all of them."
      - "**Competitions** and **Championships** — the ones you took part in, with your final position."
      - "**Drills** — the attempts you recorded. From here you can delete one entered by mistake, and picking a scored drill shows its trend."
      - "**Exams** — the completed ones, with the outcome and, when certified, who certified it."

  - type: note
    tone: tip
    title: "A drill's trend"
    text: >-
      In the **Drills** tab, the chart icon next to a scored attempt opens that
      drill's trend: the scores in time order, with zero at the bottom and the
      drill's maximum at the top. Narrowing the dates narrows the chart. With a
      single attempt nothing is drawn: one point is not a trend.

  - type: note
    tone: warning
    title: "Deleting an attempt"
    text: >-
      It is for the score you entered wrong. It does not just remove the row:
      the XP that attempt paid goes back too, and streaks and achievements are
      **recalculated**. If other drills still hold them up, nothing changes —
      deleting one out of a hundred does not cost you the streak. Attempts
      played **in a competition** cannot be deleted: they count in the standings.

  - type: text
    text: >-
      If you would rather not show a particular competition or match in your
      public profile you can hide it: it stays in the official standings —
      those are untouchable — but disappears from your shop window. See
      [Privacy and data](/aiuto/account/privacy_e_dati).

  - type: heading
    id: profili_altrui
    title: "Other people's profiles"

  - type: text
    text: >-
      Tapping a player's name in the standings opens their public profile:
      you will see what they chose to show. Email, phone and personal settings
      are never visible to others.

  - type: heading
    id: modificare
    title: "Editing your profile"

  - type: steps
    items:
      - title: "Open your profile and tap «Edit»"
        text: "From there you change email, town, team and the rest."
      - title: "If you change your email, confirm it"
        text: >-
          You will get a verification message at the new address. Until you
          confirm it, password recovery still goes through the old one.
      - title: "The password has its own entry"
        text: "It asks for your current password: that is the guarantee it really is you changing it."

  - type: faq
    items:
      - q: "Why did my rating fall even though I won?"
        a: "It does not: winning never lowers the rating. If the number looks different, check you have not switched between competitive and overall."
      - q: "Can I change my username?"
        a: "No: it appears in standings that are already published, and changing it would make past results unrecognisable."
      - q: "Do friendly matches show in my profile?"
        a: "Yes, in the overall statistics. The competitive rating excludes them."
      - q: "Who can see my email address?"
        a: "No other player. It is stored encrypted and is only used for the app's own messages."

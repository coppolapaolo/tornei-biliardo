title: "How standings are worked out"
section: approfondimenti
kind: approfondimento
audience: [tutti]
minutes: 5
summary: "Three ways of ordering players — wins, racks, position — and how level finishes are settled."
related: [seguire_la_gara, abbinamenti, formati_di_gioco]

blocks:
  - type: text
    text: >-
      Every competition picks **one** standings system, decided at creation and
      valid throughout. It changes what gets rewarded, and therefore how it
      pays to play.

  - type: shot
    shot: gara-classifica
    caption: "Standings using the «Wins» system: the two right-hand columns are wins and rack difference."

  - type: heading
    id: vittorie
    title: "Wins — the normal system"

  - type: text
    text: >-
      Orders by **matches won**. When wins are level, **rack difference**
      decides: racks won minus racks lost across the whole competition.

  - type: list
    title: "An example"
    items:
      - "Marco: 3 wins, difference +6 → **first**"
      - "Elena: 2 wins, difference +2 → **second**"
      - "Paolo: 2 wins, difference +2 → **second, level with Elena**"
      - "Davide: 1 win, difference -2 → **fourth**"

  - type: text
    text: >-
      This is the system to use when winning the match is what counts: winning
      4-3 earns the same win as winning 4-0, and the margin only separates
      players who are otherwise level.

  - type: heading
    id: rack
    title: "Racks — every rack counts"

  - type: text
    text: >-
      Orders by **total racks won**, regardless of who won the matches. Someone
      who loses 4-3 every time can finish ahead of someone who wins 4-0 in half
      their matches and loses 4-0 in the rest.

  - type: note
    tone: warning
    title: "It goes with the exact number of racks"
    text: >-
      With this system matches should be played out in full (the **exact number
      of racks** option). Otherwise whoever wins comfortably stops earlier and
      collects fewer racks than someone who wins narrowly: the count would
      reward the opposite of what it means to reward.

  - type: heading
    id: posizione
    title: "Position — for brackets"

  - type: text
    text: >-
      This is the system for knockout and double elimination: the standings
      **are** the bracket. Whoever wins the tournament is first, the losing
      finalist second, and so on. On bracket formats it is not even a choice —
      it is the only possible system, and the field disappears from the
      creation form.

  - type: text
    text: >-
      Players go out in pairs, so many positions are **shared**: the two beaten
      semi-finalists are both third, the four quarter-finalists all fifth. That
      is not a level finish to settle, it is what the path says.

  - type: text
    text: >-
      In a championship each position is worth a number of points, which add up
      across competitions. The starting table is **25 points for first, 18 for
      second, 15 for third, 12 for fourth, 8 from fifth to eighth and 4 from
      ninth to sixteenth**, and the director can change it championship by
      championship: see [Creating a
      championship](/aiuto/organizzare/creare_un_campionato). Everybody level
      inside a band takes the same score.

  - type: heading
    id: pari_merito
    title: "Level finishes"

  - type: text
    text: >-
      It often happens that two players finish identically. Between tied
      players a **chain of criteria** decides, applied one after the other: for
      example the head to head, then the rack difference, then an SSR
      tiebreaker up to 3rd place. The director composes the chain, and the
      sentence it produces («With the same wins …») can be read on the
      competition page and in its rules. How to compose it: [End-of-competition
      tie-breaks](/aiuto/organizzare/spareggi).

  - type: options
    title: "Three standings, three chains"
    items:
      - name: "Round standings"
        values: "by default: rack difference → position in the previous round → draw"
        text: >-
          They drive the pairings, so they never leave a tie: they always end
          with the draw. The SSR tiebreaker is not here, it is played after the
          competition.
      - name: "Final standings of the competition"
        values: "by default: rack difference → SSR tiebreaker up to 3rd place"
        text: >-
          Players still level after every criterion share the place, and the
          next one is skipped (1, 2, 2, 4).
      - name: "Overall championship standings"
        values: "by default: rack difference → SSR (sum) → position after the previous competition → draw"
        text: >-
          The championship chooses them, and they leave no ties: playoff
          invitations start from there.

  - type: note
    tone: info
    title: "Bracket competitions are never played off"
    text: >-
      There, a level finish by band is the intended result and not an
      ambiguity: the tie chain is not even asked for at creation. The one
      exception is the **third-place final**, which can be planned at creation
      and has the two beaten semi-finalists play for third.

  - type: heading
    id: quando_aggiorna
    title: "When they update"

  - type: text
    text: >-
      A competition's standings are recalculated **at the end of each round**,
      not after each match: the round has to be complete for the comparison to
      be between like situations. That is why they can sit still while play
      continues.

  - type: text
    text: >-
      The **championship** standings update when a competition finishes, adding
      up the results of every competition played. Missing one is not penalised
      beyond not having earned points on that occasion.

  - type: text
    text: >-
      Each competition can carry a **weight**, and its score is multiplied by
      that number before it enters the sum. Normally the weight is 1 and every
      competition counts the same. The director can raise it — usually on the
      last one, so nobody wins the championship with two competitions to
      spare — and in the list of competitions the heavier ones say so with a
      mark next to the number: ×2, ×3.

  - type: heading
    id: casi_particolari
    title: "Special cases"

  - type: options
    items:
      - name: "X by walkover"
        text: >-
          Whoever is left without an opponent gets a win and zero rack
          difference: neither rewarded nor penalised against those who played.
      - name: "Forfeit"
        text: >-
          Whoever abandons leaves their opponent all the remaining racks. Those
          racks count in the standings like any other.
      - name: "Trio match"
        text: >-
          In the three-way mini round-robin, the most racks wins; if two are
          level at the top, nobody takes the win and only rack differences
          count.
      - name: "Handicap"
        text: >-
          The standings use the **effective** scores, that is the ones after
          the handicap.

  - type: faq
    items:
      - q: "I have more wins but I am behind."
        a: "Then the competition uses the «Racks» system, where total racks count and wins do not. The system is shown on the competition card."
      - q: "Two players share the same position."
        a: "They finished level in a position for which no tie-break was planned. That is the director's choice, not a fault."
      - q: "The standings did not update after my match."
        a: "They are recalculated when every match in the round is finished."
      - q: "How do the championship standings add up?"
        a: "By summing: wins and rack difference with «Wins», total racks with «Racks», position points with «Position». If a competition carries a weight, its score is multiplied by that number first."
      - q: "In the championship two players have the same numbers: who is ahead?"
        a: "Whoever was ahead after the previous competition. If they were level there too, the draw decides: it is fixed, so the standings do not change each time you look, and it does not depend on who registered first."
      - q: "During a competition, level on wins and rack difference, who is ahead?"
        a: "Whoever was ahead in the previous round, and in round one whoever was ahead in the starting order. With the «Racks» system the difference does not count: level on racks, the previous round decides straight away. The tie-break is played only at the end of the competition."

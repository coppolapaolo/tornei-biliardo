title: "Teams"
section: organizzare
kind: approfondimento
audience: [direttore, giocatore]
minutes: 4
summary: "When entrants come from different clubs, you can ask the app not to pair team-mates against each other straight away."
screens: [admin.competition.gara_detail, admin.competition.gara_impostazioni]
related: [abbinamenti, opzioni_della_gara, profilo_e_statistiche]

blocks:
  - type: text
    text: >-
      In a competition between clubs it happens that two team-mates meet in the
      first round: sportingly it is a shame, and sometimes it is awkward too.
      The app can avoid it.

  - type: heading
    id: due_livelli
    title: "Two different kinds of team"

  - type: text
    text: >-
      The word «team» shows up in two places that should not be confused.

  - type: options
    items:
      - name: "The team on your profile"
        text: >-
          Free text, written by the player. It only serves to **pre-fill** the
          registration: nobody uses it to decide pairings, and neither director
          nor administrator edits it.
      - name: "The team in the competition"
        text: >-
          The membership that actually counts. It lives inside the single
          competition, is chosen at registration, and can differ from the
          profile one — which happens when you play for a hosting club.

  - type: heading
    id: attivare
    title: "Turning teams on (director)"

  - type: text
    text: >-
      The option is called **Keep team-mates apart in the early rounds** and
      lives in the «Bracket options» panel, which only appears if you choose
      knockout or double elimination: it is at the bracket draw that separation
      has room to work. Turn it on while the competition is still a draft. It
      has to be decided beforehand, not after: turning it on with registrations
      under way would leave half the entrants with no team.

  - type: text
    text: >-
      When teams are on, the **Teams** row appears on the competition page —
      among the things to prepare, and while registrations are open under
      «Worth keeping an eye on» — and in **Competition settings**. Tap it and
      the sheet with the list opens.

  - type: shot
    shot: gara-impostazioni
    variant: desktop

  - type: shot
    shot: gara-squadre

  - type: options
    title: "What the sheet lets you do"
    items:
      - name: "Create a team"
        text: "Teams are born inside the competition: there is no global list to maintain."
      - name: "Rename it"
        text: "To fix a misspelt name, without touching the registrations."
      - name: "Merge two teams"
        text: >-
          When the same club has been written two ways («CSB Udine» and «C.S.B.
          Udine»): merging brings the entrants together into one.
      - name: "Deactivate one"
        text: >-
          Removes it from the available choices without touching anyone who has
          already selected it.
      - name: "Change an entrant's team"
        text: >-
          In the list of entrants each player has a chip with their team: tap
          it and choose from the sheet that opens.

  - type: note
    tone: info
    text: >-
      After the first-round draw the row stays, with a grey tile: the sheet
      still opens, but the list is read-only.

  - type: heading
    id: iscriversi
    title: "Choosing your team (player)"

  - type: text
    text: >-
      When teams are on, a box opens by itself the moment you register, asking
      **«Which team are you playing for?»**. The question comes right there,
      straight away, and not at the bottom of a tab: the team is what the draw
      works with, and a draw that receives nearly every registration without a
      team has nothing to work on.

  - type: text
    text: >-
      If you filled in the team on your profile, it comes pre-selected. **No
      team** is a legitimate answer, not a field left blank by accident: it
      means that evening you are playing for yourself. Closing the box without
      answering does no harm: the registration stays valid and the same choice
      waits for you in the competition's **Entrants** tab.

  - type: heading
    id: come_funziona
    title: "What the app does at the draw"

  - type: text
    text: >-
      At the first-round draw the app tries **not to pair team-mates**. It is a
      goal, not a hard rule: if separating them all were impossible — say six of
      eight entrants from the same team — the app picks the combination that
      separates as many as it can, rather than refusing to draw.

  - type: note
    tone: info
    text: >-
      Separation applies to the **first round**, the drawn one. In later rounds
      pairings come from the standings, and there two team-mates can meet: that
      is the method working normally, not a fault.

  - type: faq
    items:
      - q: "I set a team on my profile but it does not show in the competition."
        a: "The profile team only pre-fills: if the competition does not have teams turned on, it is neither asked for nor used."
      - q: "How long can I change my team for?"
        a: "Until the first-round draw. From that moment the bracket has already been built around the teams, and changing them would make the separation already applied incoherent."
      - q: "Two team-mates met anyway."
        a: "Either it was mathematically unavoidable in the first round, or they met in a later round, where pairings follow the standings."
      - q: "Do teams produce team standings?"
        a: "No. They only serve the draw: the standings stay individual."

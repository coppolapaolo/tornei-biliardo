title: "Friendly matches"
section: giocare
kind: tutorial
audience: [giocatore]
minutes: 4
summary: "Outside official competitions you can propose a match to another player, agree on where and when, and record the result."
screens: [individual_match.dashboard, individual_match.quick_match, individual_match.create_proposal,
  individual_match.match_list, individual_match.match_detail, individual_match.proposal_list,
  individual_match.proposal_detail, individual_match.rematch, individual_match.user_statistics]
related: [giocare_una_partita, profilo_e_statistiche]

blocks:
  - type: text
    text: >-
      Not everything goes through competitions. If you want to play a couple of
      frames with a friend and keep a record — in your statistics, your rating,
      your progress — you can do it from the **Matches** section.

  - type: shot
    shot: match-individuali
    caption: "The friendly matches section: pending proposals, the ones you received, and matches coming up."

  - type: heading
    id: avvio-rapido
    title: "You are already at the table"

  - type: text
    text: >-
      If your opponent is right there and the cues are already in your hands,
      there is nothing to propose: tap **Quick start** in the Matches section,
      pick who you are playing, and you are at the scoreboard. Nobody asks you
      when (it is now), and venue, discipline and distance come pre-filled from
      the last match you played.

  - type: steps
    items:
      - title: "Open Matches and tap «Quick start»"
        text: >-
          It is the first item in the section, and you will also find it among
          the links at the bottom of the page.
      - title: "Pick who you are playing"
        text: >-
          The opponents you play most often are already listed: one tap and they
          are chosen. For everyone else there is the search by name.
      - title: "Change how you play, if you need to"
        text: >-
          Under «How it is played» you get a summary of venue, discipline and
          distance. Happy with it? Touch nothing. Otherwise tap **Change** and
          fix what you need.
      - title: "Decide whether to keep the TPA scoresheet"
        text: >-
          If you have unlocked the scoresheet, **I'll keep the TPA scoresheet**
          sits above the button. It is the one thing that has to be decided now:
          the scoresheet must be started before the first rack, so afterwards it
          is no longer possible. If you are not interested, leave it and score
          as usual.
      - title: "Start scoring"
        text: >-
          The match starts right away. Your opponent gets a notification: they
          do not have to accept anything, but at the end you both have to
          **confirm the result**, as in every friendly match.

  - type: note
    tone: info
    title: "Why nobody has to accept"
    text: >-
      The confirmation does not disappear, it moves to the end — where the
      question has an answer your opponent actually knows: the score. Until you
      both confirm, the match does not count towards the rating.

  - type: heading
    id: proporre
    title: "Proposing a match"

  - type: steps
    items:
      - title: "Open Matches and tap «New proposal»"
        text: "On a phone, «Matches» is in the bar at the bottom of the screen."
      - title: "Choose your opponent"
        text: >-
          Search for the player by name. You can also leave the proposal
          **open**: more players will see it and whoever answers first takes it.
        shot: proposta-nuova
      - title: "Say where and when"
        text: >-
          Venue, date and time. If the venue is one of those registered in the
          app, pick it from the list: it will show with its address and number
          of tables.
      - title: "Choose the format"
        text: >-
          Discipline (8-ball, 9-ball…) and distance, that is how many racks it
          takes to win. These are the same choices as in a competition,
          explained in [Match
          formats](/aiuto/approfondimenti/formati_di_gioco).
      - title: "Send it"
        text: >-
          Your opponent gets a notification and can accept or decline. Either
          way the answer comes back to you: if they accept you find the match
          among the ones to play, if they decline a notification tells you.
          Until they answer the proposal stays «pending» and you can withdraw
          it.

  - type: heading
    id: rispondere
    title: "Answering a proposal"

  - type: text
    text: >-
      When someone proposes a match you get a notification. Opening it shows
      who is proposing, where, when and in what format, and two buttons:
      **Accept** or **Decline**. If you accept, the match joins your list of
      upcoming ones.

  - type: note
    tone: info
    title: "Proposals expire"
    text: >-
      Every proposal has a deadline, normally a few hours before the planned
      time. After that it lapses on its own: it keeps invitations nobody
      answered from hanging around forever.

  - type: heading
    id: giocare
    title: "Playing and recording the result"

  - type: text
    text: >-
      When it is time to play, open the match and press **Start**. The
      scoreboard is identical to the one in competitions: one button per
      player, pressed after each rack. See [Playing a
      match](/aiuto/giocare/giocare_una_partita).

  - type: text
    text: >-
      At the end the match needs **both players to confirm**. That is the main
      difference from competitions: there, a director vouches for the result;
      here, the two of you do. Until your opponent confirms, the result stays
      pending; if they disagree they can reject it and you fix it.

  - type: heading
    id: senza-limite
    title: "The match with no limit"

  - type: text
    text: >-
      One of the formats is **Free**: no distance, you play as long as you
      like. Scoring works as always, but there is no finish line to close the
      match by itself — you two close it.

  - type: steps
    items:
      - title: "When you are done, tap «End the match»"
        text: >-
          You find it under the score. From that moment the page tells you that
          you closed it and that the other player is missing: until they answer,
          the result is not final.
      - title: "Your opponent accepts"
        text: >-
          On their phone they see that you closed the match, with **Accept** and
          **Reject**. If they accept, the match is over; if they reject, the last
          rack is taken back and you keep playing.

  - type: note
    tone: info
    title: "Both signatures are needed"
    text: >-
      The rule of friendly matches holds here too: nobody closes a match alone.
      With a distance it is the finish line that says when it is over; without
      one, you say so — but the two of you together.

  - type: heading
    id: al-meglio-dei-set
    title: "Best of sets"

  - type: text
    text: >-
      Choosing **Multi-set** you decide two numbers: how many racks it takes to
      win a set, and how many sets to win the match. The big score at the top
      counts **sets**, not racks.

  - type: text
    text: >-
      When a set ends, the next one does not start by itself: the page says so
      and offers **Start the set** with the number of the one that is beginning. That is on purpose — between one set
      and the next you swap ends, get a drink, wait.

  - type: heading
    id: orari
    title: "Fixing the times"

  - type: text
    text: >-
      It happens that you record a match half an hour after playing it, or
      leave the scoreboard open once it is over. The match page has **Times**:
      you fix the start and the end, and **either of the two players** can do
      it — just like the score, which you both record.

  - type: heading
    id: disponibilita
    title: "Being findable"

  - type: text
    text: >-
      If you have nobody particular in mind, you can declare **where and when
      you are available**: which venues you usually play at and on what days
      and times. Other players available at the same venues will see you when
      they look for an opponent.

  - type: shot
    shot: sale-biliardo
    caption: "The list of registered venues: this is where you declare which ones you are available at."

  - type: note
    tone: tip
    text: >-
      Availability is entirely optional and can be removed at any time. You
      give venues and time slots, never your precise location.

  - type: heading
    id: statistiche
    title: "Do they count in the statistics?"

  - type: text
    text: >-
      Yes. In your [profile](/aiuto/account/profilo_e_statistiche) friendly
      matches sit among the recent matches alongside competition ones, labelled
      «Individual», and they count towards matches played, won and lost. The
      same goes for the history, in the «Matches» tab.

  - type: text
    text: >-
      What does keep them separate is the **rating**, which has two modes:
      **competitive** (official competitions only) and **overall**
      (competitions plus friendlies). You can switch with one tap. Competition
      standings, on the other hand, are untouched by friendlies.

  - type: note
    tone: info
    title: "Draws are counted on their own"
    text: >-
      With «exactly N» racks a match can end level. A draw is not a loss: it
      has its own figure in the statistics, and among your recent matches it
      shows as **D**. The win percentage is still worked out over every match
      played, draws included.

  - type: shot
    shot: statistiche-amichevoli
    caption: "Friendly match statistics: matches, wins and most frequent opponents, counted separately."

  - type: faq
    items:
      - q: "I cannot see the Matches section."
        a: "It is a feature that unlocks as you use the platform. If it is not there yet, play a few more competitions and it will appear."
      - q: "My opponent does not confirm the result."
        a: "The match stays pending. Nudge them: without both confirmations the result does not go into the statistics."
      - q: "Can I propose a match to someone who is not on the app?"
        a: "No, your opponent needs an account. You can invite them to sign up: it is free."
      - q: "What is the difference from a competition?"
        a: "A friendly is a single match, with no rounds, no standings and no director. A competition is an organised event with several rounds and final standings."

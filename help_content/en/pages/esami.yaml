title: "Sitting an exam"
section: giocare
kind: tutorial
audience: [giocatore]
minutes: 5
summary: "Several drills in a row, in order. On your own to practise, or in front of an examiner so that passing them is on the record."
screens: [exam.exam_catalog, exam.exam_detail, exam.request_form,
  exam.request_list, exam.request_detail, exam.session_detail]
related: [challenge, diventare_esaminatore, profilo_e_statistiche]

blocks:
  - type: text
    text: >-
      An exam is a **sequence of drills**, chosen by whoever composed it and
      always in the same order. A single drill tells you how one shot went; an
      exam tells you whether you can hold several shots together. If you are
      not sure what a drill is, start from [Challenges](/aiuto/giocare/challenge).

  - type: shot
    shot: esame-catalogo
    caption: "The exam catalogue: for each one it says what you are to it — passed and by whom, practised alone, never tried."

  - type: heading
    id: due_modi
    title: "Two ways to sit it"

  - type: options
    items:
      - name: "On your own"
        values: "«Try it on your own»"
        text: >-
          You practise. You record the scores yourself, whenever you like, and
          you can stop and resume. It stays in your history, but it **carries
          no certification**: nobody was there to watch.
        hint: esame.prova_da_solo
      - name: "In front of an examiner"
        values: "«Ask for an appointment»"
        text: >-
          In person, with an examiner watching and recording. At the end the
          exam counts as **certified**, with the name of who certified it, the
          date and the venue.
        hint: esame.appuntamento

  - type: note
    tone: info
    text: >-
      Practice stays practice forever: there is no way to turn it into a
      certified exam afterwards. If you want it to count, it has to be sat in
      front of an examiner from the start.

  - type: heading
    id: la_scheda
    title: "What an exam page tells you"

  - type: text
    text: >-
      Right from the catalogue every exam tells you **what you are to it**:
      "passed", with the date and the name of whoever certified it; "practised
      alone", with how many times and your best result; or "never tried". At
      the top, if you have one, is **your next appointment**.

  - type: text
    text: >-
      Open the exam and you find, from the top: **what you do**, the drills
      **numbered in the order you take them** — each with what it is worth and
      how many attempts you get — then **"Your attempts"**, **who administers
      it**, and at the bottom the two commands to sit it.

  - type: shot
    shot: esame-dettaglio
    caption: "An exam page: what you do, the drills numbered in the order you take them, your attempts, who administers it, and the two commands at the bottom."

  - type: note
    tone: tip
    title: "When a drill asks for several attempts, the best one counts"
    text: >-
      Next to a drill you may read, for instance, **"3 attempts, the best one
      counts"**. It means you repeat that shot three times and your **best**
      result is what counts — not the average, not the sum: score 6, 9 and 7 on
      a 10-point drill and that drill is worth 9. Whoever composes the exam
      decides how many attempts are needed; single-attempt drills are recorded
      once.

  - type: heading
    id: da_solo
    title: "Trying it on your own"

  - type: steps
    items:
      - title: "Open the exam and tap \"Try it on your own\""
        text: >-
          It is the button at the bottom left, always within reach. The attempt
          opens at once, without asking anyone.
        shot: esame-dettaglio
      - title: "One drill at a time"
        text: >-
          The page shows you **a single drill**: the layout, the attempts you
          have already made and, at the bottom, the score to write. **Plus**
          and **minus** move it by one; tap the figure to type it. A "made or
          not" drill has two large buttons instead.
      - title: "Correct, skip, go back"
        text: >-
          Under the score you find **"Correct attempt …"** if you mistyped, and
          **"Give up attempt …"** if you do not want to take it: an attempt you
          did not take is not a zero, it simply does not count. Tap a drill in
          the row at the top to go back to it.
      - title: "You can stop and pick it up again"
        text: >-
          If you close the app halfway you lose nothing: back on the exam you
          find **"Resume training"** and the attempt is where you left it.
      - title: "Close the training session"
        text: >-
          Once the drills are done the summary appears, with **"Close the
          training session"**. At that point it goes into your history, together with
          the scores you recorded.

  - type: heading
    id: appuntamento
    title: "Requesting an appointment"

  - type: text
    text: >-
      A certified exam happens **in person**, so the first thing to agree on is
      when and where. You start from the exam page, with **"Ask for an
      appointment"**.

  - type: shot
    shot: esame-appuntamento
    caption: "The form for requesting an appointment: which examiners to ask, day, time and venue."

  - type: options
    items:
      - name: "Who you ask"
        text: >-
          If the exam has several examiners you can pick one, some, or **leave
          the choice empty to ask all of them**. Whoever accepts first closes
          the request for the others, who get a notice.
      - name: "When and where"
        text: >-
          You propose a **day**, a **time** and a **venue**. It is a proposal,
          not a commitment: the other side can answer with a different time, or
          another venue.
      - name: "Notes"
        text: "Optional. They are there to explain, not to agree: agreement happens through proposals."

  - type: heading
    id: trattativa
    title: "The negotiation"

  - type: text
    text: >-
      From there on it is an exchange of proposals. At the top of the page is
      always **the proposal on the table** — day, time, venue and who made it —
      and, when it is your turn, the button to accept it sits right in there:
      **"I accept: see you there"**. If it does not suit you, just below you
      can **counter-propose** another day, time or venue. It goes on until one
      of you accepts, or until the request expires.

  - type: shot
    shot: esame-trattativa
    caption: "A negotiation under way: at the top the proposal on the table with the button to accept it, below it the counter-proposal, then how you got there."

  - type: text
    text: >-
      **"How you got there"** keeps the line of proposals, with a lit dot on
      the standing one, and tells you where each examiner you asked is:
      **negotiating**, **hasn't answered**, **can't make it**. Until someone
      accepts you can **withdraw the request**.

  - type: shot
    shot: esame-appuntamenti
    caption: "Your exam appointments: \"Your turn\" marks the ones where the other side is waiting for your answer."

  - type: note
    tone: info
    title: "One side at a time"
    text: >-
      Whoever has just proposed **waits for the answer**: you cannot propose
      twice in a row, and the page tells you so instead of offering a button.
      In the list of appointments, **"Your turn"** marks the ones where you are
      the one who has to answer. And if you asked several examiners, from the
      moment one of them counter-proposes the negotiation is between you and
      them — the others can only accept the last proposal, not join the
      exchange.

  - type: heading
    id: il_giorno
    title: "Exam day"

  - type: steps
    items:
      - title: "The examiner opens the session"
        text: "At the table, from the page of the confirmed appointment."
      - title: "You accept the start"
        text: >-
          At the top of the session **"I accept: let's start"** appears. Until
          you tap it no score can be recorded: nobody is assessed without
          knowing.
      - title: "You play, they record"
        text: >-
          Drill after drill, attempt after attempt. From your phone you follow
          the summary: the total and, for each drill, the attempts made and the
          one that counts.
        shot: esame-sessione
      - title: "At the end they certify the outcome"
        text: >-
          **Passed** or **not passed**. There is no grade and no note: it is a
          fact, not a judgement to argue.
        shot: esame-esito

  - type: note
    tone: warning
    title: "No accepted appointment, no session"
    text: >-
      A certified session can only come from an appointment someone accepted.
      There is no way to start one on your own, and that is what tells an exam
      that counts from a practice run.

  - type: heading
    id: dopo
    title: "After the exam"

  - type: list
    items:
      - "The exam appears in your **profile**, among the ones you have sat."
      - "If it was certified it carries the **«certified by …»** mark with the date and the venue; practice does not."
      - "**Certification XP** and the exam-related achievements only fire for certified ones (see [Your progress](/aiuto/account/progressi))."
      - "If you **did not pass**, you can ask to sit it again: a new request opens, just like the first time."

  - type: note
    tone: tip
    text: >-
      If a session breaks down — you do not turn up, the table falls through,
      it gets too late — the examiner can close it **with no outcome**. That is
      not a fail and is not recorded as one: it is an exam that never happened.

  - type: faq
    items:
      - q: "I cannot see the Exams section."
        a: "It unlocks once you have completed three drills. Until then the entry does not appear: you will find it on the progress page among the features still closed, with how many you have left."
      - q: "Can I sit the same exam more than once?"
        a: "Yes. On your own whenever you like; certified, by opening a new appointment each time."
      - q: "Can I ask for an exam that I administer myself?"
        a: "No, the app does not allow it. Whoever administers an exam cannot sit it: the request never even starts."
      - q: "What is the difference between an exam and the challenges inside a competition?"
        a: "Challenges inside a competition serve the competition: they replace the walkover or settle a tie. An exam has nothing to do with competitions: it certifies that you can perform a sequence of shots."
      - q: "Does an exam count towards the rating?"
        a: "No. The rating measures matches against opponents. Exams feed your training history and your personal progress."

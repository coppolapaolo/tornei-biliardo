title: "Your first steps: sign up and log in"
section: introduzione
kind: tutorial
audience: [tutti]
minutes: 3
summary: "Creating the account, confirming your email and logging in for the first time. Five minutes, once and for all."
screens: [auth.register, auth.login, auth.forgot_password, auth.verify_email, auth.diagnosi_cookie, onboarding.onboarding]
related: [iscriversi_a_una_gara, profilo_e_statistiche]

blocks:
  - type: text
    text: >-
      You need nothing to browse competitions. To **register** for one and to
      keep score you need an account: it is free and asks for three things.

  - type: heading
    id: registrazione
    title: "Creating the account"

  - type: steps
    items:
      - title: "Open the sign-up page"
        text: >-
          The **Register** button is at the bottom of the home page, in the
          **«How to take part»** panel: scroll all the way down. On a computer
          the link is also in the left-hand column. A shortcut: if a
          competition already caught your eye, tap its **Register** button and
          the app takes you to create the account first.
        shot: home-pubblica
      - title: "Fill in the three fields"
        text: >-
          **Username**: this is the name that appears in the standings and that
          your opponents see — pick one they will recognise.
          **Email**: used to confirm the account and to reset your password if
          you forget it. **Password**: at least eight characters.
        shot: registrazione
      - title: "Confirm from your email"
        text: >-
          You will get a message with a link to tap. It checks that the address
          really is yours. If nothing arrives within a few minutes, look in
          your spam folder.
      - title: "Log in"
        text: >-
          Go back to the app and sign in with your username and password. From
          then on you stay logged in: you will not have to do it every visit.

  - type: heading
    id: installare_app
    title: "Keeping it on your phone like an app"

  - type: text
    text: >-
      There is nothing to download from any store: the browser itself can add
      **Biliardo** to your phone's apps. From there it opens full screen, with
      its own icon and no address bar, one tap away like the others.

  - type: list
    title: "Where the command is"
    items:
      - "**iPhone and iPad, in Safari**: tap the Share button — the square with the upward arrow, at the bottom — scroll the list and choose «Add to Home Screen»."
      - "**iPhone and iPad, in Chrome (or Firefox, or Edge)**: the Share button is there too, at the top right; in the menu look for «Add to Home Screen». If you cannot see it, scroll to the end of the list or tap «Edit Actions» to bring it up."
      - "**Android, in Chrome**: tap the three dots at the top right and choose «Install app»; if it is not there, «Add to Home screen» does the same."
      - "**Android, in Firefox**: the three dots, then «Add to Home screen»."
      - "**Android, in Samsung Internet**: the menu at the bottom right, then «Add page to» and «Home screen»."
      - "**Computer, with Chrome or Edge**: a small install icon appears at the right of the address bar; otherwise «Install» is in the browser menu."

  - type: note
    tone: info
    title: "On iPhone you log in once more"
    text: >-
      The app added to the Home screen keeps its data separate from Safari's:
      the first time you open it, it asks you to log in again even if you were
      already logged in in the browser. It happens only once.

  - type: heading
    id: prima_volta
    title: "The first time you log in"

  - type: text
    text: >-
      On first login the app asks a few short questions — what you are
      interested in, which town you play in. They are all optional and only
      serve to show you nearby competitions first. You can change your answers
      at any time from your profile.

  - type: shot
    shot: dashboard-giocatore
    caption: "Your home right after you come in: at the top the panel with how you are doing, below «Your competitions», the individual matches, the competitions open for registration, the championships and competitions near you."

  - type: heading
    id: come_stai_andando
    title: "The panel at the top of your home"

  - type: text
    text: >-
      As soon as you come in, just under the greeting there is a panel telling
      you how you are doing. Right after signing up it has nothing to say yet,
      so in its place you find **«Your profile is ready»** with three steps to
      tick off: *Account created*, *Play your first match*, *Try a drill*.
      Above it, one line tells you where you start from: your **Elo** — the
      rating you also find in your
      [profile](/aiuto/account/profilo_e_statistiche) — is 1200 for everyone,
      and starts moving with your first recorded match. Those three steps greet
      you when you come in and then give way to the things to do: you find them
      again next time you sign in, until you do your first activity.

  - type: text
    text: >-
      After your first activity that panel gives way to **«How you are
      doing»**: two numbers (your Elo with its recent change, say, or your
      drill score), a small chart of the trend and a strip of your latest
      activities, each with its result or finishing position. The button at the
      bottom — called **«All your numbers»** or **«Streak and ranking»**
      depending on what you have to show — opens three or four extra rows: your
      current streak, your position in a championship, drills completed, your
      level. It always starts closed: one tap opens it.

  - type: note
    tone: info
    title: "You read it once, then it makes way"
    text: >-
      **«How you are doing» is a greeting, not a dashboard**: it appears when
      you come into your home after signing in, and from then on it is gone. If
      you come back to your home later you find the things to do straight away,
      with no summary in front of them. You see it again next time you sign in:
      there is no button to call it back. Either way there is nothing to tap
      inside it — it leads nowhere and asks for nothing.

  - type: heading
    id: muoversi
    title: "Finding your way around"

  - type: text
    text: >-
      On a **phone** there is a bar at the bottom of the screen with the five
      main destinations: Dashboard, Venues, Matches, Challenges and
      Notifications. The arrow at the top left always goes back one step.

  - type: shot
    shot: dashboard-giocatore
    variant: desktop
    caption: "On a computer the same items sit in the left-hand column, always visible."

  - type: text
    text: >-
      On a **computer** those same items are in the left-hand column, and pages
      show two columns side by side instead of one: the same information, just
      arranged differently.

  - type: heading
    id: password_dimenticata
    title: "If you forget your password"

  - type: steps
    items:
      - title: "Tap «Forgot password» on the login page"
        text: "You will be asked for the email address you signed up with."
      - title: "Check your email"
        text: >-
          You will get a link for setting a new password. The link lasts only a
          few hours: if it expires, ask for another.
      - title: "Choose the new password"
        text: "From that moment the old one no longer works."

  - type: faq
    items:
      - q: "Can I change my username later?"
        a: "The username stays as chosen at sign-up, because it is the name you appear under in standings that are already published. Email and password can be changed from your profile."
      - q: "I try to log in and a page says my browser did not send cookies."
        a: "To recognise you from one page to the next the site uses a cookie, and your browser is not sending it. On that page tap **Run the cookie test**: it opens the [cookie test](/auth/diagnosi), which runs four checks on your device and tells you where it breaks and what to try. If the test says cookies work but you still cannot log in, take a screenshot of the test page and report the problem."
      - q: "I did not get the confirmation email."
        a: "Check your spam folder. From your profile you can ask for it to be sent again."
      - q: "Can I use the app on more than one device?"
        a: "Yes. The same account works from phone, tablet and computer, even at the same time."
      - q: "How do I delete my account?"
        a: "From your profile, «Delete account». Your sporting results stay in the historical standings but without your name. See [Privacy and data](/aiuto/account/privacy_e_dati)."

title: "The bracket"
section: giocare
kind: approfondimento
audience: [tutti]
minutes: 4
summary: "In knockout competitions the path is read off a bracket: winners move up, losers are out. How to read it and what changes with double elimination."
screens: [admin.competition.gara_bracket]
related: [abbinamenti, seguire_la_gara, classifiche]

blocks:
  - type: text
    text: >-
      **Knockout** and **double elimination** competitions do not have a series
      of equal rounds: they have a path. Winners advance, losers go out (or drop
      into the losers' bracket). That path is shown all at once on a single
      page.

  - type: shot
    shot: tabellone
    caption: "The bracket of a knockout competition: the quarter-finals played, with winners in bold, and the semi-finals and final already drawn."

  - type: heading
    id: aprirlo
    title: "Where to find it"

  - type: text
    text: >-
      From the competition page, the icon at the top right opens the bracket. It
      is **public**: you can send the link to anyone, and it updates itself
      while play is under way.

  - type: text
    text: >-
      Whoever directs the competition also finds it on the competition page,
      **in place of the standings**: a compact bracket with the current round,
      the one before and the one after. A row below opens the whole bracket.

  - type: shot
    shot: gara-tabellone-dettaglio
    caption: "A knockout competition: its page leads through to the bracket."

  - type: heading
    id: leggerlo
    title: "How to read it"

  - type: options
    items:
      - name: "The round names"
        text: >-
          Last 16, quarter-finals, semi-finals, final. The director does not
          choose them: the number of entrants does. Double elimination uses
          different names, because there are two brackets: **Round 1, 2, 3...**
          on the winners' side, **Losers round 1, 2, 3...** on the other, then
          the **Final** and possibly the **Decider**.
      - name: "Bold type"
        text: "Whoever won that match, and therefore goes through to the next round."
      - name: "The numbers on the right"
        text: "The match score in racks."
      - name: "Empty slots"
        text: >-
          Matches not yet played. The whole bracket is drawn from the moment of
          the draw, so an empty slot shows who will get there: the name, if
          they already went through or won the previous match, otherwise
          «whoever wins» that match. The double elimination Decider says «if
          needed».

  - type: note
    tone: tip
    title: "On a wide screen you see it all at once"
    text: >-
      The bracket is at its best in landscape: turning the phone, or using a
      computer, shows the whole path instead of one round at a time. It is the
      screen to put on a display in the venue, if you have one.

  - type: heading
    id: sorteggio
    title: "The draw"

  - type: text
    text: >-
      A bracket is not «started» like a round: it is **drawn**. In the
      Management panel the director finds the **Draw the bracket** button (in
      round-based competitions the same place says «Start the competition»), and
      the app asks for confirmation before going ahead.

  - type: note
    tone: warning
    title: "The draw settles everything at once"
    text: >-
      The draw closes registrations, freezes the teams and fixes every player's
      path to the final: who they would meet in the quarter-finals, who in the
      semi-finals, who in the final. The only way back is to cancel the draw,
      which redoes every pairing from scratch.

  - type: heading
    id: quanti_turni
    title: "How many rounds come out"

  - type: text
    text: >-
      The bracket sizes itself on the actual entrants. With 8 players that is
      quarter-finals, semi-finals and final: three rounds, seven matches. With
      16 you add one more.

  - type: text
    text: >-
      That is why the number of rounds is not set at creation time: the draw
      fixes it, on whoever actually turns up. Before the draw the competition
      card marks the figure **(estimate)**, worked out from the declared
      maximum capacity; after the draw it is the final one. Under double
      elimination it can still grow by one, if the Decider is needed: see
      below for when that happens.

  - type: text
    text: >-
      If the entrants are not a power of two (8, 16, 32) some players go
      straight through to the second round without playing the first. It is
      standard bracket behaviour and needs no setting: see [When the number of
      players is odd](/aiuto/approfondimenti/numero_dispari).

  - type: heading
    id: terzo_posto
    title: "The third-place play-off"

  - type: text
    text: >-
      In a knockout the director can add a **third-place match** between the two
      semi-final losers. It does not add a round: it is played alongside the
      final. Without it, both of them finish third, level.

  - type: text
    text: >-
      With full double elimination it is not needed, and indeed it is not even
      offered: third place goes to whoever loses the losers' bracket final, and
      that is a result on the table. It comes back with double elimination
      **with a group stage**, because there the final bracket is a straight
      knockout and the two beaten semi-finalists are level again.

  - type: heading
    id: doppio_ko
    title: "Double elimination"

  - type: text
    text: >-
      With double elimination there are two brackets: the **winners'** and the
      **losers'**. Whoever loses their first match does not go out, they drop
      into the second; losing again puts them out for good. At the end the
      winner of the losers' bracket meets the winner of the winners'.

  - type: note
    tone: info
    title: "The Decider: a round that is not always played"
    text: >-
      Whoever reaches the Final from the winners' bracket has not lost a match
      yet, and double elimination promises everyone two defeats before they go
      out. So **if the Final is won by the player coming up from the losers'
      bracket**, the two play it again on level terms: that is the
      **Decider**, and the competition has one more round. If instead the
      Final is won by the still-unbeaten player, the competition ends there
      and the Decider is not played.

  - type: note
    tone: info
    title: "With groups"
    text: >-
      Double elimination can also be arranged as parallel groups qualifying
      some players for a final knockout bracket. It is the longest format
      available and makes sense over a full day.

  - type: heading
    id: classifica
    title: "The standings of a bracket competition"

  - type: text
    text: >-
      They are not counted by wins or racks: the standings **are** the path.
      Whoever wins the tournament is first, the losing finalist second, and so
      on. In a championship each position is worth a number of points, which the
      director can configure. See [How standings are worked
      out](/aiuto/approfondimenti/classifiche).

  - type: note
    tone: info
    title: "Level finishes here are not played off"
    text: >-
      On a bracket you go out in pairs: the two beaten semi-finalists are both
      third, the four quarter-finalists all fifth. That is not an ambiguity to
      settle, it is what the path says — and indeed bracket competitions are not
      even offered a tie-break at creation time.

  - type: text
    text: >-
      Once the competition is over, its page shows the standings **in bands**:
      1st, 2nd, 3rd–4th, 5th–8th and so on, with where each player went out
      next to the name («out in the quarter-finals», «loses the final»).
      Players in the same band share the place and the championship points.
      On the podium, if no third-place match was played, there are two
      thirds.

  - type: faq
    items:
      - q: "I cannot see the bracket icon."
        a: "The competition does not use a bracket strategy: with Amalfi, random or round robin there is no path to draw, and the view does not exist."
      - q: "The director has pressed «Draw the bracket». Can I still change my team?"
        a: "No. You pick your team when you register and it stays changeable until the draw: from that moment the bracket has already been built around the teams, and changing them would make it inconsistent."
      - q: "I lost in the first round: is my competition over?"
        a: "With knockout, yes. With double elimination, no: you drop into the losers' bracket and can still climb back."
      - q: "Why did someone not play the first round?"
        a: "Because the entrants were not a power of two: some go straight through. It is not a favour, it is the only way to make the bracket add up."
      - q: "Can the bracket be changed after the draw?"
        a: "Only by cancelling the round and drawing again, and only by the director. The draw is recorded and stays verifiable."

title: "All the options of a competition"
section: organizzare
kind: riferimento
audience: [direttore]
minutes: 8
summary: "Every field of the creation form, what it actually changes, and which value to pick when you are unsure."
screens: [admin.competition.create_gara_standalone, admin.competition.edit_gara]
related: [creare_una_gara, formati_di_gioco, abbinamenti, classifiche]

blocks:
  - type: text
    text: >-
      The creation form is split into four steps. Here is every field, with the
      recommended value where the choice is not obvious. If you are creating
      your first competition you can skip this page: the proposed values work.

  - type: shot
    shot: gara-nuova
    caption: "The four steps: public information, structure, match format, summary."

  - type: heading
    id: informazioni
    title: "1. Public information"

  - type: text
    text: "What players will see in the lists and on the competition card."

  - type: options
    items:
      - name: "Competition name"
        values: "required"
        text: "How it appears in the lists. Recognisable beats formal: «Thursday 9-ball night» works perfectly well."
      - name: "Trial competition"
        values: "switch · off"
        text: >-
          Turn it on to practise: only you can see the competition, you fill
          it with fictitious players from the registered players list and delete it when
          you are done. It does not touch ELO, XP or statistics, has no public
          link or showcase, and disappears on its own after 14 days. You can
          keep three open at a time.
      - name: "Discipline"
        values: "required · 8-ball, 9-ball, 10-ball, one pocket, straight pool, bank pool, rotation"
        text: "The game. It only determines how the competition is displayed: the rules at the table are yours to know."
        hint: gara.disciplina
      - name: "Date and start time"
        values: "the date is required"
        text: >-
          The time is when people gather. Inside a championship the dates must
          increase in line with the competition number.
      - name: "Location / Venue"
        text: >-
          Choosing a registered venue means the competition inherits its tables
          and you will be able to assign them during the evening. You can also
          type a location by hand.
      - name: "Available tables"
        text: >-
          Which of the venue's tables you will actually use tonight. If the
          venue has eight but you have four tonight, list those: the app will
          only assign matches to them. You can change them at any time — in
          preparation, with registrations open, between rounds — from the
          «Tables» step or from «Competition settings».
        hint: gara.tavoli
      - name: "Entry fee"
        values: "informational"
        text: "Appears on the card. The app does not handle payments."
      - name: "Notes / description"
        text: "Free text: the evening's format, prizes, what to bring."

  - type: heading
    id: struttura
    title: "2. Competition structure"

  - type: note
    tone: info
    title: "With knockout and double elimination the form gets shorter"
    text: >-
      Choosing a bracket format makes six fields disappear: number of rounds,
      forfeit handling, odd number of players, avoid rematches, standings
      system and tie-break. This is not a convenient simplification: on a
      bracket those choices changed nothing, and the app settled them by itself
      anyway. In their place you get the **Bracket options** panel, with the
      settings that do count.

  - type: options
    items:
      - name: "Pairing algorithm"
        values: "Amalfi (recommended) · Random · Round robin · Knockout · Double elimination"
        text: >-
          How pairs are formed each round. **Amalfi** is designed for club
          competitions over rounds: everyone plays every round and pairings
          follow the standings. The others are described in [How pairs are
          formed](/aiuto/approfondimenti/abbinamenti).
        hint: gara.strategia
      - name: "Number of rounds"
        values: "recommended 3"
        text: >-
          How many sets of matches. With knockout and double elimination the
          field does not appear: the number of rounds is fixed by the draw, on
          the entrants who actually turn up. Before the draw the app only shows
          an estimate, worked out from the maximum capacity.
      - name: "Forfeit handling"
        values: "Win by walkover (default) · Remove from the round"
        text: >-
          What to do with someone who abandons mid-competition. With **win by
          walkover** they stay in the pairings and their opponents win without
          playing — simpler, but one opponent ends up with an empty match. With
          **remove** they drop out of the pairings: cleaner, but it changes the
          parity and can trigger the odd-number handling. On brackets it is not
          asked: withdrawing is always a walkover, because once the bracket has
          been drawn it is not touched again and removing somebody would leave
          an empty slot.
        hint: gara.forfait
      - name: "Minimum entrants"
        values: "required · recommended 4"
        text: >-
          Below this threshold the app will not start the first round. On
          brackets there is a format floor you cannot go under: **4** for
          knockout, **8** for double elimination. If your value was lower, the
          app raises it by itself.
      - name: "Maximum entrants"
        values: "optional · required on brackets"
        text: >-
          If set, anyone beyond that number goes on the waitlist. On bracket
          formats it becomes required: it declares the capacity and is what the
          round estimate is worked out from.
      - name: "Avoid rematches"
        values: "recommended on"
        text: >-
          Prevents two players meeting twice in the same competition. With the
          usual number of rounds it is nearly always possible to honour. On
          brackets it is not asked: whoever loses is out, so a rematch simply
          cannot happen. In double elimination the only possible one — between
          a player coming back through the losers bracket and whoever beat them
          — is part of the format.
        hint: gara.anti_rematch
      - name: "Play with handicap"
        values: "default off"
        text: >-
          Declares that players do not start level in this competition: you
          agree the head start at the table, the app neither adds nor removes
          racks. What changes is the **rating**: it is only updated in matches
          between players of the same [category](/aiuto/organizzare/categorie), and stays
          put in all the others. Decide it **before opening entries**: whoever
          enters has a right to know whether the competition has a handicap.
        hint: gara.handicap
      - name: "First round"
        values: "Random (default) · Rating · Standings"
        text: >-
          How the **first** round's pairs are formed, when no standings exist
          yet. **Random** is a straight draw. **Rating** pairs by declared
          strength, so the strongest do not meet immediately. **Standings**
          uses the championship standings.
        hint: gara.primo_turno
      - name: "If players are odd"
        values: "X by walkover · X by walkover with drill · Trio · Waitlist"
        text: >-
          What happens when the number of players is odd and someone would be
          left without an opponent. Explained one by one in [When the number of
          players is odd](/aiuto/approfondimenti/numero_dispari). On brackets it
          is not asked: whoever is left over from the count goes straight
          through to the next round, and that is how a bracket is built, not a
          policy to choose.
        hint: gara.dispari
      - name: "Standings system"
        values: "Wins (default) · Racks"
        text: >-
          How players are ordered. **Wins** counts matches won and, when level,
          rack difference. **Racks** counts total racks. On brackets the field
          does not appear, because the standings go by **position** and there
          is nothing else to choose. See [How standings are worked
          out](/aiuto/approfondimenti/classifiche).
        hint: gara.classifica
      - name: "Tie-break"
        values: "on up to 3rd place"
        text: >-
          Whether and up to which position to settle level finishes with an
          extra contest. Below the podium, as a rule, level finishes are left
          as they are. On brackets it is not asked: there, level finishes by
          band — the two beaten semi-finalists, the four quarter-finalists —
          are the intended outcome, and no tie-break would ever fire.
        hint: gara.spareggio
      - name: "Weight in the standings"
        values: "1 · only inside a championship"
        text: >-
          How many times this competition's score counts in the championship
          standings. With **1** it counts like every other; with **3** it
          counts as three competitions. It keeps the championship open to the
          end: if the last one weighs more, nobody takes it with two
          competitions to spare. A competition outside a championship has no
          such field, because there are no general standings to weigh it in.
        hint: gara.peso

  - type: heading
    id: tabellone
    title: "Bracket options"

  - type: text
    text: >-
      Choosing knockout or double elimination brings up a panel that does not
      exist with the other formats. These are the only choices that really
      change anything on a bracket.

  - type: options
    items:
      - name: "Keep team-mates apart in the early rounds"
        values: "default off"
        text: >-
          The draw separates players from the same team as far as it can.
          Turning it on means everyone who registers is asked who they play
          for. See [Teams](/aiuto/organizzare/squadre).
      - name: "3rd/4th place final"
        values: "only where third place is a level finish"
        text: >-
          The two beaten semi-finalists play for third place, in the same round
          as the final. It appears with knockout and with double elimination
          **with a group stage**; not with full double elimination, where third
          place goes to whoever loses the losers-bracket final — a result, not
          an ambiguity to settle.
      - name: "Group stage"
        values: "double elimination only · none (default) · groups of 8 · groups of 16"
        text: >-
          The long format: double elimination is played inside parallel groups,
          and each group qualifies four players — two unbeaten and two through
          the losers bracket — for a final knockout bracket.

  - type: heading
    id: formato
    title: "3. Match format"

  - type: text
    text: >-
      How long a match lasts. This is the choice that most affects the length
      of the evening.

  - type: options
    items:
      - name: "Distance"
        values: "e.g. 4, 5, 7"
        text: >-
          How many racks it takes to win the match. **Race to 4** means the
          first to 4 takes it: at most 7 racks. Going up by one lengthens the
          evening considerably.
        hint: gara.distanza
      - name: "Exact number of racks"
        values: "default off · not available on brackets"
        text: >-
          If on, **all** the racks listed are played, even once the result is
          settled. Needed when what counts is the total number of racks rather
          than who wins — that is, with the «Racks» standings system. With an
          even number, a match can end level. On bracket formats the checkbox
          does not appear: it is always a race, and in its place there is a
          note explaining why.
        hint: gara.numero_esatto
      - name: "Set play"
        values: "default off"
        text: >-
          The match is split into sets: a set is won by reaching the distance,
          and the match by taking enough sets. It lengthens things a lot:
          suitable for finals or dedicated evenings. Here too, on brackets the
          sets are a race: the option to play them all is not offered.
        hint: gara.multiset
      - name: "Start rule"
        values: "default «Lag» · inside a championship it can be inherited"
        text: >-
          Who takes the first shot of the match. With **First player** the
          first of the two always breaks, with no lag. With **Lag** the
          scoreboard asks two questions before letting anyone score: who won
          the lag, and who breaks — because whoever wins the lag **chooses**
          who breaks, and may send the opponent to the table.
        hint: gara.regola_inizio
      - name: "Who breaks"
        values: "default «Alternating» · inside a championship it can be inherited"
        text: >-
          How the break shot passes from one rack to the next. **Alternating**
          is the standard rule and switches every rack; **Alternating every
          two** gives two racks each; **Winner breaks** and **Loser breaks**
          follow the result of the previous rack instead. It applies to every
          match in the competition: it cannot be changed match by match.
        hint: gara.chi_spacca

  - type: note
    tone: warning
    title: "These two are chosen before, not after"
    text: >-
      Once the competition has started the two fields lock. Changing them
      midway would rewrite who took the break shot in the racks already
      played — and with it which of those racks count as broken and run.

  - type: note
    tone: tip
    title: "How long an evening takes"
    text: >-
      Rule of thumb: with **8 players, 3 rounds, race to 4** and 4 tables you
      stay within two and a half hours. Each extra round adds roughly
      forty-five minutes; each extra unit of distance, about twenty minutes per
      round.

  - type: heading
    id: riepilogo
    title: "4. Summary and confirmation"

  - type: text
    text: >-
      The last step recaps every choice on a single screen. It is worth
      reading: it is the last convenient moment to notice a wrong distance or a
      date that does not add up.

  - type: heading
    id: dopo
    title: "What can still be changed afterwards"

  - type: options
    items:
      - name: "Competition in draft"
        values: "everything"
        text: "Nobody has registered yet: you can change any field."
      - name: "Registrations open"
        values: "almost everything"
        text: >-
          Dates, venue, notes and capacity stay editable. Changing the format
          and pairings is technically possible but unwise: people registered
          knowing the earlier rules.
      - name: "Competition started"
        values: "little"
        text: >-
          The match format is frozen. Surrounding information (notes, tables)
          stays editable and, with due care, results that are not yet locked.

  - type: faq
    items:
      - q: "What do I pick if I have no idea?"
        a: "Amalfi, 3 rounds, distance 4, Wins standings, odd numbers with «X by walkover», avoid rematches on. That is the club-evening setup."
      - q: "I want a knockout tournament: what changes?"
        a: "Choose «Knockout» and the form gets shorter: number of rounds, forfeit handling, odd number of players, avoid rematches, standings system, tie-break and exact number of racks all disappear. The «Bracket options» panel appears instead. Maximum entrants becomes required, and the standings go by position."
      - q: "I picked a bracket and half the options vanished. Have I broken something?"
        a: "No: those options had no effect on a bracket. They used to be asked and the answer was silently ignored; now they are not asked at all. Switch back to a round-based strategy and they all come back."
      - q: "Why can I not select «Trio»?"
        a: "Trio is only possible for distances between 2 and 7, and not with bracket strategies. If the distance is outside that range the option is unavailable."
      - q: "Does the handicap affect the standings?"
        a: "Yes: the standings use the effective scores, that is the ones you wrote after applying the handicap. The personal rating, on the other hand, only moves in matches between players of the same category."

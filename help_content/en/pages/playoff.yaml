title: "End-of-championship play-offs"
section: giocare
kind: approfondimento
audience: [giocatore, direttore]
minutes: 4
summary: "The final competitions reserved for the best-placed players: how you qualify, how to accept the invitation, what happens if you decline and how directors start them."
screens: [player.playoff_invitation, admin.campionato.campionato_detail]
related: [creare_un_campionato, notifiche]

blocks:
  - type: text
    text: >-
      A championship can close with one or two special competitions, open only
      to those who finished well in the overall standings. You do not register:
      you **qualify**, and you receive an invitation.

  - type: heading
    id: qualificarsi
    title: "How you qualify"

  - type: text
    text: >-
      At the end of the championship's last competition the app looks at the
      overall standings and works out who qualifies. There can be two
      play-offs, with different thresholds:

  - type: options
    items:
      - name: "Elite play-off"
        text: "Reserved for the top finishers — how many is decided by whoever organises the championship."
      - name: "Academy play-off"
        text: >-
          For those placed below. It exists so the season does not end for
          everyone who missed the podium, and it is usually the better attended
          of the two.

  - type: text
    text: >-
      During the season the championship's overall standings mark the
      **play-off zone**: a bar next to whoever would be invited if the
      championship ended now, and an «Out of the playoffs» row right after
      the last of them. It follows the criteria chosen by the organiser, such
      as the minimum number of competitions played. Once the invitations have
      been sent, the bar moves to whoever holds a valid invitation: those who
      declined drop out, and whoever took their place shows up.

  - type: note
    tone: info
    text: >-
      Play-offs are optional: many championships have none at all and close
      with the overall standings after the last competition.

  - type: heading
    id: invito
    title: "The invitation"

  - type: text
    text: >-
      If you qualify you get a **notification**. Opening it shows the play-off,
      with the day and time it is played, and two buttons: accept or decline.

  - type: text
    text: >-
      The same invitation also appears at the top of your **home page**, in a
      "You have qualified" card with the same two buttons. You do not have to
      dig through your notifications: it stays there until you answer. Once
      you have answered the invitation disappears, but the play-off does not:
      you find it among the competitions on your home, as explained below in
      «The play-off on your home».

  - type: shot
    shot: notifiche
    caption: "Play-off invitations arrive among your notifications, like other competition messages."

  - type: steps
    items:
      - title: "Read the conditions"
        text: >-
          Date and time matter more than usual: a play-off is a single evening,
          and there is often no rearranging it.
      - title: "Accept or decline"
        text: >-
          Accepting puts you among the participants: when the director creates
          the play-off competition you are already entered, and if they created
          it before your answer you join it straight away. Declining gives up
          your place: depending on how the championship is organised, it may
          pass to the first player left out.
      - title: "Until the final starts"
        text: >-
          You can accept until the first round of the play-off competition has
          started. When it starts, invitations still unanswered expire and the
          play-off is played by whoever is in, even if that is fewer than the
          places. If the director cancels the start, the invitation is valid
          again until its deadline.
      - title: "Answer in time"
        text: >-
          The invitation has a deadline, chosen by the director when sending
          the invitations. Not answering counts as declining, and the place
          goes to someone else. If the director moves the deadline, the new
          one applies to you too as long as you have not answered.

  - type: note
    tone: tip
    title: "You can also answer in person"
    text: >-
      If you run into the competition director at the venue you can just tell
      them whether you are in: they record the answer for you and the
      invitation closes there and then. The list of qualifiers shows that they
      recorded it, so it is clear who answered for whom.

  - type: note
    tone: warning
    title: "Declining is not a penalty"
    text: >-
      Turning down a play-off costs no points and does not affect the standings
      of the championship just finished: those are closed. If you cannot make
      it, saying so straight away is a favour to whoever organises.

  - type: heading
    id: nella_home
    title: "The play-off on your home"

  - type: text
    text: >-
      From the moment the invitations go out until the first round of the
      play-off competition, your home shows a play-off card. It is shown to
      whoever received an invitation, and also to anyone who played the
      championship without qualifying. Where you find it, and what it says,
      depends on where you stand:

  - type: options
    items:
      - name: "You accepted"
        values: "Your competitions · Registered"
        text: >-
          You find it under **«Your competitions»**, like any competition you
          are registered for. The bar counts how many have already accepted
          out of the play-off places. If you accepted when the places were
          already full you read **«Waitlist»** with your number instead: if
          someone withdraws you get in, automatically.
      - name: "You are outside the play-off zone"
        values: "Your competitions · Waitlist #N"
        text: >-
          You have no invitation, but you can still get one. The number is
          your place in the queue of those left out: if a qualifier declines,
          the invitation passes to the first of them, and so on. When your turn
          comes you receive the invitation to accept, at the top of your home.
      - name: "You declined, or cannot get in"
        values: "Upcoming · Registration closed"
        text: >-
          The card sits among the **«Upcoming»** competitions, and underneath
          it says why: you declined the invitation, the invitation expired
          without a reply, your place went to another player, or you have not
          played enough competitions of the championship to be called.

  - type: text
    text: >-
      Next to the name, the card also shows where the invitations stand:
      **Invitations open** while someone still has to answer, then
      **Registration closed**. **Details** opens the play-off competition, if
      the director has already created it; otherwise the championship page,
      with the play-off zone in the standings. When the first round starts,
      the card gives way to the competition's normal card, with matches,
      standings and live scores.

  - type: heading
    id: come_si_gioca
    title: "How a play-off is played"

  - type: text
    text: >-
      Once accepted, a play-off is a competition like any other: rounds,
      pairings, scoreboard and standings work exactly as described in
      [Following a competition](/aiuto/giocare/seguire_la_gara). Only how you
      got there is different.

  - type: heading
    id: classifica_finale
    title: "How the final standings are decided"

  - type: text
    text: >-
      Whoever organises the championship picks one of two ways, and the
      difference matters a great deal if you reach the play-off from behind:

  - type: options
    items:
      - name: "Championship + play-off event"
        text: >-
          The play-off score is **added** to the championship score, as if it
          were one more competition. A good season leaves you ahead. The
          director can give the play-off a **weight**: weight 2 means that
          event counts double. To be added up, the final uses the **same
          standings system** as the championship: wins with wins, racks with
          racks.
      - name: "Play-offs only"
        text: >-
          The play-off decides the final standings: whoever plays it takes the
          top places in the order the play-off produces, and everyone else
          follows in championship order. What you did during the season gets
          you in, not to the top. Only the finishing order of the final
          counts, not its points.

  - type: note
    tone: warning
    text: >-
      You can switch from "Play-offs only" to "Championship + play-off event"
      only if the final uses the same standings system as the championship:
      otherwise different things would be added up, and the app refuses the
      change. The weight can always be changed.

  - type: note
    tone: info
    text: >-
      If nobody changes anything the first way applies, with weight 1: the
      play-off counts exactly like any other competition of the championship.

  - type: heading
    id: avviare
    title: "For directors: starting and following the play-offs"

  - type: text
    text: >-
      This part is for whoever directs the championship. Everything happens
      on the championship page: the band at the top always says where the
      play-offs stand and what the next thing to do is.

  - type: steps
    items:
      - title: "Terminate the championship"
        text: >-
          With **Terminate** the overall standings become final and the band
          switches to «Playoffs to start».
      - title: "Choose the date and the deadline, and send the invitations"
        text: >-
          Tap **Start the playoffs**: a sheet opens asking **When the playoff
          is played** and **Invited players reply by**, in your time zone.
          Both dates must be in the future. With **Start the playoffs and send
          the invitations** the qualified players receive the invitation and
          the configurations are locked.
      - title: "Move the date and the deadline, if needed"
        text: >-
          Above the list of invited players of each play-off there is the
          **Date and deadline** row. Tap it to change them, until the play-off
          competition starts. The new deadline applies to whoever has not
          answered yet; the new date also moves the competition, if you have
          already created it.
      - title: "Create the competition"
        text: >-
          When there are enough answers, **Create the playoff competition**
          creates it and enters everyone who accepted. From then on the
          button becomes **Go to playoff competition**.
      - title: "Play"
        text: >-
          As soon as the play-off competition starts, the band says **Playoffs
          in progress**: invitations are closed and the play-off is played by
          whoever is in. Instead of the invited players you find **Playoff
          competitions**, with a link to each one.

  - type: options
    title: "Final options"
    items:
      - name: "Distance, rounds, discipline, format, odd numbers"
        text: >-
          In the configuration of each play-off, with **Edit**. Left on
          **Inherit**, the final is played like the first completed
          competition of the season, including "race to N" or "exactly N". You
          can change all of them, but only before starting the play-offs.
      - name: "Standings system"
        text: >-
          With "Championship + play-off event" the final uses the
          championship's, because the points are added up. With "Play-offs
          only" you can choose another one: only the finishing order of the
          final counts.
      - name: "Bracket final"
        text: >-
          Single elimination or double knockout can be chosen with "Play-offs
          only", or when the championship is a bracket too. A bracket is always
          played "race to N".

  - type: note
    tone: info
    title: "The championship closes by itself"
    text: >-
      When every play-off competition is finished, the band says
      **Championship finished · Final standings**, with the winner of each
      play-off and the **Final results** button. There is nothing to press:
      the championship is marked completed by itself.

  - type: faq
    items:
      - q: "How do I know whether I qualified?"
        a: "You get a notification, and a \"You have qualified\" card on your home page. If instead the play-off shows up under \"Your competitions\" with \"Waitlist\", you did not qualify but can still get in if someone drops out. If there is nothing at all, the invitations have not gone out yet or the championship has no play-offs."
      - q: "I accepted: where do I find the play-off?"
        a: "On your home, under \"Your competitions\", marked \"Registered\". From the first round it is the competition's normal card, with your match inside."
      - q: "Does winning the play-off mean winning the championship?"
        a: "It depends on the setup. With \"Play-offs only\" yes; with \"Championship + play-off event\" the score is added to the season's, and it may not be enough. Ask the competition director how theirs is set up."
      - q: "Can I play in both play-offs?"
        a: "No: qualifying assigns you to one of the two, based on your position in the standings."
      - q: "I accepted but now I cannot come."
        a: "Tell the competition director: until the start they can remove you from the playoff list, on the championship page."
      - q: "My championship has no play-offs."
        a: "That is normal: they are optional and decided when the championship is created."

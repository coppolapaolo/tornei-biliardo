title: "Running a competition round by round"
section: organizzare
kind: approfondimento
audience: [direttore]
minutes: 6
summary: "The evening itself: starting rounds, assigning tables, correcting wrong results and closing the competition."
screens: [admin.competition.gara_detail, admin.competition.amalfi_classification, main.schermo_sala]
related: [gestire_le_iscrizioni, abbinamenti, numero_dispari]

blocks:
  - type: text
    text: >-
      During the evening your job comes down to three gestures: start the
      round, watch the matches finish, start the next round. The app does the
      rest.

  - type: note
    tone: tip
    title: "Your home tells you what is waiting for you"
    text: >-
      You do not have to open your competitions one by one to find the one
      that has stalled. On your home, under **«Your competitions»**, every
      competition you direct spells the pending command out on its button:
      **Open registrations**, **Start the competition**, **Extend
      registrations**, **Start round 3**, **Start the tiebreaker**, **End the
      competition**. The button takes you to the competition page, where the
      command is actually given. If people are still missing to get going, in
      place of the command you find **«Not enough players registered yet»**
      with how many are needed.

  - type: shot
    shot: gara-gestione
    caption: "The competition page as the director sees it: the phase strip at the top, then the dark band that says the one thing to do now — here, start the next round."

  - type: heading
    id: primo_turno
    title: "Starting the first round"

  - type: steps
    items:
      - title: "Close registrations"
        text: "Check the list matches who is actually in the venue."
      - title: "Tap «Start the competition»"
        text: >-
          The app draws the pairs and creates the matches. Every player gets a
          notification with their opponent's name. In bracket competitions the
          same button is called **Draw the bracket**: see the box below.
      - title: "Assign the tables"
        text: >-
          If the venue has tables configured, the app spreads them across the
          first matches; the others wait and get a table as soon as one frees
          up.

  - type: note
    tone: tip
    title: "With an odd number of players, you choose who gets the X"
    text: >-
      When registrations are odd and the competition handles that with the X
      by walkover (or with a drill instead of the X), tapping «Start First
      Round» asks you one extra thing: whether the X should go to the **last
      player to register** or be drawn, as usual. It helps when the last
      arrival is the one who made up the numbers at the last minute. The other
      pairings stay random either way. The question does not appear in
      competitions with trios, nor when the players are an even number: there
      is no X to hand out there.

  - type: note
    tone: info
    title: "The draw is reproducible"
    text: >-
      The first-round draw is recorded: if anyone disputes a pairing, it is
      possible to reconstruct how it came out. Cancelling the first round
      deletes the draw, and restarting it means genuinely drawing again.

  - type: note
    tone: warning
    title: "In bracket competitions the button is «Draw the bracket»"
    text: >-
      With knockout and double elimination you do not start a round: you draw
      the bracket, and that one action settles everything. Registrations close,
      teams freeze and every player's path to the final is fixed. The app
      reminds you with a confirmation before going ahead. The number of rounds,
      which you did not set at creation time, is decided now on the entrants
      present: until this moment the competition card showed it as an
      **estimate**. See [The bracket](/aiuto/giocare/tabellone).

  - type: heading
    id: durante
    title: "While play is under way"

  - type: text
    text: >-
      Players record their own racks from their phones and you watch the page
      update itself. You need do nothing, except step in when something goes
      wrong.

  - type: options
    title: "What you can do during the round"
    items:
      - name: "Keep score on the players' behalf"
        text: >-
          If a table has no smartphone, you keep score from the match card:
          under each name there are **−** and **+**. At the round's distance
          the + switches off, the match closes by itself and the table goes
          to the first match waiting for one.
      - name: "Validate a result"
        text: >-
          A match that reached the distance from the players' scoreboard,
          but without both confirmations, shows up in a green card with
          «Validate the result». If the score is not right, fix it with − and
          + before validating: the card says who gets the table next.
      - name: "Score a trio"
        text: >-
          A trio card has three names, and under each one **+** and **−** for
          the racks that player won. Racks are played in a fixed order — the
          first between the first and second player, the second between the
          first and third — so a + stays off until that player could have won
          it. Once every rack is played, the match closes. To correct a trio
          that is already closed, open the scoreboard from the «⋯» menu.
      - name: "Score a match played in sets"
        text: >-
          The sets won are at the top, and under them the set being played
          with its own − and +. At the set's distance the set closes and
          **Start set** appears for the next one; when a player reaches the
          sets needed, the match closes by itself.
      - name: "Validate the drill played instead of the X"
        text: >-
          In competitions where the X is replaced by a drill, the card of the
          player who sits out has one name and the drill score, from zero to
          the round's distance. If the player already declared it the card is
          green; otherwise you enter it with − and +. The score counts only
          after **Validate**. To clear it, use the «⋯» menu and **Reset the
          drill**.
      - name: "Record the drills between rounds"
        text: >-
          If the competition has a drill after a round, once that round is over
          the section **"Drill after round N"** appears, with one row for each
          player: how many attempts they have made and their best score.
          Between rounds you find it above the matches, while a round is being
          played below them. Tap the row of whoever has just played: for a
          scored drill set the number with − and + and tap **Record the
          attempt**; if the drill is only made or missed, just tap **Made it**
          or **Missed**. Once the attempts are used up the row can no longer be
          tapped, and a recorded attempt cannot be removed. The next round can
          start even if someone still has to play.
      - name: "Change a match's table"
        text: >-
          Tap the table on the card: the sheet opens with one tile per table.
          Occupied tiles show who is playing there, the free one is
          highlighted and a tap assigns it. Useful when a table breaks down
          or two pairs agree otherwise.
      - name: "Record a forfeit"
        text: >-
          Whoever abandons leaves their opponent all the racks missing to the
          distance.
        hint: partita.forfait
      - name: "Reset a wrong match"
        text: >-
          Puts the score back to zero keeping the same pair, who replay. This
          is the correction to use when a result was entered wrongly.
        hint: gara.reset_partita

  - type: text
    text: >-
      Next to the matches you find the **standings after the last closed
      round**. The arrow beside the position says whether the player moved up
      or down since the previous round; a dash means they stayed where they
      were, or that it is the first round and there is nothing to compare yet. The
      columns follow the competition's system: wins and rack difference, or
      racks won and lost.

  - type: note
    tone: info
    title: "Bracket competitions show the bracket"
    text: >-
      In place of the standings you find the **compact bracket**: the round
      on screen, the one before and the one after, with empty slots showing
      who will get there. Every card says where the winner goes — «Winner:
      Semi-finals against whoever wins Rossi – Bianchi» — and, in double
      elimination, where the loser drops. A player going through without
      playing has a «goes through» card.

  - type: shot
    shot: gara-tabellone-direttore
    variant: desktop
    caption: "A knockout competition seen by its director: the quarter-finals are over, the band offers «Start the semi-finals» and the compact bracket is on the right."

  - type: heading
    id: turni_successivi
    title: "Starting the following rounds"

  - type: text
    text: >-
      The **Start next round** button only lights up when **every** match in
      the current round is finished. That is deliberate: the new pairs come
      from the standings, and incomplete standings would produce wrong
      pairings.

  - type: note
    tone: warning
    title: "Starting a round locks the previous one"
    text: >-
      As soon as the new round starts, the previous round's matches become
      **Locked**: they can no longer be corrected, because the pairings just
      created are based on those results. Check the scores **before** pressing.

  - type: text
    text: >-
      In bracket competitions the button carries the name of the round:
      **Start the semi-finals**, **Start the final** and, in double
      elimination if needed, **Start the decider**. The pairings do not come
      from the standings: the draw already fixed them. From the «⋯» menu of the
      first round, as long as nobody has scored, you can **cancel the draw**.

  - type: heading
    id: correggere
    title: "Correcting a mistake"

  - type: text
    text: >-
      It depends when you notice. The three situations are resolved
      differently.

  - type: options
    items:
      - name: "The round is still under way"
        values: "easy"
        text: >-
          If the match is still open, fix the score with − and + on the card.
          If it is already closed, tap **Correct** on the card: enter the
          right score and, if you like, why. The correction stays written on
          the match, so whoever saw the earlier result understands what
          changed. Alternatively, from the card's menu, **Reset the match**:
          the same pair replays.
      - name: "The round is over but the next has not started"
        values: "still easy"
        text: >-
          The round's matches are rows: tap the pencil on the row and
          correct. Until you start the next round, results can be changed.
      - name: "The next round has already started"
        values: "think it over"
        text: >-
          The matches are locked. To correct them you have to **cancel the next
          round**: its matches are deleted and the pairs are freed. Then you
          correct, and start again. The players in the cancelled round will
          have to replay, so weigh up whether it is worth it.

  - type: heading
    id: schermo_sala
    title: "The room screen"

  - type: text
    text: >-
      If the venue has a TV or a projector, open **Room screen** from the
      competition page, on the computer connected to the screen. It is a
      public page with no menus: the competition poster at the top, the
      tables below with both players and a large score, and on the right the
      standings after the last closed round with the results of the previous
      round. It updates by itself at every result: nobody needs to touch it.

  - type: shot
    shot: schermo-sala
    variant: desktop
    caption: "The room screen: the poster, the tables with the matches under way, the standings and the previous round."

  - type: note
    tone: tip
    title: "In bracket competitions"
    text: >-
      The tables stay the same, with the name of the round above each match
      («Quarter-finals», «Losers round 1»). On the right, instead of the
      standings, there is the **bracket**: the round being played and the
      next one, with the places still empty and who will fill them. The whole
      bracket does not fit: from three metres it could not be read. In double
      elimination the winners are above and the losers below, both at once.
      Once the competition is over the screen shows the podium and the final
      standings, with the round in which each player went out.

  - type: note
    tone: info
    title: "When it is not there"
    text: >-
      Trial competitions have no room screen: from outside they do not exist.

  - type: heading
    id: dispari
    title: "If the number of players is odd"

  - type: text
    text: >-
      You need do nothing: the app applies the rule you chose when creating the
      competition — X by walkover, trio or challenge — and applies it to a
      different player each round, so the burden goes around. How it works is
      explained in [When the number of players is
      odd](/aiuto/approfondimenti/numero_dispari).

  - type: text
    text: >-
      In bracket competitions that rule is neither chosen nor needed: whoever is
      left over goes straight through to the next round, and the bracket is
      built that way from the start.

  - type: heading
    id: campionato
    title: "A competition inside a championship"

  - type: text
    text: >-
      If the competition is part of a championship, a line above the phase
      strip says which one it is — «Competition 4 of 6 · Campionato Sociale
      2026» — and tapping it takes you back to the championship page. Next to
      it you see **×2** when the competition weighs more than the others, or
      **Playoff** when it is the playoff competition.

  - type: text
    text: >-
      While preparing, and always in **Competition settings**, the **From the
      championship** group gathers what the competition receives from the
      championship:

  - type: shot
    shot: gara-dal-campionato

  - type: options
    items:
      - name: "Weight in the standings"
        text: >-
          How many times the competition's score counts in the championship
          standings. If it is the playoff and the championship chose to let
          the playoff decide the final standings, the score is not added and
          the row says so.
        hint: gara.peso
      - name: "Who breaks"
        text: >-
          The break rule. «Inherits» means the competition uses the one chosen
          for the whole championship; if you picked another one when editing
          the competition, the row says so.
      - name: "Allowed dates"
        text: >-
          The competitions of a championship stay in order: competition 4
          cannot be played before competition 3 or after competition 5. The
          row shows the dates it can sit between, and editing the competition
          refuses a date outside them.
      - name: "Championship page"
        text: "Takes you to the overall standings and the other competitions."

  - type: heading
    id: chiudere
    title: "Closing the competition"

  - type: text
    text: >-
      After the last round the competition ends and the standings become
      final: the «Start round» button is replaced by the one that closes the
      competition. Double elimination is the exception — after the Final one
      more round may appear, the Decider, explained on the
      [bracket](/aiuto/giocare/tabellone) page. Two things can still happen:

  - type: list
    items:
      - >-
        **Tie-breaks**: if players are level in the positions you chose to
        break, the competition waits until you have them played. You start the
        tie-break from the band at the top of the competition page.
      - >-
        **Championship standings**: if the competition is part of one, the
        results are added to the overall standings, multiplied by the weight,
        as soon as it finishes. The band tells you before you close it: «the
        competition counts ×2 in the championship standings». If the playoff
        decides the final standings, it says that instead. A standalone
        competition says nothing about points.

  - type: text
    text: >-
      In bracket competitions the final standings are **in bands** — 1st, 2nd,
      3rd–4th, 5th–8th — with where each player went out: whoever goes out in
      the same round shares the place and the points, with no tie-break.

  - type: faq
    items:
      - q: "The «Start next round» button is greyed out."
        a: "At least one match is still open. In the Rounds view, the open matches are the ones without the «Finished» label."
      - q: "A player leaves halfway through the competition."
        a: "Record a forfeit on the match in progress. For the following rounds, the rule you chose at creation decides whether they stay in the pairings (losing by walkover) or drop out. In bracket competitions there is nothing to choose: whoever withdraws lets their opponent through by walkover, and the bracket stays as it is."
      - q: "Why does my knockout not say «Start the competition»?"
        a: "Because the action there is a different one: the button says «Draw the bracket». Drawing the bracket closes registrations and fixes everybody's path to the final, so the name says what actually happens."
      - q: "Can I run a competition and play in it?"
        a: "No: a director cannot register for the competition they run. If you want to play, add a co-director to run the evening."
      - q: "I cancelled a round by mistake."
        a: "Start it again: the app will re-form the pairs. They will not necessarily be the same as before, because the pairing is recalculated."
      - q: "Can I change the distance halfway through?"
        a: "The format is frozen at the start. If you need a different distance for a specific round, it has to be set before kick-off, while the competition is still a draft."

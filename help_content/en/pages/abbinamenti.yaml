title: "How pairs are formed"
section: approfondimenti
kind: approfondimento
audience: [tutti]
minutes: 6
summary: "Five ways of pairing players each round: Amalfi, random, round robin, knockout and double elimination. When to use which."
related: [classifiche, numero_dispari, opzioni_della_gara]

blocks:
  - type: text
    text: >-
      Each round somebody has to decide who plays whom. Doing it at random is
      simple but unfair; doing it well means taking account of the standings
      and of who has already met. The app offers five methods.

  - type: heading
    id: amalfi
    title: "Amalfi — the recommended method"

  - type: text
    text: >-
      It is designed for club competitions played over rounds, where **everyone
      plays every round** and nobody is knocked out. The principle: the first
      round is drawn; from the following rounds the standings are the starting
      point, and each player is paired with someone a certain distance away in
      the table.

  - type: text
    text: >-
      That distance shrinks as the rounds go by: it equals **how many rounds
      are left**. In a three-round competition, the second round jumps two
      places, the last one jumps one. The result is that early on you face
      players far from you in the standings, and towards the end you face your
      neighbours: the matches that decide the podium are played between the
      people contesting it.

  - type: list
    title: "What it guarantees"
    items:
      - "**Everyone plays every round**: no eliminations."
      - "**No rematches**, if the constraint is on and it is mathematically possible."
      - "**Balanced matches towards the end**, when they matter most."

  - type: note
    tone: info
    title: "If a rematch is unavoidable"
    text: >-
      With many rounds and few players you reach the point where everyone has
      played everyone. The app looks for the solution with the fewest rematches
      it can, but it cannot invent new opponents.

  - type: heading
    id: casuale
    title: "Random"

  - type: text
    text: >-
      Pairs are drawn, round by round, avoiding rematches. It takes no account
      of the standings: first and second may meet in round one and never again.

  - type: text
    text: >-
      Fine for a light evening, where playing matters more than producing
      trustworthy standings. With this strategy the app generates **all rounds
      at once** at the start, so the evening's schedule is known from the off.

  - type: heading
    id: girone
    title: "Round robin"

  - type: text
    text: >-
      Everyone against everyone: each player meets every other exactly once. It
      is the fairest method there is, and also the longest.

  - type: note
    tone: warning
    title: "Watch the number of matches"
    text: >-
      With 6 players that is 15 matches, with 8 it is 28, with 10 it is 45.
      From eight people up it takes a whole day, or more tables than you
      usually have.

  - type: note
    tone: info
    title: "With an odd number someone rests, and the rest scores nothing"
    text: >-
      With an odd number of players one player **rests** each round: you see
      it in the round, but it brings nothing — no wins, no points, no racks.
      Everyone rests once, so nobody gains from it. If the director
      **removes** a player during the round robin, whoever was due to meet
      them in later rounds **wins by walkover**, with all the racks of the
      distance.

  - type: heading
    id: gironi
    title: "Round robin in several groups"

  - type: text
    text: >-
      With many players a single round robin gets long. The **Groups** option
      says how many groups you can have at most — «up to 2», for example —
      and at the start you choose how many to make, on the players present:
      each player only plays the others in their group, and the groups play
      in parallel. With 11 players and «up to 2» the app suggests two groups,
      of 6 and 5.

  - type: list
    title: "The rules"
    items:
      - "At least **3 players per group**: with few players the maximum drops by itself."
      - "The suggestion is **one group every six players**, and you can change it on the start sheet."
      - "Sizes differ by at most one; the extra player goes to the first groups."
      - "Groups are fixed at the start and **never change**, not even when someone withdraws. Cancelling the start recomposes them."
      - "The competition has as many rounds as the largest group; a group that has finished stops."
      - "In a championship, groups exist only if it uses **placements**: if the championship adds up wins, racks or points, competitions stay single-group, because a larger group plays one more match."

  - type: options
    items:
      - name: "Group composition"
        values: "Draw · By ELO · By category"
        text: >-
          Players line up in this order and go one per group in turn, there
          and back: with two groups the first goes to A, the second and third
          to B, the fourth and fifth to A. So the first in line end up in
          different groups. **By category** follows the price list order,
          then ELO within the category.
        hint: gara.composizione_gironi
      - name: "Teammates in different groups"
        values: "default off"
        text: >-
          When possible, the composition puts teammates in different groups,
          without changing the balance of the line.

  - type: note
    tone: info
    title: "The standings of a competition in groups"
    text: >-
      Within each group the order is the usual one. In the competition
      standings come first all the group **winners**, then all the seconds,
      and so on. Between groups of different size the comparison is **per
      match played** — wins, racks and points divided by the matches played —
      because a group of 6 plays one match more than a group of 5.

      While the competition is being played, its page and the venue screen
      show **one standings table per group** («Group A», «Group B»), each with
      the competition's system and tiebreak criteria; every match says its
      group, and the competition card tells you where you are in yours
      («You are 2 of 6 in group B»). Once the competition is completed the
      overall standings appear, with each player's place in their group next
      to the name («#1 in group A»).

  - type: heading
    id: fase_finale
    title: "After the groups: the bracket"

  - type: text
    text: >-
      With more than one group the competition can end with a **bracket**:
      in the form, below the groups, choose **Final phase → Bracket**, how
      many go through from each group (**Qualifiers per group**, normally 2),
      whether to play the **3rd/4th place final**, and the **time limit of
      the final phase**: same as the groups, no limit or a different limit.
      With two groups and two qualifiers the semi-finals are 1stA–2ndB and
      1stB–2ndA, then the final.

  - type: list
    title: "The rules"
    items:
      - "The bracket exists only with **more than one group**: with a single group the option does not appear."
      - "The bracket rounds are counted at the start: two groups of 4 with two qualifiers make 3 group rounds plus semi-finals and final. The start sheet shows them on each option."
      - "If at the start you choose **a single group**, the bracket **is not played**: the competition ends with the group, and the start sheet says so."
      - "Players from the same group meet as late as possible. If the qualifiers do not fill the bracket, the best group winners skip the first round."
      - "With the bracket matches are **race to N**, groups included: in the bracket someone has to go through. «Exactly N racks» cannot be chosen."
      - "Final standings: first those who played the bracket, in the order they left it, then the others in the order of the groups."
      - "In a championship the final phase is proposed by a championship **with placements**; one that adds up wins, racks or points does not have it."

  - type: heading
    id: eliminazione
    title: "Knockout"

  - type: text
    text: >-
      The classic bracket: lose and you are out. The number of rounds is not
      set — it follows from the number of entrants (8 players: quarters, semis,
      final). You can add a **third-place play-off**.

  - type: list
    items:
      - "Losers go out: half the entrants play a single match."
      - "The standings are the bracket's and use the **Position** system."
      - "You can ask that team-mates do not meet straight away."
      - "The first round is not «started»: you **draw the bracket**, and from then on everybody's path is fixed."

  - type: heading
    id: doppio_ko
    title: "Double elimination"

  - type: text
    text: >-
      Like knockout, but you have to lose **twice** to go out: whoever loses
      first drops into a losers' bracket and can climb back. Longer, but nobody
      goes home after a single defeat — a good compromise when you have time.

  - type: text
    text: >-
      It is the one format where two players can meet twice: somebody climbing
      back through the losers' bracket may face whoever beat them. That is not a
      pairing defect, it is how double elimination is built — and the shape of
      the losers' bracket still pushes that meeting as far away as it can.

  - type: note
    tone: info
    title: "On brackets there is less to choose"
    text: >-
      With knockout and double elimination the creation form does not ask for
      number of rounds, forfeit handling, odd number of players, avoid
      rematches, standings system, tie-break or exact number of racks: none of
      those choices would have any effect on a bracket. In exchange you get the
      settings that do count — keeping team-mates apart, the third-place final,
      the group stage. The full list is in [All the
      options](/aiuto/organizzare/opzioni_della_gara).

  - type: heading
    id: scegliere
    title: "Which to choose"

  - type: options
    items:
      - name: "Club evening, 6-14 players"
        values: "Amalfi"
        text: "Everyone plays every round, the standings mean something, the evening fits the time."
      - name: "Informal evening, people come to play"
        values: "Random"
        text: "No pretence of trustworthy standings, schedule known from the start."
      - name: "Few players, plenty of time"
        values: "Round robin"
        text: "Up to six entrants it stays manageable and it is the fairest."
      - name: "A tournament with a winner, limited time"
        values: "Knockout"
        text: "Quick and easy to follow, but half the entrants play a single match."
      - name: "A tournament with a winner, second chances"
        values: "Double elimination"
        text: "Fairer than straight knockout, takes about twice the time."

  - type: heading
    id: primo_turno
    title: "The first round is a special case"

  - type: text
    text: >-
      In the first round no standings exist yet, so another criterion is
      needed. The three possibilities:

  - type: options
    items:
      - name: "Random"
        values: "default"
        text: "A straight draw. The draw is recorded and stays verifiable."
      - name: "Rating"
        text: >-
          Pairs by players' declared strength, so the strongest do not knock
          each other out immediately. Typical of knockout brackets, where it is
          called seeding.
      - name: "Standings"
        text: >-
          Uses the overall championship standings: whoever is doing well in the
          championship starts from a favourable position in this competition
          too.

  - type: faq
    items:
      - q: "Why do I always play the strongest players?"
        a: "With Amalfi, if you are doing well you end up facing people doing as well as you — especially in the last rounds. That is the method working as intended."
      - q: "I met the same opponent twice."
        a: "That happens when the free pairings run out: with few players and many rounds, at some point everyone has played everyone. In double elimination it is part of the format instead: somebody climbing back through the losers' bracket may face whoever beat them."
      - q: "I cannot find the «avoid rematches» option in my knockout."
        a: "It is not there, and it would serve no purpose: losers go out, so two players cannot meet twice."
      - q: "Can I change strategy once the competition has started?"
        a: "No. Pairings already made follow the chosen strategy, and switching midway would produce an incoherent competition."
      - q: "Who decides who breaks?"
        a: "The app does not: sort it out at the table according to your club's habits."

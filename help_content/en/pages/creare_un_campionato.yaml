title: "Creating a championship"
section: organizzare
kind: tutorial
audience: [direttore]
minutes: 5
summary: "The two-step wizard: first the general rules, then the defaults every competition will inherit."
screens: [admin.campionato.wizard_start, admin.campionato.edit_campionato,
  admin.campionato.campionato_detail]
related: [creare_una_gara, classifiche]

blocks:
  - type: text
    text: >-
      A championship is a series of competitions that add up into overall
      standings: the club's season, an autumn circuit, the Thursday
      championship. You create it once, then add competitions as you go.

  - type: heading
    id: wizard
    title: "The two-step wizard"

  - type: text
    text: >-
      Creation is guided: two screens, and at the end the championship exists.
      Almost everything can be changed afterwards, so there is no need to fear
      getting it wrong.

  - type: shot
    shot: campionato-wizard
    caption: "First step of the wizard: name, planned number of competitions, standings system and pairing strategy."

  - type: heading
    id: passo1
    title: "Step 1 — The general rules"

  - type: options
    items:
      - name: "Championship name"
        text: >-
          Include the year: «2026 Club Championship». Two seasons from now you
          will be glad to tell them apart at a glance.
      - name: "Planned competitions"
        text: >-
          How many you expect. It is an indicative target, not a constraint:
          you can add or remove them.
      - name: "Standings system"
        values: "Wins · Racks · Points · Placements"
        text: >-
          How competitions enter the overall standings. With **Wins**,
          **Racks** and **Points** each competition's numbers are added up:
          **Wins** is the normal choice (matches won, and rack difference when
          level); with **Points** every result is worth the points you choose
          in the next step (usually 3, 1 and 0). With **Placements** each
          competition gives points for the **place** in its standings, and
          competitions can have different formats: an evening with groups, an
          Amalfi one, a bracket. In that case **Standings of each event** also
          appears: how each evening is ranked (usually by wins), proposed to
          every competition. The modes are explained in [How standings are
          worked out](/aiuto/approfondimenti/classifiche).
        hint: campionato.classifica
      - name: "Pairing strategy"
        values: "Amalfi · Random · Round-robin · Single elimination · Double knockout"
        text: >-
          How pairs are formed each round. **Amalfi** is the proposed value and
          is designed for club competitions played over rounds. See [How pairs
          are formed](/aiuto/approfondimenti/abbinamenti).
        hint: gara.strategia
      - name: "Challenge mode"
        text: >-
          Enables individual skill drills during the championship. See
          [Challenges](/aiuto/giocare/challenge).
      - name: "Final play-offs"
        text: >-
          Special competitions at the end of the championship reserved for the
          best-placed players. You can plan an «Elite» play-off for the top
          finishers and an «Academy» one for those below. Qualifiers receive an
          invitation to accept — and if they answer in person, you can record
          their answer yourself. Until the final starts you can add players
          even beyond the places; if the competition does not allow an odd
          number, a player who would be left over waits on the waiting list
          for a second one.
        hint: campionato.playoff_classifica_finale

  - type: note
    tone: warning
    title: "The standings system applies to the whole championship"
    text: >-
      If the championship adds up wins, racks or points, every competition
      uses the **same** standings system, and so does the play-off final when
      its score is added to the season's: you cannot add apples to pears. For
      the same reason competitions stay **single-group**: a larger group plays
      one more match. If you want groups, or different formats from one
      competition to the next, choose **Placements**: there only each
      competition's place counts. Choose carefully
      now. You can change it until a competition has started, even if it
      already has registered players, and then the change applies to every
      competition and stays in each one's history. After the first start it
      can no longer be changed: you would be changing the rules for players who
      have already played.

  - type: heading
    id: passo2
    title: "Step 2 — The defaults for competitions"

  - type: text
    text: >-
      The second step asks what the championship's «typical» competitions look
      like: venue, entry fee (and, if needed, the fee list by category, which
      applies to every competition), number of rounds, handling of odd numbers,
      how the break shot is decided, and how **ties** are settled in the round
      standings and in each competition's final standings. Every new
      competition will start out like that, and you will only have to change
      the name, date and discipline.

  - type: note
    tone: tip
    text: >-
      These are **starting values**, not hard rules: each individual
      competition stays editable. They exist so you do not retype the same ten
      choices for six evenings.

  - type: note
    tone: info
    title: "If the championship is a bracket one, step 2 is shorter"
    text: >-
      Choosing knockout or double elimination in step 1 means step 2 does not
      ask for number of rounds, handling of odd numbers or avoid rematches: on
      bracket competitions those settings have no effect, so there would be no
      point inheriting them. A bracket championship always uses placements,
      so the position points table appears, below.

  - type: heading
    id: preset
    title: "Starting from a preset"

  - type: text
    text: >-
      If you often set up the same championship — the yearly club league, the
      autumn circuit — you can save its settings as a **preset** and start
      from there. A championship preset keeps format, standings system,
      number of competitions, drills and all the values proposed to the
      competitions (rounds, odd number, break, groups, final stage, points,
      ties, time limit, fee and price list, points by position) and also
      **the playoffs**: places, minimum competitions, how they count in the
      final standings, weight and the rules of the final. Name and venue are
      left out, and for the playoffs so are dates, invitation deadline and
      qualified players.

  - type: list
    items:
      - "At **step 1** of the wizard pick the preset in **«Start from a preset»**: type, system and number of competitions fill themselves in. At **step 2** the app also writes the competition values: check them and change them as you like."
      - "**«Save as preset»** is at step 2 of the wizard and when editing the championship; from the **Settings** of an existing championship you can save it as it is, even once it is over."
      - "At **step 1** the preset also switches on **Playoff Elite** and **Playoff Academy** with their places, and the championship is created with the playoff rules of the preset. You can change the places: the positions are recalculated as usual. Step 1 creates at most two: if the preset has more, the page says so and you add the others from the championship page."
      - "When **editing** the championship the preset does not touch the playoffs, which are changed from the championship page: the page says so, and also says if the invitations have already been sent."
      - "The championship you create is not tied to the preset: if you change or delete it later, the championship does not change."
      - "You find all your presets, competition and championship, on the **[My presets](/aiuto/organizzare/i_miei_preset)** page."

  - type: heading
    id: apertura
    title: "How play starts, and who breaks"

  - type: text
    text: >-
      Two fields in step 2 decide the break shot for every competition in the
      championship.

  - type: options
    items:
      - name: "Start rule"
        values: "default «Lag»"
        text: >-
          With **First player** the first of the two always breaks. With
          **Lag** the scoreboard, before the first rack, asks who won the lag
          and who breaks — because the lag winner chooses, and may send the
          opponent to the table.
      - name: "Who breaks"
        values: "default «Alternating»"
        text: >-
          How the break shot passes from one rack to the next. **Alternating**
          is the standard rule. The others: **alternating every two**,
          **winner breaks**, **loser breaks**.

  - type: note
    tone: info
    text: >-
      Each competition starts with the championship's rule and may differ. If
      you later change the championship's rule, the app asks which
      competitions not yet started should take it: none changes by itself.

  - type: heading
    id: punti_posizione
    title: "Position points (placement championships)"

  - type: text
    text: >-
      In a placement championship each place in a competition's final
      standings is worth a number of championship points, whatever the
      competition's format. How many is up to you. Anyone who misses a
      competition gets zero; tied players get the points of the place they
      share; a place beyond the last one in the table is worth zero.

  - type: text
    text: >-
      You do not fill in sixteen boxes: you set **six thresholds**, that is the
      placing bands a bracket actually produces — 1st, 2nd, 3rd, 4th, 5th-8th
      and 9th-16th. Everybody sharing a band takes the same score: the four
      quarter-finalists are all fifth, and all take the points for fifth.

  - type: list
    title: "The proposed values"
    items:
      - "**1st** — 25 points"
      - "**2nd** — 18 points"
      - "**3rd** — 15 points"
      - "**4th** — 12 points"
      - "**5th-8th** — 8 points"
      - "**9th-16th** — 4 points"

  - type: note
    tone: tip
    text: >-
      If you leave the proposed values, the championship **follows** the
      reference table instead of carrying a copy of it around: the day the
      reference values change, your championship follows suit on its own. Only
      change the boxes if your own rules say something different.

  - type: heading
    id: aggiungere_gare
    title: "Adding competitions"

  - type: shot
    shot: campionato-gestione
    caption: "The championship page: at the top where the season stands and «New competition», then the overall standings with the playoff zone, the competitions and the management rows."

  - type: steps
    items:
      - title: "Open the championship"
        text: "From your home, under «Championships», tap «Manage»."
      - title: "Add a competition"
        text: >-
          The competition inherits the defaults. You supply the name, date and
          discipline.
      - title: "Repeat for the following ones"
        text: >-
          Dates must be in increasing order: competition 2 cannot come before
          competition 1. You can create them all at once, with the calendar
          dates, or one at a time. If you later move a competition past the
          next one, the app suggests moving the competitions it overtakes by
          the same number of days: you choose whether to do it, go back to the
          form or leave everything as it was.

  - type: heading
    id: classifica_generale
    title: "The overall standings"

  - type: text
    text: >-
      They update on their own at the end of each competition by adding up the
      results: wins and rack difference if the system is «Wins», total racks if
      it is «Racks», the competitions' points — multiplied by their weight —
      if it is «Points», position points — the ones in the table above — if it is
      «Placements». Anyone who misses a competition is not excluded: they simply
      gain nothing on that occasion.

  - type: text
    text: >-
      On equal scores the **overall standings chain** decides. You choose it
      in step 2 and when editing the championship, together with the two
      chains proposed to the competitions. The starting one is rack
      difference, then the sum of the SSR tiebreakers, then the position after
      the previous competition, then the draw: it never leaves ties, because
      playoff invitations start from there. With placements the chain has
      its own criteria: **best placements** (whoever has more first places,
      then more second places, and so on), position after the previous
      competition, head-to-head and draw; the starting one is best
      placements, then the draw. Wins and racks cannot be chosen here: with
      groups of different sizes, whoever is in the larger group plays one
      more match. Two players tied for second in a competition both count as
      a second place, and a competition that weighs zero does not count.
      Changing it once the championship
      has started recalculates the standings, and a line above them says so.

  - type: faq
    items:
      - q: "Can I add competitions once the championship has started?"
        a: "Yes, as long as the date is after the last existing competition."
      - q: "Can a player join a championship that has already started?"
        a: "Yes. They register for the remaining competitions and start from the points of the ones they took part in."
      - q: "Can a championship have more than one director?"
        a: "Yes, and whoever runs the championship runs all of its competitions as a result."
      - q: "What happens if I cancel one of the championship's competitions?"
        a: "Its results leave the overall standings. The other competitions are unaffected."
      - q: "Can I change the position points once the championship has started?"
        a: "Yes, from the championship settings. The overall standings are recalculated with the new values, so competitions already finished change score: a line above the standings says so, with who made the correction and why. If the play-off invitations have already been sent and the correction changes who is within the places, the app suggests how to update them."
      - q: "I cannot see the position points table."
        a: "It only appears on placement championships: choose «Placements» as the standings system in step 1 (knockout and double elimination championships always are). If the championship adds up wins, racks or points, those points serve no purpose."
      - q: "Can a championship have an evening with groups and an Amalfi one?"
        a: "Yes, if it uses placements. In «New Competition», at the first step, choose the **evening format** (Amalfi, Random, round-robin, single elimination, double knockout) and the **evening standings**: they start set to what the championship proposes. The options that follow adapt to the format — groups with round robin, bracket options with a bracket. From the competition's edit page you can still change them until it starts. If the championship adds up wins, racks or points, the championship decides format and standings."

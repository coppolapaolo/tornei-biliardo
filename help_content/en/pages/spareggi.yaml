title: "End-of-competition tie-breaks"
section: organizzare
kind: approfondimento
audience: [direttore]
minutes: 3
summary: "When two players finish level in the positions that matter: how to decide who is ahead, and how to run the tie-break."
screens: [admin.competition.gara_detail, admin.competition.create_gara_standalone, admin.competition.edit_gara]
related: [classifiche, challenge, condurre_la_gara]

blocks:
  - type: text
    text: >-
      After the last round it can happen that two players have the same wins and
      the same rack difference. If it happens on the podium, somebody has to
      decide.

  - type: heading
    id: decidere_prima
    title: "Decide beforehand, not afterwards"

  - type: text
    text: >-
      When creating the competition you set **how** level finishes are
      settled, and **up to which position** a tie-break is worth playing. The
      proposed value is the podium: over fifth and sixth place, as a rule,
      nobody argues.

  - type: note
    tone: warning
    text: >-
      Deciding at the end of the evening, with the two players in front of you,
      is the situation to avoid: whatever rule you pick at that moment will look
      like it was picked to favour someone. Setting it in advance makes it a
      rule of the game.

  - type: heading
    id: catena
    title: "The chain of tie criteria"

  - type: text
    text: >-
      In the competition form, under **Ties**, there is a list of criteria in
      a row. At the top, with the padlock, the main criterion: wins or racks
      won, depending on the standings system. Below it, the criteria that
      decide between tied players, one after the other: if the first is not
      enough, the second applies, and so on.

  - type: steps
    items:
      - title: "Move a criterion"
        text: >-
          The up and down arrows move it before or after the others. The order
          is the order in which they apply.
      - title: "Remove or add"
        text: >-
          The × removes a criterion. Below the list are the ones you can still
          add: tap a name to put it in the row.
      - title: "Read the sentence"
        text: >-
          Below is the sentence that goes into the rules, for example «With the
          same wins the head to head counts, then the rack difference, then the
          SSR tiebreaker up to place 3». If the sentence says what you meant,
          the chain is right.

  - type: text
    text: >-
      There are two chains. The **round standings** chain orders the players
      after each round, and pairings come from it: it always ends with the
      draw, because two players cannot stay level when deciding who plays whom.
      The **final standings** chain may leave ties: players still level after
      every criterion share the place.

  - type: heading
    id: come
    title: "The criteria"

  - type: options
    items:
      - name: "Head to head"
        text: >-
          What counts is how the matches between the tied players went. If two
          of them met, whoever won finishes ahead (if they met more than once,
          whoever won more often). Players who beat each other in a circle — A
          beat B, B beat C, C beat A — stay level, and the next criterion
          decides. Between players who never met the next criterion decides,
          without ever overturning a direct result.
      - name: "Rack difference"
        text: "Racks won minus racks lost."
      - name: "Racks won"
        text: "Total racks won. Not offered when it is already the main criterion."
      - name: "Wins"
        text: "Matches won. Not offered when it is already the main criterion."
      - name: "SSR tiebreaker"
        values: "up to 3rd place (change it with − and +)"
        text: >-
          A skill drill with a score, played after the competition: the better
          score finishes ahead. It only applies up to the place you set, and
          only in the final standings. See [Challenges](/aiuto/giocare/challenge).
      - name: "Previous position"
        text: >-
          Whoever was ahead in the previous round finishes ahead. In the first
          round the starting order counts.
      - name: "Draw"
        text: >-
          Always last. It is a fixed draw, made when the competition starts: the
          standings do not change every time you look.

  - type: heading
    id: condurlo
    title: "Running the tie-break"

  - type: steps
    items:
      - title: "The competition waits"
        text: >-
          After the last round, if there are level finishes to settle the
          competition does not close: it waits. The standings show the players
          level.
      - title: "Start the tie-break from the band at the top"
        text: >-
          The app proposes the players involved. They are the ones level in the
          positions you specified, not everyone level in the competition.
      - title: "Have the drill played and enter the scores"
        text: >-
          The score is entered like any other result. The better score moves up.
      - title: "The competition closes"
        text: >-
          The final standings take the tie-break into account, and if the
          competition is part of a championship the points go into the overall
          standings.

  - type: note
    tone: info
    title: "It can be cancelled"
    text: >-
      A tie-break started by mistake can be cancelled from the competition
      page («Cancel the tiebreaker», under the scores).
      While a tie-break is active, though, the competition's results cannot be
      changed: the tie-break treats them as final, and changing them underneath
      would make it meaningless.

  - type: heading
    id: quando_non_serve
    title: "When it is not needed"

  - type: list
    items:
      - >-
        **Bracket competitions**: the option is not even asked for at creation.
        Level finishes do exist there — the two beaten semi-finalists are both
        third, the four quarter-finalists all fifth — but they are the intended
        result, not an ambiguity: the path already is the standings. If you want
        to separate the two third places, the way to do it is the **3rd/4th
        place final**, planned at creation.
      - "**Outside the positions you specified**: level finishes stand, two players share the position and the next one is skipped."
      - "**If the chain has no SSR tiebreaker**: the standings keep the level finishes the other criteria do not settle."

  - type: faq
    items:
      - q: "The competition will not close and I cannot see why."
        a: "Almost always there is a tie-break waiting: the band at the top of the competition page says so. If you do not want to play it, it can be cancelled and the standings keep the level finish."
      - q: "Can I change the chain once the competition has started?"
        a: "Yes. The final standings chain can be changed until the tie-break has started. The round standings chain applies from the next round: the standings of rounds already started stay as they were. The change stays in the competition's history."
      - q: "Can I correct a result while a tie-break is active?"
        a: "No. The tie-break has to be cancelled first: it implicitly certifies the competition's results."
      - q: "How many players can be in a tie-break?"
        a: "Everyone level in that position: three or four is not unusual, not just two."
      - q: "Does it need a configured challenge?"
        a: "For a scored tie-break, yes, you need a drill to play. Head to head needs nothing."

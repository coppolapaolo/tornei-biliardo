title: "Handling registrations"
section: organizzare
kind: approfondimento
audience: [direttore]
minutes: 4
summary: "Opening, extending and closing registrations; adding or removing someone by hand; understanding the waitlist."
screens: [admin.competition.gara_detail, riscatto.richieste, riscatto.richiesta]
related: [creare_una_gara, condurre_la_gara, numero_dispari]

blocks:
  - type: text
    text: >-
      Registrations are the phase in which the competition takes shape. The
      competition page shows the phase strip at the top and, in the dark band,
      the one thing to do now: open registrations, start the competition, extend them.

  - type: heading
    id: stati
    title: "A competition's three phases"

  - type: options
    items:
      - name: "Draft"
        text: "The competition exists but nobody can register. This is when you can change any setting."
      - name: "Registrations open"
        text: "The competition is public and players sign themselves up. Settings remain editable, and every change stays in the competition's history."
      - name: "In progress"
        text: "The first round has started. The competition's structure is fixed; venue, time and play rules can still be changed, and the rules apply from the next round."

  - type: heading
    id: aprire
    title: "Opening registrations"

  - type: steps
    items:
      - title: "Open the competition page"
        text: "In preparation the dark band at the top offers a single command: «Open registrations»."
        shot: gara-bozza
      - title: "Tap «Open registrations»"
        text: >-
          Set the window. The closing date cannot be later than the date of the
          competition: if you get it wrong, the app pulls it back to the
          competition's time and tells you.
      - title: "Circulate the link"
        text: >-
          In the **Share** box, under the band, you will find the short invitation link:
          whoever opens it registers directly.

  - type: heading
    id: durante
    title: "While registrations are open"

  - type: shot
    shot: gara-iscritti
    caption: "The list of entrants as the director sees it: this is where you add or remove a player by hand."

  - type: options
    title: "What you can do"
    items:
      - name: "Register a player by hand"
        text: >-
          For people who do not use the app or did not make it in time. In
          the box at the top of the page type whatever you know about them —
          their last name, first name or username: the candidates appear
          below as you type, each with «Enroll» on its row. Players who added
          their name to their profile show up with it, so you do not pick a
          namesake by mistake. You can do it even
          after registration has closed, until you start the competition: the
          deadline applies to players registering by themselves, not to you.
          The list keeps «registered by» with your name, and places and parity
          apply as for everyone.
      - name: "Register someone without an account"
        text: >-
          Type their name in the same search. Below the results, or in their
          place if nobody matches, you get **Create «First Last» as
          unregistered and enroll them**: the first word becomes the first
          name, the rest the last name, and you can correct them before
          tapping the button. The player is created
          already registered for the competition, with the «not registered»
          mark next to the name: they play and appear in the standings like
          everyone else, but get no notifications. Next time you find them in
          the search, without creating them again. When they sign up they
          can claim the player: see «Who claims a player you added» below.
      - name: "Remove an entrant"
        text: >-
          For people who say they cannot come. The player is notified, and if
          there is a waitlist the first in the queue takes their place. This
          too can be done after registration has closed, until the competition
          starts.
      - name: "Change the dates"
        text: >-
          Extend the closing time if entries are thin, or bring it forward if
          you are already full. If the deadline has passed without the
          minimum, the band at the top says so and offers «Extend
          registrations».
      - name: "Close early"
        text: >-
          **Close registrations** locks the list without waiting for the
          deadline. Useful when the group is complete and you want to begin.

  - type: shot
    shot: gara-iscrivi-non-registrato

  - type: heading
    id: lista_attesa
    title: "The waitlist"

  - type: text
    text: >-
      There are two different reasons for ending up on it, and it is worth not
      confusing them.

  - type: options
    items:
      - name: "The competition is full"
        text: >-
          You set a maximum number of entrants and it has been reached.
          Latecomers queue up, and if someone withdraws they get in
          automatically in order of arrival.
      - name: "Even-number requirement"
        text: >-
          You chose that the competition needs an even number of players.
          Whoever registers and makes the count odd waits until another person
          arrives: then two get in together. See [When the number of players is
          odd](/aiuto/approfondimenti/numero_dispari).

  - type: note
    tone: info
    text: >-
      If both constraints are active, the app checks parity first and the
      maximum second.

  - type: heading
    id: riconferma
    title: "If you change the date, venue or fee"
  - type: text
    text: >-
      The entrants receive a notification, and if the change may affect their
      decision to take part — the date, the time by more than an hour, the
      venue, a higher fee — the app asks them whether they are still in. In
      the list of entrants whoever has not answered shows **to reconfirm**,
      visible to everyone like the entry itself. Nobody is removed
      automatically: whoever does not answer stays entered, and you decide.
      If a player confirms to you in person, tap the icon next to their name:
      it stays on record that you did it. If you put the previous value back,
      the request disappears.

  - type: heading
    id: chiudere
    title: "Closing and starting"

  - type: text
    text: >-
      At closing time the list is final and is the one the draw will use. Check
      two things before starting the first round:

  - type: list
    items:
      - "**There are at least as many entrants as your minimum**, otherwise the app will not start the round."
      - "**Everyone really is there** in the venue: whoever is missing should be removed now, because removing them after the start means replaying the round."

  - type: note
    tone: warning
    title: "Last-minute no-shows"
    text: >-
      A registered player who does not turn up is the most common problem of
      the evening. Remove them **before** starting the first round: a second's
      work. After the start, the only routes are cancelling the round and
      redrawing — or withdrawing them from their row under **Registered**: it
      counts as their forfeit, and their opponent wins by walkover.

  - type: note
    tone: info
    title: "In bracket competitions the button has a different name"
    text: >-
      With knockout and double elimination you find **Draw the bracket** in
      place of **Start the competition**, and there the list of entrants counts
      double: that one action creates everybody's path to the final, closes
      registrations and freezes the teams. A no-show removed a minute later
      costs you a bracket to redo. See [The bracket](/aiuto/giocare/tabellone).

  - type: heading
    id: riscatto
    title: "Who claims a player you added"

  - type: text
    text: >-
      When the person you registered without an account signs up, they find
      **«Is this you? Claim»** next to the name and ask to take over its
      matches. The request comes **to you**, since you added them and know
      them: you get a notification, and the **Claims** item appears in the
      menu while something is waiting.

  - type: steps
    items:
      - title: "Open the request"
        text: >-
          You see the claimant's username and email, and whether the email is
          already verified. Check that it really is the person you registered.
      - title: "Confirm or reject"
        text: >-
          **Confirm the claim**: the player's registrations, matches, standings
          and ELO move to their account, and this can't be undone. **Not them:
          reject**: the player stays as it was, and someone else can claim it.

  - type: shot
    shot: riscatto-richiesta

  - type: text
    text: >-
      Whoever asked for the claim can also **withdraw** the request, as long
      as you haven't decided. In that case you get a notice, the request shows
      as «withdrawn» and there is nothing left to decide.

  - type: text
    text: >-
      If the player has an **email** — for example one of those who were
      already there, with the address they signed up with — whoever reads that
      mailbox activates it on their own, without asking you: signing up with
      that address, or using «Forgotten your password?», they get a link to choose a
      username and password. If someone else had asked to claim the player in
      the meantime, that request closes as «rejected» and your «Decide» goes
      away: the right person has come forward.

  - type: note
    tone: info
    title: "Players that were already there"
    text: >-
      For a player who was there before this feature, and whom nobody is
      recorded as having added, the claim is confirmed by the director of
      **their first competition**: whoever enrolled them, or the only
      director of that competition. If there were several directors, the
      request goes to all of them and one decision is enough. If there is
      nobody, or the director has deleted their account, the administrator
      confirms it.

  - type: note
    tone: tip
    title: "If you don't answer"
    text: >-
      The administrator sees every pending request and can decide in your
      place if you don't. They don't get the notification for yours: they
      find them in their **Claims** page.

  - type: faq
    items:
      - q: "Can I reopen registrations after closing them?"
        a: "Yes, as long as the first round has not started: just set a closing date in the future again."
      - q: "An entrant has not paid the fee. Can I flag that?"
        a: "The app does not handle payments: the fee is information on the competition card. Takings are handled as they always have been."
      - q: "How do I register someone without a smartphone?"
        a: "Add them by hand from the competition page, in the registered players box. If they have no account, type first and last name in the search and tap «Create … as unregistered and enroll them»: you register them in one go."
      - q: "How many entrants do I need to start?"
        a: "The minimum you set when creating the competition, or in the «Open registrations» sheet, where you can change it together with the maximum. Below that threshold the start button stays off."

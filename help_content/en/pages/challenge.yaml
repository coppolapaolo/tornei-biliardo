title: "Challenges"
section: giocare
kind: approfondimento
audience: [giocatore]
minutes: 4
summary: "Skill drills you do on your own: for practice, for unlocking milestones, and — inside a competition — for settling tie-breaks."
screens: [challenge.today, challenge.challenge_catalog, challenge.challenge_detail, challenge.training_session,
  challenge.training_summary,
  challenge.start_attempt, challenge.attempt_detail, challenge.create_challenge,
  challenge.edit_challenge, challenge.duplicate_challenge, challenge.challenge_statistics, player.challenge_detail]
related: [disegnare_un_drill, progressi, numero_dispari, esami]

blocks:
  - type: text
    text: >-
      A challenge is a drill with fixed rules: a ball layout to pot, a shot to
      repeat, a target to reach in a set number of attempts. You play it **on
      your own**, and the outcome is a score.

  - type: heading
    id: catalogo
    title: "Where you start: «Today» and the catalogue"

  - type: text
    text: >-
      The **Challenges** section opens on **«Today»**: not a list, but the place
      to pick up from. At the top there is **«Pick up from here»**, the last
      drill you practised, with how it went and the **«Start»** button. Below
      you find **«For today»** — the suggestion of what to train, with the reason
      next to it — then your **favourites** and the **most tried**. The first
      time, when you have no history yet, you find an invitation to choose one
      instead. If you have set yourself a goal, its bar sits at the top: it is
      covered in [Your training](/aiuto/giocare/il_tuo_allenamento).

  - type: shot
    shot: esercizi-oggi
    caption: "«Today»: the session left half done, your goals, the last drill, «For today» and the most tried."

  - type: text
    text: >-
      **«Open the catalogue»** takes you to every drill. At the top, the
      **«Search for a drill»** box leaves on screen only the drills containing
      that word, in the title or in the instructions. Below, **All**, **Mine**
      and **Favourites**, and then the filters.

  - type: shot
    shot: challenge-catalogo
    caption: "The catalogue filtered by a skill: only the drills that train it are left."

  - type: options
    items:
      - name: "Skill"
        values: "Fundamentals · Shot · Cue ball · Position · Banks & kicks · Safety · Break"
        text: >-
          What the drill trains. It answers «what should I work on?».
        hint: esercizi.filtri
      - name: "Stroke"
        values: "stop · stun · follow · draw · side spin · power · bank · kick · jump · massé"
        text: >-
          Which stroke it is played with. The same draw serves a position drill
          and a safety drill: that is why it is a separate filter.
      - name: "Level"
        values: "1 to 5"
        text: >-
          How hard it is according to its author: 1 is for beginners.
      - name: "Rating"
        values: "3 and up · 4 and up"
        text: >-
          Only the drills that the people who tried them rated well.

  - type: text
    text: >-
      Tap an axis, then an entry: filters **add up** — Position, with draw,
      level 2. Tapping the selected entry again turns it off. Next to the count
      you choose the order: **most tried**, **rating**, **newest**.

  - type: note
    tone: info
    title: "If a filter finds almost nothing"
    text: >-
      Skill, stroke and level are written by the drill's author, and they are
      optional: a drill without them shows up only with no filters on. It is
      not an error, it is a drill still waiting to be described.

  - type: heading
    id: scheda
    title: "A drill's page"

  - type: text
    text: >-
      Tapping a card opens the drill's page. In the header you read who created
      it, the **rating** and **how many players tried it**: the two numbers go
      together, because a 4.8 from three people weighs less than a 4.5 from two
      hundred. Below the layout you find the labels — level, skills, strokes,
      how it is recorded — and **«How to do it»**.

  - type: shot
    shot: esercizio-scheda
    caption: "The drill's page: labels, instructions, your three numbers, the rating and your attempts."

  - type: list
    items:
      - "**Average**, **Last three** and **Best** are your numbers on that drill. «Last three» shows up once you have more than three attempts: it tells you whether you are improving."
      - "If the drill has **variants** — right and left, positions A and B — your results stay separate, one row per variant: the gap between the two sides is exactly what you want to know."
      - "**Your rating** is given by tapping a ball from **1 to 5**. You can rate a drill **after trying it at least once**; you can change the rating whenever you like, and tapping your ball again removes it."

  - type: note
    tone: info
    title: "Why a drill is called «Drill 7»"
    text: >-
      The title is optional. Whoever creates a drill can give it a name — and
      then that is what you read everywhere, in the catalogue, in exams and in
      competitions — or leave it blank, and then the drill takes its number:
      **Drill 7**.

  - type: heading
    id: allenarsi
    title: "Practising a drill"

  - type: text
    text: >-
      Practising means repeating: ten attempts in a row, not one at a time.
      That is why there is **a single screen**, where the layout and the
      instructions stay in front of you while you record one attempt after
      another, without ever changing page.

  - type: list
    title: "It is always made of three parts, from top to bottom"
    items:
      - "**The drill**: the layout and the instructions, so there is nothing to keep in your head."
      - "**How it is going**: the chart of today's attempts, one bar each, the last one highlighted and your average as a dashed line. Underneath, a sentence that says in words what the chart shows."
      - "**The controls**, docked at the bottom of the screen where your thumb is. They are the only part that changes from one drill to another: it depends on how the drill is recorded."

  - type: shot
    shot: allenamento-punteggio
    caption: "Practising a scored drill: the layout, today's attempts with the chart, and at the bottom «−», the figure, «+» and «Record the attempt»."

  - type: steps
    items:
      - title: "Pick a challenge"
        text: "Open its page and read the rules: how the balls are set up and how the score is counted."
      - title: "Tap «Practise this drill»"
        text: "It is the button at the bottom of the drill's page. If it is the drill you were already working on, «Start» on «Today» is enough."
      - title: "If there are variants, pick «which side»"
        text: "Right or left, A or B: your choice stays selected for every attempt you record. If you do not say, the attempt counts for the drill in general."
      - title: "Set the table up and play"
        text: "The layout and the instructions stay at the top, always visible."
      - title: "Record how it went"
        text: "On a pass-or-fail drill the two big buttons are enough: whichever you tap records the attempt straight away, with nothing to confirm. On a scored drill you set the number with «−» and «+», then tap «Record the attempt». The other two ways — shot by shot and with a draw — are recorded while you play, and are explained below."
      - title: "Tapped the wrong one? «Undo the last one»"
        text: "It removes the attempt you just recorded, at the bottom of the screen. It exists precisely because a single tap records: the mistake is fixed afterwards, not prevented beforehand."
      - title: "Try again as often as you like"
        text: "The attempt shows up straight away in today's list and the chart grows by one bar. The field resets itself: you are ready for the next one."
      - title: "When you have had enough, tap «I'm done»"
        text: "You go back to «Today», where the drill you just did waits at the top for next time. The attempts stay in your history."

  - type: note
    tone: info
    title: "«At this rate you finish on 14»"
    text: >-
      The sentence under the chart is not generic encouragement: it compares
      what you are doing now with your earlier attempts. It appears once there
      is enough to compare — not on the first attempt, and not without a
      history.

  - type: note
    tone: tip
    title: "Turn your phone sideways"
    text: >-
      On drills recorded with a total — scored, or pass or fail — landscape
      turns the screen into a single panel: the layout on one side, the buttons
      on the other, no scrolling. It is meant for the phone resting on the rail
      while you play. The **X** at the top left goes back to the normal screen
      without turning the phone upright again.

  - type: note
    tone: info
    text: >-
      Trying again costs you nothing: your **best result** is the one that
      stands. A bad attempt does not wipe out the good one before it.

  - type: heading
    id: colpo_per_colpo
    title: "Shot by shot: where the cue ball stopped"

  - type: text
    text: >-
      In some drills what matters is not only whether the ball goes in, but
      **where the cue ball stops**: two points six inches apart are two very
      different shots, and a single score does not say so. When a drill works
      that way, the attempt is recorded **one shot at a time** and you do not
      write the score: the shots give it.

  - type: shot
    shot: allenamento-colpo
    caption: "An attempt halfway through: the target with the resting points of the shots already played, the strip of shots, and «It did not go in» at the bottom."

  - type: steps
    items:
      - title: "Play the shot"
        text: "The layout is inside «Look at the layout again», folded away because the real table is in front of you and the space belongs to the cloth."
      - title: "If the ball went in, tap the cloth where the cue ball stopped"
        text: "The tap opens the close-up of the target. No need to aim with your finger: you adjust afterwards."
        shot: allenamento-ingrandimento
      - title: "Adjust, then confirm"
        text: "Drag the cue ball until it is where it really stopped; the two dashed lines project it onto the edges, because distance from the centre is hard to judge by eye. «Confirm» records the shot, «Whole table» goes back without recording anything."
      - title: "If it did not go in, «It did not go in · 0 points»"
        text: "The shot is worth zero and has no resting point: that is why it does not appear on the cloth."
      - title: "Watch the strip of shots"
        text: "One slot per shot with its points; a dash is a miss, and the grey slots are the shots still to play."
      - title: "When you have played them all, «Close the attempt»"
        text: "The button appears by itself after the last shot, and takes you to the end of the session."

  - type: options
    items:
      - name: "Undo the last shot"
        text: >-
          Removes the shot you just recorded, resting point included. Remove
          the only shot and the open attempt disappears.
        hint: allenamento.colpo
      - name: "Start over"
        text: >-
          Throws away the attempt in progress, shots included, and starts from
          zero: for when the table was set up wrong, not for replaying a shot
          that went badly.

  - type: note
    tone: info
    title: "Why two numbers and not one"
    text: >-
      While you play, above the controls you find **Pocketed** and
      **Position**. The first says how many balls went in; the second how close
      to the centre of the target the cue ball stopped. A single number would
      go down both for missing the ball and for misjudging the pace — that is,
      it would not say what to fix.

  - type: note
    tone: tip
    text: >-
      The open attempt waits for you: close the app halfway through the shots
      and you find it where you left it. Resuming is not starting over.

  - type: heading
    id: fine_sessione
    title: "End of session: the cloud of resting points"

  - type: text
    text: >-
      Once the attempt is closed, the app tells you how it went. The score
      first, and whether it is a personal best. Then the table with **all the
      resting points together**: the thing no score sums up, because you can
      see at a glance whether you always miss on the same side.

  - type: shot
    shot: allenamento-fine
    caption: "End of session: the score, the cloud of resting points with the sentence that reads it, the three numbers and the notes field."

  - type: list
    items:
      - "**You arrive long, short**: the cue ball stops beyond or short of the target. That is **pace** — how hard you hit it."
      - "**You arrive to the right, to the left**: it stops to one side. That is **aim**, or side — where you hit it."
      - "If the points are spread around the centre the sentence says just that: there is no recurring direction to fix, and inventing one would be advice given at random."

  - type: note
    tone: warning
    title: "The cloud does not read on its own"
    text: >-
      Only the **pocketed shots** appear on the table, because the others have
      no resting point. A tight cloud around the centre with «Pocketed» at 40%
      means you are accurate when the ball goes in, not that the attempt went
      well: the numbers next to it are read together with the picture.

  - type: text
    text: >-
      Below you find **Pocketed**, **Position** and the longest run of balls
      pocketed in a row, then every shot in order. At the bottom, the **notes
      of the session**: «table 4, slow cloth, new cue» explains a low score
      better than any statistic, but only if you write it now. They stay
      attached to that attempt. Finally **«Another 8 shots»** starts again with
      the same layout, **«I'm done»** goes back to «Today».

  - type: heading
    id: estrazione
    title: "With a draw: the app sets the task"

  - type: text
    text: >-
      In some drills part of the task is decided at the table, and has to be
      **random**: how many cushions to hit, which ball to go for. Without the
      app you would have to keep a random generator open in another tab. Here
      the app draws before every shot, and writes it out in words: **«3 or more
      cushions, ball 7»**.

  - type: shot
    shot: allenamento-estrazione
    caption: "A drill with a draw: the task just drawn, the scale of outcomes with what each one is worth, and the shots already played below."

  - type: steps
    items:
      - title: "«Draw the shot»"
        text: "The first draw opens the attempt: with these drills, starting means being told what to do."
      - title: "Play what you were given"
        text: "The task stays there until you record the shot: reloading the page does not change it, and it is not a way of drawing again until you like the result."
      - title: "Pick how it went"
        text: "Not a score to type, but a scale of outcomes **with a name** — missed, hit, pocketed — each worth its own points. Whoever created the drill decides what they are and what they are worth."
      - title: "The next task appears by itself"
        text: "As soon as you record, the next one is already there: whoever is playing should not have to ask for it. Not after the last shot, because there is nothing left to prepare."

  - type: note
    tone: info
    text: >-
      **«Undo the last shot»** puts the task you had back on the table: undoing
      corrects a wrong outcome, it does not draw again.

  - type: note
    tone: warning
    title: "Not in exams, not in competitions"
    text: >-
      A drill with a draw is for practising on your own. Two candidates would
      be given different tasks, so their attempts would not be comparable — and
      an exam certifies, a competition makes standings. Try to put one in an
      exam and the app refuses, and says so.

  - type: heading
    id: due_tipi
    title: "Four ways of counting"

  - type: text
    text: >-
      The way of counting belongs to **the drill**, it is not chosen by whoever
      practises: two attempts at the same drill must be comparable.

  - type: options
    items:
      - name: "Scored"
        values: "from 0 to N"
        text: >-
          It counts how much you did: ten shots, a point for each success. This
          is the type used for tie-breaks and for replacing an X by walkover,
          because it produces a comparable number.
      - name: "Maximum score"
        values: "optional"
        text: >-
          Whoever creates the drill can say how far you can get: the drill's
          page then reads «Scored · out of 15» and while practising you see
          «12 / 15» instead of a bare number. It can also be left empty, and
          rightly so for drills you repeat until you miss: there a maximum does
          not exist.
      - name: "Pass or fail"
        text: >-
          There is no score: either you do it or you do not. Fine for practice,
          not for deciding standings.
      - name: "Shot by shot"
        values: "needs a diagram with a target"
        text: >-
          Every shot has its outcome and, if the ball goes in, the point where
          the cue ball stopped. The score is the sum of the shots, and the
          maximum is not written down: it is the number of shots times the
          value of the centre of the target.
      - name: "With a draw"
        values: "needs the lists to draw from"
        text: >-
          The app draws the task before every shot and the outcome is picked
          from a scale of named entries. The maximum is the number of shots
          times the best outcome.
        hint: challenge.estrazione

  - type: heading
    id: in_gara
    title: "Challenges inside a competition"

  - type: text
    text: >-
      The director can put challenges into a competition. They serve two very
      different purposes.

  - type: options
    items:
      - name: "Instead of an X by walkover"
        text: >-
          When the number of players is odd, whoever is left without an
          opponent plays a challenge instead of sitting out: the score counts
          towards the round standings. It is fairer than awarding a win, and
          more fun than watching.
      - name: "As a tie-break"
        text: >-
          At the end of a competition, if two or more players are level in the
          positions that matter, it can be settled with a challenge: the best
          score finishes ahead.

  - type: note
    tone: warning
    title: "Inside a competition you go a different way"
    text: >-
      A competition challenge does not start from the catalogue: you find it on
      the competition page, with the «Try» button (or «Continue», if you have
      already begun), and the app shows you a confirmation page before you
      play. There the score counts towards the standings, and how many attempts
      you get is set by the director: next to the challenge you can see how
      many you have already used.

  - type: note
    tone: info
    title: "Spot Shot Rally"
    text: >-
      This is the challenge most often used for tie-breaks: a series of shots
      from a fixed position, with a score that accumulates. The highest total
      wins the tie-break.

  - type: heading
    id: crearle
    title: "Creating new ones, fixing them, duplicating them (directors)"

  - type: text
    text: >-
      A competition director can add drills to the catalogue. There is **one
      form**: it creates a new drill, fixes one of yours («Edit drill», on its
      page) and makes a copy of one («Duplicate»).

  - type: shot
    shot: challenge-nuova
    caption: "The drill form: title, how to do it, what it trains, with which stroke, level, how it is recorded, the layout."

  - type: options
    items:
      - name: "Title"
        values: "optional"
        text: >-
          The name the drill goes by everywhere. Without one, it takes its
          number — «Drill 12». It is worth writing: twenty drills that all start
          with «Set the balls…» cannot be told apart in the catalogue.
        hint: challenge.titolo
      - name: "How to do it"
        text: >-
          The instructions. **There is no length limit**: detailed rules can be
          written out in full, with no need to shorten them.
      - name: "What it trains"
        values: "up to three skills"
        text: >-
          This is how the catalogue lets people find the drill when they look
          for «something on position». Three at most: a drill that trains
          everything tells nothing to someone filtering. Once three are chosen,
          the others switch off.
        hint: challenge.abilita
      - name: "With which stroke"
        values: "none, one or more"
        text: >-
          The strokes it is played with. As many as needed, even none.
        hint: challenge.gesto
      - name: "Level"
        values: "1 to 5, optional"
        text: >-
          How hard you think it is. Tap the selected number again to leave it
          undeclared.
        hint: challenge.livello
      - name: "Family and step"
        values: "optional"
        text: >-
          For progressions: «stop shot» 1, 2, 3 — the same stroke, harder each
          time. You choose the family name.
      - name: "The cue ball"
        values: "replaced · stays where it is"
        text: >-
          Whether the cue ball goes back to its spot for every shot, or the next
          shot starts from where it stopped. It changes what the score measures.
      - name: "Variants"
        text: >-
          Right and left, positions A and B. **They are the same drill**, not
          another one: same layout, same rules, same rating. Whoever practises
          picks «which side» before shooting, and the results stay separate. A
          variant that already has attempts can be renamed, not removed.
      - name: "How it is recorded"
        values: "made or not · scored · shot by shot · with a draw"
        text: >-
          The four ways explained in «Four ways of counting», with the optional
          maximum score. **Shot by shot** only appears if the drill is drawn and
          the diagram has a target: without one a line says so, because it is
          the rings of the target that give the points.
        hint: challenge.punteggio_massimo
      - name: "Shots in an attempt"
        values: "shot by shot and with a draw"
        text: >-
          How many shots an attempt lasts. The maximum score is not written
          down: it is this number times the highest value — the centre of the
          target, or the best outcome on the scale.
        hint: challenge.colpi
      - name: "What the app draws"
        text: >-
          The lists to draw from, one per line, in the form
          `cushions: 1 cushion | 2 cushions | 3 or more cushions`. The lists are
          drawn together, and the task comes out already in words. From one to
          three lists.
        hint: challenge.estrazione
      - name: "How a shot is counted"
        text: >-
          The scale of outcomes, one per line, in the form `Pocketed = 4`, worst
          to best. From two to eight entries: they are the buttons whoever
          practises will see after every shot.

  - type: note
    tone: tip
    text: >-
      The picture is the part that matters: a description in words of where the
      balls go gets read differently by everyone. A photo of the table, set up,
      settles it.

  - type: note
    tone: warning
    title: "Only photos you have the rights to"
    text: >-
      Below the photo field the app reminds you: **upload only material you
      have the rights to**. The table you set up and photographed yourself is
      perfect; a figure taken from a book or from someone else's site is not.

  - type: heading
    id: modificare
    title: "Fixing a drill that already has attempts"

  - type: text
    text: >-
      A typo in the title, one more skill, a better photo: they are simply
      saved. But if you change **how it is recorded**, the **maximum score** or
      the **instructions** of a drill someone has already tried, the scores
      already written would be read under rules they were not played with. That
      is why, before saving, the app stops and asks.

  - type: shot
    shot: esercizio-ha-gia-prove
    caption: "«This drill already has attempts»: create a copy, edit anyway, or go back to the form."

  - type: options
    items:
      - name: "Create a copy and edit that one"
        text: >-
          A new drill is created with your changes, with no attempts and no
          ratings. The original stays as it was, with all its results. This is
          the recommended choice.
      - name: "Edit this one anyway"
        text: >-
          The changes apply to this drill: the recorded attempts stay, but from
          now on they are read under the new rules.
      - name: "Back to the form"
        text: >-
          Nothing happens: what you wrote is still there.

  - type: text
    text: >-
      **«Duplicate»**, on the drill's page, does the same thing on your own
      initiative: it opens the form already filled in — with a title ending in
      «(copy)», to be rewritten — and creates a new drill, yours. It is meant
      for families: the same layout with one ball moved, the easy version and
      the hard one. If the original is drawn, **«Create the copy and open the
      diagram»** takes you straight to the table with the balls already in
      place.

  - type: heading
    id: disegnare
    title: "If you have no photo"

  - type: text
    text: >-
      At the bottom of the form, in the **«The layout»** section, next to «Use
      a photo» there is the button **«Draw the drill»**: it opens an
      empty table where you place the balls and draw the shots, and the picture
      for the catalogue comes from the drawing. It is a competition director's
      feature, and it unlocks after thirty drills completed.

  - type: text
    text: >-
      How the drawing works, command by command, is explained in
      [Drawing a drill](/aiuto/giocare/disegnare_un_drill).

  - type: heading
    id: perche
    title: "What they are for, in practice"

  - type: list
    items:
      - "**Practising** a specific shot and measuring your progress over time."
      - "**Not sitting out** when an odd number leaves someone without an opponent."
      - "**Settling level finishes** without having to replay a whole match."
      - "**Unlocking milestones** and earning experience points (see [Your progress](/aiuto/account/progressi))."

  - type: faq
    items:
      - q: "I cannot see the Challenges section."
        a: "It is a feature that unlocks as you use the platform, like the Matches section. If it is not there yet, it will be."
      - q: "I cannot see «Draw the drill» on the creation form."
        a: "It is a competition director's command, and it unlocks after thirty drills completed. Until it shows up, a challenge is created by uploading the photo: that is the normal way, not a fallback."
      - q: "Can I repeat the same challenge?"
        a: "Yes, and that is exactly what the practice screen is for: you record one attempt after another without leaving. Inside a competition it is different: there the number of attempts is set by the director, and inside an exam it is set by whoever composed it — it can ask you for several attempts at the same drill, and the best one counts."
      - q: "What is the difference between a challenge and an exam?"
        a: "A challenge is a single drill. An exam is a sequence of several drills in order, and it can be certified by an examiner. See [Sitting an exam](/aiuto/giocare/esami)."
      - q: "Who checks that the score I claim is true?"
        a: "Outside competitions, nobody: it is practice, and your word counts. Inside a competition the director validates the results."
      - q: "Do challenges count towards the rating?"
        a: "No. The rating measures matches against opponents; challenges feed your personal statistics and progress."

title: "Challenges"
section: giocare
kind: approfondimento
audience: [giocatore]
minutes: 4
summary: "Skill drills you do on your own: for practice, for unlocking milestones, and — inside a competition — for settling tie-breaks."
screens: [challenge.challenge_catalog, challenge.challenge_detail, challenge.training_session,
  challenge.start_attempt, challenge.attempt_detail, challenge.create_challenge,
  challenge.edit_challenge, challenge.challenge_statistics, player.challenge_detail,
  challenge.diagram_builder, challenge.edit_diagram]
related: [progressi, numero_dispari, esami]

blocks:
  - type: text
    text: >-
      A challenge is a drill with fixed rules: a ball layout to pot, a shot to
      repeat, a target to reach in a set number of attempts. You play it **on
      your own**, and the outcome is a score.

  - type: heading
    id: catalogo
    title: "The catalogue"

  - type: text
    text: >-
      The **Challenges** section gathers every drill available, with its
      description, the picture of the layout and the scoring rules. You can
      keep some as favourites to find them quickly.

  - type: shot
    shot: challenge-catalogo
    caption: "The catalogue: each drill has its picture and scoring type."

  - type: heading
    id: allenarsi
    title: "Practising a drill"

  - type: text
    text: >-
      Practising means repeating: ten attempts in a row, not one at a time.
      That is why there is **a single screen**, where the picture of the layout
      and the instructions stay in front of you while you record one attempt
      after another, without ever changing page.

  - type: steps
    items:
      - title: "Pick a challenge"
        text: "Open its page and read the rules: how the balls are set up and how the score is counted."
      - title: "Tap «Try it»"
        text: "It is the button on the card in the catalogue. From the challenge page it reads «Practise this drill»."
      - title: "Set the table up and play"
        text: "The picture and the instructions stay at the top, always visible: nothing to keep in your head."
      - title: "Record how it went"
        text: "Use «−» and «+» to set the score, or pick «Passed» or «Not passed». Then tap «Record the attempt»."
      - title: "Try again as often as you like"
        text: "The attempt shows up straight away under «Your attempts», and «Attempts recorded» and «Your record» go up at the top. The field resets itself: you are ready for the next one."
      - title: "When you have had enough, tap «I'm done»"
        text: "You go back to the catalogue. The attempts stay in your history, and coming back to the challenge shows you the last ten."

  - type: note
    tone: info
    text: >-
      Trying again costs you nothing: your **best result** is the one that
      stands. A bad attempt does not wipe out the good one before it.

  - type: heading
    id: due_tipi
    title: "Two ways of counting"

  - type: options
    items:
      - name: "Scored"
        values: "from 0 to N"
        text: >-
          It counts how much you did: ten shots, a point for each success. This
          is the type used for tie-breaks and for replacing an X by walkover,
          because it produces a comparable number.
      - name: "Pass or fail"
        text: >-
          There is no score: either you do it or you do not. Fine for practice,
          not for deciding standings.

  - type: heading
    id: in_gara
    title: "Challenges inside a competition"

  - type: text
    text: >-
      The director can put challenges into a competition. They serve two very
      different purposes.

  - type: options
    items:
      - name: "Instead of an X by walkover"
        text: >-
          When the number of players is odd, whoever is left without an
          opponent plays a challenge instead of sitting out: the score counts
          towards the round standings. It is fairer than awarding a win, and
          more fun than watching.
      - name: "As a tie-break"
        text: >-
          At the end of a competition, if two or more players are level in the
          positions that matter, it can be settled with a challenge: the best
          score finishes ahead.

  - type: note
    tone: warning
    title: "Inside a competition you go a different way"
    text: >-
      A competition challenge does not start from the catalogue: you find it on
      the competition page, with the «Try» button (or «Continue», if you have
      already begun), and the app shows you a confirmation page before you
      play. There the score counts towards the standings, and how many attempts
      you get is set by the director: next to the challenge you can see how
      many you have already used.

  - type: note
    tone: info
    title: "Spot Shot Rally"
    text: >-
      This is the challenge most often used for tie-breaks: a series of shots
      from a fixed position, with a score that accumulates. The highest total
      wins the tie-break.

  - type: heading
    id: crearle
    title: "Creating new ones (directors)"

  - type: text
    text: >-
      A competition director can add challenges to the catalogue: description,
      a picture of the ball layout and the scoring type.

  - type: shot
    shot: challenge-nuova
    caption: "The form for creating a challenge."

  - type: note
    tone: tip
    text: >-
      The picture is the part that matters: a description in words of where the
      balls go gets interpreted differently by everyone. A photo of the table
      set up settles it — and if you have no photo, the drill can be drawn
      (below).

  - type: heading
    id: disegnare
    title: "Drawing the drill instead of photographing it"

  - type: text
    text: >-
      At the bottom of the photo box, on the **New challenge** form, there is
      the question **«No photo to hand?»** and the button **«Draw the drill»**:
      it opens an empty table where you place the balls and draw the shots. The
      picture for the catalogue comes from the drawing — there is nothing to
      upload.

  - type: note
    tone: warning
    title: "It is the alternative, not the recommended way"
    text: >-
      Anyone who has a photo goes on uploading it: the real table stays the
      clearest thing for whoever has to reproduce the layout. Drawing is for
      those without a photo, or for showing the shot itself and not only where
      the balls sit.

  - type: steps
    items:
      - title: "Tap «Draw the drill»"
        text: "It is at the bottom of the «Layout photo» box. It opens a page of its own: anything you had already typed on the form is not carried over, the instructions are written there."
      - title: "Place the balls"
        text: "Pick a ball in the tool panel, then tap the table. It snaps by itself to the grid, to the cushion and to the other balls."
      - title: "Draw the shot, if you need one"
        text: "«Shot» marks where the cue ball is struck and where you aim; «Free line» marks a path or an area. «Move» tidies up what is already on the table."
      - title: "Write the instructions"
        text: "Below the table, in «Instructions for whoever plays it»: the drawing shows the layout, not the rule. How the score is counted has to be written in words."
      - title: "Choose how it is scored"
        text: "«Scored» or «Passed or not passed»: the same two options as the ordinary form."
      - title: "Tap «Save the drill»"
        text: "It is the button at the foot of the page. The drill goes into the catalogue with the drawing as its picture, exactly as a photographed one. «Cancel» leaves without saving anything."

  - type: note
    tone: tip
    title: "The drawing is not downloadable"
    text: >-
      The builder produces no files: there is nothing to download and nothing
      to load back from disk. It does one thing, put the drill in the
      catalogue, and the only way is **«Save the drill»**. The drawing stays on
      the platform, and that is where you reopen it to fix something.

  - type: text
    text: >-
      A drawn drill can be reopened. On its page, whoever created it finds the
      **«Edit the drawing»** button: the balls come back on the table as you
      left them, you fix what needs fixing and tap «Save changes».

  - type: note
    tone: info
    text: >-
      The button shows up **only on drawn drills**. A drill born from a photo
      has no drawing to reopen, so it is not there.

  - type: note
    tone: info
    title: "It unlocks as you use it"
    text: >-
      «Draw the drill» appears to competition directors who have already
      **completed thirty drills**, like the other features that unlock through
      playing. The reason: a badly drawn drill is then played by everyone else,
      and to draw a good one it helps to have tried plenty.

  - type: heading
    id: perche
    title: "What they are for, in practice"

  - type: list
    items:
      - "**Practising** a specific shot and measuring your progress over time."
      - "**Not sitting out** when an odd number leaves someone without an opponent."
      - "**Settling level finishes** without having to replay a whole match."
      - "**Unlocking milestones** and earning experience points (see [Your progress](/aiuto/account/progressi))."

  - type: faq
    items:
      - q: "I cannot see the Challenges section."
        a: "It is a feature that unlocks as you use the platform, like the Matches section. If it is not there yet, it will be."
      - q: "I cannot see «Draw the drill» on the creation form."
        a: "It is a competition director's command, and it unlocks after thirty drills completed. Until it shows up, a challenge is created by uploading the photo: that is the normal way, not a fallback."
      - q: "Can I repeat the same challenge?"
        a: "Yes, and that is exactly what the practice screen is for: you record one attempt after another without leaving. Inside a competition it is different: there the number of attempts is set by the director, and inside an exam it is set by whoever composed it — it can ask you for several attempts at the same drill, and the best one counts."
      - q: "What is the difference between a challenge and an exam?"
        a: "A challenge is a single drill. An exam is a sequence of several drills in order, and it can be certified by an examiner. See [Sitting an exam](/aiuto/giocare/esami)."
      - q: "Who checks that the score I claim is true?"
        a: "Outside competitions, nobody: it is practice, and your word counts. Inside a competition the director validates the results."
      - q: "Do challenges count towards the rating?"
        a: "No. The rating measures matches against opponents; challenges feed your personal statistics and progress."

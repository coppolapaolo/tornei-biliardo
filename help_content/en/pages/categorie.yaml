title: "Categories"
section: organizzare
kind: approfondimento
audience: [direttore, giocatore]
minutes: 4
summary: "In handicap competitions, categories decide which matches count towards the rating; with a fee list they tell who pays what."
screens: [admin.competition.gara_detail, admin.competition.gara_impostazioni]
related: [opzioni_della_gara, gestire_le_iscrizioni, profilo_e_statistiche]

blocks:
  - type: text
    text: >-
      In a handicap competition players do not start level: the stronger one
      gives something away. A result obtained that way does not tell you how
      good the two players really are, which is why the app does not use it to
      update the rating.

  - type: text
    text: >-
      But in a competition open to several levels **most matches are played
      between equals**: two players of the same level give nothing away, and
      that result is worth exactly as much as one from an ordinary competition.
      Categories tell the two cases apart.

  - type: note
    tone: info
    title: "In one line"
    text: >-
      In a handicap competition the rating is updated **only** in matches
      between players of the same category.

  - type: heading
    id: quali
    title: "Which categories"

  - type: text
    text: >-
      You decide. In Italy the federation uses **C, B, A** and **N** for the
      national level, and many add **E** for beginners — but that is one
      organiser's choice, and elsewhere the names are different. The app
      imposes none: write the ones you use.

  - type: text
    text: >-
      Categories belong to the whole competition. If the competition is part of
      a championship, the list belongs to the championship: you write it once
      and it is ready for the second competition.

  - type: heading
    id: assegnare
    title: "Assigning them to entrants"

  - type: text
    text: >-
      There is no list to prepare beforehand. On the competition page, under
      each entrant, you will find the **Category** field: type the name and
      press Enter.

  - type: steps
    items:
      - title: "Type the first player's category"
        text: >-
          For example "B". The category is created right there: you do not need
          to have prepared it.
      - title: "Move on to the second"
        text: >-
          Now "B" is suggested as soon as you start typing. If the player is at
          another level, type a new name and that one joins the list too.
      - title: "Carry on to the last one"
        text: >-
          Each row saves itself, without reloading the page: the field turns
          green for a moment once it has saved.

  - type: note
    tone: tip
    title: "Capitals and spaces do not matter"
    text: >-
      "B", "b" and " B " are the same category: the app treats them as one, so
      a careless keystroke does not create a duplicate.

  - type: heading
    id: elenco
    title: "The list, and typos"

  - type: text
    text: >-
      The **Categories** row — on the competition page while you prepare it
      and while registrations are open, and in **Competition settings** — says
      how many categories there are and how many entrants still have none; the
      same number appears in the dark band, before «Start the competition».
      Tap it: the competition's list opens with **how many entrants** each one
      has. That is where a typo shows up: if "BB" has a single player while
      "B" has eight, "BB" is a slip. Tap the entry to rename it, delete it if
      nobody uses it, or take it out of future choices without deleting it.

  - type: text
    text: >-
      Once the competition is closed the row stays, with a grey tile: the list
      still opens, but only to read it.

  - type: heading
    id: quando
    title: "How long you can change them"

  - type: text
    text: >-
      Until the competition ends. Each match keeps the categories that applied
      when it was created: a category changed once play is under way applies to
      the matches of later rounds, and matches already played count for Elo as
      before. With the random strategy they close at the start, because every
      match already exists.

  - type: note
    tone: warning
    title: "The last useful warning"
    text: >-
      If you start the first round with somebody who has no category, the app
      tells you before going ahead. You can carry on anyway — you may not know a
      guest's level — but their matches will stay out of the rating.

  - type: heading
    id: listino
    title: "The fee list"

  - type: text
    text: >-
      If the fee depends on the category — «Serie A €30 · Serie B and C €20 ·
      Amateurs €15» — fill in **Fees by category** next to the entry fee, when
      you create or edit a single competition, or in the championship
      settings: the championship's fee list applies to all its competitions.
      Every entry you write becomes a category; removing an entry takes it off
      the fee list but does not delete it, because it may already be assigned.
      An entry's fee can also be changed from the list of categories.

  - type: text
    text: >-
      With a fee list, categories exist **even without handicap**: you assign
      them to the players as above, to know who pays what. In a competition
      without handicap they change nothing for the rating or the matches.

  - type: note
    tone: info
    title: "Information only"
    text: >-
      The fee list appears where the entry fee used to be: on the competition
      card, in the showcase, in the list of competitions and in the
      championship details, from the highest fee to the lowest. The app does
      not handle payments, and every change to the fee list stays in the
      history of the competition or championship.

  - type: heading
    id: giocatore
    title: "What the player sees"

  - type: text
    text: >-
      Their own category, next to their name in the entrant list. They cannot
      change it: only whoever runs the competition assigns it. If there is a
      fee list they see the whole list, not «their» fee: you give them the
      category, often at the venue.

  - type: faq
    items:
      - q: "I left somebody without a category: what happens?"
        a: "Their matches do not count towards the rating, just as before categories existed. \"I don't know\" is not the same as \"same level\": the app does not guess."
      - q: "Do categories change the score of a match?"
        a: "No. You apply the handicap at the table; the app neither adds nor removes racks. Categories only decide which matches count towards the rating."
      - q: "Do I have to reassign them for every competition in the championship?"
        a: "No: at the next competition each player's category comes back automatically. You only correct whoever has moved up or down in the meantime."
      - q: "What order do they appear in?"
        a: "In the list, alphabetical order: mind that the alphabet does not reflect strength, \"E\" comes before \"N\" even though it is the lowest level. In the fee list, from the highest fee to the lowest, alphabetical when the fee is the same."
      - q: "I noticed too late: the competition is already over."
        a: "It can be recovered, but not from here: it needs whoever administers the site, because making it count requires recalculating the rating."

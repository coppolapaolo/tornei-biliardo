# English index of the help mini-site.
#
# Mirrors the structure of `it/site.yaml`: same section ids, same page slugs.
# Keeping the slugs identical is what lets a reader switch language on any page
# and land on the same page rather than on the home of the guide.
#
# Terminology follows the app's own English interface, not a literal
# translation of the Italian: competition, championship, round, match, rack,
# distance, standings, venue, competition director, X by walkover.

title: "Tornei Biliardo — User Guide"
tagline: "How to play, how to organise"

intro: >-
  This guide explains, step by step and with screenshots of the app, everything
  you can do with Tornei Biliardo: register for a competition, keep score from
  your phone, follow the standings and — if you are the one organising —
  create competitions and championships. You do not need to be good with
  computers: every step is described in plain words and comes with a picture of
  what you will see on screen.

sections:
  - id: introduzione
    title: "Getting started"
    kicker: "The basics"
    icon: fa-compass
    summary: "What Tornei Biliardo is, how it is put together, and the first things to do after signing up."
    pages:
      - cosa_e
      - parole_da_sapere
      - chi_fa_cosa
      - primo_accesso

  - id: giocare
    title: "Playing"
    kicker: "For players"
    icon: fa-play
    summary: "Registering for a competition, keeping score during a match, following rounds and standings, and arranging friendly matches."
    pages:
      - iscriversi_a_una_gara
      - giocare_una_partita
      - seguire_la_gara
      - tabellone
      - partite_amichevoli
      - referto_tpa
      - sale_e_disponibilita
      - challenge
      - disegnare_un_drill
      - esami
      - playoff

  - id: organizzare
    title: "Organising"
    kicker: "For competition directors"
    icon: fa-clipboard-list
    summary: "Creating a competition or a championship, handling registrations, running the evening round by round, and fixing mistakes."
    pages:
      - fare_una_prova
      - creare_una_gara
      - creare_un_campionato
      - gestire_le_iscrizioni
      - far_conoscere_la_gara
      - condurre_la_gara
      - squadre
      - categorie
      - turni_su_misura
      - spareggi
      - opzioni_della_gara

  - id: approfondimenti
    title: "How it really works"
    kicker: "The rules behind the scenes"
    icon: fa-book
    summary: "The rules the app applies on its own: match formats, pairings, standings, odd numbers of players and tie-breaks."
    pages:
      - formati_di_gioco
      - abbinamenti
      - classifiche
      - numero_dispari

  - id: account
    title: "Your account"
    kicker: "Profile and data"
    icon: fa-user
    summary: "Profile, statistics, notifications, progress, roles you can ask for, and control over what others see about you."
    pages:

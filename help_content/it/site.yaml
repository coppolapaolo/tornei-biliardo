      - primo_accesso

  - id: giocare
    title: "Giocare"
    kicker: "Per i giocatori"
    icon: fa-play
    summary: "Iscriversi a una gara, segnare i punteggi durante la partita, seguire turni e classifiche, e organizzare partite amichevoli."
    pages:

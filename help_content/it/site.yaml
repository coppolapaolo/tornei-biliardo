# Indice del mini-sito di aiuto.
#
# L'ordine delle sezioni e delle pagine dentro ogni sezione e' l'ordine in cui
# compaiono nel sito e in cui si incatenano i pulsanti «precedente/successiva»:
# va letto come un percorso, non come un elenco alfabetico. Prima si spiega
# cos'e' l'app, poi come si gioca, poi come si organizza; il resto viene dopo.
#
# Una pagina che non compare qui non e' raggiungibile: `validate` lo segnala.

title: "Guida a Tornei Biliardo"
tagline: "Come si gioca, come si organizza"

intro: >-
  Qui trovi spiegato, passo per passo e con le schermate dell'app, tutto quello
  che si può fare con Tornei Biliardo: iscriversi a una gara, segnare i
  punteggi dal telefono, seguire le classifiche e — se organizzi tu — creare
  gare e campionati. Non serve essere pratici di computer: ogni passaggio è
  descritto con parole semplici e accompagnato dall'immagine di quello che
  vedrai sullo schermo.

sections:
  - id: introduzione
    title: "Per cominciare"
    kicker: "Le basi"
    icon: fa-compass
    summary: "Che cos'è Tornei Biliardo, come è fatto, e le prime cose da fare dopo esserti registrato."

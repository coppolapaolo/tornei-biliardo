title: "Il tabellone"
section: giocare
kind: approfondimento
audience: [tutti]
minutes: 4
summary: "Nelle gare a eliminazione il percorso si legge su un tabellone: chi vince sale, chi perde esce. Come leggerlo e cosa cambia col doppio KO."
screens: [admin.competition.gara_bracket]
related: [abbinamenti, seguire_la_gara, classifiche]

blocks:
  - type: text
    text: >-
      Le gare a **eliminazione diretta** e a **doppio KO** non hanno turni tutti
      uguali: hanno un percorso. Chi vince avanza, chi perde esce (o scende nel
      tabellone dei ripescaggi). Quel percorso si guarda tutto insieme in una
      pagina sola.

  - type: shot
    shot: tabellone
    caption: "Il tabellone di una gara a eliminazione diretta: i quarti, con i vincitori in grassetto."

  - type: heading
    id: aprirlo
    title: "Dove si trova"

  - type: text
    text: >-
      Dalla pagina della gara, l'icona in alto a destra apre il tabellone. È
      **pubblico**: si può mandare il collegamento a chiunque, e si aggiorna da
      solo mentre si gioca.

  - type: shot
    shot: gara-tabellone-dettaglio
    caption: "Una gara a eliminazione: dalla sua pagina si passa al tabellone."

  - type: heading
    id: leggerlo
    title: "Come si legge"

  - type: options
    items:
      - name: "I nomi dei turni"
        text: >-
          Ottavi, quarti, semifinali, finale. Non li sceglie il direttore: li
          determina il numero di iscritti. Nel doppio KO i nomi sono altri,
          perché i tabelloni sono due: **Turno 1, 2, 3...** per i vincenti,
          **Recupero 1, 2, 3...** per i ripescaggi, poi **Finale** ed
          eventualmente **Bella**.
      - name: "Il grassetto"
        text: "Chi ha vinto quella partita, e quindi passa al turno successivo."
      - name: "I numeri a destra"
        text: "Il punteggio in triangoli della partita."
      - name: "Le caselle vuote"
        text: >-
          Partite non ancora giocate: si riempiono man mano che i turni
          precedenti si concludono.

  - type: note
    tone: tip
    title: "Su schermo largo si vede tutto insieme"
    text: >-
      Il tabellone dà il meglio in orizzontale: girando il telefono, o su un
      computer, si vede l'intero percorso invece di un turno alla volta. È la
      schermata da proiettare in sala, se avete uno schermo.

  - type: heading
    id: sorteggio
    title: "Il sorteggio"

  - type: text
    text: >-
      Un tabellone non si «avvia» come un turno: si **estrae**. Nel pannello
      Gestione il direttore trova il pulsante **Sorteggia il tabellone** (nelle
      gare a turni lo stesso posto dice «Avvia Primo Turno»), e l'app chiede
      conferma prima di procedere.

  - type: note
    tone: warning
    title: "Il sorteggio decide tutto in una volta"
    text: >-
      Con il sorteggio le iscrizioni si chiudono, le squadre si congelano e il
      percorso di ogni giocatore fino alla finale è fissato: chi incontrerebbe
      ai quarti, chi in semifinale, chi in finale. Si torna indietro solo
      annullando il sorteggio, che rifà tutti gli abbinamenti da capo.

  - type: heading
    id: quanti_turni
    title: "Quanti turni escono"

  - type: text
    text: >-
      Il tabellone si dimensiona sugli iscritti effettivi. Con 8 giocatori sono
      quarti, semifinali e finale: tre turni, sette partite. Con 16 se ne
      aggiunge uno.

  - type: text
    text: >-
      Per questo il numero di turni non si imposta alla creazione: lo fissa il
      sorteggio, su chi si presenta davvero. Prima di sorteggiare, nella scheda
      della gara il numero è marcato **(stima)**, calcolata sulla capienza
      massima dichiarata; dopo il sorteggio è quello definitivo. Con il doppio
      KO può ancora crescere di uno, se serve la Bella: qui sotto è spiegato
      quando.

  - type: text
    text: >-
      Se gli iscritti non sono una potenza di due (8, 16, 32) alcuni giocatori
      passano direttamente al secondo turno senza giocare il primo. È il
      comportamento normale di ogni tabellone e non richiede impostazioni: vedi
      [Quando i giocatori sono
      dispari](/aiuto/approfondimenti/numero_dispari).

  - type: heading
    id: terzo_posto
    title: "La finale per il terzo posto"

  - type: text
    text: >-
      Nell'eliminazione diretta il direttore può prevedere la **finalina** fra
      i due che hanno perso le semifinali. Non allunga la gara di un turno: si
      gioca insieme alla finale. Senza finalina restano terzi a pari merito
      tutti e due.

  - type: text
    text: >-
      Nel doppio KO pieno non serve, e infatti non viene nemmeno proposta: il
      terzo è chi perde la finale dei ripescaggi, ed è un risultato sul campo.
      Torna invece disponibile nel doppio KO **a gironi**, perché lì il
      tabellone finale è a eliminazione diretta e i due semifinalisti sconfitti
      sono di nuovo appaiati.

  - type: heading
    id: doppio_ko
    title: "Il doppio KO"

  - type: text
    text: >-
      Con il doppio KO i tabelloni sono due: quello dei **vincenti** e quello
      dei **ripescaggi**. Chi perde la prima partita non esce, scende nel
      secondo; chi perde di nuovo esce davvero. Alla fine il vincitore del
      tabellone dei ripescaggi affronta quello dei vincenti.

  - type: note
    tone: info
    title: "La Bella: un turno che a volte non si gioca"
    text: >-
      Chi arriva alla Finale dal tabellone dei vincenti non ha ancora perso
      nessuna partita, e il doppio KO promette a tutti due sconfitte prima di
      uscire. Perciò, **se la Finale la vince chi risale dai ripescaggi**, i
      due si rigiocano la partita da pari: è la **Bella**, e la gara ha un
      turno in più. Se invece la Finale la vince chi era ancora imbattuto, la
      gara finisce lì e la Bella non si gioca.

  - type: note
    tone: info
    title: "Con i gironi"
    text: >-
      Il doppio KO può anche essere organizzato in gironi paralleli che
      qualificano alcuni giocatori a un tabellone finale a eliminazione. È la
      formula più lunga fra quelle disponibili e ha senso su una giornata
      intera.

  - type: heading
    id: classifica
    title: "La classifica di una gara a tabellone"

  - type: text
    text: >-
      Non si conta per vittorie o per triangoli: la classifica **è** il percorso.
      Chi vince il torneo è primo, chi perde la finale secondo, e così via. In
      un campionato ogni posizione vale un certo numero di punti, che il
      direttore può configurare. Vedi [Come si calcolano le
      classifiche](/aiuto/approfondimenti/classifiche).

  - type: note
    tone: info
    title: "I pari merito qui non si spareggiano"
    text: >-
      Su un tabellone si esce a coppie: i due semifinalisti sconfitti sono
      entrambi terzi, i quattro quartifinalisti tutti quinti. Non è
      un'ambiguità da sciogliere, è quello che dice il percorso — e infatti nelle
      gare a tabellone lo spareggio non viene nemmeno proposto alla creazione.

  - type: faq
    items:
      - q: "Non vedo l'icona del tabellone."
        a: "La gara non usa una strategia a tabellone: con Amalfi, casuale o girone all'italiana non c'è un percorso da disegnare, e la vista non esiste."
      - q: "Il direttore ha premuto «Sorteggia il tabellone». Posso ancora cambiare la mia squadra?"
        a: "No. La squadra si sceglie iscrivendosi e resta cambiabile fino al sorteggio: da quel momento il tabellone è già stato costruito tenendo conto delle squadre, e cambiarle lo renderebbe incoerente."
      - q: "Ho perso al primo turno: la mia gara è finita?"
        a: "Con l'eliminazione diretta sì. Con il doppio KO no: scendi nel tabellone dei ripescaggi e puoi ancora risalire."
      - q: "Perché qualcuno non ha giocato il primo turno?"
        a: "Perché gli iscritti non erano una potenza di due: alcuni passano direttamente. Non è un favore, è l'unico modo di far quadrare il tabellone."
      - q: "Il tabellone si può cambiare dopo il sorteggio?"
        a: "Solo annullando il turno e risorteggiando, e solo da parte del direttore. Il sorteggio viene registrato e resta verificabile."

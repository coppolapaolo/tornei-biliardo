title: "Come vengono formate le coppie"
section: approfondimenti
kind: approfondimento
audience: [tutti]
minutes: 6
summary: "Cinque modi di abbinare i giocatori a ogni turno: Amalfi, casuale, girone all'italiana, eliminazione diretta e doppio KO. Quando usare quale."
related: [classifiche, numero_dispari, opzioni_della_gara]

blocks:
  - type: text
    text: >-
      A ogni turno bisogna decidere chi gioca contro chi. Farlo a caso è
      semplice ma ingiusto; farlo bene richiede di tenere conto della
      classifica e di chi si è già incontrato. L'app propone cinque metodi.

  - type: heading
    id: amalfi
    title: "Amalfi — il metodo consigliato"

  - type: text
    text: >-
      È pensato per le gare a turni di circolo, dove **tutti giocano tutti i
      turni** e nessuno viene eliminato. Il principio: al primo turno si
      sorteggia; dai turni successivi si parte dalla classifica e si abbina
      ciascun giocatore con chi sta a una certa distanza da lui in graduatoria.

  - type: text
    text: >-
      Quella distanza si accorcia col passare dei turni: **quanti turni mancano
      alla fine**. In una gara di tre turni, al secondo turno il salto è di due
      posizioni, all'ultimo di una. Il risultato è che all'inizio si affrontano
      giocatori lontani in classifica, e verso la fine i vicini: le partite che
      decidono il podio si giocano fra chi il podio se lo sta contendendo.

  - type: list
    title: "Cosa garantisce"
    items:
      - "**Tutti giocano ogni turno**: nessuna eliminazione."
      - "**Nessun reincontro**, se il vincolo è attivo e la cosa è matematicamente possibile."
      - "**Partite equilibrate verso la fine**, quando conta di più."

  - type: note
    tone: info
    title: "Se un reincontro è inevitabile"
    text: >-
      Con molti turni e pochi giocatori arriva il momento in cui tutti hanno
      già giocato contro tutti. L'app cerca la soluzione con meno reincontri
      possibile, ma non può inventare avversari nuovi.

  - type: heading
    id: casuale
    title: "Casuale"

  - type: text
    text: >-
      Le coppie sono sorteggiate, turno per turno, evitando i reincontri. Non
      tiene conto della classifica: può capitare che primo e secondo si
      incontrino al primo turno e mai più.

  - type: text
    text: >-
      Va bene per serate leggere, dove conta giocare più che stabilire una
      graduatoria attendibile. Con questa strategia l'app genera **tutti i
      turni in una volta** all'avvio, così il calendario della serata è noto
      da subito.

  - type: heading
    id: girone
    title: "Girone all'italiana"

  - type: text
    text: >-
      Tutti contro tutti: ogni giocatore incontra ogni altro esattamente una
      volta. È il metodo più equo in assoluto, e anche il più lungo.

  - type: note
    tone: warning
    title: "Attenzione al numero di partite"
    text: >-
      Con 6 giocatori sono 15 partite, con 8 sono 28, con 10 sono 45. Da otto
      persone in su serve una giornata intera o più tavoli di quanti se ne
      hanno di solito.

  - type: note
    tone: info
    title: "Con un numero dispari si riposa, e il riposo non vale"
    text: >-
      Con giocatori dispari a ogni turno uno **riposa**: lo vedi nel turno, ma
      non gli porta niente — né vittorie, né punti, né triangoli. Tutti
      riposano una volta, quindi nessuno ci guadagna. Se a girone in corso il
      direttore **esclude** un giocatore, chi doveva incontrarlo nei turni
      dopo **vince a tavolino**, con tutti i triangoli della distanza.

  - type: heading
    id: gironi
    title: "Il girone all'italiana a più gironi"

  - type: text
    text: >-
      Con tanti iscritti il girone unico diventa lungo. La voce **Gironi**
      del modulo dice quanti gironi si possono fare al massimo — «fino a 2»,
      per esempio — e all'avvio scegli quanti farne davvero, sugli iscritti
      presenti: ognuno gioca solo contro quelli del suo girone, e i gironi
      giocano in parallelo. Con 11 iscritti e «fino a 2» l'app propone due
      gironi, da 6 e da 5.

  - type: list
    title: "Le regole"
    items:
      - "Almeno **3 giocatori per girone**: con pochi iscritti il numero massimo scende da solo."
      - "La proposta è **un girone ogni sei iscritti**, e la puoi cambiare nel foglio di avvio."
      - "Le taglie differiscono al più di uno: il giocatore in più va ai primi gironi."
      - "I gironi si fissano all'avvio e **non cambiano più**, nemmeno con un ritiro. Annullando l'avvio si ricompongono."
      - "I turni della gara sono quelli del girone più numeroso: un girone che ha finito si ferma."
      - "In un campionato i gironi ci sono solo se è **a piazzamenti**: se il campionato somma vittorie, triangoli o punti le gare restano a girone unico, perché in un girone più numeroso si gioca una partita in più."

  - type: options
    items:
      - name: "Composizione dei gironi"
        values: "Sorteggio · Per ELO · Per categoria"
        text: >-
          Gli iscritti si mettono in fila in quest'ordine e vanno uno per
          girone a turno, andata e ritorno: con due gironi il primo va in A,
          il secondo e il terzo in B, il quarto e il quinto in A. Così i primi
          della fila finiscono in gironi diversi. **Per categoria** segue
          l'ordine del listino, e dentro la categoria l'ELO.
        hint: gara.composizione_gironi
      - name: "Compagni di squadra in gironi diversi"
        values: "predefinito no"
        text: >-
          Quando si può, la composizione mette i compagni di squadra in
          gironi diversi, senza cambiare l'equilibrio della fila.

  - type: note
    tone: info
    title: "La classifica della gara a gironi"
    text: >-
      Dentro ogni girone si ordina come al solito. Nella classifica della
      gara vengono prima tutti i **primi** dei gironi, poi tutti i secondi, e
      così via. Fra gironi di taglia diversa si confronta **per partita
      giocata** — vittorie, triangoli e punti divisi per le partite giocate —
      perché in un girone da 6 si gioca una partita in più che in uno da 5.

      Mentre si gioca, la pagina della gara e lo schermo in sala mostrano
      **una classifica per girone** («Girone A», «Girone B»), ognuna con il
      sistema e i criteri dei pari merito della gara; ogni partita dice il
      suo girone, e la tessera della gara ti dice dove sei nel tuo («Sei 2°
      su 6 nel girone B»). A gara conclusa compare la classifica della gara,
      con accanto a ogni nome la posizione nel girone («1º girone A»).

  - type: heading
    id: fase_finale
    title: "Dopo i gironi: il tabellone"

  - type: text
    text: >-
      Con più gironi la gara può finire con un **tabellone**: nel modulo,
      sotto i gironi, scegli **Fase finale → Tabellone**, quanti passano da
      ogni girone (**Qualificati per girone**, di norma 2), se giocare la
      **finale per il 3°/4° posto** e il **limite di tempo della fase
      finale**: come i gironi, senza limite o un limite diverso. Con due
      gironi e due qualificati si giocano le semifinali 1ºA–2ºB e 1ºB–2ºA,
      poi la finale.

  - type: list
    title: "Le regole"
    items:
      - "Il tabellone c'è solo con **più gironi**: con il girone unico la voce non compare."
      - "I turni del tabellone si contano già all'avvio: due gironi da 4 con due qualificati fanno 3 turni di girone più semifinali e finale. Il foglio di avvio li scrive su ogni voce."
      - "Se all'avvio scegli **un girone solo**, il tabellone **non si gioca**: la gara finisce col girone, e il foglio di avvio lo dice."
      - "Chi viene dallo stesso girone si incontra il più tardi possibile. Se i qualificati non riempiono il tabellone, i migliori primi passano il primo turno senza giocare."
      - "Con il tabellone si gioca **a chi arriva prima**, anche nei gironi: nel tabellone qualcuno deve passare il turno. «Esattamente N triangoli» non si può scegliere."
      - "La classifica finale: prima chi ha giocato il tabellone, nell'ordine in cui ne è uscito, poi gli altri nell'ordine dei gironi."
      - "In un campionato la fase finale la propone il campionato **a piazzamenti**; chi somma vittorie, triangoli o punti non ce l'ha."

  - type: text
    text: >-
      **Cosa si vede durante la gara.** Mentre si giocano i gironi ci sono le
      classifiche per girone. Finiti i gironi, accanto a ogni nome compare
      **al tabellone** o **fuori**, con una riga tratteggiata fra chi passa e
      chi no: se due giocatori sono pari al taglio e ne passa uno solo, lo
      decidono i criteri dei pari merito di turno, col sorteggio in fondo, e
      la riga lo mostra. Il comando del direttore diventa **Avvia le
      semifinali**. Da lì la pagina della gara, la pagina **Tabellone** e lo
      schermo in sala mostrano il tabellone, con sotto le classifiche dei
      gironi; a gara conclusa resta la classifica finale della serata.

  - type: heading
    id: eliminazione
    title: "Eliminazione diretta"

  - type: text
    text: >-
      Il tabellone classico: chi perde è fuori. Il numero di turni non si
      imposta — lo determina il numero di iscritti (8 giocatori: quarti,
      semifinali, finale). Si può aggiungere la **finale per il terzo posto**.

  - type: list
    items:
      - "Chi perde esce: metà dei partecipanti gioca una partita sola."
      - "La classifica è quella del tabellone e usa il sistema **Posizione**."
      - "Si può chiedere che i compagni della stessa squadra non si incontrino subito."
      - "Il primo turno non si «avvia»: si **sorteggia il tabellone**, e da lì il percorso di tutti è fissato."

  - type: heading
    id: doppio_ko
    title: "Doppio KO"

  - type: text
    text: >-
      Come l'eliminazione diretta, ma per uscire bisogna perdere **due** volte:
      chi perde la prima scende in un tabellone dei ripescaggi e può risalire.
      Più lungo, ma nessuno torna a casa dopo una sola sconfitta — un buon
      compromesso quando si ha tempo.

  - type: text
    text: >-
      È l'unico formato in cui due giocatori possono incontrarsi due volte: chi
      risale dai ripescaggi può ritrovarsi davanti chi lo aveva battuto. Non è
      un difetto degli abbinamenti, è come è fatto il doppio KO — e la
      costruzione dei ripescaggi allontana comunque quel ritorno il più
      possibile.

  - type: note
    tone: info
    title: "Sui tabelloni si scelgono meno cose"
    text: >-
      Con eliminazione diretta e doppio KO il modulo di creazione non chiede
      numero di turni, gestione forfait, giocatori dispari, evita reincontri,
      sistema di classifica, spareggio e numero esatto di triangoli: su un tabellone
      nessuna di quelle scelte avrebbe effetto. In cambio compaiono le opzioni
      che invece contano — separazione dei compagni di squadra, finalina per il
      terzo posto, fase a gironi. L'elenco completo è in [Tutte le
      opzioni](/aiuto/organizzare/opzioni_della_gara).

  - type: heading
    id: scegliere
    title: "Quale scegliere"

  - type: options
    items:
      - name: "Serata di circolo, 6-14 giocatori"
        values: "Amalfi"
        text: "Tutti giocano tutti i turni, la classifica ha senso, la serata sta nei tempi."
      - name: "Serata informale, si viene per giocare"
        values: "Casuale"
        text: "Nessuna pretesa di graduatoria attendibile, calendario noto da subito."
      - name: "Pochi giocatori, tanto tempo"
        values: "Girone all'italiana"
        text: "Fino a sei partecipanti resta gestibile ed è il più equo."
      - name: "Torneo con un vincitore, tempo limitato"
        values: "Eliminazione diretta"
        text: "Veloce e comprensibile, ma metà dei partecipanti gioca una partita sola."
      - name: "Torneo con un vincitore, seconda possibilità"
        values: "Doppio KO"
        text: "Più giusto dell'eliminazione secca, richiede circa il doppio del tempo."

  - type: heading
    id: primo_turno
    title: "Il primo turno è un caso a parte"

  - type: text
    text: >-
      Al primo turno non esiste ancora una classifica, quindi serve un altro
      criterio. Le tre possibilità:

  - type: options
    items:
      - name: "Casuale"
        values: "predefinito"
        text: "Sorteggio puro. Il sorteggio viene registrato e resta verificabile."
      - name: "Rating"
        text: >-
          Accoppia in base alla forza dichiarata dei giocatori, in modo che i
          più forti non si eliminino a vicenda subito. Tipico dei tabelloni a
          eliminazione, dove si chiama «teste di serie».
      - name: "Classifica"
        text: >-
          Usa la classifica generale del campionato: chi va meglio nel
          campionato parte da una posizione favorevole anche in questa gara.

  - type: faq
    items:
      - q: "Perché gioco sempre contro i più forti?"
        a: "Con Amalfi, se stai andando bene ti trovi ad affrontare chi va bene quanto te — soprattutto negli ultimi turni. È il metodo che funziona come previsto."
      - q: "Ho incontrato due volte lo stesso avversario."
        a: "Succede quando gli abbinamenti liberi sono finiti: con pochi giocatori e molti turni, a un certo punto tutti hanno giocato contro tutti. Nel doppio KO invece è previsto dal formato: chi risale dai ripescaggi può ritrovare chi lo aveva battuto."
      - q: "Nel torneo a eliminazione non trovo l'opzione «evita reincontri»."
        a: "Non c'è, e non servirebbe: chi perde esce, quindi due giocatori non possono incontrarsi due volte."
      - q: "Posso cambiare strategia a gara iniziata?"
        a: "No. Gli abbinamenti già fatti seguono la strategia scelta, e cambiarla in corsa produrrebbe una gara incoerente."
      - q: "Chi sceglie chi spacca?"
        a: "L'app non lo decide: mettetevi d'accordo al tavolo secondo le abitudini del circolo."

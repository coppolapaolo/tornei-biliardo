title: "Come si calcolano le classifiche"
section: approfondimenti
kind: approfondimento
audience: [tutti]
minutes: 5
summary: "Quattro modi di ordinare i giocatori — vittorie, triangoli, punti, posizione — e come si risolvono i pari merito."
related: [seguire_la_gara, abbinamenti, formati_di_gioco]

blocks:
  - type: text
    text: >-
      Ogni gara sceglie **un** sistema di classifica, deciso alla creazione e
      valido per tutta la gara. Cambia cosa viene premiato, e quindi come
      conviene giocare.

  - type: shot
    shot: gara-classifica
    caption: "Una classifica con il sistema «Vittorie»: le due colonne di destra sono le vittorie e la differenza triangoli."

  - type: heading
    id: vittorie
    title: "Vittorie — il sistema normale"

  - type: text
    text: >-
      Ordina per **partite vinte**. A parità di vittorie, conta la
      **differenza triangoli**: i triangoli vinti meno quelli persi in tutta la gara.

  - type: list
    title: "Un esempio"
    items:
      - "Marco: 3 vittorie, differenza +6 → **primo**"
      - "Elena: 2 vittorie, differenza +2 → **seconda**"
      - "Paolo: 2 vittorie, differenza +2 → **secondo a pari merito con Elena**"
      - "Davide: 1 vittoria, differenza -2 → **quarto**"

  - type: text
    text: >-
      È il sistema da usare quando conta vincere la partita: chi vince 4-3
      prende la stessa vittoria di chi vince 4-0, e il margine serve solo a
      separare chi è appaiato.

  - type: heading
    id: rack
    title: "Triangoli — ogni triangolo conta"

  - type: text
    text: >-
      Ordina per **triangoli totali vinti**, senza guardare chi ha vinto le partite.
      Chi perde 4-3 in tutte le partite può stare davanti a chi vince 4-0 in
      metà e perde 4-0 nelle altre.

  - type: note
    tone: warning
    title: "Va abbinato al numero esatto di triangoli"
    text: >-
      Con questo sistema le partite dovrebbero giocarsi fino in fondo (opzione
      **numero esatto di triangoli**). Altrimenti chi vince nettamente smette prima
      e accumula meno triangoli di chi vince a fatica: il conteggio premierebbe il
      contrario di quello che vuole premiare.

  - type: heading
    id: punti
    title: "Punti — vittoria, pareggio, sconfitta"

  - type: text
    text: >-
      Ogni partita dà i **punti del suo risultato**: di norma **3** la
      vittoria, **1** il pareggio, **0** la sconfitta. La classifica si
      ordina **solo sui punti**; a pari punti decidono i criteri dei pari
      merito, che partono come nel sistema a vittorie: differenza triangoli,
      poi spareggio o sorteggio.

  - type: list
    title: "Come vale ogni risultato"
    items:
      - "**Vittoria** e **sconfitta**: i punti che hai scelto per ciascuna."
      - "**Pareggio** — a numero esatto di triangoli pari (3-3 al 6), o una partita fermata a tempo sul pari — i punti del pareggio a tutti e due."
      - "**X a tavolino**: vale una vittoria, con zero differenza triangoli. Con l'esercizio al posto della X, la differenza è il punteggio della prova."
      - "**Partita a tre** con un vincitore: a lui la vittoria, agli altri due la sconfitta. Senza vincitore, chi è appaiato in testa prende il pareggio e il terzo, se staccato, la sconfitta (a 4-4-1: pareggio, pareggio, sconfitta). Chi si ritira prende la sconfitta."

  - type: text
    text: >-
      I punti si scelgono nel modulo della gara, alla voce **Punti in
      classifica**, che compare quando il sistema è **Punti**: numeri da 0 a
      99, con la vittoria che vale più della sconfitta e il pareggio in mezzo.
      In un campionato li propone il campionato e ogni gara li riceve quando
      nasce. Dopo l'avvio non si cambiano più. La classifica generale somma i
      punti delle gare, moltiplicati per il peso di ciascuna.

  - type: heading
    id: posizione
    title: "Posizione — per i tabelloni"

  - type: text
    text: >-
      È il sistema di eliminazione diretta e doppio KO: la classifica **è** il
      tabellone. Chi vince il torneo è primo, chi perde in finale secondo, e
      così via. Sui formati a tabellone non si sceglie nemmeno — è l'unico
      sistema possibile, e il campo sparisce dal modulo di creazione.

  - type: text
    text: >-
      Si esce a coppie, quindi molte posizioni sono **condivise**: i due
      semifinalisti sconfitti sono entrambi terzi, i quattro quartifinalisti
      tutti quinti. Non è un pari merito da sciogliere, è quello che dice il
      percorso.

  - type: text
    text: >-
      In un campionato ogni posizione vale un certo numero di punti, che si
      sommano fra le gare. La tabella di partenza è **25 punti al primo, 18 al
      secondo, 15 al terzo, 12 al quarto, 8 dal quinto all'ottavo e 4 dal nono
      al sedicesimo**, e il direttore può cambiarla campionato per campionato:
      vedi [Creare un campionato](/aiuto/organizzare/creare_un_campionato).
      Tutti quelli appaiati in una banda prendono lo stesso punteggio.

  - type: heading
    id: pari_merito
    title: "I pari merito"

  - type: text
    text: >-
      Capita spesso che due giocatori chiudano identici. Fra chi è pari decide
      una **catena di criteri**, applicati uno dopo l'altro: per esempio lo
      scontro diretto, poi la differenza triangoli, poi uno spareggio SSR fino
      al 3° posto. La catena la compone il direttore, e la frase che ne viene
      fuori («A pari vittorie conta …») si legge nella pagina della gara e nel
      suo regolamento. Come si compone: [Gli spareggi di fine
      gara](/aiuto/organizzare/spareggi).

  - type: options
    title: "Tre classifiche, tre catene"
    items:
      - name: "Classifica di turno"
        values: "di norma: differenza triangoli → posizione al turno precedente → sorteggio"
        text: >-
          Serve agli abbinamenti, quindi non lascia mai pari merito: finisce
          sempre col sorteggio. Lo spareggio SSR qui non c'è, si gioca a gara
          finita.
      - name: "Classifica finale della gara"
        values: "di norma: differenza triangoli → spareggio SSR fino al 3° posto"
        text: >-
          Chi resta pari dopo tutti i criteri condivide la posizione, e la
          successiva viene saltata (1, 2, 2, 4).
      - name: "Classifica generale del campionato"
        values: "di norma: differenza triangoli → SSR (somma) → posizione dopo la gara precedente → sorteggio"
        text: >-
          La sceglie il campionato, e non lascia pari merito: da lì partono gli
          inviti ai playoff.

  - type: note
    tone: info
    title: "Nelle gare a tabellone non si spareggia"
    text: >-
      Lì il pari merito per banda è il risultato voluto, non un'ambiguità:
      infatti la catena dei pari merito non viene nemmeno chiesta alla
      creazione. L'unica eccezione è la **finalina per il terzo posto**, che si
      può prevedere alla creazione e fa giocare il terzo posto ai due
      semifinalisti sconfitti.

  - type: heading
    id: quando_aggiorna
    title: "Quando si aggiorna"

  - type: text
    text: >-
      La classifica di una gara si ricalcola **alla fine di ogni turno**, non a
      ogni partita: serve che il turno sia completo perché il confronto sia
      fra situazioni omogenee. Per questo può restare ferma anche mentre si
      gioca.

  - type: text
    text: >-
      La classifica **del campionato** si aggiorna quando una gara si conclude,
      sommando i risultati di tutte le gare disputate. Chi salta una gara non
      viene penalizzato oltre al non aver guadagnato punti in quell'occasione.

  - type: text
    text: >-
      Ogni gara può avere un **peso**, e il suo punteggio viene moltiplicato
      per quel numero prima di entrare nella somma. Di norma il peso è 1 e
      tutte le gare valgono uguale. Il direttore può alzarlo — di solito
      sull'ultima prova, così nessuno vince il campionato con due gare di
      anticipo — e nell'elenco delle gare quelle che pesano di più lo
      dichiarano con un segno accanto al numero: ×2, ×3.

  - type: heading
    id: casi_particolari
    title: "Casi particolari"

  - type: options
    items:
      - name: "X a tavolino"
        text: >-
          Chi resta senza avversario riceve una vittoria e zero differenza
          triangoli: non viene né premiato né penalizzato rispetto a chi ha giocato.
      - name: "Forfait"
        text: >-
          Chi abbandona lascia all'avversario tutti i triangoli mancanti. Quei triangoli
          contano in classifica come qualsiasi altro.
      - name: "Partita in trio"
        text: >-
          Nel mini-girone a tre, vince chi fa più triangoli; se due arrivano pari,
          nessuno prende la vittoria e contano solo le differenze triangoli.
      - name: "Handicap"
        text: >-
          La classifica usa i punteggi **effettivi**, cioè quelli dopo
          l'handicap.

  - type: faq
    items:
      - q: "Ho più vittorie ma sono dietro."
        a: "Allora la gara usa il sistema «Triangoli», dove contano i triangoli totali e non le vittorie. Il sistema è indicato nella scheda della gara."
      - q: "Due giocatori hanno la stessa posizione."
        a: "Sono a pari merito in una posizione per cui non era previsto lo spareggio. È una scelta del direttore, non un errore."
      - q: "La classifica non si è aggiornata dopo la mia partita."
        a: "Si ricalcola quando tutte le partite del turno sono concluse."
      - q: "Come si somma la classifica del campionato?"
        a: "Sommando: vittorie e differenza triangoli con «Vittorie», triangoli totali con «Triangoli», punti-posizione con «Posizione». Se una gara ha un peso, il suo punteggio viene prima moltiplicato per quel numero."
      - q: "Nel campionato due giocatori hanno gli stessi numeri: chi sta davanti?"
        a: "Chi stava davanti dopo la gara precedente. Se erano pari anche lì, decide il sorteggio: è fisso, quindi la classifica non cambia a ogni lettura, e non dipende da chi si è iscritto prima."
      - q: "Durante la gara, a pari vittorie e pari differenza, chi sta davanti?"
        a: "Chi era davanti al turno prima, e al primo turno chi era davanti nell'ordine di partenza. Con il sistema «Triangoli» la differenza non conta: a pari triangoli vale subito il turno prima. Lo spareggio si gioca solo a fine gara."

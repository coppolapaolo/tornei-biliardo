title: "Gestire gli utenti e le richieste"
section: amministrare
kind: approfondimento
audience: [amministratore]
minutes: 5
summary: "L'elenco degli account, la scheda del singolo utente e le due code di richieste da evadere: direttore di gara e gestore di sala."
screens: [admin.user.users_list, admin.user.user_detail, admin.user.director_requests, admin.venue.venue_manager_requests]
related: [diventare_direttore, chi_fa_cosa]

blocks:
  - type: text
    text: >-
      L'amministratore è chi tiene in piedi la piattaforma. Il grosso del
      lavoro sono due cose: guardare l'elenco degli utenti quando qualcosa non
      torna, e rispondere alle richieste di ruolo.

  - type: shot
    shot: admin-dashboard
    caption: "La home dell'amministratore: lo stato generale della piattaforma a colpo d'occhio."

  - type: heading
    id: elenco
    title: "L'elenco degli utenti"

  - type: shot
    shot: admin-utenti
    caption: "Ogni riga è un account, con email, ruolo, rating e numero di iscrizioni."

  - type: text
    text: >-
      La ricerca in cima filtra per nome utente o email. Le due caselle
      **Unisci utenti** e **Tutti gli utenti** servono ai casi limite: la prima
      per fondere due account della stessa persona, la seconda per vedere anche
      quelli eliminati.

  - type: options
    title: "Cosa dice ogni riga"
    items:
      - name: "Ruolo"
        text: "Giocatore, direttore o amministratore. Il pulsante accanto lo cambia."
      - name: "Verificato"
        text: "Se l'utente ha confermato il proprio indirizzo email. Chi non lo ha fatto non può recuperare la password."
      - name: "Rating e statistiche"
        text: "Elo, iscrizioni e partite: utili per capire se un account è attivo davvero."
      - name: "Ultimo accesso"
        text: "Quando si è collegato l'ultima volta."

  - type: heading
    id: scheda
    title: "La scheda di un utente"

  - type: shot
    shot: admin-utente
    caption: "La scheda singola: dati, ruolo, iscrizioni e partite recenti."

  - type: text
    text: >-
      Aprendo un utente vedi tutto quello che ha fatto sulla piattaforma. Da
      qui puoi promuoverlo a direttore, retrocederlo, o attivare l'esenzione
      dalla gamification per gli account di servizio.

  - type: note
    tone: warning
    title: "Gli account non si cancellano davvero"
    text: >-
      L'eliminazione di un account è un'**anonimizzazione**: i dati personali
      spariscono, i risultati sportivi restano nelle classifiche senza nome.
      Cancellare fisicamente un utente lascerebbe buchi nelle partite di tutti
      quelli che ci hanno giocato contro.

  - type: heading
    id: richieste_direttore
    title: "Le richieste di diventare direttore"

  - type: shot
    shot: admin-richieste-direttore
    caption: "Le richieste in attesa: chi le ha inviate, quando, e i due pulsanti per rispondere."

  - type: text
    text: >-
      Un giocatore che vuole organizzare gare invia la richiesta dal proprio
      profilo. Arriva qui, e resta in attesa finché non rispondi. Chi la invia
      riceve una notifica con l'esito, quale che sia.

  - type: steps
    items:
      - title: "Guarda chi è"
        text: >-
          Il nome è un collegamento alla sua scheda: da quante gare ha giocato,
          da quanto è iscritto, se l'email è verificata.
      - title: "Accetta o rifiuta"
        text: >-
          Accettando, l'account passa a **direttore** e la volta successiva che
          entra trova i pulsanti per creare gare e campionati.
      - title: "Se cambi idea"
        text: >-
          Un direttore si può sempre retrocedere dalla sua scheda. Le gare che
          ha già creato restano, ma non potrà più crearne di nuove.

  - type: note
    tone: info
    title: "Non è una promozione, è un compito"
    text: >-
      Il direttore di gara non ha poteri sugli altri utenti né accesso ai dati
      della piattaforma: può solo organizzare le proprie gare. Accettare una
      richiesta è a basso rischio, e rifiutarla a qualcuno che si è offerto di
      organizzare costa più di quanto sembri.

  - type: heading
    id: richieste_gestore
    title: "Le richieste di gestire una sala"

  - type: shot
    shot: admin-richieste-gestore
    caption: "Le richieste per diventare gestore di una sala biliardo."

  - type: text
    text: >-
      Chi gestisce davvero un circolo può chiedere di curare la scheda della
      propria sala: indirizzo, tavoli, orari, contatti. È un ruolo che si
      aggiunge agli altri e non tocca le gare.

  - type: note
    tone: warning
    text: >-
      Questa è l'unica richiesta che conviene verificare **fuori dall'app**:
      chiunque può chiedere di gestire una sala qualsiasi. Una telefonata al
      circolo risolve il dubbio.

  - type: faq
    items:
      - q: "Posso creare un account al posto di qualcuno?"
        a: "No: la registrazione passa dalla verifica dell'email, che deve arrivare alla persona. Puoi però iscriverla a una gara una volta che l'account esiste."
      - q: "Un utente non riceve l'email di verifica."
        a: "Dalla sua scheda controlla che l'indirizzo sia scritto giusto. L'utente può chiedere un nuovo invio dal proprio profilo."
      - q: "Quanti amministratori servono?"
        a: "Uno o due. È un ruolo con accesso completo ai dati: più persone ce l'hanno, più superficie ha un eventuale problema."
      - q: "Posso togliere il ruolo di amministratore a qualcuno?"
        a: "Sì, dalla sua scheda, purché resti almeno un amministratore attivo."

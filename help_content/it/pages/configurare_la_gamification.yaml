title: "Configurare punti, obiettivi e traguardi"
section: amministrare
kind: approfondimento
audience: [amministratore]
minutes: 5
summary: "Quanto vale ogni azione, come si sale di livello, quali obiettivi sono attivi e quali funzioni si sbloccano con l'uso."
screens: [gamification.admin_dashboard, gamification.admin_quests, gamification.admin_config_dashboard, gamification.admin_features]
related: [progressi]

blocks:
  - type: text
    text: >-
      La parte di gioco della piattaforma — punti esperienza, livelli,
      traguardi, serie — è interamente configurabile. Funziona già senza
      toccare niente: questa pagina serve quando vuoi cambiare i pesi o
      aggiungere obiettivi tuoi.

  - type: shot
    shot: admin-gamification
    caption: "Il pannello: XP distribuiti, obiettivi attivi, traguardi esistenti e distribuzione dei livelli."

  - type: heading
    id: pannello
    title: "Leggere il pannello"

  - type: options
    items:
      - name: "XP distribuiti"
        text: "Quanti punti esperienza ha erogato la piattaforma in totale. Cresce da solo con l'uso."
      - name: "Obiettivi attivi"
        text: "Quanti obiettivi periodici sono in corso in questo momento."
      - name: "Traguardi"
        text: "Quanti ne esistono in catalogo, e quanti sono stati sbloccati almeno una volta."
      - name: "Distribuzione dei livelli"
        text: >-
          Quanti utenti per livello. È il numero da guardare per capire se la
          curva è tarata bene: se sono tutti al livello 1 la curva è troppo
          ripida, se sono tutti in cima è troppo piatta.
      - name: "Top 10 utenti XP"
        text: "Chi ha accumulato di più. Utile per accorgersi di conteggi anomali."

  - type: heading
    id: obiettivi
    title: "Gli obiettivi periodici"

  - type: shot
    shot: admin-gamification-obiettivi
    caption: "La gestione degli obiettivi: crearli, attivarli, farli scadere."

  - type: text
    text: >-
      Sono i compiti brevi che i giocatori vedono nella pagina dei progressi
      («gioca tre partite questa settimana»). Ne esistono due settimanali
      predefiniti; puoi crearne altri indicando cosa contare, quanto, in che
      arco di tempo e quanti punti dare.

  - type: options
    title: "Gli stati di un obiettivo"
    items:
      - name: "Attivo"
        text: "In corso: i giocatori lo vedono e i progressi si contano."
      - name: "Scaduto"
        text: "Chiuso: resta nello storico di chi lo ha completato, ma non accetta più progressi."
      - name: "Eliminato"
        text: "Rimosso dal catalogo. Da usare per gli obiettivi creati per errore, non per chiuderne uno in corso — per quello c'è «fai scadere»."

  - type: heading
    id: configurazione
    title: "Punti, livelli e serie"

  - type: shot
    shot: admin-gamification-config
    caption: "La configurazione: quanto vale ogni azione, la curva dei livelli, le regole delle serie."

  - type: options
    items:
      - name: "XP per azione"
        text: >-
          Quanti punti vale giocare una partita, vincerla, iscriversi a una
          gara, completare una challenge. Alzare un valore non ricalcola il
          passato: vale da lì in avanti.
      - name: "Curva dei livelli"
        text: >-
          Quanti punti servono per ogni livello. Il criterio è che i primi
          livelli arrivino in fretta — servono a far capire che il meccanismo
          esiste — e i successivi rallentino.
      - name: "Serie"
        text: >-
          Ogni quanto bisogna giocare per tenere viva una serie, e le
          ricompense alle soglie. Qui si concedono anche i **congelamenti**,
          che proteggono una serie da un'interruzione.

  - type: heading
    id: funzioni
    title: "Le funzioni che si sbloccano"

  - type: shot
    shot: admin-funzioni
    caption: "Le regole di sblocco: chi vede quale funzione, e a quali condizioni."

  - type: text
    text: >-
      Alcune parti dell'app compaiono solo dopo un po' di attività — le partite
      amichevoli, le challenge. Serve a non mettere davanti a chi entra la
      prima volta un menu con quindici voci di cui non ha bisogno.

  - type: text
    text: >-
      Ogni funzione ha una regola che può basarsi sul **ruolo** (i direttori la
      vedono comunque), sul **livello** raggiunto, o su una **misura**
      d'attività (numero di partite giocate). Prima di applicare una modifica
      puoi vedere l'anteprima di chi ne avrebbe accesso.

  - type: note
    tone: warning
    title: "Sbloccare è meglio che bloccare"
    text: >-
      Una funzione tolta a chi la usava già è un guasto dal punto di vista di
      quell'utente: la cerca dove l'ha sempre trovata e non c'è più. Prima di
      stringere una regola, guarda l'anteprima e conta quante persone la
      perderebbero.

  - type: note
    tone: info
    title: "Gli amministratori sono fuori"
    text: >-
      Gli account amministratore non hanno punti né livelli e non compaiono
      nelle classifiche: chi arbitra non gioca. Se vuoi provare la vista di un
      giocatore, ti serve un account giocatore.

  - type: faq
    items:
      - q: "Se cambio i punti di un'azione, i vecchi punteggi cambiano?"
        a: "No. La modifica vale per le azioni successive; lo storico resta com'è."
      - q: "Posso assegnare punti a mano?"
        a: "Sì, dalla gestione XP, e allo stesso modo si possono azzerare quelli di un utente. È da usare per riparare, non per premiare."
      - q: "Un traguardo si può togliere a chi lo ha sbloccato?"
        a: "Puoi nascondere un traguardo dal catalogo, ma quelli già ottenuti restano: sono la storia di quell'utente."
      - q: "Come faccio a spegnere del tutto la gamification?"
        a: "Non c'è un interruttore unico. Si può portare a zero l'XP delle azioni e far scadere gli obiettivi, ma livelli e traguardi restano visibili."

title: "Le parole da sapere"
section: introduzione
kind: riferimento
audience: [tutti]
minutes: 4
summary: "Campionato, gara, turno, partita, triangolo, distanza: sei parole che ricorrono ovunque nell'app, spiegate con un esempio concreto."
related: [cosa_e, formati_di_gioco]

blocks:
  - type: text
    text: >-
      L'app usa sempre le stesse sei parole. Impararle una volta rende chiaro
      tutto il resto, comprese le schermate che sembrano più fitte.

  - type: heading
    id: le_sei_parole
    title: "Le sei parole"

  - type: options
    items:
      - name: "Triangolo"
        values: "la singola partita al tavolo"
        text: >-
          Un triangolo è una giocata: si spaccano le bilie e si gioca finché uno dei
          due vince. È l'unità più piccola. Quando durante la partita premi il
          tasto con il nome di un giocatore, stai dicendo «questo triangolo l'ha
          vinto lui».
        hint: partita.rack
      - name: "Partita"
        values: "un giocatore contro un altro"
        text: >-
          Una partita è fatta di più triangoli. Finisce quando uno dei due arriva al
          numero di triangoli stabilito, che si chiama **distanza**.
      - name: "Distanza"
        values: "es. «Al 4»"
        text: >-
          Quanti triangoli servono per vincere la partita. «Al 4» significa che
          vince chi arriva per primo a 4 triangoli vinti: la partita può durare al
          massimo 7 triangoli (4-3). Non vuol dire «si giocano 4 triangoli».
        hint: gara.distanza
      - name: "Turno"
        values: "un giro di partite"
        text: >-
          In un turno tutti i giocatori iscritti giocano una partita, ciascuno
          contro un avversario diverso. Finito il turno, l'app aggiorna la
          classifica e forma le coppie del turno dopo.
        hint: gara.turni
      - name: "Gara"
        values: "la serata"
        text: >-
          Una gara è l'evento: una data, una sala, un elenco di iscritti e un
          certo numero di turni. Al termine dell'ultimo turno la gara ha la sua
          classifica finale.
      - name: "Campionato"
        values: "più gare in fila"
        text: >-
          Un campionato mette insieme più gare nell'arco di settimane o mesi.
          Ogni gara ha la sua classifica, e le classifiche si sommano in una
          classifica generale del campionato.

  - type: heading
    id: esempio
    title: "Un esempio dall'inizio alla fine"

  - type: text
    text: >-
      Il circolo organizza il **Campionato Sociale 2026**, fatto di sei
      **gare**, una al mese. Alla **gara** di marzo si iscrivono otto
      giocatori. La gara è di tre **turni**, disciplina palla 8, **distanza**
      al 4.

  - type: steps
    items:
      - title: "Primo turno"
        text: >-
          L'app forma quattro coppie a sorteggio. Ognuno gioca la sua
          **partita**: si va avanti a **triangoli** finché uno arriva a 4. Marco
          vince 4-2, quindi ha giocato 6 triangoli e ne ha vinti 4.
      - title: "Classifica dopo il primo turno"
        text: >-
          L'app conta le vittorie e la differenza triangoli di ognuno e stila la
          classifica provvisoria.
      - title: "Secondo e terzo turno"
        text: >-
          Le coppie del turno nuovo non sono a caso: nascono dalla classifica,
          e l'app evita che due giocatori si incontrino due volte. Come lo
          faccia è spiegato in [Come vengono formate le
          coppie](/aiuto/approfondimenti/abbinamenti).
      - title: "Fine della gara"
        text: >-
          Dopo l'ultimo turno esce la classifica finale della gara. I punti
          fatti si sommano a quelli delle altre gare nella classifica generale
          del campionato.

  - type: note
    tone: info
    title: "Gare senza campionato"
    text: >-
      Una gara può anche vivere da sola, senza appartenere a nessun
      campionato: si chiama **gara singola** e funziona esattamente allo stesso
      modo, solo che la sua classifica non si somma a nient'altro.

  - type: heading
    id: altre_parole
    title: "Altre parole che incontrerai"

  - type: options
    items:
      - name: "Direttore di gara"
        text: >-
          Chi organizza e conduce la gara: apre le iscrizioni, avvia i turni,
          corregge i risultati sbagliati. Vedi [Chi fa
          cosa](/aiuto/introduzione/chi_fa_cosa).
      - name: "X a tavolino"
        text: >-
          Quando i giocatori sono in numero dispari, uno resta senza avversario
          per quel turno: gli viene assegnata una vittoria «a tavolino», senza
          giocare. Vedi [Quando i giocatori sono
          dispari](/aiuto/approfondimenti/numero_dispari).
      - name: "Trio"
        text: >-
          L'alternativa all'X a tavolino: invece di lasciare uno fermo, tre
          giocatori giocano insieme un mini-girone.
      - name: "Forfait"
        text: >-
          Quando un giocatore abbandona una partita o non si presenta.
          L'avversario vince i triangoli che restano.
      - name: "Spareggio"
        text: >-
          La prova che decide chi sta davanti quando due giocatori chiudono la
          gara a pari merito.
      - name: "Lista d'attesa"
        text: >-
          Se la gara ha un numero massimo di iscritti e si riempie, chi arriva
          dopo entra in lista d'attesa ed entra automaticamente se qualcuno si
          ritira.
      - name: "Sfida individuale"
        text: >-
          Una partita fra due giocatori fuori da ogni gara. Nel menu si chiama
          **Sfide** (su computer «Sfide individuali»), nella tua home la
          sezione si chiama **«Sfide a due»**: è sempre la stessa cosa. Vedi
          [Partite amichevoli](/aiuto/giocare/partite_amichevoli).

title: "Chi fa cosa"
section: introduzione
kind: introduzione
audience: [tutti]
minutes: 3
summary: "Giocatore, direttore di gara e amministratore: chi può fare cosa, e come si diventa direttore."
screens: [dashboard.dashboard]
related: [primo_accesso, creare_una_gara]

blocks:
  - type: text
    text: >-
      Ogni account ha un ruolo, e il ruolo decide quali schermate vedi. Non è
      una gerarchia di importanza: è una divisione di compiti. La maggior parte
      delle persone resta **giocatore** per sempre, e va benissimo così.

  - type: text
    text: >-
      Con quale ruolo il sito ti sta trattando lo leggi in cima alla tua home:
      sotto il saluto — **«Ciao»** e il tuo nome — c'è scritto *Giocatore*,
      *Direttore di gara* o *Amministratore*. Chi non è entrato, e vede solo le
      pagine pubbliche, trova invece *vista pubblica*.

  - type: heading
    id: giocatore
    title: "Giocatore"

  - type: text
    text: >-
      È il ruolo con cui nasce ogni account nuovo. Un giocatore può iscriversi
      alle gare, giocare, segnare i propri punteggi, seguire classifiche e
      statistiche, proporre partite amichevoli e curare il proprio profilo.

  - type: list
    title: "Un giocatore può"
    items:
      - "Iscriversi e disiscriversi dalle gare con le iscrizioni aperte."
      - "Segnare i triangoli delle **proprie** partite (non di quelle altrui)."
      - "Vedere turni, avversari, classifiche e tabelloni."
      - "Proporre e giocare partite amichevoli fuori dalle gare."
      - "Modificare profilo, privacy ed email; scaricare i propri dati."

  - type: heading
    id: direttore
    title: "Direttore di gara"

  - type: text
    text: >-
      Il direttore di gara è chi organizza. Oltre a tutto ciò che fa un
      giocatore, può creare gare e campionati, aprire e chiudere le iscrizioni,
      avviare i turni, assegnare i tavoli e correggere i risultati sbagliati.

  - type: shot
    shot: dashboard-direttore
    caption: "La home di un direttore di gara: i pulsanti «Nuova Gara» e «Nuovo Campionato» che un giocatore non vede, e sotto il riquadro «Come vanno le tue gare»."

  - type: text
    text: >-
      La prima volta non serve rischiare su una serata vera: un direttore può
      creare una **competizione di prova**, che vede solo lui, riempirla di
      giocatori fittizi e condurla fino in fondo con i risultati simulati.
      Dentro la prova ogni schermata si presenta da sola, con una «?» accanto
      ai comandi. È spiegata in [Fare una prova](/aiuto/organizzare/fare_una_prova).

  - type: text
    text: >-
      Cambia anche il riquadro che accoglie all'ingresso, e **segue l'ultima
      cosa che hai fatto**: se hai appena creato una gara, o qualcuno si è
      appena iscritto a una delle tue, trovi **«Come vanno le tue gare»** —
      quante ne hai organizzate, quanti posti sono occupati sul totale
      disponibile e l'andamento delle iscrizioni gara per gara. Se invece
      l'ultima cosa è stata una **partita giocata**, trovi «Come stai andando»
      come un giocatore qualsiasi, con il tuo Elo: chi organizza gioca anche, e
      il riquadro racconta quello che stai facendo, non il ruolo che hai.

  - type: text
    text: >-
      Le **gare ancora da chiudere** non si perdono nel passaggio: qualunque
      dei due riquadri ti tocchi, accanto al titolo compare l'etichetta che
      le ricorda. È l'unica cosa lì dentro che ha una scadenza.

  - type: text
    text: >-
      Più sotto, in **«Le tue gare»**, ogni gara che dirigi porta scritto sul
      pulsante **il comando che sta aspettando** — «Apri le iscrizioni»,
      «Avvia il turno 3», «Termina la gara» — così sai quale gara aspetta te,
      e per fare cosa, senza aprirle una a una. Vedi [Condurre la
      gara](/aiuto/organizzare/condurre_la_gara).

  - type: text
    text: >-
      In basso c'è la striscia delle tue ultime gare, una tessera per gara, con
      gli iscritti sul totale dei posti. Il colore dice a colpo d'occhio come
      sta andando il riempimento — e le gare con le **iscrizioni ancora
      aperte** hanno un colore tutto loro, perché sono le uniche su cui puoi
      ancora fare qualcosa. Sotto, una riga traduce ogni colore in parole.
      È comunque solo un resoconto: dentro non c'è niente da premere. E come
      per il giocatore si vede una volta sola, al primo ingresso in home dopo
      l'accesso: poi lascia il posto alle gare da seguire, e torna al prossimo
      accesso.

  - type: note
    tone: warning
    title: "Chi dirige una gara non la gioca"
    text: >-
      Un direttore **non può iscriversi alle gare che dirige lui stesso**:
      sarebbe giudice e parte. Può però giocare tranquillamente le gare dirette
      da qualcun altro, dove è un giocatore come tutti.

  - type: text
    text: >-
      Una gara può avere più di un direttore. È utile per le serate lunghe:
      chi è al tavolo a giocare non può anche condurre la gara, e un
      co-direttore fa avanzare i turni al posto suo. Si aggiunge dalla sezione
      **Direttori di gara** del pannello Gestione, scegliendo fra i direttori
      **vicini alla sede della gara**: il co-direttore lo si chiama perché quella
      sera è in sala, non perché è iscritto alla piattaforma.

  - type: heading
    id: diventare_direttore
    title: "Come si diventa direttore"

  - type: steps
    items:
      - title: "Apri il tuo profilo"
        text: "Tocca l'iniziale del tuo nome in alto a destra, poi «Il mio profilo»."
        shot: profilo
      - title: "Chiedi il ruolo di direttore"
        text: >-
          Nel profilo trovi la richiesta di promozione a direttore di gara.
          Inviala: arriva a chi amministra la piattaforma.
      - title: "Aspetta la risposta"
        text: >-
          Quando la richiesta viene accolta ricevi una notifica, e la volta
          successiva che apri la home trovi i pulsanti per creare gare e
          campionati.

  - type: heading
    id: amministratore
    title: "Amministratore"

  - type: text
    text: >-
      L'amministratore è chi tiene in piedi la piattaforma: gestisce gli
      account, approva le richieste di direttore, sorveglia i dati e può
      intervenire su qualsiasi gara. È un ruolo tecnico, di norma affidato a
      una o due persone.

  - type: note
    tone: info
    text: >-
      Gli amministratori **non partecipano alla parte di gioco**: non hanno
      punti esperienza né livelli, e non compaiono nelle classifiche. Serve a
      tenere separato chi arbitra da chi gioca.

  - type: heading
    id: gestore_sala
    title: "Gestore di sala"

  - type: text
    text: >-
      C'è infine un ruolo secondario, che si aggiunge agli altri: il gestore di
      una sala biliardo, che può tenere aggiornata la scheda della sua sala
      (indirizzo, tavoli, orari). Si richiede dal profilo, come per il ruolo di
      direttore, e viene approvato da un amministratore.

  - type: heading
    id: beta_tester
    title: "Beta tester"

  - type: text
    text: >-
      Ogni tanto una funzione nuova viene fatta provare a poche persone prima
      di aprirla a tutti. Chi viene scelto riceve il ruolo di **beta tester** e
      trova nell'app qualche schermata che gli altri ancora non vedono. Non è
      un potere in più: dentro quelle schermate valgono le stesse regole di
      sempre, e le pagine di amministrazione restano fuori portata come per
      chiunque altro.

  - type: note
    tone: info
    text: >-
      Questo ruolo **non si chiede**: lo assegna chi amministra la piattaforma,
      e lo toglie quando la funzione viene aperta a tutti. Se ti arriva, lo
      scopri da una notifica.

  - type: faq
    items:
      - q: "Posso essere sia giocatore che direttore?"
        a: "Sì, ed è la situazione normale: il direttore è un giocatore con qualche potere in più. L'unico limite è che non può iscriversi alle gare che dirige."
      - q: "Ho chiesto di diventare direttore ma non è cambiato niente."
        a: "La richiesta deve essere approvata da un amministratore. Finché non lo è, il tuo account resta giocatore. Controlla le notifiche: la risposta arriva lì."
      - q: "Chi può correggere un risultato già inserito?"
        a: "Il direttore della gara. Un giocatore può annullare l'ultimo triangolo finché la partita è in corso, ma non può più intervenire dopo che il risultato è stato chiuso."
      - q: "Come divento beta tester?"
        a: "Non si può chiedere: è chi amministra la piattaforma a scegliere le persone a cui far provare in anticipo una funzione nuova. Se il ruolo ti viene assegnato lo trovi nelle notifiche."

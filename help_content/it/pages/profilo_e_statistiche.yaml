title: "Profilo e statistiche"
section: account
kind: approfondimento
audience: [giocatore]
minutes: 4
summary: "Cosa contiene il tuo profilo, come si legge il rating e dove ritrovare tutto quello che hai giocato: partite, gare, campionati, esercizi ed esami."
screens: [player.profile, player.history, player.edit_profile, player.dashboard,
  player.view_profile]
related: [privacy_e_dati, progressi]

blocks:
  - type: text
    text: >-
      Il profilo è la tua scheda: quello che gli altri vedono di te e quello
      che l'app ha registrato delle tue partite. Ci si arriva toccando
      l'iniziale del tuo nome in alto a destra.

  - type: shot
    shot: profilo
    caption: "Il profilo personale: dati, rating e statistiche delle partite giocate."

  - type: heading
    id: cosa_contiene
    title: "Cosa contiene"

  - type: options
    items:
      - name: "Nome utente"
        text: "Il nome con cui compari nelle classifiche. Resta quello scelto alla registrazione."
      - name: "Email"
        text: "Serve per il recupero della password e per le notifiche. Modificabile, con una nuova verifica."
      - name: "Città"
        text: "Facoltativa: serve solo a mostrarti per prime le gare vicine. Mai la posizione precisa."
      - name: "Squadra"
        text: >-
          Testo libero, lo scrivi tu. Serve agli organizzatori quando una gara
          usa i tabelloni e vuole evitare che i compagni si incontrino subito.
      - name: "Rating"
        text: "Una stima numerica della tua forza, calcolata dai risultati."
        hint: profilo.rating
      - name: "Statistiche"
        text: >-
          Campionati e gare giocate, vittorie, sconfitte, totale delle partite
          e percentuale di vittorie. Conta **tutto quello che hai giocato**,
          comprese le partite amichevoli.
      - name: "Runout"
        text: >-
          Quanti triangoli hai chiuso **in un solo turno**, cioè senza mai
          lasciare il tavolo all'avversario, e quanti di quelli li avevi anche
          aperti tu — i *break and run*. Compare solo se ne hai almeno uno.
        hint: profilo.runout

  - type: note
    tone: info
    title: "Da dove arrivano i runout"
    text: >-
      Da due posti che non si sovrappongono mai: i triangoli che hai marcato
      **premendo il trattino** sul tabellone durante la partita, e quelli che
      il [referto TPA](/aiuto/giocare/referto_tpa) riconosce da sé quando lo
      tieni. Il numero grande è il totale; i break and run sono la parte di
      quelli in cui avevi anche il tiro di apertura.

  - type: heading
    id: rating
    title: "Come leggere il rating"

  - type: text
    text: >-
      Il rating parte da un valore intermedio e si muove a ogni partita: sale
      quando vinci, scende quando perdi, e si muove **di più** quando il
      risultato è inatteso. Battere un avversario molto più forte fa guadagnare
      parecchio; perdere contro uno molto più debole fa perdere altrettanto.

  - type: text
    text: >-
      Nell'app il rating si chiama **Elo**, ed è il numero che vedi anche nel
      riquadro «Come stai andando», quello che ti accoglie in cima alla home
      quando entri, insieme a quanto è cambiato nelle ultime partite. Chi non
      ha ancora giocato parte da 1200.

  - type: note
    tone: info
    title: "Due rating, non uno"
    text: >-
      C'è un rating **competitivo**, che considera solo le gare ufficiali, e
      uno **globale**, che comprende anche le partite amichevoli. Ovunque
      compaia il rating puoi passare dall'uno all'altro con un tocco: la
      scelta viene ricordata su tutte le pagine.

  - type: text
    text: >-
      Nelle gare **con handicap** il rating si muove solo nelle partite fra
      giocatori della stessa [categoria](/aiuto/organizzare/categorie): lì nessuno concede
      nulla e il risultato dice davvero chi è più forte. Fra categorie diverse
      il punteggio è alterato per costruzione, e usarlo per misurare la forza
      dei giocatori la falserebbe.

  - type: heading
    id: partite_recenti
    title: "Le partite recenti"

  - type: text
    text: >-
      Scorrendo il profilo, dopo le statistiche e gli esercizi, trovi le
      **ultime dieci partite**, da qualunque parte vengano: quelle giocate in
      gara e quelle amichevoli, nello stesso elenco. Ogni riga si apre con
      l'esito — una coppa se hai vinto, una croce se hai perso — poi
      l'avversario e il punteggio.

  - type: text
    text: >-
      Sotto al nome, un'etichetta dice **da dove viene** quella partita:
      «Campionato», «Gara» oppure «Individuale» per le amichevoli. Accanto ci
      sono la competizione e la data. La freccia a destra apre la partita.

  - type: text
    text: >-
      Con **Tutte**, in alto a destra, si passa allo storico completo: lì le
      partite non si fermano alle ultime dieci e si possono filtrare.

  - type: heading
    id: storico
    title: "Lo storico"

  - type: shot
    shot: storico
    caption: "Lo storico: cinque linguette per partite, gare, campionati, esercizi ed esami."

  - type: text
    text: >-
      Lo storico raccoglie **tutto quello che hai giocato**, diviso in cinque
      linguette: partite, gare, campionati, esercizi ed esami. È il posto dove
      ritrovare una serata di mesi fa.

  - type: list
    title: "Le cinque linguette"
    items:
      - "**Partite** — tutte, comprese le sfide individuali. Ogni riga dice da dove viene: campionato, gara o individuale. Con «Provenienza» puoi tenerne una sola, e la torta lì sopra conta le partite che stai guardando, non tutte."
      - "**Gare** e **Campionati** — le competizioni a cui hai partecipato, con la posizione finale."
      - "**Esercizi** — le prove che hai registrato. Da qui si cancella una prova inserita per sbaglio, e scegliendo un esercizio a punteggio si vede l'andamento."
      - "**Esami** — quelli conclusi, con l'esito e, se certificato, chi te l'ha certificato."

  - type: note
    tone: tip
    title: "L'andamento di un esercizio"
    text: >-
      Nella linguetta **Esercizi**, l'icona del grafico accanto a una prova a
      punteggio apre l'andamento di quell'esercizio: i punteggi in ordine di
      tempo, con lo zero in basso e il massimo dell'esercizio in alto. Restringendo
      le date il grafico segue. Con una prova sola non si disegna niente: un punto
      non è un andamento.

  - type: note
    tone: warning
    title: "Cancellare una prova"
    text: >-
      Serve per il punteggio inserito sbagliato. Non toglie solo la riga: torna
      indietro anche l'XP che quella prova aveva pagato, e serie e traguardi si
      **ricalcolano**. Se altri esercizi li reggono comunque, non cambia niente
      — cancellarne una su cento non ti fa perdere la serie. Le prove giocate
      **in gara** non si cancellano: valgono in classifica.

  - type: text
    text: >-
      Quello che gli altri vedono del tuo profilo lo decidi tu: dalle
      impostazioni di privacy puoi spegnere le statistiche, le partite recenti,
      le classifiche, le statistiche degli esercizi o l'Elo. Si spengono a blocchi
      interi, non una partita alla volta, e le classifiche ufficiali non
      cambiano comunque. Vedi [Privacy e
      dati](/aiuto/account/privacy_e_dati).

  - type: heading
    id: profili_altrui
    title: "I profili degli altri"

  - type: text
    text: >-
      Toccando il nome di un giocatore in una classifica ne apri il profilo
      pubblico: vedrai quello che ha scelto di mostrare. Email, telefono e
      impostazioni personali non sono mai visibili ad altri.

  - type: heading
    id: modificare
    title: "Modificare il profilo"

  - type: steps
    items:
      - title: "Apri il profilo e tocca «Modifica»"
        text: "Da lì cambi email, città, squadra e le altre informazioni."
      - title: "Se cambi email, confermala"
        text: >-
          Riceverai un messaggio di verifica al nuovo indirizzo. Finché non lo
          confermi, il recupero password continua a passare dal vecchio.
      - title: "Per la password c'è una voce dedicata"
        text: >-
          Serve la password attuale: è la garanzia che sia davvero tu a
          cambiarla. Cambiandola, gli altri dispositivi dove sei entrato
          vengono disconnessi: dovrai rifare l'accesso con la password nuova.

  - type: faq
    items:
      - q: "Perché il mio rating è sceso anche se ho vinto?"
        a: "Non succede: vincere non fa mai scendere il rating. Se il numero sembra diverso, controlla di non aver cambiato modalità fra competitivo e globale."
      - q: "Posso cambiare nome utente?"
        a: "No: compare in classifiche già pubblicate, e cambiarlo renderebbe irriconoscibili i risultati passati."
      - q: "Le partite amichevoli compaiono nel profilo?"
        a: "Sì: nell'elenco delle partite recenti, con l'etichetta «Individuale», e nei conteggi delle partite giocate, vinte e perse. A tenerle fuori è solo il rating competitivo: per contarle serve quello globale."
      - q: "Chi vede il mio indirizzo email?"
        a: "Nessun altro giocatore. È conservato cifrato e serve solo alle comunicazioni dell'app."
      - q: "Ho chiesto il link per la password più volte: quale uso?"
        a: "L'ultimo arrivato. Ogni richiesta nuova annulla quelle precedenti, così un link vecchio finito nelle mani sbagliate non serve più a niente. Il link dura un giorno e vale una volta sola."
      - q: "Qualcuno è entrato nel mio account: cosa faccio?"
        a: "Cambia la password, dal profilo o con il recupero dalla pagina di accesso. Chi era entrato viene buttato fuori subito: gli accessi già aperti smettono di valere appena la password cambia."

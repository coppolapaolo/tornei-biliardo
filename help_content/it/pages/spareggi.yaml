title: "Gli spareggi di fine gara"
section: organizzare
kind: approfondimento
audience: [direttore]
minutes: 3
summary: "Quando due giocatori chiudono a pari merito nelle posizioni che contano: come si decide chi sta davanti, e come si conduce lo spareggio."
screens: [admin.competition.gara_detail, admin.competition.create_gara_standalone, admin.competition.edit_gara]
related: [classifiche, challenge, condurre_la_gara]

blocks:
  - type: text
    text: >-
      Finito l'ultimo turno può succedere che due giocatori abbiano le stesse
      vittorie e la stessa differenza triangoli. Se capita sul podio, qualcuno deve
      decidere.

  - type: heading
    id: decidere_prima
    title: "Si decide prima, non dopo"

  - type: text
    text: >-
      Alla creazione della gara si stabilisce **come** si sciogliono i pari
      merito, e **fino a che posizione** vale la pena giocare uno spareggio. Il
      valore proposto è il podio: sul quinto e sesto posto, di norma, nessuno
      litiga.

  - type: note
    tone: warning
    text: >-
      Deciderlo a fine serata, con i due interessati davanti, è la situazione
      da evitare: qualunque regola scegli in quel momento sembrerà scelta per
      favorire qualcuno. Stabilirla in anticipo la rende una regola del gioco.

  - type: heading
    id: catena
    title: "La catena dei pari merito"

  - type: text
    text: >-
      Nel modulo della gara, alla voce **Pari merito**, c'è un elenco di
      criteri in fila. In cima, col lucchetto, il criterio principale: le
      vittorie o i triangoli vinti, secondo il sistema di classifica. Sotto,
      i criteri che decidono fra chi è pari, uno dopo l'altro: se il primo non
      basta, si passa al secondo, e così via.

  - type: steps
    items:
      - title: "Sposta un criterio"
        text: >-
          Con le frecce su e giù lo porti prima o dopo gli altri. L'ordine è
          quello in cui vengono applicati.
      - title: "Togli o aggiungi"
        text: >-
          La × toglie un criterio. Sotto l'elenco ci sono quelli che puoi
          ancora aggiungere: tocca il nome per metterlo in fila.
      - title: "Leggi la frase"
        text: >-
          Sotto c'è la frase che finisce nel regolamento, per esempio «A pari
          vittorie conta lo scontro diretto, poi la differenza triangoli, poi
          lo spareggio SSR fino al 3° posto». Se la frase dice quello che
          volevi, la catena è giusta.

  - type: text
    text: >-
      Le catene sono due. Quella della **classifica di turno** ordina i
      giocatori dopo ogni turno, e da lì nascono gli abbinamenti: finisce
      sempre col sorteggio, perché due giocatori non possono restare alla pari
      quando si decide chi gioca con chi. Quella della **classifica finale**
      può lasciare dei pari merito: chi resta pari dopo tutti i criteri
      condivide la posizione.

  - type: heading
    id: come
    title: "I criteri"

  - type: options
    items:
      - name: "Scontri diretti"
        text: >-
          Conta come sono andate le partite fra i giocatori pari. Se due si
          sono affrontati sta davanti chi ha vinto (se si sono affrontati più
          volte, chi ha vinto più spesso). Chi si è battuto a vicenda in giro
          — A ha battuto B, B ha battuto C, C ha battuto A — resta pari, e
          decide il criterio dopo. Fra chi non si è incontrato decide il
          criterio dopo, senza mai rovesciare un risultato diretto.
      - name: "Differenza triangoli"
        text: "I triangoli vinti meno quelli persi."
      - name: "Triangoli vinti"
        text: "I triangoli vinti in tutto. Non c'è se è già il criterio principale."
      - name: "Vittorie"
        text: "Le partite vinte. Non c'è se è già il criterio principale."
      - name: "Spareggio SSR"
        values: "fino al 3° posto (si cambia con − e +)"
        text: >-
          Una prova di abilità con un punteggio, giocata a fine gara: chi fa
          meglio sta davanti. Vale solo fino al posto indicato, e solo nella
          classifica finale. Vedi [Gli esercizi](/aiuto/giocare/challenge).
      - name: "Posizione precedente"
        text: >-
          Sta davanti chi era davanti al turno prima. Nel primo turno conta
          l'ordine di partenza.
      - name: "Sorteggio"
        text: >-
          Sempre l'ultimo. È un sorteggio fisso, deciso all'avvio della gara:
          la classifica non cambia a ogni lettura.

  - type: heading
    id: condurlo
    title: "Condurre lo spareggio"

  - type: steps
    items:
      - title: "La gara resta in attesa"
        text: >-
          Finito l'ultimo turno, se ci sono pari merito da sciogliere la gara
          non si chiude: aspetta. La classifica mostra i giocatori appaiati.
      - title: "Avvia lo spareggio dalla fascia in cima"
        text: >-
          L'app propone i giocatori coinvolti. Sono quelli a pari merito nelle
          posizioni che avevi indicato, non tutti gli appaiati della gara.
      - title: "Fai giocare la prova e inserisci i punteggi"
        text: >-
          Il punteggio si inserisce come un normale risultato. Chi fa meglio
          sale.
      - title: "La gara si chiude"
        text: >-
          La classifica finale tiene conto dello spareggio, e se la gara fa
          parte di un campionato i punti vanno nella classifica generale.

  - type: note
    tone: info
    title: "Si può annullare"
    text: >-
      Uno spareggio avviato per errore si annulla dalla pagina della gara
      («Annulla lo spareggio», sotto i punteggi). Finché
      c'è uno spareggio attivo, però, i risultati della gara non sono
      modificabili: lo spareggio li dà per definitivi, e cambiarli sotto lo
      renderebbe insensato.

  - type: heading
    id: quando_non_serve
    title: "Quando non serve"

  - type: list
    items:
      - >-
        **Gare a tabellone**: l'opzione non viene nemmeno chiesta alla
        creazione. Lì i pari merito ci sono — i due semifinalisti sconfitti sono
        entrambi terzi, i quattro quartifinalisti tutti quinti — ma sono il
        risultato voluto, non un'ambiguità: il percorso è già la classifica. Se
        vuoi separare i due terzi, la strada è la **finalina per il 3°/4°
        posto**, da prevedere alla creazione.
      - "**Fuori dalle posizioni indicate**: i pari merito restano, due giocatori condividono la posizione e la successiva viene saltata."
      - "**Se la catena non ha lo spareggio SSR**: la classifica resta con i pari merito che gli altri criteri non sciolgono."

  - type: faq
    items:
      - q: "La gara non si chiude e non capisco perché."
        a: "Quasi sempre c'è uno spareggio in attesa: lo dice la fascia in cima alla pagina della gara. Se non vuoi giocarlo, si può annullare e la classifica resta a pari merito."
      - q: "Posso correggere un risultato mentre lo spareggio è attivo?"
        a: "No. Va prima annullato lo spareggio: certifica implicitamente i risultati della gara."
      - q: "Posso cambiare la catena a gara cominciata?"
        a: "Sì. Quella della classifica finale si cambia finché lo spareggio non è cominciato. Quella della classifica di turno vale dal turno successivo: le classifiche dei turni già cominciati restano com'erano. Il cambio resta nella storia della gara."
      - q: "Quanti giocatori possono essere in uno spareggio?"
        a: "Tutti quelli appaiati in quella posizione: capita che siano tre o quattro, non solo due."
      - q: "Serve un esercizio configurato?"
        a: "Per lo spareggio a punteggio sì, serve una prova da far giocare. Lo scontro diretto invece non richiede nulla."

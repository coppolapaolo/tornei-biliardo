title: "Condurre la gara turno per turno"
section: organizzare
kind: approfondimento
audience: [direttore]
minutes: 6
summary: "La serata dal vivo: avviare i turni, assegnare i tavoli, correggere i risultati sbagliati e chiudere la gara."
screens: [admin.competition.gara_detail, admin.competition.amalfi_classification, main.schermo_sala]
related: [gestire_le_iscrizioni, abbinamenti, numero_dispari]

blocks:
  - type: text
    text: >-
      Durante la serata il tuo lavoro si riduce a tre gesti: avviare il turno,
      guardare le partite che si concludono, avviare il turno dopo. Il resto lo
      fa l'app.

  - type: note
    tone: tip
    title: "La home ti dice cosa aspetta te"
    text: >-
      Non devi aprire le gare una a una per sapere quale è ferma. Nella tua
      home, sotto **«Le tue gare»**, ogni gara che dirigi porta scritto sul
      pulsante il comando che sta aspettando: **Apri le iscrizioni**, **Avvia
      la gara**, **Estendi le iscrizioni**, **Avvia il turno 3**, **Avvia lo
      spareggio**, **Termina la gara**. Il pulsante ti porta sulla pagina della
      gara, dove il comando si dà davvero. Se manca ancora qualcuno per
      partire, al posto del comando trovi **«Non ci sono ancora abbastanza
      iscritti»** con quanti ne servono.

  - type: shot
    shot: gara-gestione
    caption: "La pagina della gara vista dal direttore: in cima la striscia delle fasi, sotto la fascia scura che dice l'unica cosa da fare adesso — qui, avviare il turno successivo."

  - type: heading
    id: primo_turno
    title: "Avviare il primo turno"

  - type: steps
    items:
      - title: "Chiudi le iscrizioni"
        text: "Controlla che l'elenco corrisponda a chi è davvero in sala."
      - title: "Tocca «Avvia la gara»"
        text: >-
          L'app sorteggia le coppie e crea le partite. Tutti i giocatori
          ricevono una notifica con il nome dell'avversario. Nelle gare a
          tabellone lo stesso pulsante si chiama **Sorteggia il tabellone**:
          vedi il riquadro qui sotto.
      - title: "Assegna i tavoli"
        text: >-
          Se la sala ha i tavoli configurati, l'app li distribuisce alle prime
          partite; le altre restano in attesa e riceveranno un tavolo appena
          se ne libera uno.

  - type: note
    tone: tip
    title: "Se i giocatori sono dispari, scegli tu a chi va la X"
    text: >-
      Quando gli iscritti sono dispari e la gara gestisce il caso con l'X a
      tavolino (o con un esercizio al posto dell'X), toccando «Avvia Primo
      Turno» l'app ti chiede una cosa in più: se l'X deve andare **all'ultimo
      iscritto** oppure a sorteggio, come sempre. Serve quando l'ultimo
      arrivato è quello che ha completato il numero all'ultimo momento. Gli
      altri abbinamenti restano casuali in tutti e due i casi. La domanda non
      compare nelle gare con il trio, né quando i giocatori sono in numero
      pari: lì non c'è nessuna X da assegnare.

  - type: note
    tone: info
    title: "Il sorteggio è riproducibile"
    text: >-
      Il sorteggio del primo turno viene registrato: se qualcuno contesta
      l'abbinamento, è possibile ricostruire come è stato estratto. Annullare
      il primo turno cancella il sorteggio, e riavviarlo significa risorteggiare
      davvero.

  - type: note
    tone: warning
    title: "Nelle gare a tabellone il pulsante è «Sorteggia il tabellone»"
    text: >-
      Con eliminazione diretta e doppio KO non si avvia un turno: si estrae il
      tabellone, e quel gesto decide tutto in una volta. Le iscrizioni si
      chiudono, le squadre si congelano e il percorso di ogni giocatore fino
      alla finale è fissato. L'app te lo ricorda con una conferma prima di
      procedere. Il numero di turni, che alla creazione non hai impostato, viene
      deciso adesso sugli iscritti presenti: fino a questo momento la scheda
      della gara lo mostrava come **stima**. Vedi [Il
      tabellone](/aiuto/giocare/tabellone).

  - type: heading
    id: durante
    title: "Mentre si gioca"

  - type: text
    text: >-
      I giocatori segnano i propri triangoli dal telefono e tu vedi la pagina
      aggiornarsi da sola. Non devi fare niente, se non intervenire quando
      qualcosa non va.

  - type: options
    title: "Quello che puoi fare durante il turno"
    items:
      - name: "Segnare il punteggio al posto dei giocatori"
        text: >-
          Se un tavolo non ha lo smartphone, segni tu dalla card della
          partita: sotto ogni nome ci sono **−** e **+**, e il numero cambia
          appena tocchi. Alla distanza del turno il + si spegne e la card
          avvisa: **«Si chiude fra 3 s»**, con **Annulla** accanto. Se l'ultimo
          tocco era sbagliato lo annulli lì, o togli il triangolo con −. Passati
          i tre secondi la card dice **«Partita chiusa»**, il tavolo passa alla
          prima partita in attesa e la pagina si aggiorna.
      - name: "Validare un risultato"
        text: >-
          Una partita arrivata alla distanza dal segnapunti dei giocatori,
          ma senza la conferma di entrambi, compare in una card verde con
          «Valida il risultato». Se il punteggio non è quello, correggilo con
          − e + prima di validare: la card dice a chi passa il tavolo.
      - name: "Segnare un trio"
        text: >-
          La card del trio ha tre nomi, e sotto ognuno **+** e **−** per i
          triangoli che ha vinto. I triangoli si giocano in un ordine fisso —
          il primo fra il primo e il secondo giocatore, il secondo fra il primo
          e il terzo — quindi un + resta spento finché quel giocatore non può
          ancora aver vinto. Giocati tutti i triangoli, la partita si chiude:
          vince chi ne ha vinti di più, e se il punteggio più alto è di due
          giocatori nessuno vince la partita. Per correggere un trio già chiuso
          tocca **Correggi**, come per le partite a due: tre numeri, che insieme
          fanno i triangoli del trio.
        shot: gara-trio-card
      - name: "Segnare una partita a set"
        text: >-
          In alto ci sono i set vinti, sotto il set che si gioca con i suoi
          − e +. Alla distanza del set il set si chiude, e compare **Inizia il
          set** per il successivo; quando uno arriva ai set che servono, la
          partita si chiude da sola. Per correggere una partita a set già
          chiusa tocca **Correggi**: il foglio mostra un blocco per set con il
          suo punteggio, e puoi aggiungere o togliere un set. Set vinti e
          vincitore si ricalcolano dai set.
        shot: gara-set-card
      - name: "Convalidare l'esercizio al posto della X"
        text: >-
          Nelle gare con la X sostituita da un esercizio, la card di chi
          riposa ha un solo nome e il punteggio dell'esercizio, da zero alla
          distanza del turno. Se il giocatore l'ha già dichiarato la card è
          verde; altrimenti lo scrivi tu con − e +. Il punteggio conta solo
          dopo **Convalida**. Per azzerarlo, menu «⋯» e **Azzera la prova**.
          Finché non convalidi, il turno dopo non si avvia: quel punteggio fa
          parte della classifica su cui si formano le coppie.
        shot: gara-x-card
      - name: "Registrare gli esercizi fra i turni"
        text: >-
          Se la gara ha un esercizio dopo un turno, quando quel turno è
          concluso compare la sezione **«Esercizio dopo il turno N»**, con una
          riga per ogni giocatore: quanti tentativi ha fatto e il migliore.
          Fra un turno e l'altro la trovi sopra le partite, mentre si gioca
          sotto. Tocca la riga di chi ha appena tirato: se l'esercizio è a
          punteggio imposti il numero con − e + e tocchi **Registra il
          tentativo**; se conta solo riuscire, basta toccare **Riuscito** o
          **Non riuscito**. Se hai registrato un tentativo per sbaglio, tocca
          la riga: sotto trovi i tentativi già registrati, e **Togli il
          tentativo** lo cancella dopo averti chiesto conferma. Si può finché
          il turno dopo non è partito. Il turno dopo, invece, non parte finché
          ogni giocatore ancora in gara non ha almeno un tentativo; nelle gare
          a sorteggio casuale non aspetta nessuno.
        shot: gara-esercizio-turno
      - name: "Cambiare il tavolo a una partita"
        text: >-
          Tocca il tavolo sulla card: si apre il foglio con le tessere dei
          tavoli. Gli occupati mostrano chi ci sta giocando, il libero è
          evidenziato e si assegna con un tocco. Serve se un tavolo si guasta
          o due coppie si accordano diversamente.
      - name: "Registrare il ritiro di un giocatore"
        text: >-
          Dal menu «⋯» della partita scegli **Ritiro di …** accanto al nome di
          chi abbandona. Prima di confermare il foglio dice cosa succede:
          l'avversario vince a tavolino, le altre partite aperte di chi si
          ritira si chiudono allo stesso modo, e la regola della gara sui
          ritiri decide se resta negli abbinamenti, perdendo a tavolino, o se
          esce dalla gara. Nel trio i triangoli che gli restano vanno agli
          avversari, e la regola della gara vale allo stesso modo. Il giocatore
          riceve una notifica che dice chi l'ha ritirato e cosa comporta. Il
          comando c'è finché la partita è aperta e il turno dopo non è avviato.
        hint: partita.forfait
      - name: "Ritirare chi se ne va senza dirlo"
        text: >-
          Se un giocatore lascia la sala senza dichiarare il forfait, apri
          **Iscritti** in fondo alla pagina e tocca la bandierina sulla sua
          riga. Il foglio **Ritiro di … dalla gara** dice cosa succede prima di
          confermare: vale come se il forfait l'avesse dichiarato lui, con la
          stessa regola della gara sui ritiri, e le sue partite aperte si
          chiudono a tavolino. Il giocatore riceve una notifica che dice chi
          l'ha ritirato e cosa comporta. Prima dell'avvio, invece, un iscritto
          si toglie con il segno meno.
      - name: "Azzerare una partita sbagliata"
        text: >-
          Riporta il punteggio a zero mantenendo la stessa coppia, che rigioca.
          È la correzione da usare quando il risultato è stato inserito male.
        hint: gara.reset_partita

  - type: shot
    shot: gara-ritiro

  - type: text
    text: >-
      Accanto alle partite trovi la **classifica dopo l'ultimo turno chiuso**.
      La freccia vicino alla posizione dice se il giocatore è salito o sceso
      rispetto al turno prima; il trattino vuol dire che è rimasto dov'era,
      oppure che è il primo turno e non c'è ancora niente da confrontare. Le colonne
      seguono il sistema della gara: vinte e differenza triangoli, oppure
      triangoli vinti e persi.

  - type: note
    tone: info
    title: "Nelle gare a tabellone c'è il tabellone"
    text: >-
      Al posto della classifica trovi il **tabellone compatto**: il turno che
      si vede, quello prima e quello dopo, con le caselle vuote di chi ci
      arriverà. Ogni card dice dove va chi vince — «Chi vince: Semifinali
      contro chi vince Rossi – Bianchi» — e nel doppio KO dove scende chi
      perde. Chi passa il turno senza giocare ha la card «passa il turno».

  - type: shot
    shot: gara-tabellone-direttore
    variant: desktop
    caption: "Una gara a eliminazione vista dal direttore: i quarti sono chiusi, la fascia propone «Avvia le semifinali» e a destra c'è il tabellone compatto."

  - type: heading
    id: turni_successivi
    title: "Avviare i turni successivi"

  - type: text
    text: >-
      Il pulsante **Avvia il turno** compare nella fascia solo quando **tutte**
      le partite del turno in corso sono concluse. È un vincolo voluto: le
      coppie del turno nuovo nascono dalla classifica, e una classifica
      incompleta produrrebbe abbinamenti sbagliati. Per la stessa ragione il
      pulsante resta **spento** se manca ancora la convalida dell'esercizio al
      posto della X o un esercizio fra i turni da registrare: la fascia dice
      «Prima di avviare il turno N» e quante cose mancano. Nelle gare a
      sorteggio casuale i turni esistono già tutti, e nessuno di questi
      aspetta.

  - type: shot
    shot: gara-turno-bloccato

  - type: note
    tone: warning
    title: "Avviare un turno blocca quello precedente"
    text: >-
      Appena parte il turno nuovo, le partite del turno precedente diventano
      **Bloccate**: non sono più correggibili, perché gli abbinamenti appena
      creati si basano su quei risultati. Controlla i punteggi **prima** di
      premere.

  - type: text
    text: >-
      Nelle gare a tabellone il pulsante porta il nome del turno: **Avvia le
      semifinali**, **Avvia la finale**, e nel doppio KO, se serve, **Avvia la
      bella**. Gli incroci non vengono dalla classifica: li ha già fissati il
      sorteggio. Dal menu «⋯» del primo turno, finché nessuno ha segnato, puoi
      **annullare il sorteggio**.

  - type: heading
    id: correggere
    title: "Correggere un errore"

  - type: text
    text: >-
      Dipende da quando te ne accorgi. Le tre situazioni si risolvono in modo
      diverso.

  - type: options
    items:
      - name: "Il turno è ancora in corso"
        values: "facile"
        text: >-
          Se la partita è ancora aperta, sistemi il punteggio con − e + sulla
          card. Se è già chiusa, tocca **Correggi** sulla card: scrivi il
          punteggio giusto e, se vuoi, il perché. La correzione resta scritta
          sulla partita, così chi aveva visto il risultato di prima capisce
          cosa è cambiato. In alternativa, dal menu della card, **Azzera la
          partita**: la coppia resta la stessa e rigioca.
      - name: "Il turno è finito ma il successivo non è partito"
        values: "ancora facile"
        text: >-
          Le partite del turno sono righe: tocca la matita sulla riga e
          correggi. Finché non avvii il turno dopo, i risultati sono
          modificabili.
      - name: "Il turno successivo è già partito"
        values: "da valutare"
        text: >-
          Le partite sono bloccate. Per correggere devi **annullare il turno
          successivo**: le sue partite vengono eliminate e le coppie si
          liberano. Poi correggi, e riavvii. I giocatori del turno annullato
          dovranno rigiocare, quindi valuta se ne vale la pena.

  - type: text
    text: >-
      Trio e partite a set si correggono dallo stesso **Correggi**, con il
      foglio adatto: tre numeri per il trio, un blocco per ogni set per la
      partita a set.

  - type: shot
    shot: gara-trio-correggi

  - type: shot
    shot: gara-set-correggi

  - type: heading
    id: schermo_sala
    title: "Lo schermo in sala"

  - type: text
    text: >-
      Se la sala ha una TV o un proiettore, apri **Schermo in sala** dalla
      pagina della gara, sul computer collegato allo schermo. È una pagina
      pubblica e senza menu: in alto la locandina della gara, sotto i tavoli
      con i due giocatori e il punteggio in grande, a destra la classifica
      dopo l'ultimo turno chiuso e i risultati del turno prima. Si aggiorna
      da sola a ogni risultato: nessuno deve toccarla.

  - type: text
    text: >-
      Quando una partita finisce il suo tavolo torna libero, ma il punteggio
      resta nella casella, in tono più tenue, finché nessun altro va a
      giocarci. Se i tavoli sono pochi e quel tavolo serve subito, il
      risultato si sposta nell'elenco a destra, sopra il turno prima. La
      classifica invece non si muove fino alla fine del turno: nelle gare in
      formula Amalfi è lei a decidere gli abbinamenti del turno successivo, e
      aggiornarla a metà turno metterebbe avanti chi ha finito prima.

  - type: shot
    shot: schermo-sala
    variant: desktop
    caption: "Lo schermo in sala: la locandina, i tavoli con le partite in corso, quelli appena liberati con il punteggio della partita conclusa, la classifica e i risultati del turno."

  - type: note
    tone: tip
    title: "Nelle gare a tabellone"
    text: >-
      I tavoli restano uguali, con il nome del turno sopra ogni partita
      («Quarti», «Recupero 1»). A destra, al posto della classifica, c'è il
      **tabellone**: il turno che si gioca e quello dopo, con i posti ancora
      vuoti e chi li occuperà. Il tabellone intero non ci sta: da tre metri
      non si leggerebbe. Nel doppio KO i vincenti stanno sopra e i ripescati
      sotto, tutti e due insieme. A gara conclusa lo schermo mostra il podio
      e la classifica finale, con il turno in cui è uscito ciascuno.

  - type: note
    tone: info
    title: "Quando non c'è"
    text: >-
      Le gare di prova non hanno uno schermo in sala: da fuori non esistono.

  - type: heading
    id: dispari
    title: "Se i giocatori sono dispari"

  - type: text
    text: >-
      Non devi fare niente: l'app applica la regola che hai scelto alla
      creazione — X a tavolino, trio o esercizi — e la applica a un giocatore
      diverso ogni turno, così l'onere gira. Il funzionamento è spiegato in
      [Quando i giocatori sono
      dispari](/aiuto/approfondimenti/numero_dispari).

  - type: text
    text: >-
      Nelle gare a tabellone quella regola non si sceglie e non serve: chi
      avanza in numero dispari passa direttamente al turno successivo, e il
      tabellone si costruisce già così.

  - type: heading
    id: campionato
    title: "La gara dentro un campionato"

  - type: text
    text: >-
      Se la gara fa parte di un campionato, sopra la striscia delle fasi una
      riga dice quale gara è — «Gara 4 di 6 · Campionato Sociale 2026» — e la
      tocchi per tornare alla pagina del campionato. Accanto compare **×2**
      quando la gara pesa più delle altre, oppure **Playoff** quando è la
      gara dei playoff.

  - type: text
    text: >-
      La gara dei playoff **non ha iscrizioni**: i partecipanti sono chi ha
      accettato l'invito. Nasce in preparazione e la striscia salta la fase
      delle iscrizioni. La fascia dice quanti hanno accettato e offre subito
      **Avvia la gara**, spento con «Mancano 2 giocatori» finché non si
      arriva al minimo; sotto c'è l'elenco di chi è dentro. Chi accetta dopo
      entra da solo fino all'avvio; per aggiungere o togliere un qualificato
      usa la lista del playoff nella pagina del campionato. All'avvio gli
      inviti ancora senza risposta scadono. Se annulli l'avvio, la gara torna
      in preparazione.

  - type: text
    text: >-
      In preparazione, e sempre in **Impostazioni gara**, il gruppo **Dal
      campionato** raccoglie quello che la gara riceve dal campionato:

  - type: shot
    shot: gara-dal-campionato

  - type: options
    items:
      - name: "Peso nella classifica"
        text: >-
          Quante volte il punteggio della gara conta nella classifica del
          campionato. Se è la gara dei playoff e il campionato ha scelto che
          sia il playoff a decidere la classifica finale, il punteggio non si
          somma e la riga lo dice.
        hint: gara.peso
      - name: "Chi spacca"
        text: >-
          La regola di apertura. «Eredita» vuol dire che la gara usa quella
          scelta per tutto il campionato; se nella modifica della gara ne hai
          scelta un'altra, la riga lo dice.
      - name: "Date ammesse"
        text: >-
          Le gare di un campionato stanno in ordine: la gara 4 non può
          giocarsi prima della gara 3 né dopo la gara 5. La riga mostra fra
          quali date può stare, e la modifica della gara rifiuta una data
          fuori da lì.
      - name: "Pagina del campionato"
        text: "Porta alla classifica generale e alle altre gare."

  - type: heading
    id: chiudere
    title: "Chiudere la gara"

  - type: text
    text: >-
      Finito l'ultimo turno, la gara si conclude e la classifica diventa
      definitiva: al posto di «Avvia turno» compare il pulsante per terminarla.
      Fa eccezione il doppio KO, dove dopo la Finale può comparire un turno in
      più — la Bella, spiegata nella pagina del [tabellone](/aiuto/giocare/tabellone).
      Il pulsante resta **spento** finché l'ultimo turno ha ancora l'esercizio
      al posto della X da convalidare o un esercizio fra i turni da
      registrare: sono punteggi della classifica finale, e la fascia dice
      «Prima di chiudere la gara» con quante cose mancano. Vale anche per lo
      spareggio. Nelle gare a sorteggio casuale non aspetta niente.
      Due cose possono ancora accadere:

  - type: list
    items:
      - >-
        **Spareggi**: se ci sono pari merito nelle posizioni che hai deciso di
        spareggiare, la gara resta in attesa finché non li fai giocare. Puoi
        avviare lo spareggio dalla fascia in cima alla pagina della gara.
      - >-
        **Classifica del campionato**: se la gara ne fa parte, i risultati
        vengono sommati alla classifica generale, moltiplicati per il peso,
        non appena la gara è conclusa. La fascia lo dice prima che tu la
        chiuda: «la gara vale ×2 nella classifica del campionato». Se è il
        playoff a decidere la classifica finale, dice quello. Per una gara
        singola non parla di punti.

  - type: text
    text: >-
      Nelle gare a tabellone la classifica finale è **per bande** — 1°, 2°,
      3°–4°, 5°–8° — con dove ciascuno è uscito: chi esce allo stesso turno
      condivide il posto e i punti, senza spareggi.

  - type: faq
    items:
      - q: "Nella fascia non compare «Avvia il turno»."
        a: "Manca almeno una partita da concludere. Nella vista Turni, le partite ancora aperte sono quelle senza etichetta «Conclusa»."
      - q: "«Avvia il turno» c'è, ma è spento."
        a: "Le partite sono chiuse, ma il turno aspetta ancora qualcosa: la fascia dice cosa. Può essere l'esercizio al posto della X da convalidare, sulla card di chi riposa, o un esercizio fra i turni che qualcuno non ha ancora registrato, nella sezione «Esercizio dopo il turno»."
      - q: "Un giocatore se ne va a metà gara."
        a: "Tocca «⋯» sulla card della sua partita e scegli **Ritiro di …**: il foglio ti dice cosa succede prima di confermare. Per i turni successivi, la regola che hai scelto alla creazione decide se resta negli abbinamenti (perdendo a tavolino) o se ne esce. Nelle gare a tabellone non c'è nulla da scegliere: chi si ritira lascia passare l'avversario a tavolino, e il tabellone resta com'è. Se se n'è andato senza dirlo e non sta giocando, lo ritiri dalla sua riga negli **Iscritti**."
      - q: "Perché il mio torneo a eliminazione non dice «Avvia la gara»?"
        a: "Perché lì l'azione è un'altra: il pulsante dice «Sorteggia il tabellone». Estrarre il tabellone chiude le iscrizioni e fissa il percorso di tutti fino alla finale, quindi il nome dice quello che succede davvero."
      - q: "Posso dirigere la gara e giocarla?"
        a: "No: un direttore non può iscriversi alla gara che dirige. Se vuoi giocare, aggiungi un co-direttore che conduca la serata."
      - q: "Ho annullato il turno per sbaglio."
        a: "Riavvialo: l'app riformerà le coppie. Non saranno necessariamente le stesse di prima, perché l'abbinamento viene ricalcolato."
      - q: "Posso cambiare la distanza a metà gara?"
        a: "Il formato è congelato all'avvio. Se serve una distanza diversa per un turno specifico, va impostata prima della partenza, quando la gara è ancora in bozza."

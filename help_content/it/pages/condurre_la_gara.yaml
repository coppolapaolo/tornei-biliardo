title: "Condurre la gara turno per turno"
section: organizzare
kind: approfondimento
audience: [direttore]
minutes: 6
summary: "La serata dal vivo: avviare i turni, assegnare i tavoli, correggere i risultati sbagliati e chiudere la gara."
screens: [admin.competition.gara_detail, admin.competition.amalfi_classification]
related: [gestire_le_iscrizioni, abbinamenti, numero_dispari]

blocks:
  - type: text
    text: >-
      Durante la serata il tuo lavoro si riduce a tre gesti: avviare il turno,
      guardare le partite che si concludono, avviare il turno dopo. Il resto lo
      fa l'app.

  - type: note
    tone: tip
    title: "La home ti dice cosa aspetta te"
    text: >-
      Non devi aprire le gare una a una per sapere quale è ferma. Nella tua
      home, sotto **«Le tue gare»**, ogni gara che dirigi porta scritto sul
      pulsante il comando che sta aspettando: **Apri le iscrizioni**, **Avvia
      la gara**, **Estendi le iscrizioni**, **Avvia il turno 3**, **Avvia lo
      spareggio**, **Termina la gara**. Il pulsante ti porta sulla pagina della
      gara, dove il comando si dà davvero. Se manca ancora qualcuno per
      partire, al posto del comando trovi **«Non ci sono ancora abbastanza
      iscritti»** con quanti ne servono.

  - type: shot
    shot: gara-gestione
    caption: "La pagina della gara vista dal direttore: in cima la striscia delle fasi, sotto la fascia scura che dice l'unica cosa da fare adesso — qui, avviare il turno successivo."

  - type: heading
    id: primo_turno
    title: "Avviare il primo turno"

  - type: steps
    items:
      - title: "Chiudi le iscrizioni"
        text: "Controlla che l'elenco corrisponda a chi è davvero in sala."
      - title: "Tocca «Avvia la gara»"
        text: >-
          L'app sorteggia le coppie e crea le partite. Tutti i giocatori
          ricevono una notifica con il nome dell'avversario. Nelle gare a
          tabellone lo stesso pulsante si chiama **Sorteggia il tabellone**:
          vedi il riquadro qui sotto.
      - title: "Assegna i tavoli"
        text: >-
          Se la sala ha i tavoli configurati, l'app li distribuisce alle prime
          partite; le altre restano in attesa e riceveranno un tavolo appena
          se ne libera uno.

  - type: note
    tone: tip
    title: "Se i giocatori sono dispari, scegli tu a chi va la X"
    text: >-
      Quando gli iscritti sono dispari e la gara gestisce il caso con l'X a
      tavolino (o con un esercizio al posto dell'X), toccando «Avvia Primo
      Turno» l'app ti chiede una cosa in più: se l'X deve andare **all'ultimo
      iscritto** oppure a sorteggio, come sempre. Serve quando l'ultimo
      arrivato è quello che ha completato il numero all'ultimo momento. Gli
      altri abbinamenti restano casuali in tutti e due i casi. La domanda non
      compare nelle gare con il trio, né quando i giocatori sono in numero
      pari: lì non c'è nessuna X da assegnare.

  - type: note
    tone: info
    title: "Il sorteggio è riproducibile"
    text: >-
      Il sorteggio del primo turno viene registrato: se qualcuno contesta
      l'abbinamento, è possibile ricostruire come è stato estratto. Annullare
      il primo turno cancella il sorteggio, e riavviarlo significa risorteggiare
      davvero.

  - type: note
    tone: warning
    title: "Nelle gare a tabellone il pulsante è «Sorteggia il tabellone»"
    text: >-
      Con eliminazione diretta e doppio KO non si avvia un turno: si estrae il
      tabellone, e quel gesto decide tutto in una volta. Le iscrizioni si
      chiudono, le squadre si congelano e il percorso di ogni giocatore fino
      alla finale è fissato. L'app te lo ricorda con una conferma prima di
      procedere. Il numero di turni, che alla creazione non hai impostato, viene
      deciso adesso sugli iscritti presenti: fino a questo momento la scheda
      della gara lo mostrava come **stima**. Vedi [Il
      tabellone](/aiuto/giocare/tabellone).

  - type: heading
    id: durante
    title: "Mentre si gioca"

  - type: text
    text: >-
      I giocatori segnano i propri triangoli dal telefono e tu vedi la pagina
      aggiornarsi da sola. Non devi fare niente, se non intervenire quando
      qualcosa non va.

  - type: options
    title: "Quello che puoi fare durante il turno"
    items:
      - name: "Segnare il punteggio al posto dei giocatori"
        text: >-
          Se un tavolo non ha lo smartphone, segni tu dalla card della
          partita: sotto ogni nome ci sono **−** e **+**. Alla distanza del
          turno il + si spegne, la partita si chiude da sola e il tavolo passa
          alla prima partita in attesa.
      - name: "Validare un risultato"
        text: >-
          Una partita arrivata alla distanza dal segnapunti dei giocatori,
          ma senza la conferma di entrambi, compare in una card verde con
          «Valida il risultato». Se il punteggio non è quello, correggilo con
          − e + prima di validare: la card dice a chi passa il tavolo.
      - name: "Cambiare il tavolo a una partita"
        text: >-
          Tocca il tavolo sulla card: si apre il foglio con le tessere dei
          tavoli. Gli occupati mostrano chi ci sta giocando, il libero è
          evidenziato e si assegna con un tocco. Serve se un tavolo si guasta
          o due coppie si accordano diversamente.
      - name: "Registrare un forfait"
        text: >-
          Chi abbandona lascia all'avversario tutti i triangoli che mancano alla
          distanza.
        hint: partita.forfait
      - name: "Azzerare una partita sbagliata"
        text: >-
          Riporta il punteggio a zero mantenendo la stessa coppia, che rigioca.
          È la correzione da usare quando il risultato è stato inserito male.
        hint: gara.reset_partita

  - type: text
    text: >-
      Accanto alle partite trovi la **classifica dopo l'ultimo turno chiuso**.
      La freccia vicino alla posizione dice se il giocatore è salito o sceso
      rispetto al turno prima; il trattino, che è rimasto dov'era. Le colonne
      seguono il sistema della gara: vinte e differenza triangoli, oppure
      triangoli vinti e persi.

  - type: heading
    id: turni_successivi
    title: "Avviare i turni successivi"

  - type: text
    text: >-
      Il pulsante **Avvia il turno** compare nella fascia solo quando **tutte**
      le partite del turno in corso sono concluse. È un vincolo voluto: le
      coppie del turno nuovo nascono dalla classifica, e una classifica
      incompleta produrrebbe abbinamenti sbagliati.

  - type: note
    tone: warning
    title: "Avviare un turno blocca quello precedente"
    text: >-
      Appena parte il turno nuovo, le partite del turno precedente diventano
      **Bloccate**: non sono più correggibili, perché gli abbinamenti appena
      creati si basano su quei risultati. Controlla i punteggi **prima** di
      premere.

  - type: heading
    id: correggere
    title: "Correggere un errore"

  - type: text
    text: >-
      Dipende da quando te ne accorgi. Le tre situazioni si risolvono in modo
      diverso.

  - type: options
    items:
      - name: "Il turno è ancora in corso"
        values: "facile"
        text: >-
          Se la partita è ancora aperta, sistemi il punteggio con − e + sulla
          card. Se è già chiusa, tocca **Correggi** sulla card: scrivi il
          punteggio giusto e, se vuoi, il perché. La correzione resta scritta
          sulla partita, così chi aveva visto il risultato di prima capisce
          cosa è cambiato. In alternativa, dal menu della card, **Azzera la
          partita**: la coppia resta la stessa e rigioca.
      - name: "Il turno è finito ma il successivo non è partito"
        values: "ancora facile"
        text: >-
          Le partite del turno sono righe: tocca la matita sulla riga e
          correggi. Finché non avvii il turno dopo, i risultati sono
          modificabili.
      - name: "Il turno successivo è già partito"
        values: "da valutare"
        text: >-
          Le partite sono bloccate. Per correggere devi **annullare il turno
          successivo**: le sue partite vengono eliminate e le coppie si
          liberano. Poi correggi, e riavvii. I giocatori del turno annullato
          dovranno rigiocare, quindi valuta se ne vale la pena.

  - type: heading
    id: dispari
    title: "Se i giocatori sono dispari"

  - type: text
    text: >-
      Non devi fare niente: l'app applica la regola che hai scelto alla
      creazione — X a tavolino, trio o esercizi — e la applica a un giocatore
      diverso ogni turno, così l'onere gira. Il funzionamento è spiegato in
      [Quando i giocatori sono
      dispari](/aiuto/approfondimenti/numero_dispari).

  - type: text
    text: >-
      Nelle gare a tabellone quella regola non si sceglie e non serve: chi
      avanza in numero dispari passa direttamente al turno successivo, e il
      tabellone si costruisce già così.

  - type: heading
    id: chiudere
    title: "Chiudere la gara"

  - type: text
    text: >-
      Finito l'ultimo turno, la gara si conclude e la classifica diventa
      definitiva: al posto di «Avvia turno» compare il pulsante per terminarla.
      Fa eccezione il doppio KO, dove dopo la Finale può comparire un turno in
      più — la Bella, spiegata nella pagina del [tabellone](/aiuto/giocare/tabellone).
      Due cose possono ancora accadere:

  - type: list
    items:
      - >-
        **Spareggi**: se ci sono pari merito nelle posizioni che hai deciso di
        spareggiare, la gara resta in attesa finché non li fai giocare. Puoi
        avviare lo spareggio dalla fascia in cima alla pagina della gara.
      - >-
        **Classifica del campionato**: se la gara ne fa parte, i risultati
        vengono sommati alla classifica generale non appena la gara è conclusa.

  - type: faq
    items:
      - q: "Nella fascia non compare «Avvia il turno»."
        a: "Manca almeno una partita da concludere. Nella vista Turni, le partite ancora aperte sono quelle senza etichetta «Conclusa»."
      - q: "Un giocatore se ne va a metà gara."
        a: "Registra il forfait sulla partita in corso. Per i turni successivi, la regola che hai scelto alla creazione decide se resta negli abbinamenti (perdendo a tavolino) o se ne esce. Nelle gare a tabellone non c'è nulla da scegliere: chi si ritira lascia passare l'avversario a tavolino, e il tabellone resta com'è."
      - q: "Perché il mio torneo a eliminazione non dice «Avvia la gara»?"
        a: "Perché lì l'azione è un'altra: il pulsante dice «Sorteggia il tabellone». Estrarre il tabellone chiude le iscrizioni e fissa il percorso di tutti fino alla finale, quindi il nome dice quello che succede davvero."
      - q: "Posso dirigere la gara e giocarla?"
        a: "No: un direttore non può iscriversi alla gara che dirige. Se vuoi giocare, aggiungi un co-direttore che conduca la serata."
      - q: "Ho annullato il turno per sbaglio."
        a: "Riavvialo: l'app riformerà le coppie. Non saranno necessariamente le stesse di prima, perché l'abbinamento viene ricalcolato."
      - q: "Posso cambiare la distanza a metà gara?"
        a: "Il formato è congelato all'avvio. Se serve una distanza diversa per un turno specifico, va impostata prima della partenza, quando la gara è ancora in bozza."

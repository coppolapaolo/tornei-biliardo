title: "I playoff di fine campionato"
section: giocare
kind: approfondimento
audience: [giocatore]
minutes: 3
summary: "Le gare finali riservate ai migliori classificati: come ci si qualifica, come si accetta l'invito e cosa succede se si rifiuta."
screens: [player.playoff_invitation]
related: [creare_un_campionato, notifiche]

blocks:
  - type: text
    text: >-
      Un campionato può chiudersi con una o due gare speciali, aperte solo a chi
      si è piazzato bene nella classifica generale. Non ci si iscrive: ci si
      **qualifica**, e si riceve un invito.

  - type: heading
    id: qualificarsi
    title: "Come ci si qualifica"

  - type: text
    text: >-
      Alla fine dell'ultima gara del campionato l'app guarda la classifica
      generale e individua i qualificati. I playoff previsti possono essere due,
      con soglie diverse:

  - type: options
    items:
      - name: "Playoff Elite"
        text: "Riservato ai primi classificati — quanti, lo decide chi organizza il campionato."
      - name: "Playoff Academy"
        text: >-
          Per i classificati successivi. Serve a non far finire la stagione a
          chi non è arrivato sul podio, e di solito è la gara più partecipata
          delle due.

  - type: text
    text: >-
      Durante la stagione la classifica generale del campionato segna la
      **zona playoff**: una barra accanto a chi, se il campionato finisse
      adesso, verrebbe invitato, e la riga «Fuori dai playoff» subito dopo
      l'ultimo. Tiene conto dei criteri scelti da chi organizza, come il
      minimo di gare giocate. Quando gli inviti sono partiti, la barra passa a
      chi ha un invito valido: chi ha rifiutato esce, chi è entrato al suo
      posto compare.

  - type: note
    tone: info
    text: >-
      I playoff sono facoltativi: molti campionati non li prevedono affatto e
      si chiudono con la classifica generale dell'ultima gara.

  - type: heading
    id: invito
    title: "L'invito"

  - type: text
    text: >-
      Se ti qualifichi ricevi una **notifica**. Aprendola trovi la gara di
      playoff — data, sala, formato — e due pulsanti: accettare o rifiutare.

  - type: text
    text: >-
      Lo stesso invito compare anche in cima alla tua **pagina iniziale**, in
      una scheda «Sei qualificato», con gli stessi due pulsanti. Non devi
      cercarlo fra le notifiche: finché non rispondi resta lì, e sparisce
      appena hai risposto.

  - type: shot
    shot: notifiche
    caption: "Gli inviti ai playoff arrivano fra le notifiche, come gli altri avvisi della gara."

  - type: steps
    items:
      - title: "Leggi le condizioni"
        text: >-
          Data e ora contano più del solito: un playoff è una serata sola, e
          spesso non si recupera.
      - title: "Accetta o rifiuta"
        text: >-
          Accettando entri fra gli iscritti della gara di playoff.
          Rifiutando lasci il posto: a seconda di come è organizzato il
          campionato, può scalare al primo escluso.
      - title: "Rispondi in tempo"
        text: >-
          L'invito ha una scadenza. Non rispondere equivale a rifiutare, e il
          posto va a qualcun altro.

  - type: note
    tone: tip
    title: "Puoi anche rispondere a voce"
    text: >-
      Se incontri il direttore di gara in sala puoi dirgli se ci sei o no: lui
      registra la risposta al posto tuo e l'invito si chiude subito. Nella
      lista dei qualificati resta scritto che l'ha registrata lui, così è
      chiaro chi ha risposto per chi.

  - type: note
    tone: warning
    title: "Rifiutare non è una penalità"
    text: >-
      Rinunciare a un playoff non toglie punti né incide sulla classifica del
      campionato appena concluso: quella è chiusa. Se non puoi esserci, dirlo
      subito è un favore a chi organizza.

  - type: heading
    id: come_si_gioca
    title: "Come si gioca un playoff"

  - type: text
    text: >-
      Una volta accettato, un playoff è una gara come le altre: turni,
      abbinamenti, segnapunti e classifica funzionano esattamente come descritto
      in [Seguire la gara](/aiuto/giocare/seguire_la_gara). Cambia solo come ci
      si è arrivati.

  - type: heading
    id: classifica_finale
    title: "Come si decide la classifica finale"

  - type: text
    text: >-
      Chi organizza il campionato sceglie fra due modi, e la differenza conta
      parecchio per chi arriva ai playoff da dietro:

  - type: options
    items:
      - name: "Campionato + gara di playoff"
        text: >-
          Il punteggio del playoff si **somma** a quello del campionato, come
          se fosse una gara in più. Chi ha fatto una bella stagione parte
          avvantaggiato. Il direttore può dare al playoff un **peso**: peso 2
          vuol dire che quella gara vale il doppio delle altre.
      - name: "Solo i playoff"
        text: >-
          La classifica finale la decide il playoff: chi lo gioca occupa le
          prime posizioni nell'ordine deciso lì, e sotto vengono tutti gli
          altri nell'ordine che avevano in campionato. Quello che hai fatto
          durante la stagione ti serve a entrare, non a vincere.

  - type: note
    tone: info
    text: >-
      Se nessuno tocca niente vale il primo modo, con peso 1: il playoff conta
      esattamente come una gara qualsiasi del campionato.

  - type: faq
    items:
      - q: "Come faccio a sapere se mi sono qualificato?"
        a: "Ricevi una notifica, e trovi la scheda «Sei qualificato» sulla tua pagina iniziale. Se non c'è nessuna delle due, non ti sei qualificato oppure il campionato non prevede playoff."
      - q: "Vincere il playoff vuol dire vincere il campionato?"
        a: "Dipende da come è impostato. Con «Solo i playoff» sì; con «Campionato + gara di playoff» il punteggio si somma a quello della stagione, e può non bastare. Chiedi al direttore di gara come ha impostato il suo."
      - q: "Posso partecipare a entrambi i playoff?"
        a: "No: la qualificazione ti assegna a uno dei due, in base alla tua posizione in classifica."
      - q: "Ho accettato ma poi non posso venire."
        a: "Avvisa il direttore di gara: può toglierti dagli iscritti come per qualsiasi altra gara."
      - q: "Il mio campionato non ha playoff."
        a: "È normale: sono facoltativi e si decidono alla creazione del campionato."

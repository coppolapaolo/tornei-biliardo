title: "I playoff di fine campionato"
section: giocare
kind: approfondimento
audience: [giocatore, direttore]
minutes: 4
summary: "Le gare finali riservate ai migliori classificati: come ci si qualifica, come si accetta l'invito, cosa succede se si rifiuta e come li avvia chi dirige."
screens: [player.playoff_invitation, admin.campionato.campionato_detail]
related: [creare_un_campionato, notifiche]

blocks:
  - type: text
    text: >-
      Un campionato può chiudersi con una o due gare speciali, aperte solo a chi
      si è piazzato bene nella classifica generale. Non ci si iscrive: ci si
      **qualifica**, e si riceve un invito.

  - type: heading
    id: qualificarsi
    title: "Come ci si qualifica"

  - type: text
    text: >-
      Alla fine dell'ultima gara del campionato l'app guarda la classifica
      generale e individua i qualificati. I playoff previsti possono essere due,
      con soglie diverse:

  - type: options
    items:
      - name: "Playoff Elite"
        text: "Riservato ai primi classificati — quanti, lo decide chi organizza il campionato."
      - name: "Playoff Academy"
        text: >-
          Per i classificati successivi. Serve a non far finire la stagione a
          chi non è arrivato sul podio, e di solito è la gara più partecipata
          delle due.

  - type: text
    text: >-
      Durante la stagione la classifica generale del campionato segna la
      **zona playoff**: una barra accanto a chi, se il campionato finisse
      adesso, verrebbe invitato, e la riga «Fuori dai playoff» subito dopo
      l'ultimo. Tiene conto dei criteri scelti da chi organizza, come il
      minimo di gare giocate. Quando gli inviti sono partiti, la barra passa a
      chi ha un invito valido: chi ha rifiutato esce, chi è entrato al suo
      posto compare.

  - type: note
    tone: info
    text: >-
      I playoff sono facoltativi: molti campionati non li prevedono affatto e
      si chiudono con la classifica generale dell'ultima gara.

  - type: heading
    id: invito
    title: "L'invito"

  - type: text
    text: >-
      Se ti qualifichi ricevi una **notifica**. Aprendola trovi il playoff,
      con il giorno e l'ora in cui si gioca, e due pulsanti: accettare o
      rifiutare.

  - type: text
    text: >-
      Lo stesso invito compare anche in cima alla tua **pagina iniziale**, in
      una scheda «Sei qualificato», con gli stessi due pulsanti. Non devi
      cercarlo fra le notifiche: finché non rispondi resta lì. Quando hai
      risposto l'invito sparisce, ma il playoff no: lo ritrovi fra le gare
      della home, come spiegato più sotto in «Il playoff nella tua home».

  - type: shot
    shot: notifiche
    caption: "Gli inviti ai playoff arrivano fra le notifiche, come gli altri avvisi della gara."

  - type: steps
    items:
      - title: "Leggi le condizioni"
        text: >-
          Data e ora contano più del solito: un playoff è una serata sola, e
          spesso non si recupera.
      - title: "Accetta o rifiuta"
        text: >-
          Accettando entri fra i partecipanti: quando il direttore crea la
          gara di playoff ci sei già iscritto, e se l'ha creata prima della
          tua risposta ci entri subito. Rifiutando lasci il posto: a seconda
          di come è organizzato il campionato, può scalare al primo escluso.
      - title: "Fino all'inizio della finale"
        text: >-
          Si può accettare finché il primo turno della gara di playoff non è
          cominciato. Quando parte, gli inviti rimasti senza risposta scadono
          e il playoff si gioca con chi c'è, anche se sono meno dei posti. Se
          il direttore annulla l'avvio, l'invito torna valido fino alla sua
          scadenza.
      - title: "Rispondi in tempo"
        text: >-
          L'invito ha una scadenza, scelta dal direttore quando manda gli
          inviti. Non rispondere equivale a rifiutare, e il posto va a
          qualcun altro. Se il direttore sposta la scadenza, quella nuova vale
          anche per te finché non hai risposto.

  - type: note
    tone: tip
    title: "Puoi anche rispondere a voce"
    text: >-
      Se incontri il direttore di gara in sala puoi dirgli se ci sei o no: lui
      registra la risposta al posto tuo e l'invito si chiude subito. Nella
      lista dei qualificati resta scritto che l'ha registrata lui, così è
      chiaro chi ha risposto per chi.

  - type: note
    tone: warning
    title: "Rifiutare non è una penalità"
    text: >-
      Rinunciare a un playoff non toglie punti né incide sulla classifica del
      campionato appena concluso: quella è chiusa. Se non puoi esserci, dirlo
      subito è un favore a chi organizza.

  - type: heading
    id: nella_home
    title: "Il playoff nella tua home"

  - type: text
    text: >-
      Da quando partono gli inviti fino al primo turno della gara di playoff,
      nella tua home c'è una scheda del playoff. La vede chi ha ricevuto un
      invito e anche chi ha giocato il campionato senza qualificarsi. Dove la
      trovi, e cosa c'è scritto, dipende da dove sei tu:

  - type: options
    items:
      - name: "Hai accettato"
        values: "Le tue gare · Iscritto"
        text: >-
          La trovi sotto **«Le tue gare»**, come ogni gara a cui sei iscritto.
          La barra conta quanti hanno già accettato sui posti del playoff. Se
          hai accettato quando i posti erano già pieni leggi invece **«Lista
          d'attesa»** con il tuo numero: se qualcuno si ritira entri tu, da
          solo.
      - name: "Sei fuori dalla zona playoff"
        values: "Le tue gare · Lista d'attesa #N"
        text: >-
          Non hai un invito, ma puoi ancora riceverlo. Il numero è il tuo posto
          in coda fra gli esclusi: se un qualificato rifiuta, l'invito passa al
          primo di loro, e così via. Quando tocca a te ricevi l'invito da
          accettare, in cima alla home.
      - name: "Hai rifiutato, o non puoi entrare"
        values: "In arrivo · Iscrizioni chiuse"
        text: >-
          La scheda sta fra le gare **«In arrivo»**, e sotto dice perché: hai
          rifiutato l'invito, l'invito è scaduto senza risposta, il tuo posto è
          passato a un altro giocatore, oppure non hai giocato abbastanza gare
          del campionato per essere chiamato.

  - type: text
    text: >-
      Accanto al nome, la scheda dice anche a che punto sono gli inviti:
      **Inviti in corso** finché qualcuno deve ancora rispondere, poi
      **Iscrizioni chiuse**. **Dettagli** apre la gara di playoff, se il
      direttore l'ha già creata; altrimenti la pagina del campionato, con la
      zona playoff in classifica. Quando comincia il primo turno la scheda
      lascia il posto a quella normale della gara, con partite, classifica e
      diretta.

  - type: heading
    id: come_si_gioca
    title: "Come si gioca un playoff"

  - type: text
    text: >-
      Una volta accettato, un playoff è una gara come le altre: turni,
      abbinamenti, segnapunti e classifica funzionano esattamente come descritto
      in [Seguire la gara](/aiuto/giocare/seguire_la_gara). Cambia solo come ci
      si è arrivati.

  - type: heading
    id: classifica_finale
    title: "Come si decide la classifica finale"

  - type: text
    text: >-
      Chi organizza il campionato sceglie fra due modi, e la differenza conta
      parecchio per chi arriva ai playoff da dietro:

  - type: options
    items:
      - name: "Campionato + gara di playoff"
        text: >-
          Il punteggio del playoff si **somma** a quello del campionato, come
          se fosse una gara in più. Chi ha fatto una bella stagione parte
          avvantaggiato. Il direttore può dare al playoff un **peso**: peso 2
          vuol dire che quella gara vale il doppio delle altre. Per potersi
          sommare, la finale usa lo **stesso sistema di classifica** del
          campionato: vittorie con vittorie, triangoli con triangoli.
      - name: "Solo i playoff"
        text: >-
          La classifica finale la decide il playoff: chi lo gioca occupa le
          prime posizioni nell'ordine deciso lì, e sotto vengono tutti gli
          altri nell'ordine che avevano in campionato. Quello che hai fatto
          durante la stagione ti serve a entrare, non a vincere. Della finale
          conta solo l'ordine d'arrivo, non i punti.

  - type: note
    tone: warning
    text: >-
      Si passa da «Solo i playoff» a «Campionato + gara di playoff» solo se la
      finale usa lo stesso sistema di classifica del campionato: altrimenti si
      sommerebbero cose diverse, e l'app rifiuta il cambio. Il peso invece si
      cambia sempre.

  - type: note
    tone: info
    text: >-
      Se nessuno tocca niente vale il primo modo, con peso 1: il playoff conta
      esattamente come una gara qualsiasi del campionato.

  - type: heading
    id: avviare
    title: "Per chi dirige: avviare e seguire i playoff"

  - type: text
    text: >-
      Questa parte è per chi dirige il campionato. Tutto passa dalla pagina
      del campionato: la fascia in cima dice sempre a che punto sono i
      playoff e qual è la prossima cosa da fare.

  - type: steps
    items:
      - title: "Termina il campionato"
        text: >-
          Con **Termina** la classifica generale diventa definitiva e la
          fascia passa a «Playoff da avviare».
      - title: "Scegli data e scadenza, e manda gli inviti"
        text: >-
          Tocca **Avvia i playoff**: si apre un foglio che chiede **Quando si
          gioca il playoff** e **Gli invitati rispondono entro**, nel tuo fuso
          orario. Tutte e due le date devono essere nel futuro. Con **Avvia i
          playoff e invia gli inviti** i qualificati ricevono l'invito e le
          configurazioni si bloccano.
      - title: "Sposta data e scadenza, se serve"
        text: >-
          Sopra l'elenco degli invitati di ogni playoff c'è la riga **Data e
          scadenza**. Toccala per cambiarle, fino a quando la gara di playoff
          comincia. La scadenza nuova vale per chi non ha ancora risposto; la
          data nuova sposta anche la gara, se l'hai già creata.
      - title: "Crea la gara"
        text: >-
          Quando le risposte bastano, **Crea la gara playoff** crea la gara e
          ci iscrive chi ha accettato. Da lì il pulsante diventa **Vai alla
          gara playoff**.
      - title: "Si gioca"
        text: >-
          Appena la gara di playoff comincia, la fascia dice **Playoff in
          corso**: gli inviti sono chiusi e si gioca con chi è entrato. Al
          posto degli invitati trovi **Gare di playoff**, con il collegamento
          a ciascuna.

  - type: note
    tone: info
    title: "Il campionato si chiude da solo"
    text: >-
      Quando tutte le gare di playoff sono concluse, la fascia dice
      **Campionato concluso** e mostra il campione — il primo della
      **Classifica finale** — con secondo e terzo. La finale resta fra le
      gare, con chi l'ha vinta, come le altre. Non c'è niente da premere: il
      campionato risulta completato da solo, e la vetrina annuncia il
      campione allo stesso modo.

  - type: faq
    items:
      - q: "Come faccio a sapere se mi sono qualificato?"
        a: "Ricevi una notifica, e trovi la scheda «Sei qualificato» sulla tua pagina iniziale. Se invece il playoff compare sotto «Le tue gare» con «Lista d'attesa», non ti sei qualificato ma puoi ancora entrare se qualcuno rinuncia. Se non c'è niente, gli inviti non sono ancora partiti oppure il campionato non prevede playoff."
      - q: "Ho accettato: dove ritrovo il playoff?"
        a: "Nella tua home, sotto «Le tue gare», con scritto «Iscritto». Dal primo turno è la scheda normale della gara, con la tua partita dentro."
      - q: "Vincere il playoff vuol dire vincere il campionato?"
        a: "Dipende da come è impostato. Con «Solo i playoff» sì; con «Campionato + gara di playoff» il punteggio si somma a quello della stagione, e può non bastare. Chiedi al direttore di gara come ha impostato il suo."
      - q: "Posso partecipare a entrambi i playoff?"
        a: "No: la qualificazione ti assegna a uno dei due, in base alla tua posizione in classifica."
      - q: "Ho accettato ma poi non posso venire."
        a: "Avvisa il direttore di gara: fino all'avvio può toglierti dalla lista del playoff, nella pagina del campionato."
      - q: "Il mio campionato non ha playoff."
        a: "È normale: sono facoltativi e si decidono alla creazione del campionato."

title: "Partite amichevoli"
section: giocare
kind: tutorial
audience: [giocatore]
minutes: 4
summary: "Fuori dalle gare ufficiali puoi proporre una partita a un altro giocatore, accordarvi su luogo e ora, e registrare il risultato."
screens: [individual_match.dashboard, individual_match.quick_match, individual_match.create_proposal,
  individual_match.match_list, individual_match.match_detail, individual_match.proposal_list,
  individual_match.proposal_detail, individual_match.rematch, individual_match.user_statistics]
related: [giocare_una_partita, profilo_e_statistiche]

blocks:
  - type: text
    text: >-
      Non tutto passa dalle gare. Se vuoi giocare due partite con un amico e
      tenerne traccia — nelle statistiche, nel rating, nei progressi — puoi
      farlo dalla sezione **Sfide** — su computer, nella colonna di sinistra,
      si chiama **Sfide individuali**.

  - type: shot
    shot: match-individuali
    caption: "La sezione delle partite amichevoli: le proposte in attesa, quelle ricevute e le partite in programma."

  - type: heading
    id: avvio-rapido
    title: "Siete già in sala"

  - type: text
    text: >-
      Se l'avversario ce l'hai davanti e le stecche sono già in mano, non serve
      proporre niente: tocca **Avvio rapido** nella sezione Sfide, scegli chi
      hai davanti e sei al segnapunti. Non si chiede quando (è adesso), e sala,
      disciplina e distanza arrivano già scritte, riprese dall'ultima partita
      che hai giocato.

  - type: steps
    items:
      - title: "Apri Sfide e tocca «Avvio rapido»"
        text: >-
          È la prima voce della sezione, e la trovi anche in fondo alla pagina
          fra i collegamenti.
      - title: "Scegli chi hai davanti"
        text: >-
          Gli avversari con cui giochi più spesso sono già in elenco: un tocco
          e sono scelti. Per tutti gli altri c'è la ricerca per nome.
      - title: "Se serve, cambia come si gioca"
        text: >-
          Sotto «Come si gioca» c'è il riepilogo di sala, disciplina e distanza.
          Vanno bene? Non toccare niente. Altrimenti tocca **Cambia** e correggi
          quello che serve.
      - title: "Decidi se tenere il referto TPA"
        text: >-
          Se hai sbloccato il referto, sopra il pulsante c'è **Tengo il referto
          TPA**. È l'unica cosa che va decisa adesso: il referto va aperto prima
          del primo triangolo, quindi dopo non si può più. Se non ti interessa,
          lascia stare e si segna come sempre.
      - title: "Inizia a segnare"
        text: >-
          La partita parte subito. L'avversario riceve una notifica: non deve
          accettare niente, ma a fine partita dovete **confermare il risultato
          in due**, come in ogni amichevole.

  - type: note
    tone: info
    title: "Perché nessuno deve accettare"
    text: >-
      La conferma non sparisce, si sposta alla fine — dove la domanda ha una
      risposta che l'avversario conosce davvero: il punteggio. Finché non
      confermate entrambi, la partita non entra nel rating.

  - type: heading
    id: proporre
    title: "Proporre una partita"

  - type: steps
    items:
      - title: "Apri Sfide e tocca «Nuova proposta»"
        text: "Su telefono, «Sfide» è nella barra in fondo allo schermo; su computer, «Sfide individuali» nella colonna di sinistra."
      - title: "Scegli l'avversario"
        text: >-
          Cerca il giocatore per nome. Puoi anche lasciare la proposta
          **aperta**: la vedranno più giocatori e la prende chi risponde per
          primo.
        shot: proposta-nuova
      - title: "Indica dove e quando"
        text: >-
          Sala, data e ora. Se la sala è fra quelle registrate nell'app,
          sceglila dall'elenco: comparirà con indirizzo e numero di tavoli.
      - title: "Scegli il formato"
        text: >-
          Disciplina (palla 8, palla 9…) e distanza, cioè a quanti triangoli si
          vince. Sono le stesse scelte di una gara, spiegate in [Formati di
          gioco](/aiuto/approfondimenti/formati_di_gioco).
      - title: "Invia"
        text: >-
          L'avversario riceve una notifica e può accettare o rifiutare. In tutti
          e due i casi ti arriva la risposta: se accetta trovi la partita fra
          quelle da giocare, se rifiuta te lo dice una notifica. Finché non
          risponde, la proposta resta «in attesa» e puoi ritirarla.

  - type: heading
    id: rispondere
    title: "Rispondere a una proposta"

  - type: text
    text: >-
      Quando qualcuno ti propone una partita ricevi una notifica. Aprendola
      trovi chi propone, dove, quando e con che formato, e due pulsanti:
      **Accetta** o **Rifiuta**. Accettando, la partita entra nella tua lista
      delle prossime.

  - type: note
    tone: info
    title: "Le proposte scadono"
    text: >-
      Ogni proposta ha una scadenza, di norma poche ore prima dell'orario
      previsto. Passata quella, decade da sola: serve a non lasciare in sospeso
      inviti a cui nessuno ha risposto.

  - type: heading
    id: giocare
    title: "Giocare e registrare il risultato"

  - type: text
    text: >-
      Non serve tornare nella sezione Sfide per trovarla: le partite fissate e
      quelle già iniziate compaiono anche nella tua home, sotto **«Sfide a
      due»**, subito dopo le tue gare.

  - type: text
    text: >-
      Al momento di giocare, apri la partita e premi **Inizia**. Il segnapunti
      è identico a quello delle gare: un tasto per giocatore, si preme dopo
      ogni triangolo. Vedi [Giocare una
      partita](/aiuto/giocare/giocare_una_partita).

  - type: text
    text: >-
      A fine partita serve la **conferma di entrambi**. È la differenza
      principale rispetto alle gare: lì c'è un direttore che garantisce il
      risultato, qui garantite voi due. Finché l'avversario non conferma, il
      risultato resta in attesa; se non è d'accordo può rifiutarlo e si
      corregge.

  - type: text
    text: >-
      Una partita **in attesa di conferma** da più di un giorno esce dalla
      dashboard e resta fra le tue sfide, con lo stato **In attesa di
      conferma**. E finché una partita aspetta la **tua** conferma non puoi
      lanciare né accettare altre sfide: quando ci provi, l'app ti mostra le
      partite da chiudere, con **Confermo il risultato** e **Rifiuto il
      risultato**, e chiusa l'ultima ti riporta dov'eri.

  - type: heading
    id: chi-apre
    title: "Chi apre, e come si passa il tiro"

  - type: text
    text: >-
      Sotto «Come si gioca», insieme a disciplina e distanza, ci sono due
      scelte che riguardano il **tiro di apertura**. Non sono obbligatorie: se
      non le tocchi, apre il primo dei due e poi ci si alterna, che è come si
      è sempre giocato.

  - type: options
    items:
      - name: "Regola di inizio"
        values: "predefinito «Primo giocatore»"
        text: >-
          Chi esegue il primo tiro. Con **Acchito** il segnapunti, prima del
          primo triangolo, chiede chi ha vinto l'acchito e chi apre — perché
          chi vince l'acchito **sceglie**, e può mandare al tavolo
          l'avversario. Come funziona al tavolo è spiegato in [Giocare una
          partita](/aiuto/giocare/giocare_una_partita).
      - name: "Chi spacca"
        values: "predefinito «A turno»"
        text: >-
          Come passa il tiro di apertura da un triangolo al successivo. **A
          turno** è la regola standard e alterna ogni volta; **A turno ogni
          due** dà due triangoli a testa; **Spacca chi ha vinto** e **Spacca
          chi ha perso** seguono invece il risultato del triangolo prima.

  - type: note
    tone: info
    title: "Chi propone, sceglie"
    text: >-
      In una proposta le due regole viaggiano con l'invito, come la disciplina
      e la distanza: chi accetta sa già a cosa sta dicendo di sì. Finché la
      partita non è cominciata si possono ancora correggere.

  - type: heading
    id: senza-limite
    title: "La sfida senza limite"

  - type: text
    text: >-
      Fra i formati c'è anche **Libero**: nessuna distanza, si gioca finché
      volete. Il segnapunti funziona come sempre, ma non c'è nessun traguardo
      che chiuda la partita da solo — a chiuderla siete voi.

  - type: steps
    items:
      - title: "Quando avete finito, tocca «Termina la sfida»"
        text: >-
          Lo trovi sotto al punteggio. Da quel momento la pagina ti dice che
          hai chiuso e che manca l'altro: finché non risponde, il risultato non
          è definitivo.
      - title: "L'avversario accetta"
        text: >-
          Sul suo telefono compare che hai chiuso la sfida, con **Accetta** e
          **Rifiuta**. Se accetta la partita è conclusa; se rifiuta, l'ultimo
          triangolo viene tolto e si torna a giocare.

  - type: note
    tone: info
    title: "Serve la firma di tutti e due"
    text: >-
      Vale anche qui la regola delle amichevoli: nessuno chiude una partita da
      solo. Con la distanza è il traguardo a dire quando è finita, senza
      distanza lo dite voi — ma in due.

  - type: heading
    id: al-meglio-dei-set
    title: "Al meglio dei set"

  - type: text
    text: >-
      Scegliendo **Multi-set** decidi due numeri: quanti triangoli servono per
      vincere un set, e quanti set per vincere la sfida. Il punteggio grande in
      cima conta i **set**, non i triangoli.

  - type: text
    text: >-
      Quando un set finisce non ne comincia un altro da solo: la pagina te lo
      dice e ti offre **Inizia il set** col numero di quello che comincia. È voluto — fra un set e
      l'altro al tavolo si cambia, si beve, si aspetta.

  - type: heading
    id: sbagliata
    title: "Ho sbagliato ad aprirla"

  - type: text
    text: >-
      L'avvio rapido è veloce perché non chiede niente: sala, disciplina e
      distanza le riprende dall'ultima partita. Il rovescio è che ogni tanto
      riprende quella sbagliata — avevate deciso «al 7» e vi ritrovate un «al
      5» — oppure hai scelto l'avversario di fianco invece di quello davanti.

  - type: text
    text: >-
      Finché **non avete segnato nemmeno un triangolo**, nella pagina della
      sfida trovi due comandi: **Cambia come si gioca**, per correggere sala,
      disciplina, formato e distanza, e **Annulla la sfida**, per farla sparire
      del tutto. Dal primo triangolo in poi non ci sono più: cambiare la
      distanza a metà partita riscriverebbe il significato dei punti già fatti.

  - type: note
    tone: info
    title: "Se ve ne accorgete a metà"
    text: >-
      Non c'è più niente da correggere: l'unica strada è chiudere la partita
      com'è e riaprirne una giusta.

  - type: heading
    id: orari
    title: "Correggere gli orari"

  - type: text
    text: >-
      Capita di segnare la partita mezz'ora dopo averla giocata, o di lasciare
      il segnapunti aperto a partita finita. Nella pagina della sfida c'è
      **Orari**: si correggono inizio e fine, e li può sistemare **ognuno dei
      due giocatori** — come per il punteggio, che segnate tutti e due.

  - type: heading
    id: disponibilita
    title: "Farsi trovare"

  - type: text
    text: >-
      Se non hai in mente nessuno in particolare, puoi dichiarare **dove e
      quando sei disponibile**: in quali sale giochi di solito e in che giorni
      e orari. Gli altri giocatori disponibili nelle stesse sale ti vedranno
      quando cercano un avversario.

  - type: shot
    shot: sale-biliardo
    caption: "L'elenco delle sale registrate: da qui si dichiara in quali sei disponibile."

  - type: note
    tone: tip
    text: >-
      La disponibilità è del tutto facoltativa e si può togliere in qualsiasi
      momento. Indichi le sale e le fasce orarie, mai la tua posizione precisa.

  - type: heading
    id: statistiche
    title: "Contano nelle statistiche?"

  - type: text
    text: >-
      Sì. Nel tuo [profilo](/aiuto/account/profilo_e_statistiche) le amichevoli
      stanno fra le partite recenti insieme a quelle di gara, con l'etichetta
      «Individuale», e sono contate fra le partite giocate, vinte e perse. Lo
      stesso nello storico, nella linguetta «Partite».

  - type: text
    text: >-
      A tenerle separate è il **rating**, che ha due modalità: **competitivo**
      (solo gare ufficiali) e **globale** (gare più amichevoli). Puoi passare
      dall'una all'altra con un tocco. Le classifiche delle gare, invece, non
      sono toccate dalle amichevoli.

  - type: note
    tone: info
    title: "I pareggi si contano a parte"
    text: >-
      Con «esattamente N» triangoli si può finire pari. Un pareggio non è una
      sconfitta: nelle statistiche ha una voce sua, e fra le ultime sfide
      compare come **X**. La percentuale di vittorie resta calcolata su tutte
      le partite giocate, pareggi compresi.

  - type: shot
    shot: statistiche-amichevoli
    caption: "Le statistiche delle amichevoli: partite, vittorie e avversari più frequenti, contate a parte."

  - type: faq
    items:
      - q: "Non vedo la sezione Sfide."
        a: "È una funzione che si sblocca con l'uso della piattaforma. Se non compare, continua a giocare qualche gara: comparirà."
      - q: "L'avversario non conferma il risultato."
        a: "La partita resta in attesa: dopo un giorno esce dalla dashboard, ma la trovi fra le sfide. Sollecitalo: senza la conferma di entrambi il risultato non entra nelle statistiche. Finché non conferma, lui non può lanciare né accettare altre sfide; tu sì."
      - q: "Perché non riesco a lanciare o accettare una sfida?"
        a: "Hai almeno una partita che aspetta la tua conferma. Confermala o rifiutala dalla pagina che l'app ti propone, o da Le mie sfide: chiusa l'ultima, puoi ripartire."
      - q: "Posso proporre una partita a chi non è iscritto all'app?"
        a: "No, l'avversario deve avere un account. Puoi invitarlo a registrarsi: è gratuito."
      - q: "Che differenza c'è con una gara?"
        a: "Un'amichevole è una partita sola, senza turni, senza classifica e senza direttore. Una gara è un evento organizzato con più turni e una classifica finale."

title: "Primo accesso: registrati ed entra"
section: introduzione
kind: tutorial
audience: [tutti]
minutes: 3
summary: "Creare l'account, confermare l'email ed entrare la prima volta. Sono cinque minuti, una volta sola."
screens: [auth.register, auth.login, auth.forgot_password, auth.verify_email, onboarding.onboarding]
related: [iscriversi_a_una_gara, profilo_e_statistiche]

blocks:
  - type: text
    text: >-
      Per guardare le gare non serve niente. Per **iscriverti** e per segnare i
      punteggi serve un account: è gratuito e chiede tre informazioni.

  - type: heading
    id: registrazione
    title: "Creare l'account"

  - type: steps
    items:
      - title: "Apri la registrazione"
        text: >-
          Dalla pagina iniziale tocca **Registrati**. Se sei su computer, il
          collegamento è nella colonna di sinistra.
        shot: home-pubblica
      - title: "Compila i tre campi"
        text: >-
          **Nome utente**: è il nome con cui comparirai nelle classifiche e che
          vedranno gli avversari — scegline uno che ti riconosca.
          **Email**: serve per confermare l'account e per recuperare la
          password se la dimentichi. **Password**: almeno otto caratteri.
        shot: registrazione
      - title: "Conferma dall'email"
        text: >-
          Riceverai un messaggio con un collegamento da toccare. Serve a
          verificare che l'indirizzo sia davvero tuo. Se non arriva entro
          qualche minuto, controlla la posta indesiderata.
      - title: "Entra"
        text: >-
          Torna sull'app e accedi con nome utente e password. Da qui in avanti
          resti collegato: non dovrai rifarlo a ogni visita.

  - type: heading
    id: installare_app
    title: "Tenerla sul telefono come un'app"

  - type: text
    text: >-
      Non c'è niente da scaricare da nessuno store: è il browser stesso che può
      aggiungere **Biliardo** fra le app del telefono. Da lì si apre a tutto
      schermo, con la sua icona e senza la barra dell'indirizzo, e resta a
      portata di dito come le altre.

  - type: list
    title: "Dove si trova il comando"
    items:
      - "**iPhone e iPad, da Safari**: tocca il tasto Condividi — il quadrato con la freccia verso l'alto, in basso — scorri l'elenco e scegli «Aggiungi a Home»."
      - "**iPhone e iPad, da Chrome (o Firefox, o Edge)**: il tasto Condividi c'è anche qui, in alto a destra; nel menu cerca «Aggiungi alla schermata Home». Se non lo vedi, scorri l'elenco fino in fondo o tocca «Modifica azioni» per farlo comparire."
      - "**Android, da Chrome**: tocca i tre puntini in alto a destra e scegli «Installa app»; se non c'è, «Aggiungi a schermata Home» fa la stessa cosa."
      - "**Android, da Firefox**: i tre puntini, poi «Aggiungi a schermata Home»."
      - "**Android, da Samsung Internet**: il menu in basso a destra, poi «Aggiungi pagina a» e «Schermata Home»."
      - "**Computer, con Chrome o Edge**: nella barra dell'indirizzo compare una piccola icona di installazione, a destra; altrimenti la voce «Installa» è nel menu del browser."

  - type: note
    tone: info
    title: "Sull'iPhone il primo accesso si rifà"
    text: >-
      L'app aggiunta alla schermata Home tiene i suoi dati separati da quelli
      di Safari: la prima volta che la apri ti chiede di accedere di nuovo,
      anche se nel browser eri già entrato. Succede una volta sola.

  - type: heading
    id: prima_volta
    title: "La prima volta che entri"

  - type: text
    text: >-
      Al primo accesso l'app fa qualche domanda breve — che cosa ti interessa
      fare, in che città giochi. Sono tutte facoltative e servono solo a
      mostrarti per prime le gare vicine a te. Puoi cambiare le risposte in
      qualsiasi momento dal profilo.

  - type: shot
    shot: dashboard-giocatore
    caption: "La tua home appena entrato: in cima il riquadro con il tuo andamento, sotto le gare a cui sei iscritto, i campionati e le gare vicine a te."

  - type: heading
    id: come_stai_andando
    title: "Il riquadro in cima alla home"

  - type: text
    text: >-
      Appena entri, subito sotto il saluto c'è un riquadro che ti racconta come
      stai andando. Appena registrato non ha ancora niente da dire, quindi al
      suo posto trovi **«Il tuo profilo è pronto»** con tre passi da spuntare:
      *Account creato*, *Gioca il primo match*, *Prova un esercizio*. Sopra, una
      riga spiega da dove parti: il punteggio **Elo** — il rating che trovi
      anche nel [profilo](/aiuto/account/profilo_e_statistiche) — vale 1200 per
      tutti, e comincia a muoversi con la prima partita registrata. Anche quei
      tre passi ti accolgono all'ingresso e poi lasciano il posto alle cose da
      fare: li ritrovi al prossimo accesso, finché non fai la prima attività.

  - type: text
    text: >-
      Dopo la prima attività quel riquadro lascia il posto a **«Come stai
      andando»**: due numeri (per esempio il tuo Elo con la variazione recente,
      oppure il punteggio degli esercizi), un piccolo grafico dell'andamento e la
      striscia delle ultime attività, ognuna con il risultato o il piazzamento.
      Il pulsante in fondo — si chiama **«Tutti i tuoi numeri»** o **«Streak e
      classifica»** a seconda di cosa hai da vedere — apre tre o quattro righe
      in più: la serie in corso, la tua posizione in campionato, gli esercizi
      completati, il livello. Parte sempre chiuso: si apre con un tocco.

  - type: note
    tone: info
    title: "Si legge una volta, poi lascia il posto"
    text: >-
      **«Come stai andando» è un saluto, non un cruscotto**: compare quando
      entri in home dopo l'accesso, e da lì in poi non c'è più. Se torni in
      home più tardi trovi subito le cose da fare, senza il riepilogo davanti.
      Lo rivedi al prossimo accesso: non c'è un pulsante per richiamarlo. In
      ogni caso non c'è niente da premere lì dentro — non porta da nessuna
      parte e non chiede niente.

  - type: heading
    id: muoversi
    title: "Come ci si muove"

  - type: text
    text: >-
      Su **telefono** c'è una barra in fondo allo schermo con le cinque
      destinazioni principali: Dashboard, Sale, Sfide, Esercizi e Notifiche.
      La freccia in alto a sinistra torna sempre indietro di un passo.

  - type: shot
    shot: dashboard-giocatore
    variant: desktop
    caption: "Su computer le stesse voci stanno nella colonna di sinistra, sempre visibile."

  - type: text
    text: >-
      Su **computer** le stesse voci sono nella colonna di sinistra, e le
      pagine mostrano due colonne affiancate invece di una sola: le
      informazioni sono le stesse, solo disposte diversamente.

  - type: heading
    id: password_dimenticata
    title: "Se dimentichi la password"

  - type: steps
    items:
      - title: "Tocca «Password dimenticata» nella pagina di accesso"
        text: "Ti verrà chiesto l'indirizzo email con cui ti sei registrato."
      - title: "Controlla l'email"
        text: >-
          Riceverai un collegamento per impostare una password nuova. Il
          collegamento vale poche ore: se scade, richiedine un altro.
      - title: "Scegli la password nuova"
        text: "Da quel momento la vecchia non funziona più."

  - type: faq
    items:
      - q: "Posso cambiare nome utente dopo?"
        a: "Il nome utente resta quello scelto alla registrazione, perché è il nome con cui compari nelle classifiche già pubblicate. Email e password si cambiano dal profilo."
      - q: "Non ho ricevuto l'email di conferma."
        a: "Controlla la posta indesiderata. Dal tuo profilo puoi chiedere di inviarla di nuovo."
      - q: "Posso usare l'app da più dispositivi?"
        a: "Sì. Lo stesso account funziona da telefono, tablet e computer, anche contemporaneamente."
      - q: "Come si cancella l'account?"
        a: "Dal profilo, voce «Elimina account». I tuoi risultati sportivi restano nelle classifiche storiche ma senza il tuo nome. Vedi [Privacy e dati](/aiuto/account/privacy_e_dati)."

title: "Il referto TPA"
section: giocare
kind: tutorial
audience: [giocatore]
minutes: 8
summary: "Nelle partite amichevoli puoi annotare tutta la partita, non solo chi vince i triangoli, e ottenere il TPA: la percentuale di azioni riuscite."
screens: [individual_match.tpa_referto]
related: [partite_amichevoli, profilo_e_statistiche]

blocks:
  - type: text
    text: >-
      Di solito, di una partita resta un numero solo: 5 a 3. Ma due partite
      finite 5 a 3 possono essere state due partite diversissime. Il **referto
      TPA** serve a raccontare anche il resto: quante bilie hai imbucato e
      perché ogni turno è finito.

  - type: text
    text: >-
      Alla fine ne esce un numero, il **TPA**, che si legge come una
      percentuale di azioni riuscite. Va da **0 a 1000**: un TPA di **750** vuol
      dire che tre volte su quattro quello che hai fatto al tavolo è andato a
      buon fine. È lo stesso conto che si usa nel biliardo americano
      professionistico.

  - type: note
    tone: info
    title: "Si sblocca con l'esperienza"
    text: >-
      Il referto non compare subito. Si sblocca quando hai già giocato gare,
      campionati, partite amichevoli, esercizi ed esami: non perché sia
      difficile da capire, ma perché va compilato **mentre giochi**, e conviene
      arrivarci quando l'app la conosci già bene.

  - type: heading
    id: aprire
    title: "Aprire il referto"

  - type: text
    text: >-
      Il referto va aperto **prima del primo triangolo**: racconta la partita
      dall'inizio, quindi a triangoli già segnati non si apre più. Per questo lo
      si chiede quando la partita sta per cominciare — in tutt'e due i modi in
      cui una partita può nascere.

  - type: text
    text: "**Se stai facendo un avvio rapido:**"

  - type: steps
    items:
      - title: "Nel modulo, spunta «Tengo il referto TPA»"
        text: >-
          È sopra il pulsante «Inizia a segnare», e compare solo se hai
          sbloccato la funzione. L'avvio rapido porta dritti al segnapunti,
          dove la prima cosa che si fa è segnare: se non lo chiedi lì, dopo il
          primo triangolo è tardi.
      - title: "Tocca «Inizia a segnare»"
        text: >-
          La partita nasce con il referto già aperto e ti trovi direttamente
          sulla schermata del referto, pronto per annotare la spaccata.

  - type: text
    text: "**Se la partita è nata da una proposta:**"

  - type: steps
    items:
      - title: "Apri la partita e spunta «Tengo il referto TPA»"
        text: >-
          La spunta è sopra il pulsante «Inizia la sfida», e compare solo se
          hai sbloccato la funzione. Anche qui la domanda si fa adesso: appena
          la partita parte sei sul segnapunti, e al primo triangolo il referto
          non si apre più.
      - title: "Tocca «Inizia la sfida»"
        text: >-
          La partita comincia con il referto già aperto e ti trovi
          direttamente sulla schermata del referto.

  - type: note
    tone: tip
    title: "Se hai già cominciato e non hai ancora segnato"
    text: >-
      C'è ancora tempo: sotto il punteggio trovi «Prendi il referto TPA», e poi
      «Apri il referto». Vale solo finché il punteggio è fermo a zero a zero.

  - type: text
    text: >-
      Da quando il referto è aperto è tuo: lo tieni tu per tutta la partita. Il
      tuo avversario trova «Guarda il referto TPA» e vede la stessa schermata
      riempirsi da sola, ma non può scriverci.

  - type: note
    tone: warning
    title: "I triangoli non si segnano più a mano"
    text: >-
      Con il referto aperto, il segnapunti normale sparisce. Non è una
      dimenticanza: i triangoli vinti li registra il referto, così non devi segnare
      due volte la stessa cosa e il punteggio non può mai discordare da quello
      che hai annotato.

  - type: heading
    id: chi-lo-vede
    title: "Chi lo vede, e come cambia il pulsante"

  - type: text
    text: >-
      Il pulsante sotto il punteggio della partita non dice la stessa cosa a
      tutti e due i giocatori, e cambia parole man mano che la partita va
      avanti.

  - type: list
    items:
      - "**Prendi il referto TPA**: il referto non c'è ancora e puoi aprirlo tu."
      - "**Apri il referto TPA**: il referto è aperto e lo tieni tu. Di qui si annota."
      - "**Guarda il referto TPA**: il referto lo tiene il tuo avversario. Lo vedi riempirsi, ma non ci scrivi."
      - "**Rivedi il referto TPA**: il referto è chiuso. Si rilegge e basta."

  - type: note
    tone: info
    title: "Se lo apre l'avversario, lo vedi comunque"
    text: >-
      Da sbloccare c'è solo la mossa di **prendere** il referto. Guardarne uno
      no: se lo ha aperto il tuo avversario, la partita è anche tua, e il
      pulsante «Guarda il referto TPA» ti compare anche se tu non hai sbloccato
      niente.

  - type: note
    tone: tip
    title: "Non serve ricaricare la pagina"
    text: >-
      Chi guarda vede il referto riempirsi da solo, un tocco dopo l'altro,
      senza dover toccare niente. E quando chi lo compila lo chiude, la pagina
      di chi guarda se ne accorge da sola.

  - type: heading
    id: come-si-compila
    title: "Come si compila"

  - type: shot
    shot: referto-tpa
    caption: "Il referto TPA durante la partita: i due giocatori affiancati, ciascuno con le sue due caselle, e sotto il tastierino."

  - type: text
    text: >-
      In alto ci sono i due giocatori, uno accanto all'altro. Quello **chiaro**
      è chi sta al tavolo adesso. Per ciascuno vedi due numeri grandi alla
      pari: i **triangoli** vinti e il **TPA**. Sotto, più piccolo, quante
      bilie ha imbucato e quanti errori ha fatto.

  - type: text
    text: >-
      Dentro il riquadro di ogni giocatore ci sono due caselle, le stesse del
      referto di carta. Nella **casella chiara** si scrive quante bilie sono
      entrate e perché il turno è finito. Nella **casella più scura**, a
      destra, solo i falli. Chi è al tavolo ci vede il turno che stai
      scrivendo; l'altro ci vede il suo ultimo turno.

  - type: text
    text: >-
      Il **tastierino** è sempre tutto lì, in basso: i numeri come su un
      telefono, poi le lettere nell'ordine del referto di carta. I tasti che
      in quel momento non si possono premere **si spengono**, ma restano al
      loro posto: così le dita imparano dove stanno.

  - type: steps
    items:
      - title: "Quante bilie ha imbucato"
        text: >-
          Premi il numero. Se è il turno di spaccata i numeri si premono
          **due volte**: prima quante ne sono entrate sulla spaccata, poi
          quante in tutto nel turno. Sul referto le bilie della spaccata
          restano scritte piccole, in alto, prima del totale.
      - title: "Perché il turno è finito"
        text: >-
          **M** se ha sbagliato un tiro che voleva imbucare, **S** se ha
          giocato di difesa, **K** se era costretto a un tiro di sponda perché
          non vedeva la bilia.
      - title: "Se c'è stato un fallo"
        text: >-
          **P** se la bilia bianca è finita in buca o fuori dal tavolo, **N**
          se non ha colpito regolarmente la bilia designata. Il fallo finisce
          nella casella più scura.
      - title: "Se ha vinto il triangolo"
        text: >-
          Premi **G**. Se ha imbucato tutte le bilie rimaste non serve: il
          referto se ne accorge da solo. Sul referto il triangolo vinto è un
          **cerchio** attorno al numero delle bilie.
      - title: "Passa il tavolo"
        text: >-
          Tocca il riquadro dell'altro giocatore: c'è scritto «Tocca: tavolo
          a…». Il turno si chiude e comincia il suo. Prima della spaccata lo
          stesso tocco sceglie chi spacca.

  - type: note
    tone: info
    title: "Primo tiro di calcio"
    text: >-
      Se dopo una difesa dell'avversario la prima bilia è entrata **di
      sponda**, tocca «Primo tiro di calcio?». Sul referto compare il numero
      del giocatore, cerchiato in piccolo sopra la casella. Conta, perché
      toglie l'errore a chi aveva giocato la difesa.

  - type: note
    tone: tip
    title: "La parola sotto le lettere"
    text: >-
      Sotto M, K, S, P, G e N c'è scritto cosa vogliono dire. Quando le hai
      imparate puoi toglierle: apri «Cosa vuol dire ogni lettera» e spegni
      «Mostra la parola sotto le lettere del tastierino».

  - type: heading
    id: annotazioni-piccole
    title: "Le tre annotazioni piccole"

  - type: text
    text: >-
      Sotto le lettere grandi ce ne sono tre piccole. Servono a non addebitare
      un errore a chi non l'ha commesso, e sono ciò che rende il TPA giusto
      invece che approssimativo.

  - type: options
    items:
      - name: "n"
        text: >-
          Il tiro sbagliato era **facile**, più facile di un tiro dal
          dischetto. Vale doppio: se sbagli una cosa semplice, il TPA lo dice.
      - name: "x"
        text: >-
          La difesa era **premeditata**: non stavi provando a chiudere il triangolo,
          quindi non è un errore di posizione.
      - name: "p"
        text: >-
          Era un **push out**, la giocata libera subito dopo la spaccata.

  - type: heading
    id: se-sbagli
    title: "Se sbagli a scrivere"

  - type: text
    text: >-
      Ci sono due rimedi, uno piccolo e uno grande.

  - type: list
    items:
      - "**Cancella**, il tasto col bordo accanto allo zero: toglie quello che hai scritto **in questo turno**, tutto insieme, e lo riscrivi. Il tavolo resta a chi c'era."
      - "**Indietro**, in fondo al tastierino: per tornare a un turno già passato. Lo trovi spiegato qui sotto."

  - type: heading
    id: rileggere-e-ripartire
    title: "Tornare indietro, e ripartire da un turno"

  - type: text
    text: >-
      In fondo al tastierino ci sono **Indietro** e **Avanti**, con in mezzo a
      che punto sei: «turno 6 di 8». Servono a scorrere la partita un turno
      alla volta.

  - type: shot
    shot: referto-tpa-rileggi
    caption: "Un turno del passato riletto con «Indietro»: sopra i giocatori c'è scritto che qui non si scrive, e il tastierino è spento."

  - type: text
    text: >-
      Mentre rileggi **non si scrive niente**: lo dice la riga sopra i
      giocatori, e il tastierino è tutto spento. Vedi chi era al tavolo, cosa
      aveva scritto, e i triangoli e il TPA **di quel momento**. Con «Avanti»
      torni al turno in corso. Il tuo avversario non si accorge di niente.

  - type: text
    text: >-
      Se ti accorgi che un turno del passato è sbagliato, l'unico tasto acceso
      è **Riparti da questo turno…**

  - type: shot
    shot: referto-tpa-riparti
    caption: "Prima di ripartire, il foglio dice quale turno si riapre e, barrati, quali turni escono dal referto."

  - type: steps
    items:
      - title: "Tocca «Riparti da questo turno…»"
        text: >-
          Si apre un foglio che ti dice cosa succede: quel turno si riapre
          **vuoto**, e i turni scritti dopo **escono dal referto**. Li vedi
          elencati, barrati.
      - title: "Conferma, oppure «Resta a guardare»"
        text: >-
          Se confermi, triangoli e TPA si ricalcolano fino a quel punto e
          riprendi ad annotare da lì. Se un turno tolto aveva chiuso un
          triangolo, quel triangolo esce anche dal punteggio della partita.

  - type: note
    tone: warning
    title: "Dopo non si torna avanti"
    text: >-
      I turni che escono non si recuperano: vanno riscritti. Per questo il
      foglio te li fa vedere prima. Se volevi solo controllare, «Resta a
      guardare» non tocca niente.

  - type: heading
    id: il-foglio
    title: "Il referto, turno per turno"

  - type: text
    text: >-
      Sotto il tastierino — a fianco, su uno schermo largo — c'è il
      **referto**: tutta la partita, triangolo per triangolo e turno per
      turno. Serve durante la partita per controllare di non aver saltato
      niente, e dopo per rivedere com'è andata.

  - type: shot
    shot: referto-tpa-foglio
    caption: "Il referto turno per turno: le bilie della spaccata piccole in alto, il totale, la lettera. Il cerchio verde è un triangolo vinto."

  - type: text
    text: >-
      Si legge come il referto di carta. **¹3 M** vuol dire: una bilia sulla
      spaccata, tre in tutto, poi un tiro sbagliato. Un numero dentro un
      **cerchio** è il turno che ha vinto il triangolo. Tutti i segni sono
      spiegati in «Cosa vuol dire ogni lettera».

  - type: heading
    id: referto-chiuso
    title: "A partita finita: il referto chiuso"

  - type: text
    text: >-
      Quando avete finito, **Chiudi il referto**: su telefono è in fondo alla
      pagina, su uno schermo largo in alto a destra. Ti chiede conferma,
      perché dopo non si annota più. Il risultato della partita segue la
      strada di sempre: va confermato da tutti e due.

  - type: shot
    shot: referto-tpa-chiuso
    caption: "Il referto chiuso: chi ha vinto, da dove sono venuti gli errori di ciascuno, e i triangoli migliori."

  - type: text
    text: >-
      Da chiuso, il referto **racconta la partita**. In alto chi ha vinto, con
      triangoli e TPA. Poi due tabelle che mettono i giocatori a confronto,
      riga per riga.

  - type: list
    items:
      - "**Da dove vengono gli errori**: tiri sbagliati, posizione, difese, spaccate, tiri di sponda. È la parte che ti dice su cosa allenarti."
      - "**I triangoli migliori**: gli «spacca e chiude», i triangoli **chiusi in un turno** — cioè senza mai lasciare il tavolo, spacca e chiude compresi — e i triangoli perfetti."

  - type: text
    text: >-
      Sotto c'è il referto turno per turno, con i triangoli **ripiegati**:
      ogni riga dice chi l'ha vinto e il punteggio a quel punto. Tocca un
      triangolo per aprirlo, o «Apri tutti».

  - type: heading
    id: dove-si-vede
    title: "Dove ritrovi il tuo TPA"

  - type: text
    text: >-
      Il TPA di una partita sola dice poco: è nel tempo che diventa
      interessante. Lo ritrovi in due posti, dove si somma da solo.

  - type: list
    items:
      - "Nel tuo **profilo**, accanto all'Elo: il TPA di tutte le partite messe insieme."
      - "Nelle **statistiche** delle sfide individuali, con il dettaglio di dove nascono i tuoi errori e l'elenco delle partite con referto."

  - type: note
    tone: info
    title: "Non è la media dei TPA delle partite"
    text: >-
      Si sommano bilie ed errori di tutte le partite e si divide una volta
      sola. Una partita lunga pesa più di una corta, com'è giusto: altrimenti
      un triangolo fortunato varrebbe quanto un'ora di gioco pulito.

  - type: text
    text: >-
      Il TPA compare anche se il referto lo ha tenuto il tuo avversario: quello
      che è stato annotato riguarda anche te.

  - type: heading
    id: gli-errori
    title: "Cosa conta come errore"

  - type: list
    title: "Il TPA conta cinque tipi di errore"
    items:
      - "**Miss**: vedevi la bilia, hai provato a imbucarla, hai sbagliato. Due errori se il tiro era facile."
      - "**Spaccata**: bilia bianca in buca o fuori dal tavolo sulla spaccata."
      - "**Kick**: eri costretto al tiro di sponda e non è andata bene."
      - "**Difesa**: hai giocato di difesa e l'avversario poi ha imbucato, o ha sbagliato un tiro facile."
      - "**Posizione**: bilia bianca in buca, oppure hai imbucato qualcosa senza riuscire a chiudere il triangolo."

  - type: text
    text: >-
      L'ultimo è quello che sorprende di più: **imbucare senza chiudere è un
      errore**. Ha senso, se ci pensi — se avessi lasciato la bilia bianca dove
      serviva, avresti continuato. È anche il motivo per cui esistono le
      annotazioni piccole: quando non era colpa tua, si annota e non conta.

  - type: faq
    items:
      - q: "Non vedo il pulsante del referto."
        a: "Sia la spunta «Tengo il referto TPA» sia il pulsante «Prendi il referto TPA» compaiono solo se hai sbloccato la funzione — servono gare, campionati, partite amichevoli, esercizi ed esami già fatti — e solo in una partita a palla 8, palla 9 o palla 10 senza set. Il pulsante, in più, si vede solo a partita iniziata e prima che sia segnato il primo triangolo. Se avete già segnato, il pulsante sparisce: è la risposta più comune, e il motivo lo trovi scritto per esteso aprendo la pagina del referto. Se invece il referto lo ha già aperto il tuo avversario, il pulsante «Guarda il referto TPA» ti compare comunque, che tu abbia sbloccato o no."
      - q: "Posso aprirlo a partita già cominciata?"
        a: "Sì, ma solo finché il punteggio è fermo a zero a zero: il referto racconta la partita dall'inizio. Se avete già segnato dei triangoli, per quella partita non si può più. Se sai in anticipo di volerlo tenere, spunta «Tengo il referto TPA» prima di far partire la partita — la spunta c'è sia nell'avvio rapido sia nella partita nata da una proposta."
      - q: "Ho spuntato «Tengo il referto TPA» ma la partita è partita senza."
        a: "Succede se la disciplina o il formato non lo prevedono: il referto vale per palla 8, palla 9 e palla 10, e non copre le partite a set. In quel caso la partita parte lo stesso, senza referto — chiedere l'impossibile non ti fa perdere la partita."
      - q: "Lo può tenere il mio avversario al posto mio?"
        a: "Lo tiene chi lo apre, e resta suo per tutta la partita. Tu premi «Guarda il referto TPA» e lo vedi riempirsi da solo, senza ricaricare la pagina, ma non puoi scriverci."
      - q: "Ho premuto il tasto sbagliato."
        a: "Se è successo in questo turno, tocca «cancella», accanto allo zero: il turno torna vuoto e lo riscrivi. Se te ne accorgi dopo aver passato il tavolo, tocca «Indietro» fino a quel turno e poi «Riparti da questo turno…»: il foglio ti dice quali turni escono dal referto, e da lì riannoti."
      - q: "Ho toccato «Indietro» per sbaglio: ho perso qualcosa?"
        a: "No. Indietro e Avanti servono solo a rileggere: non cambiano niente, né nel referto né nel punteggio. Tocca «Avanti» finché torni al turno in corso. Si tolgono dei turni solo con «Riparti da questo turno…», e solo dopo la conferma."
      - q: "Che TPA è un buon TPA?"
        a: "Dipende dalla disciplina e dal livello. La cosa utile non è il numero in sé, ma come cambia il tuo nel tempo: è per quello che il referto esiste."
      - q: "Funziona anche nelle gare?"
        a: "Per ora no, solo nelle partite amichevoli."

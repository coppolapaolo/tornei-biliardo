title: "Il referto TPA"
section: giocare
kind: tutorial
audience: [giocatore]
minutes: 6
summary: "Nelle partite amichevoli puoi annotare tutta la partita, non solo chi vince i triangoli, e ottenere il TPA: la percentuale di azioni riuscite."
screens: [individual_match.tpa_referto]
related: [partite_amichevoli, profilo_e_statistiche]

blocks:
  - type: text
    text: >-
      Di solito, di una partita resta un numero solo: 5 a 3. Ma due partite
      finite 5 a 3 possono essere state due partite diversissime. Il **referto
      TPA** serve a raccontare anche il resto: quante bilie hai imbucato e
      perché ogni turno è finito.

  - type: text
    text: >-
      Alla fine ne esce un numero, il **TPA**, che si legge come una
      percentuale di azioni riuscite. Un TPA di **.750** vuol dire che tre
      volte su quattro quello che hai fatto al tavolo è andato a buon fine. È
      lo stesso conto che si usa nel biliardo americano professionistico.

  - type: note
    tone: info
    title: "Si sblocca con l'esperienza"
    text: >-
      Il referto non compare subito. Si sblocca quando hai già giocato gare,
      campionati, partite amichevoli, esercizi ed esami: non perché sia
      difficile da capire, ma perché va compilato **mentre giochi**, e conviene
      arrivarci quando l'app la conosci già bene.

  - type: heading
    id: aprire
    title: "Aprire il referto"

  - type: text
    text: >-
      Il referto va aperto **prima del primo triangolo**: racconta la partita
      dall'inizio, quindi a triangoli già segnati non si apre più. Di qui le due
      strade per prenderlo, secondo come è nata la partita.

  - type: text
    text: "**Se stai facendo un avvio rapido:**"

  - type: steps
    items:
      - title: "Nel modulo, spunta «Tengo il referto TPA»"
        text: >-
          È sopra il pulsante «Inizia a segnare», e compare solo se hai
          sbloccato la funzione. L'avvio rapido porta dritti al segnapunti,
          dove la prima cosa che si fa è segnare: se non lo chiedi lì, dopo il
          primo triangolo è tardi.
      - title: "Tocca «Inizia a segnare»"
        text: >-
          La partita nasce con il referto già aperto e ti trovi direttamente
          sulla schermata del referto, pronto per annotare la spaccata.

  - type: text
    text: "**Se la partita è nata da una proposta:**"

  - type: steps
    items:
      - title: "Apri la partita e premi «Inizia»"
        text: >-
          Il referto vale per le partite amichevoli a **palla 8, palla 9 e
          palla 10**. Nelle altre discipline il TPA non si calcola, e nelle
          partite a set non si applica.
      - title: "Tocca «Prendi il referto TPA»"
        text: >-
          Il pulsante è sotto il punteggio. Anche qui va premuto prima di
          segnare il primo triangolo.
      - title: "Conferma con «Apri il referto»"
        text: >-
          Da questo momento il referto è tuo: lo tieni tu per tutta la partita.
          Il tuo avversario trova «Guarda il referto TPA» e vede la stessa
          schermata riempirsi da sola, ma non può scriverci.

  - type: note
    tone: warning
    title: "I triangoli non si segnano più a mano"
    text: >-
      Con il referto aperto, il segnapunti normale sparisce. Non è una
      dimenticanza: i triangoli vinti li registra il referto, così non devi segnare
      due volte la stessa cosa e il punteggio non può mai discordare da quello
      che hai annotato.

  - type: heading
    id: chi-lo-vede
    title: "Chi lo vede, e come cambia il pulsante"

  - type: text
    text: >-
      Il pulsante sotto il punteggio della partita non dice la stessa cosa a
      tutti e due i giocatori, e cambia parole man mano che la partita va
      avanti.

  - type: list
    items:
      - "**Prendi il referto TPA**: il referto non c'è ancora e puoi aprirlo tu."
      - "**Apri il referto TPA**: il referto è aperto e lo tieni tu. Di qui si annota."
      - "**Guarda il referto TPA**: il referto lo tiene il tuo avversario. Lo vedi riempirsi, ma non ci scrivi."
      - "**Rivedi il referto TPA**: il referto è chiuso. Si rilegge e basta."

  - type: note
    tone: info
    title: "Se lo apre l'avversario, lo vedi comunque"
    text: >-
      Da sbloccare c'è solo la mossa di **prendere** il referto. Guardarne uno
      no: se lo ha aperto il tuo avversario, la partita è anche tua, e il
      pulsante «Guarda il referto TPA» ti compare anche se tu non hai sbloccato
      niente.

  - type: note
    tone: tip
    title: "Non serve ricaricare la pagina"
    text: >-
      Chi guarda vede il referto riempirsi da solo, un tocco dopo l'altro,
      senza dover toccare niente. E quando chi lo compila lo chiude, la pagina
      di chi guarda se ne accorge da sola.

  - type: heading
    id: come-si-compila
    title: "Come si compila"

  - type: shot
    shot: referto-tpa
    caption: "Il referto TPA durante la partita: i due giocatori con il loro TPA, la casella del turno e il tastierino."

  - type: text
    text: >-
      In alto ci sono i due giocatori. Quello **scuro** è chi sta al tavolo
      adesso. Accanto al nome trovi il suo TPA e, più piccolo, quante bilie ha
      imbucato (**B**) e quanti errori ha fatto (**E**). Nel cerchio a destra i
      triangoli vinti.

  - type: text
    text: >-
      Sotto ci sono due caselle. Nella **casella chiara** si scrive quante
      bilie sono entrate e perché il turno è finito. Nella **casella scura**,
      solo i falli. Sono le stesse due caselle del referto di carta.

  - type: steps
    items:
      - title: "Quante bilie ha imbucato"
        text: >-
          Premi il numero. Se è il turno di spaccata i numeri si premono
          **due volte**: prima quante ne sono entrate sulla spaccata, poi
          quante in tutto nel turno.
      - title: "Perché il turno è finito"
        text: >-
          **M** se ha sbagliato un tiro che voleva imbucare, **S** se ha
          giocato di difesa, **K** se era costretto a un tiro di sponda perché
          non vedeva la bilia.
      - title: "Se c'è stato un fallo"
        text: >-
          **P** se la bilia bianca è finita in buca o fuori dal tavolo, **N**
          se non ha colpito regolarmente la bilia designata.
      - title: "Se ha vinto il triangolo"
        text: >-
          Premi **G**. Se ha imbucato tutte le bilie rimaste non serve: il
          referto se ne accorge da solo.
      - title: "Passa il tavolo"
        text: >-
          Tocca il nome dell'altro giocatore. Il turno si chiude e comincia il
          suo.

  - type: note
    tone: tip
    title: "Il tastierino ti guida"
    text: >-
      Non devi ricordarti cosa si può premere e cosa no: i tasti che in quel
      momento non hanno senso sono spenti. Se hai sbagliato, **Annulla
      l'ultimo tocco** torna indietro di un passo, quante volte vuoi.

  - type: heading
    id: annotazioni-piccole
    title: "Le tre annotazioni piccole"

  - type: text
    text: >-
      Sotto le lettere grandi ce ne sono tre piccole. Servono a non addebitare
      un errore a chi non l'ha commesso, e sono ciò che rende il TPA giusto
      invece che approssimativo.

  - type: options
    items:
      - name: "n"
        text: >-
          Il tiro sbagliato era **facile**, più facile di un tiro dal
          dischetto. Vale doppio: se sbagli una cosa semplice, il TPA lo dice.
      - name: "x"
        text: >-
          La difesa era **premeditata**: non stavi provando a chiudere il triangolo,
          quindi non è un errore di posizione.
      - name: "p"
        text: >-
          Era un **push out**, la giocata libera subito dopo la spaccata.

  - type: heading
    id: il-foglio
    title: "Rileggere la partita"

  - type: text
    text: >-
      In fondo alla pagina c'è **il foglio**: tutta la partita, triangolo per triangolo e
      turno per turno. Serve durante la partita per controllare di non aver
      saltato niente, e dopo per rivedere com'è andata.

  - type: shot
    shot: referto-tpa-foglio
    caption: "Il foglio del referto: ogni riga è una visita al tavolo, con le bilie imbucate e il motivo per cui il turno è finito."

  - type: text
    text: >-
      Quando avete finito, **Chiudi il referto**. Da quel momento si legge e
      basta. Il risultato della partita segue la strada di sempre: va
      confermato da tutti e due.

  - type: heading
    id: dove-si-vede
    title: "Dove ritrovi il tuo TPA"

  - type: text
    text: >-
      Il TPA di una partita sola dice poco: è nel tempo che diventa
      interessante. Lo ritrovi in due posti, dove si somma da solo.

  - type: list
    items:
      - "Nel tuo **profilo**, accanto all'Elo: il TPA di tutte le partite messe insieme."
      - "Nelle **statistiche** dei match amichevoli, con il dettaglio di dove nascono i tuoi errori e l'elenco delle partite con referto."

  - type: note
    tone: info
    title: "Non è la media dei TPA delle partite"
    text: >-
      Si sommano bilie ed errori di tutte le partite e si divide una volta
      sola. Una partita lunga pesa più di una corta, com'è giusto: altrimenti
      un triangolo fortunato varrebbe quanto un'ora di gioco pulito.

  - type: text
    text: >-
      Il TPA compare anche se il referto lo ha tenuto il tuo avversario: quello
      che è stato annotato riguarda anche te.

  - type: heading
    id: gli-errori
    title: "Cosa conta come errore"

  - type: list
    title: "Il TPA conta cinque tipi di errore"
    items:
      - "**Miss**: vedevi la bilia, hai provato a imbucarla, hai sbagliato. Due errori se il tiro era facile."
      - "**Spaccata**: bilia bianca in buca o fuori dal tavolo sulla spaccata."
      - "**Kick**: eri costretto al tiro di sponda e non è andata bene."
      - "**Difesa**: hai giocato di difesa e l'avversario poi ha imbucato, o ha sbagliato un tiro facile."
      - "**Posizione**: bilia bianca in buca, oppure hai imbucato qualcosa senza riuscire a chiudere il triangolo."

  - type: text
    text: >-
      L'ultimo è quello che sorprende di più: **imbucare senza chiudere è un
      errore**. Ha senso, se ci pensi — se avessi lasciato la bilia bianca dove
      serviva, avresti continuato. È anche il motivo per cui esistono le
      annotazioni piccole: quando non era colpa tua, si annota e non conta.

  - type: faq
    items:
      - q: "Non vedo il pulsante del referto."
        a: "«Prendi il referto TPA» compare solo se hai sbloccato la funzione — servono gare, campionati, partite amichevoli, esercizi ed esami già fatti — e solo a partita iniziata, in una partita a palla 8, palla 9 o palla 10 senza set, prima che sia segnato il primo triangolo. Se avete già segnato, il pulsante sparisce: è la risposta più comune, e il motivo lo trovi scritto per esteso aprendo la pagina del referto. Se invece il referto lo ha già aperto il tuo avversario, il pulsante «Guarda il referto TPA» ti compare comunque, che tu abbia sbloccato o no."
      - q: "Posso aprirlo a partita già cominciata?"
        a: "No. Il referto racconta la partita dall'inizio, quindi va aperto prima del primo triangolo. Se avete già segnato dei triangoli, per quella partita non si può più: se sai in anticipo di volerlo tenere, spunta «Tengo il referto TPA» nel modulo dell'avvio rapido."
      - q: "Ho spuntato «Tengo il referto TPA» ma la partita è partita senza."
        a: "Succede se la disciplina o il formato scelti non lo prevedono: il referto vale per palla 8, palla 9 e palla 10, e non copre le partite a set. In quel caso la partita parte lo stesso, senza referto — chiedere l'impossibile non ti fa perdere la partita."
      - q: "Lo può tenere il mio avversario al posto mio?"
        a: "Lo tiene chi lo apre, e resta suo per tutta la partita. Tu premi «Guarda il referto TPA» e lo vedi riempirsi da solo, senza ricaricare la pagina, ma non puoi scriverci."
      - q: "Ho premuto il tasto sbagliato."
        a: "«Annulla l'ultimo tocco» torna indietro di un passo. Puoi premerlo più volte di seguito: torna indietro anche di un triangolo intero, punteggio compreso."
      - q: "Che TPA è un buon TPA?"
        a: "Dipende dalla disciplina e dal livello. La cosa utile non è il numero in sé, ma come cambia il tuo nel tempo: è per quello che il referto esiste."
      - q: "Funziona anche nelle gare?"
        a: "Per ora no, solo nelle partite amichevoli."

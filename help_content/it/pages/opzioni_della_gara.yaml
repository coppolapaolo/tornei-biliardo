title: "Tutte le opzioni di una gara"
section: organizzare
kind: riferimento
audience: [direttore]
minutes: 8
summary: "Ogni campo del modulo di creazione, cosa cambia davvero e quale valore scegliere se non sei sicuro."
screens: [admin.competition.create_gara_standalone, admin.competition.edit_gara]
related: [creare_una_gara, formati_di_gioco, abbinamenti, classifiche]

blocks:
  - type: text
    text: >-
      Il modulo di creazione è diviso in quattro passaggi. Qui c'è ogni campo,
      con il valore consigliato quando la scelta non è ovvia. Se stai creando
      la tua prima gara, questa pagina puoi anche saltarla: i valori proposti
      funzionano.

  - type: shot
    shot: gara-nuova
    caption: "I quattro passaggi: informazioni pubbliche, struttura, formato del match, riepilogo."

  - type: heading
    id: informazioni
    title: "1. Informazioni pubbliche"

  - type: text
    text: "Quello che vedranno i giocatori negli elenchi e sulla scheda della gara."

  - type: options
    items:
      - name: "Nome competizione"
        values: "obbligatorio"
        text: "Come comparirà negli elenchi. Meglio riconoscibile che formale: «Serata palla 9 del giovedì» funziona benissimo."
      - name: "Disciplina"
        values: "obbligatorio · palla 8, palla 9, palla 10, one pocket, 14.1, bank pool, rotation"
        text: "Il gioco. Determina solo come viene mostrata la gara: le regole al tavolo le conoscete voi."
        hint: gara.disciplina
      - name: "Data e ora inizio"
        values: "obbligatoria la data"
        text: >-
          L'ora è quella di ritrovo. Dentro un campionato le date devono essere
          in ordine crescente rispetto al numero della gara.
      - name: "Luogo / Sala"
        text: >-
          Scegliendo una sala registrata la gara eredita i suoi tavoli e potrai
          assegnarli durante la serata. Puoi anche scrivere un luogo a mano.
      - name: "Tavoli disponibili"
        text: >-
          Quali tavoli della sala userete davvero stasera. Se la sala ne ha
          otto ma stasera ne avete quattro, indica quelli: l'app assegnerà le
          partite solo a quelli.
        hint: gara.tavoli
      - name: "Quota iscrizione"
        text: "Informativa: compare sulla scheda. L'app non gestisce pagamenti."
      - name: "Note / descrizione"
        text: "Testo libero: formula della serata, premi, cosa portare."

  - type: heading
    id: struttura
    title: "2. Struttura della gara"

  - type: note
    tone: info
    title: "Con eliminazione diretta e doppio KO il modulo si accorcia"
    text: >-
      Scegliendo un formato a tabellone sei campi spariscono dal modulo: numero
      di turni, gestione forfait, se i giocatori sono dispari, evita
      reincontri, sistema di classifica e spareggio. Non è una semplificazione
      di comodo: su un tabellone quelle scelte non cambiavano nulla, e l'app le
      decideva comunque da sé. Al loro posto compare il riquadro **Opzioni del
      tabellone**, con le voci che invece contano.

  - type: options
    items:
      - name: "Algoritmo di abbinamento"
        values: "Amalfi (consigliato) · Casuale · Girone all'italiana · Eliminazione diretta · Doppio KO"
        text: >-
          Come si formano le coppie a ogni turno. **Amalfi** è pensato per le
          gare a turni di circolo: tutti giocano tutti i turni e gli
          abbinamenti seguono la classifica. Le altre sono descritte in [Come
          vengono formate le coppie](/aiuto/approfondimenti/abbinamenti).
        hint: gara.strategia
      - name: "Numero di turni"
        values: "consigliato 3"
        text: >-
          Quanti giri di partite. Con eliminazione diretta e doppio KO il campo
          non compare: il numero di turni lo fissa il sorteggio, sugli iscritti
          che si presentano davvero. Prima del sorteggio l'app ne mostra solo
          una stima, calcolata sulla capienza massima.
      - name: "Gestione forfait"
        values: "Vincita a tavolino (predefinito) · Escludi dal turno"
        text: >-
          Cosa fare di chi abbandona a metà gara. Con **vincita a tavolino**
          resta negli abbinamenti e i suoi avversari vincono senza giocare —
          più semplice, ma un avversario si ritrova con una partita vuota. Con
          **escludi** esce dagli abbinamenti: più pulito, ma cambia la parità e
          può far scattare la gestione del numero dispari. Sui tabelloni non si
          chiede: il ritiro è sempre una vincita a tavolino, perché una volta
          sorteggiato il tabellone non si tocca più e togliere qualcuno
          lascerebbe una casella vuota.
        hint: gara.forfait
      - name: "Min partecipanti"
        values: "obbligatorio · consigliato 4"
        text: >-
          Sotto questa soglia l'app non fa partire il primo turno. Sui
          tabelloni c'è un minimo di formato che non si può scendere: **4** per
          l'eliminazione diretta, **8** per il doppio KO. Se il valore era più
          basso, l'app lo alza da sé.
      - name: "Max partecipanti"
        values: "facoltativo · obbligatorio sui tabelloni"
        text: >-
          Se impostato, oltre quel numero si finisce in lista d'attesa. Sui
          formati a tabellone diventa obbligatorio: dichiara la capienza e
          serve a dare la stima dei turni.
      - name: "Evita reincontri"
        values: "consigliato attivo"
        text: >-
          Impedisce che due giocatori si affrontino due volte nella stessa
          gara. Con il numero di turni tipico è quasi sempre possibile
          rispettarlo. Sui tabelloni non si chiede: chi perde esce, quindi un
          reincontro non può proprio capitare. Nel doppio KO l'unico possibile
          — fra un ripescato e chi lo aveva battuto — è previsto dal formato.
        hint: gara.anti_rematch
      - name: "Gioco con handicap"
        values: "predefinito no"
        text: >-
          Dichiara che in questa gara i giocatori non partono alla pari: il
          vantaggio lo concordate voi al tavolo, l'app non toglie né aggiunge
          triangoli. Quello che cambia è il **rating**: si aggiorna solo nelle
          partite fra giocatori della stessa [categoria](/aiuto/organizzare/categorie), e
          resta fermo in tutte le altre. Va deciso **prima di aprire le
          iscrizioni**: chi si iscrive ha diritto di sapere se la gara è con
          handicap.
        hint: gara.handicap
      - name: "Primo turno"
        values: "Casuale (predefinito) · Rating · Classifica"
        text: >-
          Come si formano le coppie del **primo** turno, quando non esiste
          ancora una classifica. **Casuale** è il sorteggio puro. **Rating**
          accoppia per forza dichiarata, in modo che i più forti non si
          incontrino subito. **Classifica** usa la classifica del campionato.
        hint: gara.primo_turno
      - name: "Se giocatori dispari"
        values: "Riposo · Riposo con esercizio · Trio · Lista d'attesa"
        text: >-
          Cosa succede quando i giocatori sono in numero dispari e uno
          resterebbe senza avversario. Spiegate una per una in [Quando i
          giocatori sono dispari](/aiuto/approfondimenti/numero_dispari). Sui
          tabelloni non si chiede: chi resta fuori dal conto passa
          direttamente al turno successivo, ed è il modo in cui un tabellone si
          costruisce, non una politica da scegliere.
        hint: gara.dispari
      - name: "Sistema di classifica"
        values: "Vittorie (predefinito) · Triangoli"
        text: >-
          Come si ordinano i giocatori. **Vittorie** conta le partite vinte e,
          a parità, la differenza triangoli. **Triangoli** conta i triangoli totali. Sui
          tabelloni il campo non compare, perché la classifica è per
          **posizione** e non c'è altro da scegliere. Vedi [Come si calcolano
          le classifiche](/aiuto/approfondimenti/classifiche).
        hint: gara.classifica
      - name: "Spareggio"
        values: "attivo fino al 3° posto"
        text: >-
          Se e fino a che posizione risolvere i pari merito con una prova
          aggiuntiva. Dal podio in giù, di norma, i pari merito si lasciano
          tali. Sui tabelloni non si chiede: lì i pari merito per banda — i due
          semifinalisti sconfitti, i quattro quartifinalisti — sono il
          risultato voluto, e nessuno spareggio scatterebbe.
        hint: gara.spareggio

  - type: heading
    id: tabellone
    title: "Le opzioni del tabellone"

  - type: text
    text: >-
      Scegliendo eliminazione diretta o doppio KO compare un riquadro che con
      gli altri formati non esiste. Sono le sole scelte che su un tabellone
      cambiano davvero qualcosa.

  - type: options
    items:
      - name: "Evita incontri fra compagni di squadra nei primi turni"
        values: "predefinito no"
        text: >-
          Il sorteggio allontana il più possibile chi gioca per la stessa
          squadra. Accendendola, a chi si iscrive viene chiesto per chi gioca.
          Vedi [Le squadre](/aiuto/organizzare/squadre).
      - name: "Finale per il 3°/4° posto"
        values: "solo dove il terzo posto è un pari merito"
        text: >-
          I due semifinalisti sconfitti si giocano il terzo posto, nello stesso
          turno della finale. Compare con l'eliminazione diretta e con il
          doppio KO **a gironi**; nel doppio KO pieno no, perché lì il terzo è
          chi perde la finale dei ripescati, e non c'è ambiguità da sciogliere.
      - name: "Fase a gironi"
        values: "solo doppio KO · nessuna (predefinito) · gironi da 8 · gironi da 16"
        text: >-
          La formula lunga: si gioca a doppio KO dentro gironi paralleli, e
          ogni girone qualifica quattro giocatori — due imbattuti e due
          ripescati — a un tabellone finale a eliminazione diretta.

  - type: heading
    id: formato
    title: "3. Formato del match"

  - type: text
    text: >-
      Quanto dura una partita. È la scelta che più incide sulla durata della
      serata.

  - type: options
    items:
      - name: "Distanza"
        values: "es. 4, 5, 7"
        text: >-
          Quanti triangoli servono per vincere la partita. **Al 4** vuol dire che
          vince chi arriva prima a 4: al massimo 7 triangoli. Salire di una unità
          allunga la serata di parecchio.
        hint: gara.distanza
      - name: "Numero esatto di triangoli"
        values: "predefinito no · non c'è sui tabelloni"
        text: >-
          Se attivo, si giocano **sempre** tutti i triangoli indicati, anche quando
          il risultato è già deciso. Serve quando conta il totale dei triangoli e
          non chi vince — cioè con il sistema di classifica «Triangoli». Con un
          numero pari, la partita può finire in parità. Sui formati a tabellone
          la casella non compare: si gioca sempre a chi arriva prima, e al suo
          posto c'è una nota che spiega il perché.
        hint: gara.numero_esatto
      - name: "Partita a set"
        values: "predefinito no"
        text: >-
          La partita si divide in set: si vince un set arrivando alla distanza,
          e si vince la partita conquistando abbastanza set. Allunga
          parecchio: adatta a finali o serate dedicate. Anche qui, sui
          tabelloni il set si vince arrivando primi: la scelta di giocarli
          tutti non viene chiesta.
        hint: gara.multiset
      - name: "Regola di inizio"
        values: "predefinito «Primo giocatore» · dentro un campionato si può ereditare"
        text: >-
          Chi esegue il primo tiro della partita. Con **Primo giocatore** apre
          sempre il primo dei due, senza sorteggio. Con **Acchito** il
          segnapunti fa due domande prima di lasciar segnare: chi ha vinto
          l'acchito, e chi apre — perché chi vince l'acchito **sceglie** chi
          apre, e può mandare al tavolo l'avversario.
        hint: gara.regola_inizio
      - name: "Chi spacca"
        values: "predefinito «A turno» · dentro un campionato si può ereditare"
        text: >-
          Come passa il tiro di apertura da un triangolo al successivo. **A
          turno** è la regola standard e alterna a ogni triangolo; **A turno
          ogni due** dà due triangoli a testa; **Spacca chi ha vinto** e
          **Spacca chi ha perso** seguono invece il risultato del triangolo
          prima. Vale per tutte le partite della gara: sulla singola partita
          non si cambia.
        hint: gara.chi_spacca

  - type: note
    tone: warning
    title: "Queste due si scelgono prima, non dopo"
    text: >-
      Una volta che la gara è cominciata i due campi si bloccano. Cambiarli a
      metà riscriverebbe chi ha eseguito il tiro di apertura nei triangoli già
      giocati — e con esso quali di quei triangoli risultano chiusi
      «spaccando».

  - type: note
    tone: tip
    title: "Quanto dura una serata"
    text: >-
      Regola pratica: con **8 giocatori, 3 turni, al 4** e 4 tavoli si sta
      dentro le due ore e mezza. Ogni turno in più aggiunge circa
      quarantacinque minuti; ogni unità di distanza in più, una ventina di
      minuti a turno.

  - type: heading
    id: riepilogo
    title: "4. Riepilogo e conferma"

  - type: text
    text: >-
      L'ultimo passaggio ricapitola tutte le scelte in una schermata sola. Vale
      la pena leggerla: è l'ultimo momento comodo per accorgersi di una
      distanza sbagliata o di una data che non torna.

  - type: heading
    id: dopo
    title: "Cosa si può ancora cambiare dopo"

  - type: options
    items:
      - name: "Gara in bozza"
        values: "tutto"
        text: "Nessuno si è ancora iscritto: puoi cambiare qualunque campo."
      - name: "Iscrizioni aperte"
        values: "quasi tutto"
        text: >-
          Date, sala, note e capienza restano modificabili. Cambiare formato e
          abbinamenti è tecnicamente possibile ma sconsigliato: chi si è già
          iscritto lo ha fatto conoscendo le regole di prima.
      - name: "Gara avviata"
        values: "poco"
        text: >-
          Il formato di gioco è congelato. Restano modificabili le informazioni
          di contorno (note, tavoli) e, con le dovute cautele, i risultati non
          ancora bloccati.

  - type: faq
    items:
      - q: "Cosa scelgo se non ho idea?"
        a: "Amalfi, 3 turni, distanza 4, classifica Vittorie, dispari con «Riposo», evita reincontri attivo. È la configurazione da serata di circolo."
      - q: "Voglio un torneo a eliminazione: cosa cambia?"
        a: "Scegli «Eliminazione diretta» e il modulo si accorcia: spariscono numero di turni, gestione forfait, giocatori dispari, evita reincontri, sistema di classifica, spareggio e numero esatto di triangoli. Compare invece il riquadro «Opzioni del tabellone». Il massimo iscritti diventa obbligatorio, e la classifica è per posizione."
      - q: "Ho scelto il tabellone e metà delle opzioni è sparita. Ho fatto un danno?"
        a: "No: quelle opzioni su un tabellone non avevano effetto. Prima si chiedevano e la risposta veniva ignorata in silenzio; ora non si chiedono più. Se torni a una strategia a turni, ricompaiono tutte."
      - q: "Perché non riesco a selezionare «Trio»?"
        a: "Il trio è possibile solo per distanze fra 2 e 7 e non con le strategie a tabellone. Se la distanza è fuori da quell'intervallo, l'opzione non è disponibile."
      - q: "L'handicap incide sulle classifiche?"
        a: "Sì: la classifica usa i punteggi effettivi, cioè quelli che avete scritto dopo aver applicato l'handicap. Il rating personale invece si muove solo nelle partite fra giocatori della stessa categoria."

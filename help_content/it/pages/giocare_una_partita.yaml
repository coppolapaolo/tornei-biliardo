title: "Giocare una partita e segnare i punti"
section: giocare
kind: tutorial
audience: [giocatore]
minutes: 5
summary: "Il segnapunti: un tasto per giocatore, si preme dopo ogni triangolo. Come correggere un errore e cosa succede quando la partita finisce."
screens: [admin.match.match_detail]
related: [seguire_la_gara, formati_di_gioco]

blocks:
  - type: text
    text: >-
      Questa è la schermata che userai di più: la pagina della partita. È fatta
      per essere usata in piedi, con una mano, mentre l'altra tiene la stecca.

  - type: heading
    id: aprire
    title: "Aprire la partita"

  - type: text
    text: >-
      Quando il turno parte, la tua partita compare nella tua home **dentro la
      scheda della gara** — sotto **«Le tue gare»**, con il turno, l'avversario
      e il tavolo — e il pulsante **Gioca la tua partita** ti porta al
      segnapunti. La ritrovi nella pagina della gara, dove il pulsante si
      chiama **Inserisci risultato**. Ricevi anche una notifica. Toccala e sei
      dentro.

  - type: note
    tone: info
    title: "Se il tavolo non è ancora assegnato"
    text: >-
      La partita si apre lo stesso: al posto del numero c'è la riga «Il tavolo
      non è ancora assegnato», e il numero compare da solo appena se ne libera
      uno. Non c'è niente da aspettare per cominciare a segnare.

  - type: shot
    shot: partita-segnapunti
    caption: "La pagina della partita: in alto il punteggio, al centro il segnapunti, in fondo l'elenco dei triangoli già giocati."

  - type: heading
    id: leggere
    title: "Leggere la schermata"

  - type: options
    title: "Cosa c'è, dall'alto in basso"
    items:
      - name: "Il pallino «In corso»"
        text: "Rosso e lampeggiante: vuol dire che la partita è viva e che il punteggio si aggiorna in tempo reale anche per chi la guarda da lontano."
      - name: "Il punteggio"
        text: "I due numeri grandi. Sotto ciascuno c'è il nome del giocatore e il suo rating."
        hint: partita.punteggio
      - name: "La riga della distanza"
        text: "Per esempio «Al 5 triangoli · 7 triangoli giocati»: ti ricorda a quanto si vince e quanti triangoli sono già stati giocati in tutto."
        hint: gara.distanza
      - name: "Il segnapunti"
        text: "I due tasti grandi «+1», uno per giocatore. Il tuo è quello pieno, scuro: si riconosce senza leggere il nome."
        hint: partita.segnapunti
      - name: "Annulla ultimo triangolo"
        text: >-
          Toglie l'ultimo punto assegnato. Serve quando si preme il tasto
          sbagliato, e resta a portata anche a distanza raggiunta e a partita
          appena conclusa, finché il direttore non valida: è proprio il triangolo che
          chiude la partita quello in cui sbagliare costa di più.
      - name: "Dichiara forfait"
        text: "Da usare solo se la partita si interrompe davvero: assegna all'avversario tutti i triangoli che mancano."
        hint: partita.forfait
      - name: "Triangoli giocati"
        text: "L'elenco di chi ha vinto ogni triangolo, con il punteggio progressivo. È il tabellino della partita."

  - type: heading
    id: segnare
    title: "Segnare un triangolo"

  - type: steps
    items:
      - title: "Finite il triangolo al tavolo"
        text: "Si gioca normalmente: l'app non entra nel merito delle regole del biliardo."
      - title: "Premi il tasto di chi ha vinto"
        text: >-
          Un solo tocco sul tasto **+1** con il nome del vincitore del triangolo.
          Non «+1 a me» e «-1 a lui»: si segna solo chi ha vinto.
        shot: partita-rack
      - title: "Controlla il punteggio in alto"
        text: >-
          Il numero grande cambia subito, e il triangolo compare in fondo
          all'elenco. Se il numero non è cambiato, il tocco non è arrivato:
          ripremi.
      - title: "Avanti fino alla distanza"
        text: >-
          Si va avanti così a ogni triangolo. Quando si arriva al numero stabilito
          i tasti **+1** si spengono e si passa alla conferma del risultato.

  - type: note
    tone: tip
    title: "Basta che segni uno dei due"
    text: >-
      Non serve che segnino entrambi i giocatori: il punteggio è uno solo e si
      aggiorna sul telefono di tutti e due. Mettetevi d'accordo su chi tiene il
      conto, di solito chi ha il telefono più comodo da raggiungere.

  - type: heading
    id: tabellone
    title: "Il tabellone: gira il telefono"

  - type: text
    text: >-
      Se appoggi il telefono alla sponda e lo giri in orizzontale, la pagina
      cambia da sola: diventa un tabellone a tutto schermo, con i due punteggi
      grandi al centro. Si legge da lontano, anche mentre giochi dall'altra
      parte del tavolo.

  - type: shot
    shot: partita-tabellone
    variant: landscape
    caption: "Il tabellone a telefono ruotato: il numero del tavolo in alto a sinistra, i due punteggi grandi, la pastiglia SPACCA su chi apre e i trattini dei triangoli sotto ogni punteggio."

  - type: list
    title: "Cosa cambia rispetto alla pagina normale"
    items:
      - "Si segna toccando la **metà del giocatore**: metà sinistra dello schermo, triangolo a chi sta a sinistra; metà destra, all'altro. Non c'è nessun tasto da cercare — il bersaglio è mezzo schermo, e si prende con una mano sola, anche senza guardare."
      - "La tua metà è quella con scritto **tu** accanto al nome."
      - "Sotto ogni nome c'è il **punteggio Elo** del giocatore: serve a capire con chi stai giocando prima ancora di cominciare. In una partita di gara è l'Elo delle gare, in una sfida individuale è quello che tiene conto anche delle sfide. Chi preferisce non mostrarlo lo spegne dalle impostazioni di [privacy](/aiuto/account/privacy_e_dati) — e allora sotto il suo nome non compare niente."
      - "Mentre giocate, in fondo resta il pulsante per **annullare l'ultimo triangolo**: con un bersaglio così grande un tocco per sbaglio è più facile, non meno. Alla distanza cede il posto ad «Accetta» e «Rifiuta», che fa la stessa cosa."
      - "Il punto arriva nello stesso posto della pagina normale: fra le due viste non c'è differenza per il punteggio."
      - "Sotto ogni punteggio i trattini dicono quanti triangoli mancano alla vittoria, senza doverli contare."
      - "In alto a sinistra, quando il tavolo è assegnato, c'è il suo **numero in evidenza**: serve a riconoscere il proprio tabellone attraversando una sala con otto biliardi. Accanto, l'ora in cui la partita è cominciata."
      - "In alto a destra il pallino rosso lampeggia finché si gioca; a partita ferma smette."

  - type: text
    text: >-
      Il tabellone resta anche quando la partita finisce: le due metà si
      spengono e in fondo compaiono **Accetta** e **Rifiuta**, mentre sopra c'è
      scritto chi ha vinto e con che punteggio. Non serve raddrizzare il
      telefono per confermare il risultato.

  - type: heading
    id: chi-spacca
    title: "Chi spacca, e i triangoli chiusi in una visita"

  - type: text
    text: >-
      Sopra il nome di chi deve eseguire il tiro di apertura compare la
      scritta **spacca**. Si sposta da sola dopo ogni triangolo, seguendo la
      regola scelta per la gara: non c'è niente da premere e niente da
      ricordare.

  - type: text
    text: >-
      I trattini sotto il punteggio non contano soltanto: quello che si è
      appena acceso si può **premere**. Un tocco lo marca come triangolo chiuso
      in una visita, cioè senza mai lasciare il tavolo all'avversario; un
      secondo tocco lo smarca, se hai sbagliato.

  - type: list
    title: "Cosa compare sul trattino"
    items:
      - "**B** se quel triangolo lo aveva aperto lui: ha spaccato e ha chiuso."
      - "**R** se lo ha chiuso rispondendo, cioè dopo che ad aprire era stato l'avversario."
      - "Niente, se non lo hai marcato. È il caso normale: la marcatura è facoltativa e non cambia il punteggio."

  - type: note
    tone: info
    title: "La distinzione fra B e R non si sceglie"
    text: >-
      Non ti viene chiesta: la app sa già chi aveva il tiro di apertura in quel
      triangolo, e decide da sé. A te basta premere il trattino.

  - type: text
    text: >-
      I due numeri finiscono nel tuo [profilo](/aiuto/account/profilo_e_statistiche),
      alla voce **Runout**.

  - type: heading
    id: acchito
    title: "Quando la gara si comincia con l'acchito"

  - type: text
    text: >-
      Se la regola di inizio è **Acchito**, prima del primo triangolo il
      tabellone fa due domande al posto del punteggio. In gara la sceglie il
      direttore; in una [sfida individuale](/aiuto/giocare/partite_amichevoli)
      la scegli tu, insieme al resto di come si gioca.

  - type: steps
    items:
      - title: "Chi ha vinto l'acchito?"
        text: "Tocca il nome di chi lo ha vinto."
      - title: "Chi esegue il tiro di apertura?"
        text: >-
          Lo sceglie chi ha vinto l'acchito, e **non deve essere lui**: può
          mandare al tavolo l'avversario. Se apre lui, non tocchi niente; se
          manda l'altro, tocca l'altro nome.
      - title: "Comincia"
        text: "Il tabellone compare, e si segna come sempre."

  - type: note
    tone: info
    title: "Se la gara non usa l'acchito non vedi niente"
    text: >-
      Con la regola **Primo giocatore** — che è quella predefinita — apre il
      primo dei due e le domande non compaiono affatto.

  - type: note
    tone: tip
    title: "Il telefono non si spegne"
    text: >-
      Finché il tabellone è aperto lo schermo resta acceso da solo: non devi
      toccarlo per tenerlo vivo, e quindi non rischi di segnare un triangolo
      che non c'è stato. Se il telefono si blocca lo stesso, il primo tocco
      dopo lo sblocco non conta: serve solo a riprendere in mano la partita.

  - type: note
    tone: info
    title: "Vale anche per le sfide individuali"
    text: >-
      Il tabellone è lo stesso: gira il telefono anche quando stai giocando una
      partita fuori dalle gare.

  - type: note
    tone: tip
    title: "Per tornare alla pagina normale"
    text: >-
      Raddrizza il telefono, e il tabellone sparisce da solo. Se preferisci
      restare in orizzontale ma rivedere il resto della partita — l'elenco dei
      triangoli, il forfait — tocca la **X** in alto a sinistra.

  - type: heading
    id: sbagli
    title: "Se sbagli"

  - type: text
    text: >-
      **Hai premuto il tasto sbagliato**: tocca **Annulla ultimo triangolo**. Puoi
      ripeterlo più volte, tornando indietro triangolo per triangolo.

  - type: text
    text: >-
      **La partita si è appena chiusa**: c'è ancora **Annulla ultimo triangolo**, nel
      riquadro verde. Toglie il triangolo sbagliato e riporta la partita in corso,
      così potete rigiocarlo. Vale finché il direttore non valida il risultato.

  - type: text
    text: >-
      **Il direttore ha già validato**: da quel momento non puoi più correggerla
      da solo. Chiamalo: può azzerare la partita e farvela reinserire. È fatto
      apposta: un risultato validato è entrato in classifica, e non deve poter
      cambiare senza che chi organizza lo sappia.

  - type: heading
    id: forfait
    title: "Forfait e abbandoni"

  - type: text
    text: >-
      Se un giocatore non può proseguire — deve andare via, si infortuna, non
      si è presentato — si usa **Dichiara forfait**. L'avversario riceve tutti
      i triangoli che mancavano alla distanza: se eravate 3-2 in una gara al 5, il
      risultato diventa 5-2. Il forfait si dichiara finché il turno dopo non è
      partito: da lì la partita appartiene a un turno chiuso, e serve il
      direttore di gara.

  - type: note
    tone: warning
    text: >-
      Il forfait non è annullabile dal giocatore. Se lo dichiari per sbaglio,
      serve il direttore di gara. Nel dubbio, chiedi a lui prima di premere.

  - type: heading
    id: fine
    title: "Quando la partita finisce"

  - type: text
    text: >-
      Raggiunta la distanza compare **Distanza raggiunta**: il punteggio non
      può più salire e resta solo da confermarlo. Chi ha vinto risulta
      d'accordo senza fare niente — non ha motivo di contestare il risultato
      che gli dà la vittoria — quindi la firma che manca è quella di chi ha
      perso, con i due pulsanti **Accetta** e **Rifiuta**.

  - type: note
    tone: tip
    title: "Se sei tu a segnare il triangolo che ti fa perdere, non ti si chiede altro"
    text: >-
      Spesso è chi perde a tenere il conto. Avendo già segnato il punto che
      chiude la partita a favore dell'altro, non gli viene chiesto di
      accettarlo una seconda volta: la partita si chiude subito. Lo stesso vale
      se a segnare è il direttore della gara, perché il suo punteggio è già
      quello ufficiale.

  - type: text
    text: >-
      **Rifiuta** non chiude niente: toglie l'ultimo triangolo e riporta il
      punteggio a un tocco dalla fine, così potete rimettervi d'accordo al
      tavolo e segnare di nuovo.

  - type: text
    text: >-
      Confermato il risultato la partita diventa **Conclusa**. Da quel momento:
      il risultato entra nella classifica del turno, il tavolo si libera per la
      partita successiva, e quando **tutte** le partite del turno sono finite il
      direttore può avviare il turno dopo. Al posto dei tasti **+1** resta un
      riquadro verde con il solo **Annulla ultimo triangolo**: se l'ultimo triangolo era
      sbagliato lo togli e la partita torna in corso, finché il direttore non
      valida.

  - type: shot
    shot: gara-turni
    caption: "Le partite del turno: quelle concluse mostrano il risultato con la coroncina accanto al vincitore."

  - type: faq
    items:
      - q: "Posso segnare i punti di una partita che non è la mia?"
        a: "No, solo il direttore di gara può farlo. Tu vedi tutte le partite, ma puoi intervenire solo sulla tua."
      - q: "Il punteggio non si aggiorna sul telefono dell'altro."
        a: "L'aggiornamento passa dalla rete: se la sala ha poco segnale può metterci qualche secondo. Ricaricando la pagina si allinea."
      - q: "Abbiamo giocato più triangoli del dovuto."
        a: "L'app non lo permette: al raggiungimento della distanza i tasti +1 si spengono. Se avete giocato triangoli in più, semplicemente non contano."
      - q: "Dobbiamo confermare il risultato in due?"
        a: "Servono le firme di tutti e due, ma quella di chi vince è automatica: la sola che vi resta da dare è quella di chi perde. E se è stato lui a segnare l'ultimo triangolo l'ha già data premendo, quindi non compare nessun pulsante. Quando compaiono «Accetta» e «Rifiuta», tocca a te."
      - q: "Che cos'è il numero del tavolo che vedo in alto?"
        a: "Il tavolo che il direttore vi ha assegnato per questa partita. Se non c'è, la sala non ha configurato i tavoli e vi mettete d'accordo sul posto."

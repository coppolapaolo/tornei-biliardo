title: "Gli esercizi"
section: giocare
kind: approfondimento
audience: [giocatore]
minutes: 4
summary: "Prove di abilità da eseguire da soli: servono ad allenarsi, a sbloccare traguardi e — dentro una gara — a decidere gli spareggi."
screens: [challenge.today, challenge.challenge_catalog, challenge.challenge_detail, challenge.training_session,
  challenge.training_summary,
  challenge.start_attempt, challenge.attempt_detail, challenge.create_challenge,
  challenge.edit_challenge, challenge.duplicate_challenge, challenge.challenge_statistics, player.challenge_detail]
related: [disegnare_un_drill, progressi, numero_dispari, esami]

blocks:
  - type: text
    text: >-
      Un esercizio ha regole fisse: una disposizione di bilie
      da imbucare, un tiro da ripetere, un obiettivo da raggiungere in un certo
      numero di tentativi. Si gioca **da soli**, e il risultato è un punteggio.

  - type: heading
    id: catalogo
    title: "Da dove si comincia: «Oggi» e il catalogo"

  - type: text
    text: >-
      La sezione **Esercizi** si apre su **«Oggi»**: non un elenco, ma il punto
      da cui ripartire. In cima c'è **«Riprendi da qui»**, l'ultimo esercizio su
      cui ti sei allenato, con com'è andata e il pulsante **«Comincia»**. Sotto
      trovi **«Per oggi»** — la proposta di cosa allenare, col motivo accanto —
      poi i tuoi **preferiti** e **i più provati**. La prima volta, quando una
      storia non ce l'hai ancora, al suo posto c'è l'invito a sceglierne uno.
      Se ti sei dato un obiettivo, la sua barra sta in cima: ne parla
      [Il tuo allenamento](/aiuto/giocare/il_tuo_allenamento).

  - type: shot
    shot: esercizi-oggi
    caption: "«Oggi»: la seduta lasciata a metà, i tuoi obiettivi, l'esercizio da riprendere, «Per oggi» e i più provati."

  - type: text
    text: >-
      **«Apri il catalogo»** porta a tutti gli esercizi. In alto la casella
      **«Cerca un esercizio»** lascia a schermo solo le prove che contengono
      quella parola, nel titolo o nelle istruzioni. Sotto, **Tutti**, **I miei**
      e **Preferiti**, e poi i filtri.

  - type: shot
    shot: challenge-catalogo
    caption: "Il catalogo filtrato per un'abilità: restano solo gli esercizi che la allenano."

  - type: options
    items:
      - name: "Abilità"
        values: "Fondamentali · Tiro · Battente · Posizione · Sponde · Difesa · Spaccata"
        text: >-
          Che cosa allena l'esercizio. È la risposta a «su cosa devo lavorare?».
        hint: esercizi.filtri
      - name: "Gesto"
        values: "stop · stun · follow · draw · spin · forza · bank · kick · jump · massé"
        text: >-
          Con che colpo si esegue. Lo stesso draw serve a un esercizio di
          posizione e a uno di difesa: per questo è un filtro a parte.
      - name: "Livello"
        values: "da 1 a 5"
        text: >-
          Quanto è difficile secondo chi l'ha creato: 1 per chi comincia.
      - name: "Voto"
        values: "da 3 in su · da 4 in su"
        text: >-
          Solo gli esercizi che chi li ha provati ha votato bene.

  - type: text
    text: >-
      Tocca un asse, poi una voce: i filtri **si sommano** — Posizione, col
      draw, di livello 2. La voce accesa, ritoccata, si spegne. Accanto al
      conteggio scegli l'ordine: **i più provati**, **voto**, **i più nuovi**.

  - type: note
    tone: info
    title: "Se un filtro non trova quasi niente"
    text: >-
      Abilità, gesto e livello li scrive chi ha creato l'esercizio, e sono
      facoltativi: un esercizio che non li ha compare solo senza filtri. Non è
      un errore, è un esercizio ancora da descrivere.

  - type: heading
    id: scheda
    title: "La scheda di un esercizio"

  - type: text
    text: >-
      Toccando una card si apre la scheda. In testata leggi chi l'ha creato, il
      **voto** e **quanti giocatori l'hanno provato**: i due numeri vanno letti
      insieme, perché un 4,8 dato da tre persone pesa meno di un 4,5 dato da
      duecento. Sotto la disposizione trovi le etichette — livello, abilità,
      gesti, come si registra — e **«Come si fa»**.

  - type: shot
    shot: esercizio-scheda
    caption: "La scheda: etichette, istruzioni, i tuoi tre numeri, il voto e le tue prove."

  - type: list
    items:
      - "**Media**, **Ultime tre** e **Record** sono i tuoi numeri su quell'esercizio. «Ultime tre» compare quando hai più di tre prove: dice se stai migliorando."
      - "Se l'esercizio ha delle **varianti** — destra e sinistra, posizioni A e B — i tuoi risultati restano separati, una riga per variante: la differenza fra i due lati è proprio la cosa da sapere."
      - "**Il tuo voto** si dà toccando una bilia da **1 a 5**. Puoi votare un esercizio **dopo averlo provato almeno una volta**; il voto si cambia quando vuoi, e toccando di nuovo la tua bilia lo togli."

  - type: note
    tone: info
    title: "Perché una prova si chiama «Esercizio 7»"
    text: >-
      Il titolo è facoltativo. Chi crea una prova può darle un nome — e allora
      è quello che si legge dappertutto, nel catalogo, negli esami e nelle
      gare — oppure lasciarlo in bianco, e allora la prova prende il suo numero:
      **Esercizio 7**.

  - type: heading
    id: allenarsi
    title: "Allenarsi su una prova"

  - type: text
    text: >-
      Allenarsi vuol dire ripetere: dieci prove di fila, non una alla volta.
      Per questo c'è **una schermata sola**, dove la disposizione e le
      istruzioni restano sotto gli occhi mentre registri una prova dopo
      l'altra, senza mai cambiare pagina.

  - type: list
    title: "È sempre fatta di tre parti, dall'alto in basso"
    items:
      - "**L'esercizio**: il disegno e la consegna, così non devi ricordarti niente a memoria."
      - "**Come sta andando**: il grafico delle prove di oggi, una barra per prova, con l'ultima in evidenza e il tratteggio della tua media. Sotto, una frase che dice in parole quello che il grafico mostra."
      - "**I comandi**, agganciati in fondo allo schermo dove arriva il pollice. Sono l'unica parte che cambia da un esercizio all'altro: dipende da come si registra."

  - type: shot
    shot: allenamento-punteggio
    caption: "L'allenamento su un esercizio a punteggio: disposizione, prove di oggi con il grafico, e in fondo «−», la cifra, «+» e «Registra la prova»."

  - type: steps
    items:
      - title: "Scegli un esercizio"
        text: "Apri la sua scheda e leggi le regole: come si dispongono le bilie e come si conta il punteggio."
      - title: "Tocca «Allenati su questo esercizio»"
        text: "È il pulsante in fondo alla scheda. Se è l'esercizio che stavi già facendo, da «Oggi» basta «Comincia»."
      - title: "Se ci sono varianti, scegli «da che parte»"
        text: "Destra o sinistra, A o B: la scelta resta accesa per tutte le prove che registri. Se non la dici, la prova vale per l'esercizio in generale."
      - title: "Prepara il tavolo e gioca"
        text: "La disposizione e le istruzioni restano in alto, sempre visibili."
      - title: "Registra com'è andata"
        text: "Se l'esercizio è superato o non superato, ti bastano i due tasti grandi: quello che tocchi registra subito la prova, senza confermare. Se è a punteggio, imposti il numero con «−» e «+» e poi tocchi «Registra la prova». Gli altri due modi — colpo per colpo e con estrazione — si registrano mentre giochi, e sono spiegati qui sotto."
      - title: "Se sbagli tasto, «Annulla l'ultima»"
        text: "Toglie l'ultima prova registrata, in fondo alla schermata. Serve proprio perché basta un tocco per registrare: l'errore si corregge dopo, non prima."
      - title: "Riprova quante volte vuoi"
        text: "La prova compare subito nell'elenco di oggi e il grafico si allunga di una barra. Il campo si azzera da solo: sei già pronto per la prossima."
      - title: "Quando basta, tocca «Ho finito»"
        text: "Torni a «Oggi», dove l'esercizio appena fatto ti aspetta in cima per la prossima volta. Le prove restano nel tuo storico."

  - type: note
    tone: info
    title: "«A questo ritmo chiudi a 14»"
    text: >-
      La frase sotto il grafico non è un incoraggiamento generico: confronta
      quello che stai facendo adesso con le tue prove di prima. Compare quando
      c'è abbastanza da confrontare — non alla prima prova, e non senza uno
      storico.

  - type: note
    tone: tip
    title: "Gira il telefono"
    text: >-
      Negli esercizi che si registrano col totale — a punteggio, o superati e
      non superati — mettendolo in orizzontale la schermata diventa un pannello
      solo: la disposizione da una parte, i tasti dall'altra, senza scorrere. È
      pensata per il telefono appoggiato alla sponda mentre giochi. La **X** in
      alto a sinistra torna alla schermata normale senza raddrizzarlo.

  - type: note
    tone: info
    text: >-
      Riprovare non fa danni: resta il tuo **risultato migliore**. Una prova
      andata male non cancella quella buona di prima.

  - type: heading
    id: colpo_per_colpo
    title: "Colpo per colpo: dove si è fermata la bianca"

  - type: text
    text: >-
      In certi esercizi non conta solo se la bilia entra, ma **dove si ferma la
      battente**: due punti a quindici centimetri l'uno dall'altro sono due
      colpi molto diversi, e un punteggio solo non lo dice. Quando l'esercizio
      è fatto così, la prova si registra **un colpo alla volta** e il punteggio
      non lo scrivi tu: lo danno i colpi.

  - type: shot
    shot: allenamento-colpo
    caption: "Una prova a metà: il bersaglio col punto d'arrivo dei colpi già tirati, la striscia dei colpi e, in fondo, «Non è entrata»."

  - type: steps
    items:
      - title: "Tira"
        text: "La disposizione è nella linguetta «Rivedi la disposizione», chiusa perché il tavolo ce l'hai davanti e lo spazio serve al panno."
      - title: "Se la bilia è entrata, tocca il panno dove si è fermata la bianca"
        text: "Il tocco apre l'ingrandimento sul bersaglio. Non serve mirare col dito: si aggiusta dopo."
        shot: allenamento-ingrandimento
      - title: "Aggiusta e conferma"
        text: "Trascina la battente finché è dove si era fermata davvero; i due tratteggi la proiettano sui bordi, perché a occhio la distanza dal centro si giudica male. «Conferma» registra il colpo, «Tavolo intero» torna indietro senza registrare niente."
      - title: "Se non è entrata, «Non è entrata · 0 punti»"
        text: "Il colpo vale zero e non ha un punto d'arrivo: per questo sul panno non compare."
      - title: "Guarda la striscia dei colpi"
        text: "Un posto per colpo, col suo punteggio; il trattino è una mancata e i posti grigi sono i colpi che restano."
      - title: "Quando li hai tirati tutti, «Chiudi la prova»"
        text: "Il pulsante compare da solo dopo l'ultimo colpo, e porta alla fine sessione."

  - type: options
    items:
      - name: "Annulla l'ultimo colpo"
        text: >-
          Toglie il colpo appena registrato, punto d'arrivo compreso. Tolto
          l'unico colpo, la prova aperta sparisce.
        hint: allenamento.colpo
      - name: "Ricomincia"
        text: >-
          Butta via la prova in corso, colpi compresi, e riparte da zero: serve
          quando il tavolo era preparato male, non per rifare un colpo andato
          storto.

  - type: note
    tone: info
    title: "Perché due numeri e non uno"
    text: >-
      Mentre tiri, sopra i comandi trovi **Imbucate** e **Posizione**. Il primo
      dice quante bilie sono entrate; il secondo quanto vicino al centro del
      bersaglio si è fermata la battente. Un numero solo scenderebbe sia per chi
      sbaglia la bilia sia per chi sbaglia la forza — cioè non direbbe che cosa
      correggere.

  - type: note
    tone: tip
    text: >-
      La prova aperta ti aspetta: se chiudi l'app a metà dei colpi, la ritrovi
      dov'era. Riprendere non è ricominciare.

  - type: heading
    id: fine_sessione
    title: "La fine della sessione: la nuvola dei punti d'arrivo"

  - type: text
    text: >-
      Chiusa la prova, l'app te la racconta. In cima il punteggio, e se è un
      record te lo dice. Poi il tavolo con **tutti i punti d'arrivo insieme**:
      è la cosa che nessun punteggio riassume, perché si vede a colpo d'occhio
      se sbagli sempre dalla stessa parte.

  - type: shot
    shot: allenamento-fine
    caption: "La fine sessione: il punteggio, la nuvola dei punti d'arrivo con la frase che la legge, i tre numeri e il campo delle note."

  - type: list
    items:
      - "**Arrivi lungo, corto**: la battente si ferma oltre o prima del bersaglio. È **forza** — quanto hai tirato."
      - "**Arrivi a destra, a sinistra**: si ferma di lato. È **mira**, o effetto — dove hai tirato."
      - "Se i punti sono sparsi attorno al centro la frase lo dice e basta: non c'è una direzione da correggere, e inventargliene una sarebbe un consiglio dato a caso."

  - type: note
    tone: warning
    title: "La nuvola non si legge da sola"
    text: >-
      Sul tavolo compaiono **solo i colpi imbucati**, perché gli altri un punto
      d'arrivo non ce l'hanno. Una nuvola stretta attorno al centro con le
      «Imbucate» al 40% vuol dire che quando la bilia entra sei preciso, non che
      la prova è andata bene: i due numeri accanto si leggono insieme alla
      figura.

  - type: text
    text: >-
      Sotto trovi **Imbucate**, **Posizione** e la serie più lunga di imbucate
      di fila, poi tutti i colpi in fila. In fondo, le **note della sessione**:
      «tavolo 4, panno lento, stecca nuova» spiega un punteggio basso meglio di
      qualunque statistica, ma solo se lo scrivi adesso. Restano attaccate a
      quella prova. Infine **«Altri 8 colpi»** ricomincia subito con la stessa
      disposizione, **«Ho finito»** torna a «Oggi».

  - type: heading
    id: estrazione
    title: "Con estrazione: la consegna la dà l'app"

  - type: text
    text: >-
      Ci sono esercizi in cui una parte della consegna si decide al tavolo, e
      deve essere **casuale**: quante sponde fare, su quale bilia andare. Senza
      l'app toccherebbe tenere aperto un sorteggiatore su un'altra scheda del
      telefono. Qui l'estrazione la fa l'app, prima di ogni colpo, e la scrive
      già a parole: **«3 o più sponde, bilia 7»**.

  - type: shot
    shot: allenamento-estrazione
    caption: "Un esercizio con estrazione: la consegna appena uscita, la scala degli esiti con quanto vale ciascuno, e sotto i colpi già giocati."

  - type: steps
    items:
      - title: "«Estrai il colpo»"
        text: "La prima estrazione apre la prova: con questi esercizi cominciare vuol dire sapere che cosa fare."
      - title: "Tira quello che ti è uscito"
        text: "La consegna resta lì finché non registri il colpo: ricaricare la pagina non la cambia, e non è un modo di riestrarre finché non piace."
      - title: "Scegli com'è andata"
        text: "Non un punteggio da digitare, ma una scala di voci **con un nome** — mancata, toccata, imbucata — ognuna col suo valore. Chi ha creato l'esercizio decide quali sono e quanto valgono."
      - title: "Il colpo dopo esce da solo"
        text: "Appena registri, la consegna successiva è già lì: chi sta tirando non deve chiederla. Sull'ultimo colpo no, perché dopo non c'è niente da preparare."

  - type: note
    tone: info
    text: >-
      **«Annulla l'ultimo colpo»** rimette in attesa la consegna che avevi:
      annullare corregge un esito sbagliato, non fa ripescare.

  - type: note
    tone: warning
    title: "Non entra negli esami né nelle gare"
    text: >-
      Un esercizio con estrazione si allena da soli e basta. A due candidati
      uscirebbero consegne diverse, quindi le loro prove non sarebbero
      confrontabili — e un esame certifica, una gara fa classifica. Se provi a
      metterlo in un esame, l'app lo rifiuta e te lo scrive.

  - type: heading
    id: due_tipi
    title: "Quattro modi di contare"

  - type: text
    text: >-
      Il modo è una proprietà **dell'esercizio**, non una scelta di chi si
      allena: due prove dello stesso esercizio devono potersi confrontare.

  - type: options
    items:
      - name: "A punteggio"
        values: "da 0 a N"
        text: >-
          Si conta quanto hai fatto: dieci tiri, un punto per ogni riuscita. È
          il tipo che serve per gli spareggi e per sostituire l'X a tavolino,
          perché produce un numero confrontabile.
      - name: "Punteggio massimo"
        values: "facoltativo"
        text: >-
          Chi crea l'esercizio può dire fin dove si può arrivare: allora il
          la scheda scrive «A punteggio · su 15» e mentre ti alleni leggi «12 / 15»
          invece di un numero solo. Può anche lasciarlo vuoto, ed è giusto così
          per le prove che si ripetono finché non sbagli: lì un massimo non
          esiste.
      - name: "Superata o non superata"
        text: >-
          Non c'è un punteggio: o riesci o no. Va bene per allenarsi, non per
          decidere una classifica.
      - name: "Colpo per colpo"
        values: "vuole un disegno col bersaglio"
        text: >-
          Ogni colpo ha il suo esito e, se la bilia entra, il punto in cui si è
          fermata la battente. Il punteggio è la somma dei colpi, e il massimo
          non si scrive: è i colpi per il valore del centro del bersaglio.
      - name: "Con estrazione"
        values: "vuole le liste da cui pescare"
        text: >-
          L'app estrae la consegna prima di ogni colpo e l'esito si sceglie da
          una scala di voci. Il massimo è i colpi per l'esito che vale di più.
        hint: challenge.estrazione

  - type: heading
    id: crearle
    title: "Crearne di nuovi, correggerli, duplicarli (direttori)"

  - type: text
    text: >-
      Un direttore di gara può aggiungere esercizi al catalogo. Il modulo è
      **uno solo**: serve a crearne uno nuovo, a correggere uno dei tuoi
      («Modifica l'esercizio», nella sua scheda) e a farne una copia («Duplica»).

  - type: shot
    shot: challenge-nuova
    caption: "Il modulo dell'esercizio: titolo, come si fa, cosa allena, con che gesto, livello, come si registra, la disposizione."

  - type: options
    items:
      - name: "Titolo"
        values: "facoltativo"
        text: >-
          Il nome con cui la prova si presenta ovunque. Senza, prende il suo
          numero — «Esercizio 12». Vale la pena scriverlo: venti prove che
          cominciano tutte con «Disponi le bilie…» nel catalogo non si
          distinguono l'una dall'altra.
        hint: challenge.titolo
      - name: "Come si fa"
        text: >-
          Le istruzioni. **Non c'è un limite di lunghezza**: le regole
          articolate si scrivono per esteso, senza doverle accorciare.
      - name: "Cosa allena"
        values: "fino a tre abilità"
        text: >-
          È da qui che il catalogo fa trovare l'esercizio a chi cerca «qualcosa
          sulla posizione». Al più tre: un esercizio che allena tutto non dice
          niente a chi filtra. Scelte tre, le altre si spengono.
        hint: challenge.abilita
      - name: "Con che gesto"
        values: "zero, uno o più"
        text: >-
          I colpi con cui si esegue. Quanti ne servono, anche nessuno.
        hint: challenge.gesto
      - name: "Livello"
        values: "da 1 a 5, facoltativo"
        text: >-
          Quanto è difficile secondo te. Tocca di nuovo la cifra accesa per non
          dichiararlo.
        hint: challenge.livello
      - name: "Famiglia e passo"
        values: "facoltativi"
        text: >-
          Per le progressioni: «stop shot» 1, 2, 3 — lo stesso gesto, sempre più
          difficile. Il nome della famiglia lo scegli tu.
      - name: "La bianca"
        values: "si rimette · resta dov'è"
        text: >-
          Se a ogni tiro la battente torna al suo posto, o se il tiro dopo parte
          da dove si è fermata. Cambia che cosa misura il punteggio.
      - name: "Varianti"
        text: >-
          Destra e sinistra, posizioni A e B. **Sono lo stesso esercizio**, non
          un altro: stessa disposizione, stesse regole, stesso voto. Chi si
          allena sceglie «da che parte» prima di tirare, e i risultati restano
          separati. Una variante che ha già delle prove si può rinominare, non
          togliere.
      - name: "Come si registra"
        values: "riuscito o no · a punteggio · colpo per colpo · con estrazione"
        text: >-
          I quattro modi spiegati in «Quattro modi di contare», col punteggio
          massimo facoltativo. **Colpo per colpo** compare solo se l'esercizio
          è disegnato e nel disegno c'è un bersaglio: senza, una riga lo
          ricorda, perché sono gli anelli del bersaglio a dare i punti.
        hint: challenge.punteggio_massimo
      - name: "Colpi di una prova"
        values: "colpo per colpo e con estrazione"
        text: >-
          Quanti colpi dura una prova. Il punteggio massimo non si scrive: è
          questo numero per il valore più alto — il centro del bersaglio, o
          l'esito migliore della scala.
        hint: challenge.colpi
      - name: "Che cosa estrae l'app"
        text: >-
          Le liste da cui pescare, una per riga, nella forma
          `sponde: 1 sponda | 2 sponde | 3 o più sponde`. Le liste si pescano
          insieme, e la consegna esce già a parole. Da una a tre liste.
        hint: challenge.estrazione
      - name: "Come si conta un colpo"
        text: >-
          La scala degli esiti, uno per riga, nella forma `Imbucata = 4`, dal
          peggiore al migliore. Da due a otto voci: sono i tasti che chi si
          allena vedrà dopo ogni colpo.

  - type: note
    tone: tip
    text: >-
      L'immagine è la parte che conta: una descrizione a parole di dove vanno
      le bilie viene interpretata da ognuno a modo suo. Una foto del tavolo
      preparato risolve la questione.

  - type: note
    tone: warning
    title: "Solo foto di cui hai i diritti"
    text: >-
      Sotto il campo della foto l'app lo ricorda: **carica solo materiale di
      cui hai i diritti**. Il tavolo che hai preparato e fotografato tu va
      benissimo; la figura presa da un libro o dal sito di qualcun altro no.

  - type: heading
    id: modificare
    title: "Correggere un esercizio che ha già delle prove"

  - type: text
    text: >-
      Un refuso nel titolo, un'abilità in più, una foto migliore: si salvano e
      basta. Ma se cambi **come si registra**, il **punteggio massimo** o le
      **istruzioni** di un esercizio che qualcuno ha già provato, i punteggi
      già scritti si leggerebbero con regole che non sono quelle con cui sono
      stati fatti. Per questo, prima di salvare, l'app si ferma e chiede.

  - type: shot
    shot: esercizio-ha-gia-prove
    caption: "«Questo esercizio ha già delle prove»: crea una copia, modifica comunque, o torna al modulo."

  - type: options
    items:
      - name: "Crea una copia e modifica quella"
        text: >-
          Nasce un esercizio nuovo con le tue modifiche, senza prove e senza
          voti. L'originale resta com'era, con tutti i suoi risultati. È la
          scelta consigliata.
      - name: "Modifica comunque questo"
        text: >-
          Le modifiche si applicano a questo esercizio: le prove già registrate
          restano, ma da ora si leggono con le regole nuove.
      - name: "Torna al modulo"
        text: >-
          Non succede niente: quello che avevi scritto è ancora lì.

  - type: text
    text: >-
      **«Duplica»**, nella scheda dell'esercizio, fa la stessa cosa di tua
      iniziativa: apre il modulo già compilato — col titolo che finisce in
      «(copia)», da riscrivere — e crea un esercizio nuovo, tuo. Serve per le
      famiglie: la stessa disposizione con una bilia spostata, la versione
      facile e quella difficile. Se l'originale è disegnato, **«Crea la copia e
      apri il disegno»** ti porta dritto sul tavolo con le bilie già al loro
      posto.

  - type: heading
    id: disegnare
    title: "Se la foto non ce l'hai"

  - type: text
    text: >-
      In fondo al modulo, nella sezione **«La disposizione»**, accanto a «Usa
      una foto» c'è il pulsante **«Disegna l'esercizio»**: apre un tavolo vuoto
      su cui disponi le bilie e tracci i tiri, e l'immagine del catalogo la
      genera il disegno. È una funzione da direttore di gara, e si sblocca
      dopo trenta esercizi completati.

  - type: text
    text: >-
      Come funziona il disegno, comando per comando, è spiegato in
      [Disegnare un esercizio](/aiuto/giocare/disegnare_un_drill).

  - type: heading
    id: in_gara
    title: "Gli esercizi dentro una gara"

  - type: text
    text: >-
      Il direttore può inserire esercizi nella gara. Servono a due cose molto
      diverse.

  - type: options
    items:
      - name: "Al posto dell'X a tavolino"
        text: >-
          Quando i giocatori sono dispari, chi resta senza avversario invece di
          stare fermo esegue un esercizio: il punteggio ottenuto conta per la
          classifica del turno. È più equo dell'assegnare una vittoria a
          tavolino, e più divertente che stare a guardare.
      - name: "Come spareggio"
        text: >-
          A fine gara, se due o più giocatori sono a pari merito nelle
          posizioni che contano, si può decidere con un esercizio: chi fa il
          punteggio migliore sta davanti.

  - type: note
    tone: warning
    title: "Dentro una gara si passa da un'altra parte"
    text: >-
      L'esercizio di una gara non si avvia dal catalogo: la trovi nella pagina
      della gara, con il pulsante «Prova» (o «Continua», se hai già cominciato),
      e prima di giocare l'app ti mostra una pagina di conferma. Lì il punteggio
      conta per la classifica, e quante prove hai a disposizione lo stabilisce
      il direttore: accanto all'esercizio vedi quante ne hai già fatte.

  - type: note
    tone: info
    title: "Spot Shot Rally"
    text: >-
      È l'esercizio usata più spesso per gli spareggi: una serie di tiri da
      posizione fissa, con un punteggio che si accumula. Chi accumula di più
      vince lo spareggio.

  - type: heading
    id: perche
    title: "A cosa servono, in pratica"

  - type: list
    items:
      - "**Allenarsi** su un gesto specifico e misurare i progressi nel tempo."
      - "**Non stare fermi** quando il numero dispari lascia qualcuno senza avversario."
      - "**Decidere i pari merito** senza dover far rigiocare una partita intera."
      - "**Sbloccare traguardi** e guadagnare punti esperienza (vedi [I tuoi progressi](/aiuto/account/progressi))."

  - type: faq
    items:
      - q: "Non vedo la sezione Esercizi."
        a: "È una funzione che si sblocca con l'uso della piattaforma, come la sezione Sfide. Se non compare ancora, comparirà."
      - q: "Non vedo «Disegna l'esercizio» nel modulo di creazione."
        a: "È un comando da direttore di gara, e si sblocca dopo trenta esercizi completati. Finché non compare, l'esercizio si crea caricando la foto: è il modo normale, non un ripiego."
      - q: "Posso rifare la stesso esercizio più volte?"
        a: "Sì, ed è proprio il senso della schermata di allenamento: registri una prova dopo l'altra senza uscire. Dentro una gara è diverso: lì il numero di tentativi lo stabilisce il direttore, e dentro un esame lo stabilisce chi l'ha composto — può chiederti più prove dello stesso esercizio, e conta la migliore."
      - q: "Che differenza c'è fra un esercizio e un esame?"
        a: "Un esercizio è una prova sola. Un esame è una sequenza di più esercizi in ordine, e può essere certificato da un esaminatore. Vedi [Sostenere un esame](/aiuto/giocare/esami)."
      - q: "Chi controlla che il punteggio dichiarato sia vero?"
        a: "Fuori dalle gare, nessuno: è un allenamento, e vale la parola. Dentro una gara è il direttore a validare i risultati."
      - q: "Gli esercizi contano per il rating?"
        a: "No. Il rating misura le partite contro avversari; gli esercizi alimentano statistiche e progressi personali."

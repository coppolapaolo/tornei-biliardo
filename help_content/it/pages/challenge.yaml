title: "Le challenge"
section: giocare
kind: approfondimento
audience: [giocatore]
minutes: 4
summary: "Prove di abilità da eseguire da soli: servono ad allenarsi, a sbloccare traguardi e — dentro una gara — a decidere gli spareggi."
screens: [challenge.challenge_catalog, challenge.challenge_detail, challenge.training_session,
  challenge.start_attempt, challenge.attempt_detail, challenge.create_challenge,
  challenge.edit_challenge, challenge.challenge_statistics, player.challenge_detail,
  challenge.diagram_builder, challenge.edit_diagram]
related: [progressi, numero_dispari, esami]

blocks:
  - type: text
    text: >-
      Una challenge è un esercizio con regole fisse: una disposizione di bilie
      da imbucare, un tiro da ripetere, un obiettivo da raggiungere in un certo
      numero di tentativi. Si gioca **da soli**, e il risultato è un punteggio.

  - type: heading
    id: catalogo
    title: "Il catalogo"

  - type: text
    text: >-
      La sezione **Challenge** raccoglie tutte le prove disponibili, con la
      descrizione, l'immagine della disposizione e le regole di punteggio. Puoi
      metterne qualcuna fra i preferiti per ritrovarla in fretta.

  - type: shot
    shot: challenge-catalogo
    caption: "Il catalogo: ogni prova ha la sua immagine e il tipo di punteggio."

  - type: heading
    id: allenarsi
    title: "Allenarsi su una prova"

  - type: text
    text: >-
      Allenarsi vuol dire ripetere: dieci prove di fila, non una alla volta.
      Per questo c'è **una schermata sola**, dove la foto della disposizione e
      le istruzioni restano sotto gli occhi mentre registri una prova dopo
      l'altra, senza mai cambiare pagina.

  - type: steps
    items:
      - title: "Scegli una challenge"
        text: "Apri la sua scheda e leggi le regole: come si dispongono le bilie e come si conta il punteggio."
      - title: "Tocca «Provala»"
        text: "È il pulsante sulla scheda nel catalogo. Dalla pagina della challenge si chiama «Allenati su questo drill»."
      - title: "Prepara il tavolo e gioca"
        text: "La foto e le istruzioni restano in alto, sempre visibili: non devi ricordarti niente a memoria."
      - title: "Registra com'è andata"
        text: "Con i tasti «−» e «+» imposti il punteggio, oppure scegli «Superata» o «Non superata». Poi tocca «Registra la prova»."
      - title: "Riprova quante volte vuoi"
        text: "La prova compare subito in «Le tue prove», e in alto salgono «Prove registrate» e «Il tuo record». Il campo si azzera da solo: sei già pronto per la prossima."
      - title: "Quando basta, tocca «Ho finito»"
        text: "Torni al catalogo. Le prove restano nel tuo storico, e tornando sulla challenge ritrovi le ultime dieci."

  - type: note
    tone: info
    text: >-
      Riprovare non fa danni: resta il tuo **risultato migliore**. Una prova
      andata male non cancella quella buona di prima.

  - type: heading
    id: due_tipi
    title: "Due modi di contare"

  - type: options
    items:
      - name: "A punteggio"
        values: "da 0 a N"
        text: >-
          Si conta quanto hai fatto: dieci tiri, un punto per ogni riuscita. È
          il tipo che serve per gli spareggi e per sostituire l'X a tavolino,
          perché produce un numero confrontabile.
      - name: "Superata o non superata"
        text: >-
          Non c'è un punteggio: o riesci o no. Va bene per allenarsi, non per
          decidere una classifica.

  - type: heading
    id: crearle
    title: "Crearne di nuove (direttori)"

  - type: text
    text: >-
      Un direttore di gara può aggiungere challenge al catalogo: descrizione,
      immagine della disposizione delle bilie e tipo di punteggio.

  - type: shot
    shot: challenge-nuova
    caption: "Il modulo per creare una challenge."

  - type: note
    tone: tip
    text: >-
      L'immagine è la parte che conta: una descrizione a parole di dove vanno
      le bilie viene interpretata da ognuno a modo suo. Una foto del tavolo
      preparato risolve la questione — e se la foto non ce l'hai, il drill si
      può disegnare (qui sotto).

  - type: heading
    id: disegnare
    title: "Disegnare il drill invece di fotografarlo"

  - type: text
    text: >-
      In fondo al riquadro della foto, nel modulo «Nuova challenge», c'è la
      domanda **«Non hai una foto?»** e il pulsante **«Disegna il drill»**:
      apre un tavolo vuoto su cui disponi le bilie e tracci i tiri.
      L'immagine da mettere nel catalogo la genera il disegno, non serve
      caricare niente.

  - type: note
    tone: warning
    title: "È l'alternativa, non il modo consigliato"
    text: >-
      Chi la foto ce l'ha continua a caricarla: il tavolo vero resta la cosa
      più chiara per chi deve riprodurre la disposizione. Il disegno serve a
      chi la foto non ce l'ha, o a chi vuole indicare anche il tiro e non solo
      dove stanno le bilie.

  - type: steps
    items:
      - title: "Tocca «Disegna il drill»"
        text: "È in fondo al riquadro «Foto della disposizione». Si apre una pagina a sé: quello che avevi già scritto nel modulo non viene portato dietro, le istruzioni si scrivono lì."
      - title: "Disponi le bilie"
        text: "Scegli una bilia nel riquadro «Biglie», poi tocca il tavolo. Si aggancia da sola alla griglia, alla sponda e alle altre bilie."
      - title: "Traccia il tiro, se serve"
        text: "Con lo strumento «Tiro» indichi da dove si colpisce e dove si mira; «Linea libera» serve a segnare una traiettoria o una zona. Con «Sposta» si sistema quel che è già sul tavolo."
      - title: "Scrivi le istruzioni"
        text: "Sotto al tavolo, nel campo «Istruzioni per chi la esegue»: il disegno mostra la disposizione, non la regola. Come si conta va scritto a parole."
      - title: "Scegli come si conta"
        text: "«A punteggio» oppure «Superata o non superata»: le stesse due possibilità del modulo normale."
      - title: "Tocca «Salva il drill»"
        text: "È il pulsante in fondo alla pagina. Il drill entra nel catalogo con l'immagine del disegno, come se l'avessi fotografato. «Annulla» esce senza salvare niente."

  - type: note
    tone: tip
    title: "Il disegno non si scarica"
    text: >-
      Il builder non produce file: non c'è niente da scaricare e niente da
      ricaricare da disco. Serve a una cosa sola, mettere il drill nel
      catalogo, e l'unico modo è **«Salva il drill»**. Il disegno resta
      sull'applicazione, ed è da lì che lo riapri quando vuoi correggerlo.

  - type: text
    text: >-
      Un drill disegnato si può riaprire. Sulla sua pagina, chi l'ha creato
      trova il pulsante **«Modifica il disegno»**: le bilie tornano sul tavolo
      come le avevi lasciate, si corregge quel che serve e si tocca «Salva le
      modifiche».

  - type: note
    tone: info
    text: >-
      Il pulsante compare **solo sui drill disegnati**. Un drill nato da una
      foto non ha un disegno da riaprire, quindi lì non c'è.

  - type: note
    tone: info
    title: "Si sblocca con l'uso"
    text: >-
      «Disegna il drill» compare ai direttori di gara che hanno già
      **completato trenta drill**, come le altre funzioni che si sbloccano
      giocando. Il motivo: un drill disegnato male lo eseguono poi tutti gli
      altri, e per disegnarne uno buono conviene averne provati parecchi.

  - type: heading
    id: in_gara
    title: "Le challenge dentro una gara"

  - type: text
    text: >-
      Il direttore può inserire challenge nella gara. Servono a due cose molto
      diverse.

  - type: options
    items:
      - name: "Al posto dell'X a tavolino"
        text: >-
          Quando i giocatori sono dispari, chi resta senza avversario invece di
          stare fermo esegue una challenge: il punteggio ottenuto conta per la
          classifica del turno. È più equo dell'assegnare una vittoria a
          tavolino, e più divertente che stare a guardare.
      - name: "Come spareggio"
        text: >-
          A fine gara, se due o più giocatori sono a pari merito nelle
          posizioni che contano, si può decidere con una challenge: chi fa il
          punteggio migliore sta davanti.

  - type: note
    tone: warning
    title: "Dentro una gara si passa da un'altra parte"
    text: >-
      La challenge di una gara non si avvia dal catalogo: la trovi nella pagina
      della gara, con il pulsante «Prova» (o «Continua», se hai già cominciato),
      e prima di giocare l'app ti mostra una pagina di conferma. Lì il punteggio
      conta per la classifica, e quante prove hai a disposizione lo stabilisce
      il direttore: accanto alla challenge vedi quante ne hai già fatte.

  - type: note
    tone: info
    title: "Spot Shot Rally"
    text: >-
      È la challenge usata più spesso per gli spareggi: una serie di tiri da
      posizione fissa, con un punteggio che si accumula. Chi accumula di più
      vince lo spareggio.

  - type: heading
    id: perche
    title: "A cosa servono, in pratica"

  - type: list
    items:
      - "**Allenarsi** su un gesto specifico e misurare i progressi nel tempo."
      - "**Non stare fermi** quando il numero dispari lascia qualcuno senza avversario."
      - "**Decidere i pari merito** senza dover far rigiocare una partita intera."
      - "**Sbloccare traguardi** e guadagnare punti esperienza (vedi [I tuoi progressi](/aiuto/account/progressi))."

  - type: faq
    items:
      - q: "Non vedo la sezione Challenge."
        a: "È una funzione che si sblocca con l'uso della piattaforma, come la sezione Match. Se non compare ancora, comparirà."
      - q: "Non vedo «Disegna il drill» nel modulo di creazione."
        a: "È un comando da direttore di gara, e si sblocca dopo trenta drill completati. Finché non compare, la challenge si crea caricando la foto: è il modo normale, non un ripiego."
      - q: "Posso rifare la stessa challenge più volte?"
        a: "Sì, ed è proprio il senso della schermata di allenamento: registri una prova dopo l'altra senza uscire. Dentro una gara è diverso: lì il numero di tentativi lo stabilisce il direttore, e dentro un esame lo stabilisce chi l'ha composto — può chiederti più prove dello stesso drill, e conta la migliore."
      - q: "Che differenza c'è fra una challenge e un esame?"
        a: "Una challenge è una prova sola. Un esame è una sequenza di più drill in ordine, e può essere certificato da un esaminatore. Vedi [Sostenere un esame](/aiuto/giocare/esami)."
      - q: "Chi controlla che il punteggio dichiarato sia vero?"
        a: "Fuori dalle gare, nessuno: è un allenamento, e vale la parola. Dentro una gara è il direttore a validare i risultati."
      - q: "Le challenge contano per il rating?"
        a: "No. Il rating misura le partite contro avversari; le challenge alimentano statistiche e progressi personali."

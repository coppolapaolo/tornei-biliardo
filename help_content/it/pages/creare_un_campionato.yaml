title: "Creare un campionato"
section: organizzare
kind: tutorial
audience: [direttore]
minutes: 5
summary: "Il wizard in due passaggi: prima le regole generali, poi i valori predefiniti che tutte le gare erediteranno."
screens: [admin.campionato.wizard_start, admin.campionato.edit_campionato,
  admin.campionato.campionato_detail]
related: [creare_una_gara, classifiche]

blocks:
  - type: text
    text: >-
      Un campionato è una serie di gare che si sommano in una classifica
      generale: il torneo sociale dell'anno, il circuito autunnale, il
      campionato del giovedì. Si crea una volta, e poi si aggiungono le gare
      man mano.

  - type: heading
    id: wizard
    title: "Il wizard in due passaggi"

  - type: text
    text: >-
      La creazione è guidata: due schermate, e alla fine il campionato esiste.
      Quasi tutto è modificabile dopo, quindi non c'è da temere di sbagliare.

  - type: shot
    shot: campionato-wizard
    caption: "Primo passo del wizard: nome, numero di gare previste, sistema di classifica e strategia di abbinamento."

  - type: heading
    id: passo1
    title: "Passo 1 — Le regole generali"

  - type: options
    items:
      - name: "Nome del campionato"
        text: >-
          Includi l'anno: «Campionato Sociale 2026». Fra due stagioni sarai
          contento di distinguerli a colpo d'occhio.
      - name: "Gare pianificate"
        text: >-
          Quante gare prevedi. È un obiettivo indicativo, non un vincolo:
          potrai aggiungerne o toglierne.
      - name: "Sistema di classifica"
        values: "Vittorie · Triangoli · Punti · Posizione"
        text: >-
          Come si ordina la classifica. **Vittorie** è la scelta normale: conta
          quante partite hai vinto, e a parità la differenza triangoli. Con
          **Punti** ogni risultato vale i punti che scegli al passo successivo
          (di norma 3 la vittoria, 1 il pareggio, 0 la sconfitta). Le quattro
          modalità sono spiegate in [Come si calcolano le
          classifiche](/aiuto/approfondimenti/classifiche).
        hint: campionato.classifica
      - name: "Strategia di abbinamento"
        values: "Amalfi · Casuale · Girone all'italiana · Eliminazione · Doppio KO"
        text: >-
          Come si formano le coppie a ogni turno. **Amalfi** è il valore
          proposto ed è pensato per le gare a turni di circolo. Vedi [Come
          vengono formate le coppie](/aiuto/approfondimenti/abbinamenti).
        hint: gara.strategia
      - name: "Modalità esercizi"
        text: >-
          Attiva gli esercizi dentro le gare del campionato: senza, il pulsante
          per gestirli non compare. Non riguarda le sfide fra giocatori. Vedi
          [Gli esercizi](/aiuto/giocare/challenge).
      - name: "Playoff finali"
        text: >-
          Gare speciali a fine campionato riservate ai migliori classificati.
          Puoi prevedere un playoff «Elite» per i primi e uno «Academy» per i
          successivi. I qualificati ricevono un invito da accettare — e se ti
          rispondono a voce puoi registrare tu la loro risposta. Fino
          all'avvio della finale puoi aggiungere giocatori anche oltre i
          posti; se la gara non ammette dispari, chi resterebbe in più aspetta
          in lista d'attesa un secondo giocatore.
        hint: campionato.playoff_classifica_finale

  - type: note
    tone: warning
    title: "Il sistema di classifica vale per tutto il campionato"
    text: >-
      Tutte le gare di un campionato usano lo **stesso** sistema di
      classifica, e anche la finale dei playoff quando il suo punteggio si
      somma a quello della stagione: non si possono sommare mele e pere. Sceglilo con attenzione ora. Puoi cambiarlo finché nessuna
      gara è stata avviata, anche se ha già degli iscritti, e allora il cambio
      vale per tutte le gare e resta nella storia di ciascuna. Dopo il primo
      avvio non si può più: cambieresti le regole a chi ha già giocato.

  - type: heading
    id: passo2
    title: "Passo 2 — I valori predefiniti delle gare"

  - type: text
    text: >-
      Il secondo passaggio chiede come saranno fatte le gare «tipo» del
      campionato: sala, quota di partecipazione (e, se serve, il listino delle
      quote per categoria, che vale per tutte le gare), numero di turni, gestione del
      numero dispari, come si decide chi esegue il tiro di apertura, e come si
      sciolgono i **pari merito** nella classifica di turno e in quella finale
      di ogni gara. Ogni gara nuova nascerà già così, e tu dovrai solo cambiare
      nome, data e disciplina.

  - type: note
    tone: tip
    text: >-
      Sono **valori di partenza**, non regole ferree: ogni singola gara resta
      modificabile. Servono a non ridigitare le stesse dieci scelte per sei
      serate. Se più avanti ne cambi uno, l'app ti chiede a quali gare già
      create, e non ancora avviate, applicarlo: sono già spuntate quelle che
      avevano il valore di prima.

  - type: note
    tone: info
    title: "Se il campionato è a tabellone il passo 2 è più corto"
    text: >-
      Scegliendo eliminazione diretta o doppio KO al passo 1, il passo 2 non
      chiede numero di turni, gestione del numero dispari ed evita reincontri:
      sulle gare a tabellone quelle impostazioni non hanno effetto, quindi non
      avrebbe senso ereditarle. Compare invece la tabella dei punti per
      posizione, qui sotto.

  - type: heading
    id: apertura
    title: "Come si comincia, e chi spacca"

  - type: text
    text: >-
      Due voci nel passo 2 decidono il tiro di apertura per tutte le gare del
      campionato.

  - type: options
    items:
      - name: "Regola di inizio"
        values: "predefinito «Acchito»"
        text: >-
          Con **Primo giocatore** apre sempre il primo dei due. Con
          **Acchito** il segnapunti, prima del primo triangolo, chiede chi ha
          vinto l'acchito e chi apre — perché chi vince l'acchito sceglie, e
          può mandare al tavolo l'avversario.
      - name: "Chi spacca"
        values: "predefinito «A turno»"
        text: >-
          Come passa il tiro di apertura da un triangolo al successivo. **A
          turno** è la regola standard. Le altre: **a turno ogni due**,
          **spacca chi ha vinto**, **spacca chi ha perso**.

  - type: note
    tone: info
    text: >-
      Ogni gara nasce con la regola del campionato e può discostarsi. Se un
      domani cambi quella del campionato, l'app ti chiede a quali gare non
      ancora avviate applicarla: nessuna cambia da sola.

  - type: heading
    id: punti_posizione
    title: "I punti per posizione (solo campionati a tabellone)"

  - type: text
    text: >-
      Nelle gare a tabellone la classifica è per posizione, e ogni piazzamento
      vale un certo numero di punti di campionato. Quanti, lo decidi tu.

  - type: text
    text: >-
      Non si compilano sedici caselle: si indicano **sei soglie**, cioè le
      bande di piazzamento che nel tabellone esistono davvero — 1°, 2°, 3°, 4°,
      5°-8° e 9°-16°. Chi condivide una banda prende lo stesso punteggio: i
      quattro quartifinalisti sono tutti quinti, e prendono tutti i punti del
      quinto posto.

  - type: list
    title: "I valori proposti"
    items:
      - "**1°** — 25 punti"
      - "**2°** — 18 punti"
      - "**3°** — 15 punti"
      - "**4°** — 12 punti"
      - "**5°-8°** — 8 punti"
      - "**9°-16°** — 4 punti"

  - type: note
    tone: tip
    text: >-
      Se lasci i valori proposti, il campionato **segue** la tabella di
      riferimento invece di portarsene dietro una copia: il giorno in cui i
      valori di riferimento cambiassero, il tuo campionato si adegua da solo.
      Cambia le caselle solo se il tuo regolamento dice altro.

  - type: heading
    id: aggiungere_gare
    title: "Aggiungere le gare"

  - type: shot
    shot: campionato-gestione
    caption: "La pagina del campionato: in cima a che punto è la stagione e «Nuova gara», poi la classifica generale con la zona playoff, le gare e la gestione."

  - type: steps
    items:
      - title: "Apri il campionato"
        text: "Dalla tua home, sotto «Campionati», tocca «Gestione»."
      - title: "Aggiungi una gara"
        text: >-
          La gara eredita i valori predefiniti. Tu metti nome, data e
          disciplina.
      - title: "Ripeti per le gare successive"
        text: >-
          Le date devono essere in ordine crescente: la gara 2 non può
          precedere la gara 1. Puoi crearle tutte subito, con le date del
          calendario, oppure una alla volta. Se poi sposti una gara oltre la
          successiva, l'app ti propone di spostare anche le gare che scavalca
          dello stesso numero di giorni: scegli tu se farlo, tornare al
          modulo o lasciare tutto com'era.

  - type: heading
    id: classifica_generale
    title: "La classifica generale"

  - type: text
    text: >-
      Si aggiorna da sola alla fine di ogni gara sommando i risultati: le
      vittorie e la differenza triangoli se il sistema è «Vittorie», i triangoli totali
      se è «Triangoli», i punti delle gare — moltiplicati per il peso — se è
      «Punti», i punti per posizione — quelli della tabella qui sopra — se
      è «Posizione». Chi salta una gara non viene escluso: semplicemente non
      guadagna nulla in quell'occasione.

  - type: text
    text: >-
      A pari punteggio decide la **catena della classifica generale**, che si
      sceglie al passo 2 e nella modifica del campionato, insieme alle due
      proposte alle gare. Quella di partenza è differenza triangoli, poi la
      somma degli spareggi SSR, poi la posizione dopo la gara precedente, poi
      il sorteggio: non lascia mai pari merito, perché da lì partono gli
      inviti ai playoff. Cambiarla a campionato iniziato ricalcola la
      classifica, e sopra compare la riga che lo dice.

  - type: faq
    items:
      - q: "Posso aggiungere gare a campionato già iniziato?"
        a: "Sì, purché la data sia successiva all'ultima gara esistente."
      - q: "Un giocatore può entrare a campionato iniziato?"
        a: "Sì. Si iscrive alle gare che restano e parte dal punteggio delle gare a cui ha partecipato."
      - q: "Posso avere più direttori su un campionato?"
        a: "Sì, e chi dirige il campionato dirige di conseguenza tutte le sue gare."
      - q: "Cosa succede se annullo una gara del campionato?"
        a: "I suoi risultati escono dalla classifica generale. Le altre gare non ne risentono."
      - q: "Posso cambiare i punti per posizione a campionato iniziato?"
        a: "Sì, dalle impostazioni del campionato. La classifica generale si ricalcola con i valori nuovi, quindi le gare già concluse cambiano punteggio: sopra la classifica compare una riga che lo dice, con chi ha fatto la correzione e il motivo. Se gli inviti ai playoff sono già partiti e la correzione cambia chi rientra nei posti, l'app ti propone come aggiornarli."
      - q: "Non vedo la tabella dei punti per posizione."
        a: "Compare solo sui campionati a eliminazione diretta o doppio KO. Con Amalfi, casuale o girone all'italiana la classifica non è per posizione e quei punti non servono."

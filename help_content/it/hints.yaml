  - id: gara.numero_turni
    label: "Numero di turni"
    short: "Quanti giri di partite. Sui tabelloni non si imposta: lo fissa il sorteggio, sugli iscritti che si presentano. Nel doppio KO può crescere di uno se si gioca la Bella."

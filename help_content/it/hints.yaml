    short: "Quanto forte si colpisce. A forza 30 la bilia percorre due lunghezze di tavolo, e il cerchio tratteggiato segna dove si ferma."
    anchor: drill-forza
    screens: [challenge.diagram_builder, challenge.edit_diagram]
    page: disegnare_un_drill
    section: tiro

  - id: drill.posizioni_standard
    label: "Posizioni standard"
    short: "Otto disposizioni già pronte, dai triangoli al wagon wheel. Sostituiscono quel che c'è sul tavolo: se sbagli, «Annulla mossa» rimette tutto."
    anchor: drill-posizioni-standard
    screens: [challenge.diagram_builder, challenge.edit_diagram]
    page: disegnare_un_drill
    section: posizioni

  - id: drill.istruzioni
    label: "Istruzioni per chi la esegue"
    short: "Il disegno mostra la disposizione, non la regola: come si conta il punteggio va scritto qui, a parole. Senza, l'esercizio non si salva."
    anchor: drill-istruzioni
    screens: [challenge.diagram_builder, challenge.edit_diagram]
    page: disegnare_un_drill
    section: salvare

  # --- Avvio rapido delle sfide individuali (issue #176) --------------------
  - id: sfida.avvio_rapido
    label: "Avvio rapido"
    short: "Per la partita che state giocando adesso: scegli chi hai davanti e sei al segnapunti. Niente data da concordare, niente attesa."
    anchor: sfida-avvio-rapido
    screens: [individual_match.dashboard, individual_match.match_list]
    page: partite_amichevoli
    section: avvio-rapido

  - id: sfida.chi_hai_davanti
    label: "Chi hai davanti"
    short: "Gli avversari con cui giochi più spesso sono già in elenco. Per gli altri, cerca per nome: deve avere un account."
    anchor: sfida-chi-hai-davanti
    screens: [individual_match.quick_match]
    page: partite_amichevoli
    section: avvio-rapido

  - id: sfida.riepilogo_rapido
    label: "Come si gioca"
    short: "Sala, disciplina e distanza sono già quelle dell'ultima partita. Se vanno bene non tocchi niente; «Cambia» le apre."
    anchor: sfida-riepilogo-rapido
    screens: [individual_match.quick_match]
    page: partite_amichevoli
    section: avvio-rapido

  - id: sfida.referto_all_avvio
    label: "Tengo il referto TPA"
    short: "Va deciso adesso: il referto si apre prima del primo triangolo, e appena la partita parte si è al segnapunti."
    anchor: sfida-referto-all-avvio
    screens: [individual_match.quick_match, individual_match.match_detail]
    page: referto_tpa
    section: aprire
  - id: campionato.playoff_classifica_finale
    label: "Classifica finale del campionato"
    short: "Il playoff si somma al campionato (con un peso a scelta), oppure decide da solo le prime posizioni. Se non tocchi niente vale la somma, con peso 1."
    anchor: campionato-playoff-classifica-finale
    screens: [admin.campionato.campionato_detail]
    page: playoff
    section: classifica_finale


tours:
  - screen: dashboard.dashboard
    title: "La tua home"
    intro: "Da qui parte tutto: come stai andando, le gare a cui sei iscritto, i campionati che segui e le gare vicine a te."
    audience: [giocatore]
    steps:
      - title: "Il riepilogo che ti accoglie"
        text: "Appena entri, in cima c'è un riquadro con il tuo andamento: due numeri, un grafico e le ultime attività. Si legge e basta; poi lascia il posto alle cose da fare, e torna al prossimo accesso."
      - title: "Le tue gare"
        text: "Le gare attive sono la prima cosa da fare che trovi in home. Il colore dell'etichetta dice a che punto sono: iscrizioni aperte, in corso, conclusa."
      - title: "Iscriviti con un tocco"
        text: "Le gare con le iscrizioni aperte hanno il pulsante verde: non serve cercarle altrove."
      - title: "In fondo allo schermo"
        text: "La barra con Dashboard, Sale, Sfide, Esercizi e Notifiche ti porta ovunque. Su computer è la colonna di sinistra."

  - screen: admin.competition.gara_detail
    title: "La pagina della gara"
    intro: "Tutto quello che riguarda una gara sta qui: chi gioca contro chi, come va la classifica e chi partecipa."
    audience: [giocatore, direttore]
    steps:
      - hint: gara.turni
      - hint: gara.classifica
      - title: "Iscritti"
        text: "Chi partecipa e chi è eventualmente in lista d'attesa."
      - hint: gara.distanza

  - screen: admin.match.match_detail
    title: "Il segnapunti"
    intro: "Questa schermata si usa mentre giochi: un tasto per giocatore, si preme dopo ogni triangolo."
    audience: [giocatore]
    steps:
      - hint: partita.segnapunti
      - hint: partita.punteggio
      - title: "Se sbagli"
        text: "«Annulla ultimo triangolo» toglie l'ultimo punto assegnato. Puoi ripeterlo più volte."
      - hint: partita.rack
      - hint: partita.tabellone

  - screen: admin.competition.create_gara_standalone
    title: "Creare una gara"
    intro: "Quattro passaggi. Se è la prima volta, cambia solo nome, data, sala e disciplina: il resto va già bene così."
    audience: [direttore]
    steps:
      - hint: gara.distanza
      - hint: gara.strategia
      - hint: gara.dispari
      - hint: gara.classifica_sistema
      - title: "Se scegli un tabellone"
        text: "Con eliminazione diretta e doppio KO metà delle domande sparisce — su un tabellone non avrebbero effetto — e compare il riquadro «Opzioni del tabellone»."

  - screen: individual_match.tpa_referto
    title: "Il referto TPA"
    intro: "Qui annoti tutta la partita, non solo chi vince i triangoli. Un turno per volta: quante bilie e perché è finito."
    audience: [giocatore]
    steps:
      - hint: referto.tastierino
      - hint: referto.passa_tavolo
      - hint: referto.annotazioni_piccole
      - hint: referto.annulla

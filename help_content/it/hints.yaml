    label: "Il tastierino"
    short: "Prima quante bilie sono entrate, poi perché il turno è finito. I tasti che ora non hanno senso sono spenti."
    anchor: referto-tastierino
    screens: [individual_match.tpa_referto]
    page: referto_tpa
    section: come-si-compila

  - id: referto.passa_tavolo
    label: "Passare il tavolo"

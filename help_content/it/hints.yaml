# Micro-aiuto e presentazioni: contenuti pronti per l'interfaccia adattiva.
#
# QUESTI TESTI LI MOSTRA L'APP: `static/js/help-hints.js` (la «modalità
# aiuto», ADR-058) li chiede a /aiuto/api/schermata/<endpoint> e, dove la
# pagina la accende — oggi il banner della competizione di prova — mette una
# piccola "?" accanto a ogni elemento che espone `data-help="<anchor>"` e
# alla prima visita di una schermata la presentazione (`tours`).
#
# I testi sono nati prima del codice, di proposito: sono la parte che
# richiede di conoscere il dominio e di essere riletta con calma. Si rivedono
# tutti insieme in /aiuto/microaiuto. Ogni `anchor` deve avere il suo
# `data-help` in un template, e viceversa: lo verifica
# tests/new/unit/test_help_anchors.py.
#
# Campi di `hints`:
#   id       nome puntato, es. gara.distanza (identifica il suggerimento)
#   label    titolo del fumetto: il nome del comando come lo chiama l'utente
#   short    una o due frasi, massimo 220 caratteri. Se serve più spazio,
#            la spiegazione lunga va nella pagina indicata da `page`.
#   anchor   valore che l'elemento dell'interfaccia esporrà in `data-help`.
#            È il contratto fra questo file e i template dell'app.
#   screens  endpoint Flask in cui il comando compare
#   page     pagina della guida che lo spiega per esteso
#   section  ancora dentro quella pagina (deve essere un `heading` esistente)
#
# Campi di `tours`: `screen`, `title`, `intro`, `audience`, `steps`. Un passo
# che indica `hint:` eredita da lì titolo, testo e ancora — non riscriverli, o
# le due versioni divergeranno alla prima modifica.

hints:
  # --- La tua home ---------------------------------------------------------
  - id: home.andamento
    label: "Come stai andando"
    short: "Due numeri, un grafico e le tue ultime attività: dice come stai procedendo, e non porta da nessuna parte. Ti accoglie quando entri, una volta per accesso."
    anchor: home-andamento
    screens: [dashboard.dashboard]
    page: primo_accesso
    section: come_stai_andando

  - id: home.tutti_i_numeri
    label: "Tutti i tuoi numeri"
    short: "Apre tre o quattro righe in più: serie in corso, posizione in campionato, esercizi completati, livello. Parte sempre chiuso, si apre con un tocco."
    anchor: home-tutti-i-numeri
    screens: [dashboard.dashboard]
    page: primo_accesso
    section: come_stai_andando


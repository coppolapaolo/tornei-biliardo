    page: profilo_e_statistiche
    section: rating

  - id: profilo.livello
    label: "Livello"
    short: "Misura quanto usi l'app, non quanto giochi bene. Per la bravura c'è il rating."
    anchor: profilo-livello
    screens: [gamification.dashboard, player.profile]
    page: progressi
    section: xp

  # --- Campionato ----------------------------------------------------------
  - id: campionato.classifica
    label: "Sistema di classifica"

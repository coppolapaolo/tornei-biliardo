    anchor: campionato-punti-posizione
    screens: [admin.campionato.edit_campionato]
    page: creare_un_campionato
    section: punti_posizione

  # --- Esami ---------------------------------------------------------------
  - id: esame.prova_da_solo
    label: "Prova da solo"
    short: "Ti alleni: registri tu i punteggi e puoi fermarti e riprendere. Resta nel tuo storico ma non porta la certificazione."
    anchor: esame-prova-da-solo

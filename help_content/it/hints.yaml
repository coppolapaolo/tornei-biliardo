    section: catalogo

  - id: esercizio.voto
    label: "Il tuo voto"
    short: "Da una a cinque bilie, per aiutare gli altri a scegliere: tocca la bilia del tuo voto. Si vota un esercizio dopo averlo provato; il voto si cambia quando vuoi, e toccando di nuovo la tua bilia lo togli."
    anchor: esercizio-voto
    screens: [challenge.challenge_detail]
    page: challenge
    section: catalogo

  - id: esercizio.varianti
    label: "Varianti"
    short: "Lo stesso esercizio da destra e da sinistra, o dalle posizioni A e B: i tuoi risultati restano separati, perché la differenza fra i due lati è la cosa da sapere."
    anchor: esercizio-varianti
    screens: [challenge.challenge_detail]
    page: challenge
    section: catalogo

  - id: allenamento.variante
    label: "Da che parte"
    short: "Scegli la variante prima di tirare: resta accesa per tutte le prove che registri. Se non la dici, la prova vale per l'esercizio in generale."
    anchor: allenamento-variante
    screens: [challenge.training_session]
    page: challenge
    section: catalogo

  - id: challenge.abilita
    label: "Cosa allena"
    short: "Le abilità che l'esercizio mette alla prova, al più tre: è da qui che il catalogo lo fa trovare a chi cerca «qualcosa sulla posizione». Se non lo sai, lascia vuoto."
    anchor: challenge-abilita
    screens: [challenge.create_challenge, challenge.edit_challenge, challenge.duplicate_challenge]
    page: challenge
    section: crearle

  - id: challenge.gesto
    label: "Con che gesto"
    short: "I colpi con cui si esegue: stop, draw, follow… Quanti ne servono, anche nessuno. È un secondo modo di cercare, diverso da «cosa allena»."
    anchor: challenge-gesto
    screens: [challenge.create_challenge, challenge.edit_challenge, challenge.duplicate_challenge]
    page: challenge
    section: crearle

  - id: challenge.livello
    label: "Livello"
    short: "Quanto è difficile secondo te, da 1 (per chi comincia) a 5. Tocca di nuovo la cifra accesa per non dichiararlo."
    anchor: challenge-livello
    screens: [challenge.create_challenge, challenge.edit_challenge, challenge.duplicate_challenge]
    page: challenge
    section: crearle

  - id: challenge.duplica
    label: "Duplica"
    short: "Apre il modulo già compilato coi dati di questo esercizio e ne crea uno nuovo, tuo, senza prove né voti. L'originale non si tocca."
    anchor: challenge-duplica
    screens: [challenge.challenge_detail]
    page: challenge
    section: crearle

  # --- Builder degli esercizi ---------------------------------------------------
  - id: challenge.punteggio_massimo
    label: "Punteggio massimo"
    short: "Fin dove si può arrivare. Facoltativo: lascialo vuoto per le prove che si ripetono finché non sbagli, dove un massimo non esiste."
    anchor: challenge-punteggio-massimo
    screens: [challenge.create_challenge, challenge.edit_challenge, challenge.duplicate_challenge, challenge.diagram_builder, challenge.edit_diagram]
    page: challenge
    section: due_tipi

  - id: challenge.colpi
    label: "Colpi di una prova"
    short: "Quanti colpi ha una prova registrata colpo per colpo. Il punteggio massimo non si scrive: è questo numero per il valore del centro del bersaglio."
    anchor: challenge-colpi
    screens: [challenge.edit_challenge, challenge.duplicate_challenge]
    page: challenge
    section: due_tipi

  - id: allenamento.esito
    label: "Superata / Non superata"
    short: "Il tasto che tocchi registra subito la prova: non c'è niente da confermare. Se sbagli tasto, «Annulla l'ultima» lo disfa."
    anchor: allenamento-esito
    screens: [challenge.training_session]
    page: challenge
    section: allenarsi

  - id: allenamento.punteggio
    label: "Il punteggio della prova"
    short: "Più e meno compongono il punteggio, che non sale oltre il massimo dell'esercizio. «Registra la prova» lo salva e riporta la cifra a zero, pronta per la prossima."
    anchor: allenamento-punteggio
    screens: [challenge.training_session]
    page: challenge
    section: allenarsi

  - id: allenamento.andamento
    label: "Le prove di oggi"
    short: "Una barra per ogni prova di oggi, l'ultima accesa. La linea tratteggiata è la tua media fino a ieri: il confronto è con te stesso, non con gli altri."
    anchor: allenamento-andamento
    screens: [challenge.training_session]
    page: challenge
    section: allenarsi

  - id: challenge.estrazione
    label: "Che cosa estrae l'app"
    short: "Le liste da cui l'app pesca prima di ogni colpo: una per riga, «nome: voce | voce». Si pescano insieme, e la consegna esce già a parole — «3 o più sponde, bilia 7»."
    anchor: challenge-estrazione
    screens: [challenge.create_challenge, challenge.edit_challenge, challenge.duplicate_challenge]
    page: challenge
    section: due_tipi

  - id: allenamento.colpo
    label: "Colpo per colpo"
    short: "Se la bilia è entrata, tocca il panno dove si è fermata la bianca: l'anello in cui cade dà i punti. Se non è entrata, il colpo vale zero e non ha una posizione."
    anchor: allenamento-colpo
    screens: [challenge.training_session]
    page: challenge
    section: allenarsi

  - id: allenamento.annulla
    label: "Annulla l'ultima"
    short: "Toglie l'ultima prova registrata. Torna indietro anche l'XP: serve a correggere un tocco sbagliato, non a rigiocarsi il punteggio."
    anchor: allenamento-annulla
    screens: [challenge.training_session]
    page: challenge
    section: allenarsi

  - id: drill.disegna
    label: "Disegna l'esercizio"
    short: "Se la foto del tavolo non ce l'hai, l'esercizio si disegna: disponi le bilie, tracci il tiro, e l'immagine la genera il disegno."
    anchor: drill-disegna
    screens: [challenge.create_challenge]
    page: challenge
    section: disegnare

  - id: drill.modifica_disegno
    label: "Modifica il disegno"
    short: "Rimette le bilie sul tavolo come le avevi lasciate. Compare solo sugli esercizi disegnati: da una foto non c'è un disegno da riaprire."
    anchor: drill-modifica-disegno
    screens: [challenge.challenge_detail]
    page: disegnare_un_drill
    section: correggere

  - id: drill.strumento
    label: "Gli strumenti"
    short: "Uno alla volta, e quello attivo è giallo: «Sposta» sistema, «Tiro» disegna un tiro, «Linea libera» traccia un percorso, «Testo» scrive."
    anchor: drill-strumento
    screens: [challenge.diagram_builder, challenge.edit_diagram]
    page: disegnare_un_drill
    section: strumenti

  - id: drill.bersaglio
    label: "Il bersaglio"
    short: "Dove la bianca deve fermarsi: un centro e fino a cinque anelli, ciascuno coi suoi punti. Ce n'è uno per disegno, e con un bersaglio l'esercizio si può registrare colpo per colpo."
    anchor: drill-bersaglio
    screens: [challenge.diagram_builder, challenge.edit_diagram]
    page: disegnare_un_drill
    section: strumenti

  - id: drill.calamite
    label: "Calamite sponda e biglie"
    short: "La bilia si aggancia da sola a griglia, sponda e altre bilie. Togli il segno di spunta — o tieni premuto Alt — se ti sposta dove non vuoi."
    anchor: drill-calamite
    screens: [challenge.diagram_builder, challenge.edit_diagram]
    page: disegnare_un_drill
    section: bilie

  - id: drill.punto_impatto
    label: "Punto di impatto sulla bianca"
    short: "Il cerchio è la bianca vista di fronte: tocca dove la colpisce la stecca. In mezzo è pieno, in alto o in basso è effetto, ai lati è laterale."
    anchor: drill-punto-impatto
    screens: [challenge.diagram_builder, challenge.edit_diagram]
    page: disegnare_un_drill
    section: tiro

  - id: drill.forza
    label: "Forza"
    short: "Quanto forte si colpisce. A forza 30 la bilia percorre due lunghezze di tavolo, e il cerchio tratteggiato segna dove si ferma."
    anchor: drill-forza
    screens: [challenge.diagram_builder, challenge.edit_diagram]
    page: disegnare_un_drill
    section: tiro

  - id: drill.posizioni_standard
    label: "Posizioni standard"
    short: "Otto disposizioni già pronte, dai triangoli al wagon wheel. Sostituiscono quel che c'è sul tavolo: se sbagli, «Annulla mossa» rimette tutto."
    anchor: drill-posizioni-standard
    screens: [challenge.diagram_builder, challenge.edit_diagram]
    page: disegnare_un_drill
    section: posizioni

  - id: drill.istruzioni
    label: "Istruzioni per chi la esegue"
    short: "Il disegno mostra la disposizione, non la regola: come si conta il punteggio va scritto qui, a parole. Senza, l'esercizio non si salva."
    anchor: drill-istruzioni
    screens: [challenge.diagram_builder, challenge.edit_diagram]
    page: disegnare_un_drill
    section: salvare

  # --- Avvio rapido delle sfide individuali (issue #176) --------------------
  - id: sfida.avvio_rapido
    label: "Avvio rapido"
    short: "Per la partita che state giocando adesso: scegli chi hai davanti e sei al segnapunti. Niente data da concordare, niente attesa."
    anchor: sfida-avvio-rapido
    screens: [individual_match.dashboard, individual_match.match_list]
    page: partite_amichevoli
    section: avvio-rapido

  - id: sfida.chi_hai_davanti
    label: "Chi hai davanti"
    short: "Gli avversari con cui giochi più spesso sono già in elenco. Per gli altri, cerca per nome: deve avere un account."
    anchor: sfida-chi-hai-davanti
    screens: [individual_match.quick_match]
    page: partite_amichevoli
    section: avvio-rapido

  - id: sfida.riepilogo_rapido
    label: "Come si gioca"
    short: "Sala, disciplina e distanza sono già quelle dell'ultima partita. Se vanno bene non tocchi niente; «Cambia» le apre."
    anchor: sfida-riepilogo-rapido
    screens: [individual_match.quick_match]
    page: partite_amichevoli
    section: avvio-rapido

  - id: sfida.referto_all_avvio
    label: "Tengo il referto TPA"
    short: "Va deciso adesso: il referto si apre prima del primo triangolo, e appena la partita parte si è al segnapunti."
    anchor: sfida-referto-all-avvio
    screens: [individual_match.quick_match, individual_match.match_detail]
    page: referto_tpa
    section: aprire
  - id: campionato.playoff_classifica_finale
    label: "Classifica finale del campionato"
    short: "Il playoff si somma al campionato (con un peso a scelta), oppure decide da solo le prime posizioni. Se non tocchi niente vale la somma, con peso 1."
    anchor: campionato-playoff-classifica-finale
    screens: [admin.campionato.campionato_detail]
    page: playoff
    section: classifica_finale

  # --- Segnalazioni ------------------------------------------------------------
  - id: segnalazione.tipo
    label: "Di cosa si tratta"
    short: "Tre possibilità: qualcosa non funziona, hai un'idea, non hai capito come si fa. Serve a noi per capire subito che tipo di segnalazione è."
    anchor: segnalazione-tipo
    screens: [feedback.nuova_segnalazione]
    page: segnalare_un_problema
    section: come_si_scrive
  - id: segnalazione.racconto
    label: "Racconta cosa è successo"
    short: "Cosa stavi facendo, cosa ti aspettavi, cosa è successo invece. Non serve essere tecnici: scrivi come lo racconteresti a voce."
    anchor: segnalazione-racconto
    screens: [feedback.nuova_segnalazione]
    page: segnalare_un_problema
    section: come_si_scrive
  - id: segnalazione.stato
    label: "Lo stato della segnalazione"
    short: "Dice a che punto siamo: ricevuta, presa in considerazione, fatto, oppure per ora non la faremo. Cambia da solo, e ti arriva una notifica."
    anchor: segnalazione-stato
    screens: [feedback.le_mie_segnalazioni]
    page: segnalare_un_problema
    section: che_fine_fa

  - id: vetrina.locandina
    label: "Locandina"
    short: "L'immagine che compare nell'anteprima del link su WhatsApp o Facebook. Caricala sul campionato e la usano tutte le sue gare."
    anchor: vetrina-locandina
    screens: [admin.competition.gara_vetrina, admin.campionato.campionato_vetrina]
    page: far_conoscere_la_gara
    section: locandina
  - id: vetrina.indirizzo
    label: "Indirizzo personalizzato"
    short: "Un nome leggibile al posto del codice, da dettare al telefono. Il link con il codice continua a funzionare."
    anchor: vetrina-indirizzo
    screens: [admin.competition.gara_vetrina]
    page: far_conoscere_la_gara
    section: indirizzo
  - id: vetrina.link_esterno
    label: "Link esterno"
    short: "Regolamento, pagina della sala o modulo di pagamento: diventa un pulsante in fondo alla vetrina."
    anchor: vetrina-link-esterno
    screens: [admin.competition.gara_vetrina, admin.campionato.campionato_vetrina]
    page: far_conoscere_la_gara
    section: regolamento

  # --- Campionato: wizard e pagina del campionato ---------------------------
  - id: campionato.gare_pianificate
    label: "Gare pianificate"
    short: "Quante gare pensi di giocare nel campionato. È un'indicazione per chi lo segue: le gare le aggiungi una alla volta, e puoi farne di più o di meno."
    anchor: campionato-gare-pianificate
    screens: [admin.campionato.wizard_start]
    page: creare_un_campionato
    section: passo1

  - id: campionato.modalita_esercizi
    label: "Modalità esercizi"
    short: "Nelle gare del campionato i giocatori affrontano anche prove di abilità individuali, con una classifica a parte. Se non sai cos'è, lascia spento."
    anchor: campionato-modalita-esercizi
    screens: [admin.campionato.wizard_start]
    page: creare_un_campionato
    section: passo1

  - id: campionato.playoff_elite
    label: "Playoff Elite"
    short: "A fine campionato i primi della classifica generale giocano una gara finale fra loro. Qui decidi se farla e per quanti giocatori."
    anchor: campionato-playoff-elite
    screens: [admin.campionato.wizard_start]
    page: playoff
    section: qualificarsi

  - id: campionato.playoff_academy
    label: "Playoff Academy"
    short: "Una seconda finale per chi viene subito dopo i primi: così anche chi non è in testa ha una gara da giocarsi a fine stagione."
    anchor: campionato-playoff-academy
    screens: [admin.campionato.wizard_start]
    page: playoff
    section: qualificarsi

  - id: campionato.nuova_gara
    label: "Nuova gara"
    short: "Aggiunge una gara al campionato. Nasce già con le impostazioni predefinite scelte nel wizard: cambia solo quello che serve."
    anchor: campionato-nuova-gara
    screens: [admin.campionato.campionato_detail]
    page: creare_un_campionato
    section: aggiungere_gare

  - id: campionato.termina
    label: "Termina"
    short: "Chiude il campionato: la classifica generale diventa definitiva e, se hai previsto i playoff, da qui li avvii. Non si torna indietro."
    anchor: campionato-termina
    screens: [admin.campionato.campionato_detail]
    page: creare_un_campionato
    section: classifica_generale

  - id: campionato.avvia_playoff
    label: "Avvia i playoff"
    short: "Chiede quando si gioca e fino a quando si risponde, poi manda l'invito ai qualificati. Chi rifiuta lascia il posto al primo degli esclusi."
    anchor: campionato-avvia-playoff
    screens: [admin.campionato.campionato_detail]
    page: playoff
    section: avviare

  - id: playoff.risposta_invito
    label: "Accetta / Rifiuta"
    short: "La risposta all'invito. Di norma la dà il giocatore dal suo telefono; se te la dice a voce, o se il giocatore è fittizio, la registri tu qui."
    anchor: playoff-risposta-invito
    screens: [admin.campionato.campionato_detail]
    page: playoff
    section: invito

  - id: playoff.invito_scaduto
    label: "Accetta (invito scaduto)"
    short: "L'invito è scaduto, ma fino all'avvio della gara puoi accettarlo tu per il giocatore, per esempio se si presenta in sala. Entra anche oltre i posti."
    anchor: playoff-invito-scaduto
    screens: [admin.campionato.campionato_detail]
    page: playoff
    section: invito

  - id: playoff.accetta_tutti
    label: "Accetta tutti i rimanenti"
    short: "In una prova i fittizi non rispondono da soli: questo pulsante accetta tutti gli inviti ancora in attesa, e la finale si riempie in un tocco."
    anchor: playoff-accetta-tutti
    screens: [admin.campionato.campionato_detail]
    page: fare_una_prova
    section: campionato

  # --- Competizione di prova (ADR-058) ---------------------------------------
  - id: prova.spunta
    label: "Competizione di prova"
    short: "Una competizione che vedi solo tu, da riempire di giocatori fittizi e condurre come una vera. Non tocca statistiche né classifiche. Al massimo tre alla volta."
    anchor: prova-spunta
    screens: [admin.competition.create_gara_standalone, admin.campionato.wizard_start]
    page: fare_una_prova
    section: creare

  - id: prova.fittizi
    label: "Giocatori fittizi"
    short: "Tre pulsanti per riempire la prova: il minimo per farla partire, fino al massimo per riempirla, uno in più per vedere cosa succede con i dispari."
    anchor: prova-fittizi
    screens: [admin.competition.gara_detail]
    page: fare_una_prova
    section: iscrivere

  - id: prova.simulazione
    label: "Simulazione"
    short: "Fa giocare i fittizi al posto tuo: una partita, il turno intero o tutta la gara. Metà partite si chiudono da sole, le altre aspettano che le validi tu."
    anchor: prova-simulazione
    screens: [admin.competition.gara_detail]
    page: fare_una_prova
    section: simulare

  - id: prova.aiuto
    label: "Suggerimenti"
    short: "Accende o spegne le «?» accanto ai comandi e la presentazione delle schermate. Vale per questo browser: spento qui, resta spento in ogni prova."
    anchor: prova-aiuto
    screens: [admin.competition.gara_detail, admin.competition.gara_preparazione, admin.competition.gara_impostazioni, admin.campionato.campionato_detail, admin.campionato.edit_campionato]
    page: fare_una_prova
    section: aiuto

  - id: prova.elimina
    label: "Elimina la prova"
    short: "Cancella tutto, subito: gare, partite, iscrizioni e giocatori fittizi. Se non lo fai tu, la prova sparisce da sola alla scadenza scritta qui sopra."
    anchor: prova-elimina
    screens: [admin.competition.gara_detail, admin.competition.gara_preparazione, admin.competition.gara_impostazioni, admin.campionato.campionato_detail, admin.campionato.edit_campionato]
    page: fare_una_prova
    section: eliminare

tours:
  - screen: dashboard.dashboard
    title: "La tua home"
    intro: "Da qui parte tutto: come stai andando, le gare a cui sei iscritto, quelle in corso, i campionati e le gare vicine a te."
    audience: [giocatore]
    steps:
      - title: "Il riepilogo che ti accoglie"
        text: "Appena entri, in cima c'è un riquadro con il tuo andamento: due numeri, un grafico e le ultime attività. Si legge e basta; poi lascia il posto alle cose da fare, e torna al prossimo accesso."
      - title: "Le tue gare"
        text: "Sotto «Le tue gare» c'è solo quello che ti riguarda: le gare a cui sei iscritto e quelle che dirigi. La tua partita di adesso sta dentro la scheda della sua gara."
      - title: "Sfide a due"
        text: "Le partite fuori gara, fissate o già iniziate, hanno una sezione tutta loro subito sotto le tue gare."
      - title: "In diretta ora"
        text: "Le gare che si stanno giocando adesso, anche quelle in cui non giochi, con i punteggi ai tavoli: la scheda scura è la diretta."
      - title: "Aperte, puoi iscriverti"
        text: "Le gare a cui puoi ancora iscriverti stanno in una sezione separata, più in basso: un tocco sul pulsante verde e sei dentro."
      - title: "Concluse"
        text: "L'ultima gara conclusa e quelle dell'ultimo mese, di tutti: quelle che hai giocato o diretto portano scritto «Hai giocato» e «Hai diretto». Le altre stanno nello storico."
      - title: "In fondo allo schermo"
        text: "La barra con Dashboard, Sale, Sfide, Esercizi e Notifiche ti porta ovunque. Su computer è la colonna di sinistra."

  - screen: admin.competition.gara_detail
    title: "La pagina della gara"
    intro: "Tutto quello che riguarda una gara sta qui: chi gioca contro chi, come va la classifica e chi partecipa."
    audience: [giocatore, direttore]
    steps:
      - title: "Dove siamo"
        text: "Chi dirige vede in cima la striscia delle fasi — preparazione, iscrizioni (il playoff non le ha), in gioco, chiusura — e una fascia scura con l'unica cosa da fare adesso; il resto della gestione sta in «Impostazioni gara». Chi gioca ha le linguette Turni, Classifica e Iscritti."
      - hint: gara.turni
      - hint: gara.classifica
      - title: "Iscritti"
        text: "Chi partecipa e chi è eventualmente in lista d'attesa."
      - hint: gara.distanza

  - screen: admin.match.match_detail
    title: "Il segnapunti"
    intro: "Questa schermata si usa mentre giochi: un tasto per giocatore, si preme dopo ogni triangolo."
    audience: [giocatore]
    steps:
      - hint: partita.segnapunti
      - hint: partita.punteggio
      - title: "Se sbagli"
        text: "«Annulla ultimo triangolo» toglie l'ultimo punto assegnato. Puoi ripeterlo più volte."
      - hint: partita.rack
      - hint: partita.tabellone

  - screen: admin.competition.create_gara_standalone
    title: "Creare una gara"
    intro: "Quattro passaggi. Se è la prima volta, cambia solo nome, data, sala e disciplina: il resto va già bene così."
    audience: [direttore]
    steps:
      - hint: gara.distanza
      - hint: gara.strategia
      - hint: gara.dispari
      - hint: gara.classifica_sistema
      - title: "Se scegli un tabellone"
        text: "Con eliminazione diretta e doppio KO metà delle domande sparisce — su un tabellone non avrebbero effetto — e compare il riquadro «Opzioni del tabellone»."

  - screen: individual_match.tpa_referto
    title: "Il referto TPA"
    intro: "Qui annoti tutta la partita, non solo chi vince i triangoli. Un turno per volta: quante bilie e perché è finito."
    audience: [giocatore]
    steps:
      - hint: referto.tastierino
      - hint: referto.passa_tavolo
      - hint: referto.annotazioni_piccole
      - hint: referto.rileggi

  - screen: feedback.nuova_segnalazione
    title: "Segnalare un problema"
    intro: "Tre campi e basta. La pagina da cui arrivi, la versione e il browser li allega l'app da sola."
    audience: [giocatore, direttore]
    steps:
      - hint: segnalazione.tipo
      - hint: segnalazione.racconto
      - title: "Cosa non scrivere"
        text: "Il testo finisce su GitHub, dove teniamo l'elenco dei lavori: non scriverci dati personali tuoi o di altri giocatori."


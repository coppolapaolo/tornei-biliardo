    anchor: referto-annotazioni-piccole
    screens: [individual_match.tpa_referto]
    page: referto_tpa
    section: annotazioni-piccole

  - id: referto.annulla
    label: "Annulla l'ultimo tocco"
    short: "Torna indietro di un passo, quante volte vuoi. Riporta indietro anche i triangoli già assegnati."
    anchor: referto-annulla
    screens: [individual_match.tpa_referto]
    page: referto_tpa
    section: come-si-compila

  # --- Catalogo e creazione degli esercizi --------------------------------------
  - id: challenge.ricerca
    label: "Cerca nel titolo o nelle istruzioni…"
    short: "Filtra tutte e tre le linguette insieme, e i numeri accanto ai nomi si aggiornano. Cerca anche dentro le istruzioni, non solo nel titolo."
    anchor: challenge-ricerca
    screens: [challenge.challenge_catalog]
    page: challenge
    section: catalogo

  - id: challenge.titolo
    label: "Titolo"
    short: "Il nome con cui la prova compare ovunque. È facoltativo: senza, prende il suo numero — «Esercizio 12»."
    anchor: challenge-titolo
    screens: [challenge.create_challenge, challenge.diagram_builder, challenge.edit_diagram]
    page: challenge
    section: crearle

  # --- Builder degli esercizi ---------------------------------------------------
  - id: challenge.punteggio_massimo
    label: "Punteggio massimo"
    short: "Fin dove si può arrivare. Facoltativo: lascialo vuoto per le prove che si ripetono finché non sbagli, dove un massimo non esiste."
    anchor: challenge-punteggio-massimo
    screens: [challenge.create_challenge, challenge.diagram_builder, challenge.edit_diagram]
    page: challenge
    section: due_tipi

  - id: allenamento.esito
    label: "Superata / Non superata"
    short: "Il tasto che tocchi registra subito la prova: non c'è niente da confermare. Se sbagli tasto, «Annulla l'ultima» lo disfa."
    anchor: allenamento-esito
    screens: [challenge.training_session]
    page: challenge
    section: allenarsi

  - id: allenamento.annulla
    label: "Annulla l'ultima"
    short: "Toglie l'ultima prova registrata. Torna indietro anche l'XP: serve a correggere un tocco sbagliato, non a rigiocarsi il punteggio."
    anchor: allenamento-annulla
    screens: [challenge.training_session]
    page: challenge

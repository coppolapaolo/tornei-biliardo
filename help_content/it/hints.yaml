  - id: esame.ordine_drill
    label: "L'ordine degli esercizi"
    short: "I candidati li affrontano nella sequenza in cui li metti. Si riordina finché l'esame non è quello che volevi."
    anchor: esame-ordine-drill
    screens: [exam.exam_detail]
    page: diventare_esaminatore
    section: comporre


  # --- Referto TPA (ADR-044) -----------------------------------------------

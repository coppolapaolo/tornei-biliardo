    anchor: iscrizione-lista-attesa
    screens: [admin.competition.gara_detail, player.gara_detail]
    page: iscriversi_a_una_gara
    section: lista_attesa

  # --- Profilo -------------------------------------------------------------
  - id: profilo.runout

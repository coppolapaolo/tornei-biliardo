    screens: [admin.competition.gara_detail]
    page: tabellone
    section: sorteggio

  - id: gara.squadra_iscrizione
    label: "Con che squadra giochi?"
    short: "Te lo chiede appena ti iscrivi, se la gara tiene lontani i compagni nel sorteggio. «Senza squadra» è una risposta, e si può cambiare fino al sorteggio."
    anchor: gara-squadra-iscrizione
    screens: [admin.competition.gara_detail]
    page: squadre
    section: iscriversi

  # --- Pagina della partita ------------------------------------------------
  - id: partita.punteggio
    label: "Punteggio"

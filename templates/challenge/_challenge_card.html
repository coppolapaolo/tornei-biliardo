{# templates/challenge/_challenge_card.html — 7c

   La card del catalogo (prototipo 9b·1). Niente `<script>` qui dentro: il
   file e' incluso una volta per challenge, quindi la funzione veniva
   ridichiarata a ogni card. I comandi vivono in `_challenge_grid.html`.
#}
{% set stats = challenge.get_statistics() %}
<article class="c7-card challenge-card" data-challenge-id="{{ challenge.id }}"
         data-challenge-url="{{ url_for('challenge.challenge_detail', challenge_id=challenge.id) }}"
         style="cursor: pointer; padding: 0; overflow: hidden; display: flex; flex-direction: column;">
    {# Foto del tavolo: è il contenuto principale della challenge, e va vista
       intera — ritagliarla toglie i bordi del tavolo (ADR-044). #}
    <div class="c7-diagram c7-diagram--card">
        {% if challenge.image_filename %}
        <img class="c7-diagram__img" src="{{ challenge_image_url(challenge) }}"
             alt="{{ challenge.description[:60] }}"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">
        <div style="display: none; position: absolute; inset: 0; place-items: center; color: var(--c7-ink-faint); font-size: 30px;">
            <i class="fas fa-bullseye"></i>
        </div>
        {% else %}
        <div style="display: grid; position: absolute; inset: 0; place-items: center; color: var(--c7-ink-faint); font-size: 30px;">
            <i class="fas fa-bullseye"></i>
        </div>
        {% endif %}

        <button class="favorite-btn" data-challenge-id="{{ challenge.id }}"
            data-favorite-url="{{ url_for('challenge.toggle_favorite', challenge_id=challenge.id) }}"
            style="position: absolute; top: 10px; right: 10px; width: 38px; height: 38px; border: 0; border-radius: 50%; background: var(--c7-card); display: grid; place-items: center; {% if challenge.id in user_favorites %}color: var(--c7-err);{% else %}color: var(--c7-ink-muted);{% endif %}"
            title="{% if challenge.id in user_favorites %}{{ _('Rimuovi dai preferiti') }}{% else %}{{ _('Aggiungi ai preferiti') }}{% endif %}">
            {% if challenge.id in user_favorites %}<i class="fas fa-heart"></i>{% else %}<i class="far fa-heart"></i>{% endif %}
        </button>

        <span class="c7-state {% if challenge.pass_fail_only %}c7-state--info{% else %}c7-state--muted{% endif %}" style="position: absolute; bottom: 10px; left: 10px;">
            {% if challenge.pass_fail_only %}{{ _('Riuscita o no') }}{% else %}{{ _('A punteggio') }}{% endif %}
        </span>
    </div>

    <div style="padding: var(--c7-pad-card); display: flex; flex-direction: column; flex: 1;">
        <p style="margin: 0; font-size: 14px; font-weight: 700; line-height: 1.45; flex: 1;">
            {{ challenge.description }}
        </p>
        {% if challenge.created_by_id == current_user.id %}
        <span class="c7-kicker" style="margin-top: 6px;">{{ _('Creata da te') }}</span>
        {% endif %}

        {# `get_statistics()` era chiamata due volte per card: due passate sui
           tentativi per stampare due numeri. #}
        <div class="text-muted" style="margin-top: 12px; font-size: 12px; font-weight: 700;">
            <span class="c7-num">{{ stats.unique_players }}</span> {{ _('giocatori') }}
            <span class="c7-sep">·</span>
            <span class="c7-num">{{ stats.total_attempts }}</span> {{ _('tentativi') }}
        </div>

        <div style="display: flex; gap: 8px; margin-top: 16px;">
            {% if not current_user.is_admin %}
            <a href="{{ url_for('challenge.start_attempt', challenge_id=challenge.id) }}" class="btn btn-primary btn-sm" style="flex: 1;">{{ _('Provala') }}</a>
            {% endif %}
            <a href="{{ url_for('challenge.challenge_detail', challenge_id=challenge.id) }}" class="btn btn-secondary btn-sm" style="flex: 1;">{{ _('Dettagli') }}</a>
            {% if current_user.is_admin or (current_user.is_authenticated and challenge.created_by_id == current_user.id) %}
            <button class="c7-iconbtn delete-challenge-btn" style="width: 40px; height: 40px; background: var(--c7-err-bg); color: var(--c7-err-ink);"
                    data-delete-url="{{ url_for('challenge.delete_challenge', challenge_id=challenge.id) }}"
                    title="{{ _('Elimina') }}" aria-label="{{ _('Elimina') }}">
                <i class="fas fa-trash"></i>
            </button>
            {% endif %}
        </div>

        <div class="text-muted" style="margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--c7-line-soft); font-size: 12px; font-weight: 600;">
            {% if challenge.created_by %}{{ _('Creata da') }} {{ challenge.created_by.username }}{% else %}{{ _('Creata dal sistema') }}{% endif %}
            <span class="c7-sep">·</span> <span class="c7-num">{{ challenge.created_at|date_local }}</span>
        </div>
    </div>
</article>

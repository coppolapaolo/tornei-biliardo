{% extends "base.html" %}

{% block title %}Modifica {{ tournament.name }} - Admin{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1>Modifica Torneo</h1>
        <p class="text-muted mb-0">{{ tournament.name }}</p>
    </div>
    <div>
        <a href="{{ url_for('admin.tournament.tournament_detail', tournament_id=tournament.id) }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left"></i> Annulla
        </a>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        {% include "components/_tournament_edit_form.html" %}
    </div>
</div>
{% endblock %}

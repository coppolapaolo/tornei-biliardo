{% extends 'base.html' %}
{% block content %}
  <h2>Richieste Direttore di Gara</h2>
  <table class="table">
    <thead>
      <tr>
        <th>Utente</th>
        <th>Data richiesta</th>
        <th>Azione</th>
      </tr>
    </thead>
    <tbody>
      {% for req in requests %}
        <tr>
          <td>{{ req.user.username }}</td>
          <td>{{ req.requested_at|datetime_local }}</td>
          <td>
            <form method="POST" action="{{ url_for('admin.user.approve_director_request', req_id=req.id) }}" style="display:inline;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button type="submit" class="btn btn-success btn-sm">Approva</button>
            </form>
            <form method="POST" action="{{ url_for('admin.user.reject_director_request', req_id=req.id) }}" style="display:inline;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button type="submit" class="btn btn-danger btn-sm">Rifiuta</button>
            </form>
          </td>
        </tr>
      {% else %}
        <tr><td colspan="3">Nessuna richiesta.</td></tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}

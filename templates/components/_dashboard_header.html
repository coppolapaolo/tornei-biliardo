<!-- Unified Dashboard Header Component -->
<div class="d-flex justify-content-between align-items-center mb-4">
  <div class="d-flex align-items-center">
    <h2 class="h5 me-3 mb-0">
      <i class="fas {{ vm.icon }}"></i> {{ vm.title }}
    </h2>
    {% if vm.caps and vm.caps.can_create_tournament %}
      <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#newTournamentModal">
        <i class="fas fa-plus"></i> Nuovo Torneo
      </button>
    {% endif %}
  </div>

  {% include "components/_resource_selector.html" %}
</div>

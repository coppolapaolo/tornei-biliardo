<!-- Amalfi Preview Modal Component -->
<div class="modal fade" id="amalfiPreviewModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fas fa-eye"></i> Anteprima Turno <span id="modalRoundNumber"></span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="amalfiPreviewContent">
                    <!-- Content loaded via AJAX -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="fas fa-times"></i> Chiudi
                </button>
                <button type="button" class="btn btn-success" id="confirmStartRound" style="display: none;">
                    <i class="fas fa-play"></i> Avvia Turno
                </button>
            </div>
        </div>
    </div>
</div>

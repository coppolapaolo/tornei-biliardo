{# templates/components/_new_campionato_modal.html #}
<!-- Modal Nuovo Campionato -->
{% if is_director %}
<div class="modal fade" id="newTournamentModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="POST" action="{{ url_for('admin.campionato.create_campionato') }}">
        <div class="modal-header">
          <h5 class="modal-title">Crea Nuovo Campionato</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Nome campionato</label>
            <input type="text" class="form-control" name="name" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Tipo</label>
            <select class="form-select" name="campionato_type">
              <option value="amalfi" selected>Amalfi</option>
              <option value="random">Random</option>
            </select>
            <small class="text-muted">
              Amalfi: classifica. Random: casuale anti-rematch.
            </small>
          </div>
          <!-- opzioni rapide -->
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="without_x" id="without_x">
            <label class="form-check-label" for="without_x">Senza X</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="final_playoffs" id="final_playoffs">
            <label class="form-check-label" for="final_playoffs">Playoff finali</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="challenge_mode" id="challenge_mode">
            <label class="form-check-label" for="challenge_mode">Challenge mode</label>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
          <button type="submit" class="btn btn-primary">Crea</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endif %}

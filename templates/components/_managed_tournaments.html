<!-- Managed Tournaments Sidebar Component -->
{% if vm.managed_tournaments and vm.managed_tournaments|length %}
<div class="card mb-4">
  <div class="card-header"><h5 class="mb-0"><i class="fas fa-briefcase"></i> I miei Tornei</h5></div>
  <div class="card-body p-2">
    {% for t in vm.managed_tournaments %}
      <a href="{{ url_for('admin.tournament.tournament_detail', tournament_id=t.id) }}" class="btn btn-outline-secondary btn-sm w-100 mb-1">
        {{ t.name }}
      </a>
    {% endfor %}
  </div>
</div>
{% endif %}

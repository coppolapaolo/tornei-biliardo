{# templates/components/_user_profile_header.html #}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1>
            <i class="fas fa-user"></i> {{ user.username }}
            {% if user.is_admin %}
                <span class="badge bg-danger ms-2">Admin</span>
            {% endif %}
        </h1>
        <p class="text-muted mb-0">Scheda giocatore</p>
    </div>
    <div>
        <a href="{{ url_for('admin.user.users_list') }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left"></i> Torna alla Lista
        </a>
    </div>
</div>

<!-- Open Inscriptions Modal Component -->
<div class="modal fade" id="openInscriptionsModal" tabindex="-1">
    <div class="modal-dialog modal-fullscreen-sm-down">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{ _("Apri Iscrizioni") }}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form action="{{ url_for('admin.competition.open_inscriptions', gara_id=gara.id) }}" method="POST" id="inscriptionForm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="modal-body">
                    {# Gli orari si leggono e si scrivono nel fuso di chi sta
                       compilando (ADR-043): il server li converte con
                       `parse_local_datetime`. #}
                    <div class="alert alert-info">
                        <small><i class="fas fa-clock"></i> {{ _("Gli orari sono nel tuo fuso orario.") }}</small>
                    </div>
                    <div class="mb-3">
                        <label for="inscription_start" class="form-label">{{ _("Inizio Iscrizioni") }}</label>
                        <input type="datetime-local" class="form-control" name="inscription_start" id="inscription_start" required>
                    </div>
                    <div class="mb-3">
                        <label for="inscription_end" class="form-label">{{ _("Fine Iscrizioni") }}</label>
                        <input type="datetime-local" class="form-control" name="inscription_end" id="inscription_end" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{{ _("Annulla") }}</button>
                    <button type="submit" class="btn btn-success">{{ _("Apri Iscrizioni") }}</button>
                </div>
            </form>
        </div>
    </div>
</div>

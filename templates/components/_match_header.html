<!-- Match Header Component -->
<div class="card-header">
    <div class="d-flex justify-content-between align-items-center">
        <small>
        {{ match.gara|gara_display_name }} - Turno {{ match.round_number }} -
        {{ match.gara.discipline.replace('_', ' ') }} -
        {{ match.distance_config|format_distance }}
        - Tavolo {{ match.table_assignment or 'In attesa di assegnazione'}}
        </small>
        <div>
            <span class="badge {{ match | status_badge_class }}">{{ match | status_text }}</span>
        </div>
    </div>
</div>

{# templates/components/_managed_tournaments_card.html #}
<!-- I miei Tornei -->
{% if is_director %}
<div class="card mb-4">
    <div class="card-header">
        <h5><i class="fas fa-briefcase"></i> I miei Tornei</h5>
    </div>
    <div class="card-body p-2">
        {% if managed_tournaments %}
        {% for t in managed_tournaments %}
            <a href="{{ url_for('admin.tournament.tournament_detail', tournament_id=t.id) }}"
            class="btn btn-outline-secondary btn-sm w-100 mb-1">
            {{ t.name }}
            </a>
        {% endfor %}
        {% else %}
        <div class="text-muted small text-center">Nessun torneo gestito</div>
        {% endif %}
    </div>
</div>
{% endif %}

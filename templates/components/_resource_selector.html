<!-- templates/components/_resource_selector.html -->
<div class="mb-3" id="resource-selector">
  <div class="dropdown">
    <button
      class="btn btn-outline-primary dropdown-toggle d-flex align-items-center"
      type="button"
      id="resourceSelect"
      data-bs-toggle="dropdown"
      aria-expanded="false"
    >
      {% if vm.selected_gara %}
        <i class="fas fa-bullseye me-2"></i>
        {{ vm.selected_gara.name }}{% if vm.selected_gara.date %} ({{ vm.selected_gara.date|date_local }}){% endif %}
      {% elif vm.selected_campionato %}
        <i class="fas fa-trophy me-2"></i>
        {{ vm.selected_campionato.name }}
      {% else %}
        <i class="fas fa-trophy me-2"></i> Seleziona…
      {% endif %}
    </button>

    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="resourceSelect">
      {% for it in vm.selector_items or [] %}
        <li>
          <button
            type="button"
            class="dropdown-item d-flex align-items-center {% if it.selected %}active{% endif %}"
            data-kind="{{ it.kind }}"
            data-id="{{ it.id }}"
          >
            {% if it.kind == 't' %}
              <i class="fas fa-trophy me-2"></i>
            {% else %}
              <i class="fas fa-bullseye me-2"></i>
            {% endif %}
            {{ it.label }}
          </button>
        </li>
      {% endfor %}
    </ul>
  </div>
</div>

<script>
(function(){
  const container = document.getElementById('resource-selector');
  if (!container) return;
  container.querySelectorAll('.dropdown-item').forEach(function(btn){
    btn.addEventListener('click', function(){
      const kind = this.dataset.kind;
      const id = this.dataset.id;
      const params = new URLSearchParams(window.location.search);
      if (kind === 'p') {
        params.set('gara_id', id);
        params.delete('campionato_id');
      } else {
        params.set('campionato_id', id);
        params.delete('gara_id');
      }
      window.location.search = params.toString();
    });
  });
})();
</script>

<!-- Modale eliminazione (soft delete) — 7c -->
<div class="modal fade" id="softDeleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="softDeleteModalTitle">{{ _("Elimina") }}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{{ _('Chiudi') }}"></button>
            </div>
            <form id="softDeleteForm" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="modal-body">
                    <p style="margin: 0 0 6px; font-size: 15px;">
                        <span id="softDeleteModalMessage"></span><strong id="softDeleteEntityName"></strong>?
                    </p>
                    <p id="softDeleteExtraMessage" class="text-muted" style="display: none; font-size: 13px; margin: 0 0 16px;"></p>

                    <div class="c7-label" style="margin-top: 18px;">{{ _("Cosa fare con le partite esistenti") }}</div>
                    <div class="c7-stack">
                        <label class="c7-choice" for="cascadeDeleteAll">
                            <input class="form-check-input" type="radio" name="cascade_option" id="cascadeDeleteAll" value="delete_all" checked>
                            <span>
                                <span class="c7-choice__title">{{ _("Elimina tutto") }}</span>
                                <span class="c7-choice__desc">{{ _("Le partite spariscono insieme alla gara.") }}</span>
                            </span>
                        </label>
                        <label class="c7-choice" for="cascadeKeepMatches">
                            <input class="form-check-input" type="radio" name="cascade_option" id="cascadeKeepMatches" value="keep_matches">
                            <span>
                                <span class="c7-choice__title">{{ _("Mantieni le partite") }}</span>
                                <span class="c7-choice__desc">{{ _("Diventano sfide individuali, slegate dalla gara.") }}</span>
                            </span>
                        </label>
                    </div>

                    <div style="margin-top: 18px;">
                        <label for="softDeleteReason" class="form-label">{{ _("Motivo") }}</label>
                        <input type="text" class="form-control" id="softDeleteReason" name="reason" maxlength="255"
                               placeholder="{{ _('Es. gara annullata per maltempo') }}">
                        <div class="form-text">{{ _("Facoltativo, ma aiuta chi legge lo storico.") }}</div>
                    </div>

                    <div class="c7-flash c7-flash--info" style="margin-top: 16px;">
                        <span class="c7-flash__ico"><i class="fas fa-info"></i></span>
                        <span class="c7-flash__body">{{ _("I dati non vengono cancellati definitivamente: restano recuperabili.") }}</span>
                    </div>
                </div>
                <div class="modal-footer" style="display: flex; gap: 10px;">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{{ _("Annulla") }}</button>
                    <button type="submit" class="btn btn-danger" style="flex: 1;">{{ _("Elimina") }}</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
/**
 * Apre il modale di eliminazione.
 *
 * @param {string} entityType - 'gara' o 'campionato'
 * @param {number} entityId
 * @param {string} entityName
 * @param {string} actionUrl
 */
function showSoftDeleteModal(entityType, entityId, entityName, actionUrl) {
    var modal = document.getElementById('softDeleteModal');
    var form = document.getElementById('softDeleteForm');
    var title = document.getElementById('softDeleteModalTitle');
    var message = document.getElementById('softDeleteModalMessage');
    var nameSpan = document.getElementById('softDeleteEntityName');
    var extraMessage = document.getElementById('softDeleteExtraMessage');

    if (entityType === 'campionato') {
        title.textContent = {{ _("Elimina il campionato")|tojson }};
        message.textContent = {{ _("Confermi di voler eliminare il campionato")|tojson }} + ' ';
        extraMessage.textContent = {{ _("Spariranno anche tutte le gare collegate.")|tojson }};
        extraMessage.style.display = 'block';
    } else {
        title.textContent = {{ _("Elimina la gara")|tojson }};
        message.textContent = {{ _("Confermi di voler eliminare la gara")|tojson }} + ' ';
        extraMessage.style.display = 'none';
    }

    nameSpan.textContent = entityName;
    form.action = actionUrl;

    document.getElementById('cascadeDeleteAll').checked = true;
    document.getElementById('softDeleteReason').value = '';

    var bsModal = new bootstrap.Modal(modal);
    bsModal.show();
}
</script>

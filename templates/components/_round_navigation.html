<!-- Round Navigation Component -->
<div class="card">
    <div class="card-header">
        <h6><i class="fas fa-list-ol"></i> Navigation Turni</h6>
    </div>
    <div class="card-body">
        {% for r in range(1, prova.rounds_count + 1) %}
            {% if r <= prova.current_round %}
                <a href="{{ url_for('admin.competition.amalfi_classification', prova_id=prova.id, round_number=r) }}" 
                   class="btn btn-sm {% if r == round_number %}btn-primary{% else %}btn-outline-primary{% endif %} w-100 mb-1">
                    Turno {{ r }}
                    {% if r == round_number %}
                        <i class="fas fa-eye ms-1"></i>
                    {% endif %}
                </a>
            {% else %}
                <button class="btn btn-sm btn-outline-secondary w-100 mb-1" disabled>
                    Turno {{ r }} (Non iniziato)
                </button>
            {% endif %}
        {% endfor %}
        
        {% if round_number < prova.rounds_count and round_number == prova.current_round %}
            <hr>
            <button class="btn btn-success btn-sm w-100" 
                    onclick="previewNextRound({{ round_number + 1 }})">
                <i class="fas fa-eye"></i> Anteprima Turno {{ round_number + 1 }}
            </button>
        {% endif %}
    </div>
</div>

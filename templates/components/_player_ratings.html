<div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">
            <i class="fas fa-chart-line"></i> {{ _("Rating") }}
        </h5>
        <span class="badge bg-info text-dark">{{ _("Lv. 6+") }}</span>
    </div>
    <div class="card-body">
        <div class="row text-center">
            <div class="col-6">
                <h6 class="text-muted mb-2">Elo</h6>
                <div class="h3 mb-0 text-primary fw-bold">
                    {{ user.elo_rating if user.elo_rating else 1200 }}
                </div>
            </div>
            <div class="col-6">
                <h6 class="text-muted mb-2">Fargo</h6>
                <div class="h3 mb-0 text-secondary">
                    {{ user.fargo_rating if user.fargo_rating else '-' }}
                </div>
            </div>
        </div>
        <div class="mt-3 text-center">
            <small class="text-muted">
                {{ _("I rating vengono aggiornati automaticamente al termine di ogni partita ufficiale.") }}
            </small>
        </div>
    </div>
</div>

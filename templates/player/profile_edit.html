{% extends "base.html" %}
{% block title %}Modifica Informazioni Personali - {{ user.username }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card">
      <div class="card-header">
        <h4><i class="fas fa-user-edit"></i> Modifica Informazioni personali</h4>
      </div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('player.edit_profile') }}">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input id="email" name="email" type="email" class="form-control" required value="{{ user.email }}">
          </div>
          <div class="mb-3">
            <label class="form-label" for="phone">Telefono</label>
            <input id="phone" name="phone" type="text" class="form-control" value="{{ user.phone or '' }}">
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save"></i> Salva
            </button>
            <a class="btn btn-outline-secondary" href="{{ url_for('player.profile') }}">
              Annulla
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

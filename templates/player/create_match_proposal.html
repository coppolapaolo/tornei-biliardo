{% extends "base.html" %}

{% block title %}Create Match Proposal - Torneo Biliardo{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0"><i class="fas fa-handshake"></i> Create Match Proposal</h4>
            </div>
            <div class="card-body">
                <form method="POST" id="proposalForm">
                    <!-- Proposal Type -->
                    <div class="mb-3">
                        <label class="form-label">Proposal Type</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="proposal_type" id="direct" value="direct" checked>
                            <label class="form-check-label" for="direct">
                                <strong>Direct Invitation</strong> - Invite specific players
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="proposal_type" id="open" value="open">
                            <label class="form-check-label" for="open">
                                <strong>Open Proposal</strong> - Available to all eligible players
                            </label>
                        </div>
                    </div>

                    <!-- Invited Users (for direct proposals) -->
                    <div class="mb-3" id="invitedUsersSection">
                        <label for="invited_users" class="form-label">Invite Players</label>
                        <select class="form-select" name="invited_users" id="invited_users" multiple size="5">
                            {% for user in users %}
                            <option value="{{ user.id }}">{{ user.username }}</option>
                            {% endfor %}
                        </select>
                        <div class="form-text">Hold Ctrl/Cmd to select multiple players</div>
                    </div>

                    <!-- Location -->
                    <div class="mb-3">
                        <label for="location" class="form-label">Location</label>
                        <select class="form-select" name="location" id="location" required>
                            <option value="">Select a location...</option>
                            {% for location in locations %}
                            <option value="{{ location.name }}">{{ location.name }} - {{ location.address }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Scheduled Date/Time -->
                    <div class="mb-3">
                        <label for="scheduled_at" class="form-label">Scheduled Date & Time</label>
                        <input type="datetime-local" class="form-control" name="scheduled_at" id="scheduled_at" required>
                    </div>

                    <!-- Game Configuration -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="discipline" class="form-label">Discipline</label>
                            <select class="form-select" name="discipline" id="discipline">
                                <option value="palla_8">8-Ball</option>
                                <option value="palla_9">9-Ball</option>
                                <option value="palla_10">10-Ball</option>
                                <option value="straight_pool">Straight Pool</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="distance" class="form-label">Distance</label>
                            <input type="number" class="form-control" name="distance" id="distance" value="5" min="1" max="25">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="best_of" id="best_of" checked>
                                <label class="form-check-label" for="best_of">
                                    Best of (unchecked = Race to)
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="break_rule" class="form-label">Break Rule</label>
                            <select class="form-select" name="break_rule" id="break_rule">
                                <option value="alternate">Alternate Break</option>
                                <option value="winner">Winner Breaks</option>
                                <option value="loser">Loser Breaks</option>
                            </select>
                        </div>
                    </div>

                    <!-- Optional Fields -->
                    <div class="mb-3">
                        <label for="entry_fee" class="form-label">Entry Fee (€) <small class="text-muted">(optional)</small></label>
                        <input type="number" class="form-control" name="entry_fee" id="entry_fee" step="0.01" min="0">
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description <small class="text-muted">(optional)</small></label>
                        <textarea class="form-control" name="description" id="description" rows="3" 
                                  placeholder="Add any additional information about this match..."></textarea>
                    </div>

                    <!-- Submit Buttons -->
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('player.match_proposals') }}" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-paper-plane"></i> Create Proposal
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const directRadio = document.getElementById('direct');
    const openRadio = document.getElementById('open');
    const invitedUsersSection = document.getElementById('invitedUsersSection');
    
    function toggleInvitedUsers() {
        if (directRadio.checked) {
            invitedUsersSection.style.display = 'block';
            document.getElementById('invited_users').required = true;
        } else {
            invitedUsersSection.style.display = 'none';
            document.getElementById('invited_users').required = false;
        }
    }
    
    directRadio.addEventListener('change', toggleInvitedUsers);
    openRadio.addEventListener('change', toggleInvitedUsers);
    
    // Set default datetime to tomorrow at 19:00
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    tomorrow.setHours(19, 0, 0, 0);
    
    const datetimeInput = document.getElementById('scheduled_at');
    datetimeInput.value = tomorrow.toISOString().slice(0, 16);
    
    // Set minimum datetime to now
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    datetimeInput.min = now.toISOString().slice(0, 16);
});
</script>

{% endblock %}

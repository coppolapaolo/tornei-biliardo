<!-- templates/player/_change_password_modal.html -->
<div class="modal fade" id="changePasswordModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <form class="modal-content" method="POST" action="{{ url_for('player.change_password') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="modal-header">
        <h5 class="modal-title"><i class="fas fa-key"></i> Cambia password</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label" for="current_password">Password attuale</label>
          <input id="current_password" name="current_password" type="password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="new_password">Nuova password</label>
          <input id="new_password" name="new_password" type="password" class="form-control" required minlength="6">
        </div>
        <div class="mb-3">
          <label class="form-label" for="confirm_password">Conferma nuova password</label>
          <input id="confirm_password" name="confirm_password" type="password" class="form-control" required minlength="6">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" type="submit"><i class="fas fa-save"></i> Aggiorna</button>
        <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Annulla</button>
      </div>
    </form>
  </div>
</div>

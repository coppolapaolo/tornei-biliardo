<!-- templates/player/_change_password_modal.html — 7c -->
<div class="modal fade" id="changePasswordModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content" method="POST" action="{{ url_for('player.change_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="modal-header">
        <h5 class="modal-title">{{ _('Cambia password') }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{{ _('Chiudi') }}"></button>
      </div>
      <div class="modal-body">
        <div class="c7-stack">
          <div>
            <label class="form-label" for="current_password">{{ _('Password attuale') }}</label>
            <input id="current_password" name="current_password" type="password" class="form-control" autocomplete="current-password" required>
          </div>
          <div>
            <label class="form-label" for="new_password">{{ _('Nuova password') }}</label>
            <input id="new_password" name="new_password" type="password" class="form-control" autocomplete="new-password" required minlength="6">
            <div class="form-text">{{ _('Almeno 6 caratteri.') }}</div>
          </div>
          <div>
            <label class="form-label" for="confirm_password">{{ _('Ripeti la nuova password') }}</label>
            <input id="confirm_password" name="confirm_password" type="password" class="form-control" autocomplete="new-password" required minlength="6">
          </div>
        </div>
      </div>
      <div class="modal-footer" style="display: flex; gap: 10px;">
        <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">{{ _('Annulla') }}</button>
        <button class="btn btn-primary" type="submit" style="flex: 1;">{{ _('Aggiorna') }}</button>
      </div>
    </form>
  </div>
</div>

{% extends "base.html" %}

{% block title %}Nessun Campionato Attivo{% endblock %}

{% block content %}
<div class="text-center">
    <div class="mb-4">
        <i class="fas fa-trophy fa-5x text-muted"></i>
    </div>
    <h1 class="mb-3">Nessun Campionato</h1>
    <p class="lead text-muted">Al momento non ci sono campionati in corso.</p>

    {% if not current_user.is_authenticated %}
        <div class="mt-4">
            <a href="{{ url_for('auth.register') }}" class="btn btn-primary me-2">Registrati</a>
            <a href="{{ url_for('auth.login') }}" class="btn btn-outline-primary">Accedi</a>
        </div>
    {% endif %}
</div>
{% endblock %}

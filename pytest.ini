[pytest]
minversion = 7.1
pythonpath = .
addopts = -q -ra --strict-markers -m "not legacy"
testpaths = tests/new
markers =
    unit: test di unità
    integration: test di integrazione con DB/app
    e2e: test end-to-end su route
    legacy: vecchi test (esclusi)
filterwarnings =
    ignore::DeprecationWarning
    # Un avviso di SQLAlchemy è un guasto annunciato: con la 2.1 `Query.get()`
    # e i `distinct()` di colonna fuori da un'aggregazione hanno cominciato a
    # segnalarsi, e un avviso finisce in un riepilogo che nessuno legge. Da
    # errore, un uso nuovo fa fallire il test che lo attraversa. Le righe dopo
    # prevalgono su quella sopra, che altrimenti zittirebbe LegacyAPIWarning.
    error::sqlalchemy.exc.SAWarning
    error::sqlalchemy.exc.LegacyAPIWarning

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONANYWHERE_USERNAME: paolocoppola
  PYTHONANYWHERE_DOMAIN: paolocoppola.pythonanywhere.com
  PROJECT_PATH: /home/paolocoppola/tornei-biliardo

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist

      - name: Run unit tests
        run: |
          PYTHONPATH=. pytest tests/new/unit/ -n auto --tb=short

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyright

      - name: Run type check
        run: pyright

  deploy:
    runs-on: ubuntu-latest
    needs: [test, typecheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Pull code on PythonAnywhere
        env:
          PA_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          # Create a temporary console to run git pull
          CONSOLE_ID=$(curl -s -X POST \
            -H "Authorization: Token $PA_API_TOKEN" \
            -d "executable=bash&working_directory=${{ env.PROJECT_PATH }}" \
            "https://www.pythonanywhere.com/api/v0/user/${{ env.PYTHONANYWHERE_USERNAME }}/consoles/" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -n "$CONSOLE_ID" ]; then
            # Send git pull command
            curl -s -X POST \
              -H "Authorization: Token $PA_API_TOKEN" \
              -d "input=git pull origin main && exit\n" \
              "https://www.pythonanywhere.com/api/v0/user/${{ env.PYTHONANYWHERE_USERNAME }}/consoles/$CONSOLE_ID/send_input/"

            echo "Git pull initiated in console $CONSOLE_ID"
            sleep 10
          else
            echo "Warning: Could not create console, skipping git pull"
          fi

      - name: Reload web app
        env:
          PA_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Token $PA_API_TOKEN" \
            "https://www.pythonanywhere.com/api/v0/user/${{ env.PYTHONANYWHERE_USERNAME }}/webapps/${{ env.PYTHONANYWHERE_DOMAIN }}/reload/")

          echo "Reload response: $RESPONSE"
          echo "Deployment complete!"

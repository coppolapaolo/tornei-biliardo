name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONANYWHERE_USERNAME: paolocoppola
  # domain_name della webapp reale (custom domain, vedi /var/www/www_torneibiliardo_it_wsgi.py):
  # con il dominio sbagliato l'API risponde 404 e il reload da CI non ha mai effetto.
  PYTHONANYWHERE_DOMAIN: www.torneibiliardo.it
  PROJECT_PATH: /home/paolocoppola/mysite

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # Serve la storia per confrontare la PR con la sua base (vedi sotto).
          fetch-depth: 0

      # Una PR di sola documentazione non ha niente da provare, ma questo job
      # e' un check obbligatorio della protezione di `main`: se non partisse,
      # bloccherebbe il merge invece di sbloccarlo. Quindi parte sempre, e
      # decide da solo se ha qualcosa da fare. «Sola documentazione» e'
      # stretto di proposito: Markdown, testo, e `docs/` senza sorgenti
      # Python. Un `.py` toccato per un docstring, un template, un YAML
      # della guida (letto e validato dai test) contano come codice.
      # Sul push su `main` gira sempre tutto: e' quello che il deploy aspetta.
      - name: Decide what to run
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "File cambiati rispetto a $BASE_REF:"
          echo "$CHANGED" | sed 's/^/  /'
          if [ -z "$CHANGED" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Resta cio' che non e' documentazione: ne' Markdown o testo, ne'
          # un file sotto docs/ che non sia un sorgente Python.
          NON_DOCS=$(echo "$CHANGED" | awk '!/\.(md|txt)$/ && !(/^docs\// && !/\.py$/) && !/^LICENSE$/')
          if [ -z "$NON_DOCS" ]; then
            echo "Solo documentazione: test e type check saltati."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "Codice toccato, si prova tutto:"
            echo "$NON_DOCS" | sed 's/^/  /'
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist pyright

      - name: Run unit tests
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          PYTHONPATH=. pytest tests/new/unit/ -n auto --tb=short

      - name: Run type check
        if: steps.scope.outputs.docs_only != 'true'
        run: pyright

  pr-title:
    # Il titolo della PR non e' cosmetica: con lo squash merge diventa il
    # messaggio di commit su `main`, ed e' da li' che release-please decide se
    # e come muovere la versione. Una PR senza prefisso non produce nessun
    # errore — semplicemente sparisce da `docs/RELEASES.md` e non fa avanzare
    # `Config.VERSION`. Un guasto muto, quindi si blocca prima.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check Conventional Commits prefix
        env:
          # Il titolo passa da una variabile d'ambiente e non interpolato nello
          # script: un titolo di PR e' testo scritto da chiunque apra la PR, e
          # interpolarlo in `run:` lo farebbe eseguire dalla shell del runner.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          TYPES='feat|fix|perf|revert|refactor|docs|test|build|ci|chore|style'
          if echo "$PR_TITLE" | grep -qE "^($TYPES)(\([a-z0-9 ._/-]+\))?!?: .+"; then
            echo "Titolo conforme: $PR_TITLE"
            exit 0
          fi
          echo "::error::Titolo non conforme a Conventional Commits: '$PR_TITLE'"
          echo ""
          echo "Il titolo deve iniziare con un tipo, due punti e uno spazio."
          echo "La descrizione resta in italiano: solo il prefisso e' fisso."
          echo ""
          echo "  fix:   una correzione            -> alza la patch (1.0.0 -> 1.0.1)"
          echo "  feat:  una funzione nuova        -> alza la minor (1.0.1 -> 1.1.0)"
          echo "  feat!: un cambiamento rompente   -> alza la major (1.1.0 -> 2.0.0)"
          echo "  chore/docs/test/ci/refactor/... -> non muovono la versione"
          echo ""
          echo "Esempio: fix: la X del primo turno puo' andare all'ultimo iscritto"
          exit 1

  check-migrations:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      has_new_migrations: ${{ steps.check.outputs.has_migrations }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check for new migration files
        id: check
        run: |
          # Check if any new migration files were added in this push
          NEW_MIGRATIONS=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'migrations/*.py' | grep -v '__init__.py' | grep -v 'runner.py' || true)
          if [ -n "$NEW_MIGRATIONS" ]; then
            echo "New migration files detected:"
            echo "$NEW_MIGRATIONS"
            echo "has_migrations=true" >> $GITHUB_OUTPUT
          else
            echo "No new migration files"
            echo "has_migrations=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: [test-and-typecheck, check-migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-migrations.outputs.has_new_migrations != 'true'

    steps:
      # Note: Git pull and migrations must be done manually or via scheduled task
      # PythonAnywhere console API requires browser session, doesn't work from CI
      # See scripts/auto_deploy.py for scheduled task setup

      - name: Reload web app
        env:
          PA_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Token $PA_API_TOKEN" \
            "https://www.pythonanywhere.com/api/v0/user/${{ env.PYTHONANYWHERE_USERNAME }}/webapps/${{ env.PYTHONANYWHERE_DOMAIN }}/reload/")

          echo "Reload response: $RESPONSE"
          echo "Deployment complete!"

  skip-deploy-notification:
    runs-on: ubuntu-latest
    needs: [test-and-typecheck, check-migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-migrations.outputs.has_new_migrations == 'true'

    steps:
      - name: Notify skipped deployment
        run: |
          echo "⚠️ DEPLOYMENT SKIPPED - New migration files detected!"
          echo ""
          echo "Manual steps required on PythonAnywhere:"
          echo "  1. cd /home/paolocoppola/mysite"
          echo "  2. git pull origin main"
          echo "  3. python migrations/runner.py"
          echo "  4. Reload web app from dashboard"
          exit 0

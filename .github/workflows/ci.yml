name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONANYWHERE_USERNAME: paolocoppola
  PYTHONANYWHERE_DOMAIN: paolocoppola.pythonanywhere.com
  PROJECT_PATH: /home/paolocoppola/mysite

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist

      - name: Run unit tests
        run: |
          PYTHONPATH=. pytest tests/new/unit/ -n auto --tb=short

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyright

      - name: Run type check
        run: pyright

  check-migrations:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      has_new_migrations: ${{ steps.check.outputs.has_migrations }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for new migration files
        id: check
        run: |
          # Check if any new migration files were added in this push
          NEW_MIGRATIONS=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'migrations/*.py' | grep -v '__init__.py' | grep -v 'runner.py' || true)
          if [ -n "$NEW_MIGRATIONS" ]; then
            echo "New migration files detected:"
            echo "$NEW_MIGRATIONS"
            echo "has_migrations=true" >> $GITHUB_OUTPUT
          else
            echo "No new migration files"
            echo "has_migrations=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: [test, typecheck, check-migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-migrations.outputs.has_new_migrations != 'true'

    steps:
      # Note: Git pull and migrations must be done manually or via scheduled task
      # PythonAnywhere console API requires browser session, doesn't work from CI
      # See scripts/auto_deploy.py for scheduled task setup

      - name: Reload web app
        env:
          PA_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Token $PA_API_TOKEN" \
            "https://www.pythonanywhere.com/api/v0/user/${{ env.PYTHONANYWHERE_USERNAME }}/webapps/${{ env.PYTHONANYWHERE_DOMAIN }}/reload/")

          echo "Reload response: $RESPONSE"
          echo "Deployment complete!"

  skip-deploy-notification:
    runs-on: ubuntu-latest
    needs: [test, typecheck, check-migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-migrations.outputs.has_new_migrations == 'true'

    steps:
      - name: Notify skipped deployment
        run: |
          echo "⚠️ DEPLOYMENT SKIPPED - New migration files detected!"
          echo ""
          echo "Manual steps required on PythonAnywhere:"
          echo "  1. cd /home/paolocoppola/mysite"
          echo "  2. git pull origin main"
          echo "  3. python migrations/runner.py"
          echo "  4. Reload web app from dashboard"
          exit 0

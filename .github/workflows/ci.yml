name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push nuovo sulla stessa PR rende inutile il giro precedente: si cancella,
# invece di tenere occupato un runner fino in fondo per un risultato che
# nessuno leggera'. Su `main` invece no, e la differenza e' voluta: li' ogni
# commit e' quello che va in produzione, e il suo esito serve anche quando ne
# arriva subito un altro.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# La CI non tocca la produzione: niente reload della web app.
# Il codice, le dipendenze, le migration e il reload li porta lo scheduled
# task scripts/auto_deploy.py. Il reload a ogni merge, tolto il 2026-09-14,
# riavviava l'app senza codice nuovo e costava errori 5xx a chi era collegato.

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # Serve la storia per confrontare la PR con la sua base (vedi sotto).
          fetch-depth: 0

      # Una PR di sola documentazione non ha niente da provare, ma questo job
      # e' un check obbligatorio della protezione di `main`: se non partisse,
      # bloccherebbe il merge invece di sbloccarlo. Quindi parte sempre, e
      # decide da solo se ha qualcosa da fare. «Sola documentazione» e'
      # stretto di proposito: Markdown, testo, e `docs/` senza sorgenti
      # Python. Un `.py` toccato per un docstring, un template, un YAML
      # della guida (letto e validato dai test) contano come codice.
      # Sul push su `main` gira sempre tutto: e' quello che il deploy aspetta.
      - name: Decide what to run
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          # Come per PR_TITLE piu' sotto: il nome del branch lo sceglie chi
          # apre la PR, quindi passa da una variabile e non si interpola nello
          # script, che altrimenti lo farebbe eseguire dalla shell del runner.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # La PR di rilascio la scrive release-please: numero di versione,
          # changelog e manifest. Il filtro qui sotto non la riconosce come
          # documentazione perche' tocca `config.py`, quindi faceva girare
          # test e pyright per cambiare una riga - e si ripete a ogni merge,
          # perche' quella PR si riapre di continuo. Il criterio giusto in
          # questo caso non e' che file tocca, ma chi l'ha aperta.
          if [ "$HEAD_REF" = "release-please--branches--main" ]; then
            echo "PR di rilascio generata dal bot: test e type check saltati."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet origin "$BASE_REF"
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "File cambiati rispetto a $BASE_REF:"
          echo "$CHANGED" | sed 's/^/  /'
          if [ -z "$CHANGED" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Resta cio' che non e' documentazione: ne' Markdown o testo, ne'
          # un file sotto docs/ che non sia un sorgente Python. I manifesti
          # delle dipendenze sono .txt ma sono codice: una PR che cambia una
          # dipendenza deve installare e provare tutto.
          NON_DOCS=$(echo "$CHANGED" | awk '/^requirements[^\/]*\.txt$/ || (!/\.(md|txt)$/ && !(/^docs\// && !/\.py$/) && !/^LICENSE$/)')
          if [ -z "$NON_DOCS" ]; then
            echo "Solo documentazione: test e type check saltati."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "Codice toccato, si prova tutto:"
            echo "$NON_DOCS" | sed 's/^/  /'
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist pyright

      - name: Run unit tests
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          PYTHONPATH=. pytest tests/new/unit/ -n auto --tb=short

      - name: Run type check
        if: steps.scope.outputs.docs_only != 'true'
        run: pyright

  pr-title:
    # Il titolo della PR non e' cosmetica: con lo squash merge diventa il
    # messaggio di commit su `main`, ed e' da li' che release-please decide se
    # e come muovere la versione. Una PR senza prefisso non produce nessun
    # errore — semplicemente sparisce da `docs/RELEASES.md` e non fa avanzare
    # `Config.VERSION`. Un guasto muto, quindi si blocca prima.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check Conventional Commits prefix
        env:
          # Il titolo passa da una variabile d'ambiente e non interpolato nello
          # script: un titolo di PR e' testo scritto da chiunque apra la PR, e
          # interpolarlo in `run:` lo farebbe eseguire dalla shell del runner.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          TYPES='feat|fix|perf|revert|refactor|docs|test|build|ci|chore|style'
          if echo "$PR_TITLE" | grep -qE "^($TYPES)(\([a-z0-9 ._/-]+\))?!?: .+"; then
            echo "Titolo conforme: $PR_TITLE"
            exit 0
          fi
          echo "::error::Titolo non conforme a Conventional Commits: '$PR_TITLE'"
          echo ""
          echo "Il titolo deve iniziare con un tipo, due punti e uno spazio."
          echo "La descrizione resta in italiano: solo il prefisso e' fisso."
          echo ""
          echo "  fix:   una correzione            -> alza la patch (1.0.0 -> 1.0.1)"
          echo "  feat:  una funzione nuova        -> alza la minor (1.0.1 -> 1.1.0)"
          echo "  feat!: un cambiamento rompente   -> alza la major (1.1.0 -> 2.0.0)"
          echo "  chore/docs/test/ci/refactor/... -> non muovono la versione"
          echo ""
          echo "Esempio: fix: la X del primo turno puo' andare all'ultimo iscritto"
          exit 1
